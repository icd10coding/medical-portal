副甲低下編 Z98.890 + Z90.89;非 E89.2。","高乳酸血症 ≠ 酸中毒；未載酸中毒不可編 E87.20；query 後僅確認高乳酸 → R79.89。","生化復發(PSA上升)攝護腺癌(前列腺切除後)編 C79.9 + R97.21 + Z90.79 + Z85.46。","非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。"],"e":"正解：副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。 應使用：Z98.890（其他特指術後狀態）+ Z90.89（其他器官後天缺如）。 不應使用：E89.2（術後副甲低下，無記載不用）。 實務：切除部分副甲狀腺不必然致副甲低下(有四顆);無記載不編 E89.2。 （來源：AHA Coding Clinic 2023年第3季「副甲狀腺切除後（無副甲低下）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-15:a","q":"【AHA Coding Clinic 2023年第3季｜射血分數改善/恢復之心衰竭】\nHFrecEF 病史,因急性慢性失代償右心衰竭入院,另有 HFpEF。\n依該季 Coding Clinic，應如何編碼？","o":["I50.813 + I50.32","I50.32","I50.813","I50.813 + I50.33"],"e":"正解：I50.813 + I50.32。I50.813（急性慢性右心衰竭）主診 + I50.32（慢性舒張性心衰竭） 編碼順序：I50.813 為主診。 重點：急性慢性右心衰竭主診 I50.813 + 慢性舒張性 I50.32；HFrecEF/HFimpEF 指左室 EF 恢復。 實務：HFrecEF 與 HFimpEF 互通,指左室 EF 恢復,與右心衰竭為不同議題。 （來源：AHA Coding Clinic 2023年第3季「射血分數改善/恢復之心衰竭」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-15:d","q":"【AHA Coding Clinic 2023年第3季】\nHFrecEF 病史,因急性慢性失代償右心衰竭入院,另有 HFpEF。\n依該季 Coding Clinic，下列結論何者正確？","o":["急性慢性右心衰竭主診 I50.813 + 慢性舒張性 I50.32；HFrecEF/HFimpEF 指左室 EF 恢復。","SLE 所致急性心肌炎編 M32.19 + I40.8。","失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。","重度憂鬱所致成人異食癖：F32.2 + F50.83。"],"e":"正解：急性慢性右心衰竭主診 I50.813 + 慢性舒張性 I50.32；HFrecEF/HFimpEF 指左室 EF 恢復。 應使用：I50.813（急性慢性右心衰竭）主診 + I50.32（慢性舒張性心衰竭）。 編碼順序：I50.813 為主診。 實務：HFrecEF 與 HFimpEF 互通,指左室 EF 恢復,與右心衰竭為不同議題。 （來源：AHA Coding Clinic 2023年第3季「射血分數改善/恢復之心衰竭」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-16:a","q":"【AHA Coding Clinic 2023年第3季｜葡萄胎後妊娠滋養細胞疾病/腫瘤併轉移】\n葡萄胎後 stage III GTN,子宮腫塊併雙肺、附件、陰道轉移。\n依該季 Coding Clinic，應如何編碼？","o":["C54.8 + C78.01 + C78.02 + C79.82","D39.2 + C78.01 + C78.02 + C79.82","C78.01 + C78.02 + C79.82","C54.8 + C78.02 + C79.82"],"e":"正解：C54.8 + C78.01 + C78.02 + C79.82。C54.8（子宮體重疊部位惡性）+ C78.01/C78.02（雙肺續發惡性）+ C79.82（生殖器官續發惡性） 不應使用／不適用：D39.2（胎盤未定行為，已轉移不適用）。 重點：轉移性 GTD/GTN 編惡性碼 C54.8 + 肺/生殖器轉移;非 D39.2。 實務：已轉移之惡性 GTD/GTN 不報未定行為。 （來源：AHA Coding Clinic 2023年第3季「葡萄胎後妊娠滋養細胞疾病/腫瘤併轉移」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-16:d","q":"【AHA Coding Clinic 2023年第3季】\n葡萄胎後 stage III GTN,子宮腫塊併雙肺、附件、陰道轉移。\n依該季 Coding Clinic，下列結論何者正確？","o":["轉移性 GTD/GTN 編惡性碼 C54.8 + 肺/生殖器轉移;非 D39.2。","轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。","發炎性乳癌(IBC)以新碼 C50.A- 編；放療就診主診 Z51.0。","妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。"],"e":"正解：轉移性 GTD/GTN 編惡性碼 C54.8 + 肺/生殖器轉移;非 D39.2。 應使用：C54.8（子宮體重疊部位惡性）+ C78.01/C78.02（雙肺續發惡性）+ C79.82（生殖器官續發惡性）。 不應使用：D39.2（胎盤未定行為，已轉移不適用）。 實務：已轉移之惡性 GTD/GTN 不報未定行為。 （來源：AHA Coding Clinic 2023年第3季「葡萄胎後妊娠滋養細胞疾病/腫瘤併轉移」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-17:a","q":"【AHA Coding Clinic 2023年第3季｜膀胱侵襲性與非侵襲性乳突尿路上皮癌】\n膀胱多部位高惡性乳突尿路上皮癌(前壁/膀胱頸侵襲;右側壁/左頂非侵襲)。\n依該季 Coding Clinic，應如何編碼？","o":["C67.3 + C67.5 + C67.2 + C67.1","C67.5 + C67.2 + C67.1","C67.3 + C67.2 + C67.1","C67.3 + C67.5 + C67.1"],"e":"正解：C67.3 + C67.5 + C67.2 + C67.1。C67.3（前壁）+ C67.5（膀胱頸）+ C67.2（側壁）+ C67.1（頂）膀胱惡性 不應使用／不適用：原位癌碼(並存侵襲時不編)。 重點：同部位並存原位(非侵襲)與侵襲癌時,只編惡性碼,不編原位碼。 實務：同部位並存 in situ 與 invasive → 不編 in situ。 （來源：AHA Coding Clinic 2023年第3季「膀胱侵襲性與非侵襲性乳突尿路上皮癌」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-17:d","q":"【AHA Coding Clinic 2023年第3季】\n膀胱多部位高惡性乳突尿路上皮癌(前壁/膀胱頸侵襲;右側壁/左頂非侵襲)。\n依該季 Coding Clinic，下列結論何者正確？","o":["同部位並存原位(非侵襲)與侵襲癌時,只編惡性碼,不編原位碼。","左膝多部位軟骨軟化，單一碼 M94.262 涵蓋全膝各 component。","醫師記 class 3 肥胖（或同時記 morbid + class 3）→ 只編 E66.813，不編 E66.01。","血小板低下併 DIC 只編 D65（血小板低下為 DIC 固有）。"],"e":"正解：同部位並存原位(非侵襲)與侵襲癌時,只編惡性碼,不編原位碼。 應使用：C67.3（前壁）+ C67.5（膀胱頸）+ C67.2（側壁）+ C67.1（頂）膀胱惡性。 不應使用：原位癌碼(並存侵襲時不編)。 實務：同部位並存 in situ 與 invasive → 不編 in situ。 （來源：AHA Coding Clinic 2023年第3季「膀胱侵襲性與非侵襲性乳突尿路上皮癌」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-18:a","q":"【AHA Coding Clinic 2023年第3季｜Kratom 濫用併戒斷】\n鴉片依賴戒斷後以 kratom 處理戒斷症狀,記 kratom abuse with withdrawal。\n依該季 Coding Clinic，應如何編碼？","o":["F19.139","F55.1","F12.9","F02.80"],"e":"正解：F19.139。F19.139（其他精神活性物質濫用併戒斷,未特指） 不應使用／不適用：F55.1（草藥/民俗療法濫用，非精神活性物質不適用）。 重點：Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。 實務：Kratom 為精神活性物質→F19 系列。 （來源：AHA Coding Clinic 2023年第3季「Kratom 濫用併戒斷」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-18:d","q":"【AHA Coding Clinic 2023年第3季】\n鴉片依賴戒斷後以 kratom 處理戒斷症狀,記 kratom abuse with withdrawal。\n依該季 Coding Clinic，下列結論何者正確？","o":["Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。","rituximab 輸注反應編輸注併發症 T80.89XA + 藥物不良反應 T45.1X5A + 表現碼。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。","【更正】應編 J45.42（中度持續性氣喘併 status asthmaticus），非 J45.41。"],"e":"正解：Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。 應使用：F19.139（其他精神活性物質濫用併戒斷,未特指）。 不應使用：F55.1（草藥/民俗療法濫用，非精神活性物質不適用）。 實務：Kratom 為精神活性物質→F19 系列。 （來源：AHA Coding Clinic 2023年第3季「Kratom 濫用併戒斷」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-19:d","q":"【AHA Coding Clinic 2023年第3季】\n31週處方大麻治慢性疼痛,PROM 入院分娩,尿檢大麻陽性。\n依該季 Coding Clinic，下列結論何者正確？","o":["妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。","外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。","妊娠肝內膽汁鬱積編 O26.62 + E78.79 + K76.89；無阻塞不用 K83.1。"],"e":"正解：妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。 應使用：O42（早期破水）主診 + O99.892（其他疾病併發分娩）+ G89.29（其他慢性疼痛）+ Z79.899（其他長期用藥）。 不應使用：將處方大麻報為物質使用。 編碼順序：O42 為主診。 實務：治療性(處方)大麻比照長期處方用藥。 （來源：AHA Coding Clinic 2023年第3季「妊娠期處方大麻（早期破水）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-20:a","q":"【AHA Coding Clinic 2023年第3季｜醫療用途處方大麻（僅記 use）】\n處方大麻治疼痛等,病歷僅記 cannabis use。\n依該季 Coding Clinic，應如何編碼？","o":["Z79.899","F12.90","Z79.52","Z77.29"],"e":"正解：Z79.899。所治病況碼 + Z79.899（其他長期用藥） 不應使用／不適用：F12.90（未特指大麻使用；處方治病不編）。 重點：醫療處方大麻(僅記 use)編所治病況 + Z79.899;不編物質使用碼。 實務：處方治療性大麻→長期用藥;不報精神活性物質使用。 （來源：AHA Coding Clinic 2023年第3季「醫療用途處方大麻（僅記 use）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-20:d","q":"【AHA Coding Clinic 2023年第3季】\n處方大麻治疼痛等,病歷僅記 cannabis use。\n依該季 Coding Clinic，下列結論何者正確？","o":["醫療處方大麻(僅記 use)編所治病況 + Z79.899;不編物質使用碼。","副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。","大麻電子煙使用無伴隨物質相關疾患/醫療病況時不可報告。","二手電子煙暴露所致病況編症狀碼 + Z77.29；不用 U07.0。"],"e":"正解：醫療處方大麻(僅記 use)編所治病況 + Z79.899;不編物質使用碼。 應使用：所治病況碼 + Z79.899（其他長期用藥）。 不應使用：F12.90（未特指大麻使用；處方治病不編）。 實務：處方治療性大麻→長期用藥;不報精神活性物質使用。 （來源：AHA Coding Clinic 2023年第3季「醫療用途處方大麻（僅記 use）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-21:a","q":"【AHA Coding Clinic 2023年第3季｜早期妊娠絨毛膜下出血】\n12+4週陰道出血,超音波示大絨毛膜下出血。\n依該季 Coding Clinic，應如何編碼？","o":["O20.8","O26.62","O23.593","O02.1"],"e":"正解：O20.8。O20.8（早期妊娠其他出血） 重點：12週絨毛膜下出血編 O20.8。 實務：O20 含 20 週前出血 inclusion。 （來源：AHA Coding Clinic 2023年第3季「早期妊娠絨毛膜下出血」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-21:d","q":"【AHA Coding Clinic 2023年第3季】\n12+4週陰道出血,超音波示大絨毛膜下出血。\n依該季 Coding Clinic，下列結論何者正確？","o":["12週絨毛膜下出血編 O20.8。","腦點狀出血編 I61.8（=出血性中風）。","絨毛膜羊膜分離（CAS）編 O41.8X30（索引無專項）。","重度憂鬱所致成人異食癖：F32.2 + F50.83。"],"e":"正解：12週絨毛膜下出血編 O20.8。 應使用：O20.8（早期妊娠其他出血）。 實務：O20 含 20 週前出血 inclusion。 （來源：AHA Coding Clinic 2023年第3季「早期妊娠絨毛膜下出血」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-22:a","q":"【AHA Coding Clinic 2023年第3季｜糖尿病病人之視神經病變】\n第2型 DM 併右眼視神經病變。\n依該季 Coding Clinic，應如何編碼？","o":["E11.39 + H46.9 + E11.9","H46.9 + E11.9","E11.39 + E11.9","E11.39 + H46.9"],"e":"正解：E11.39 + H46.9 + E11.9。相關→E11.39（DM 併其他眼併發症）+ H46.9（未特指視神經炎）；無關→H46.9 + E11.9 不應使用／不適用：逕以『with』推定連結。 編碼順序：先 query。 重點：視神經病變與 DM 未由『with』推定→需 query;相關 E11.39+H46.9,無關 H46.9+E11.9。 實務：糖尿病神經病變指周邊;視神經病變與 DM 索引未以 with/due to/associated 連結。 （來源：AHA Coding Clinic 2023年第3季「糖尿病病人之視神經病變」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-22:d","q":"【AHA Coding Clinic 2023年第3季】\n第2型 DM 併右眼視神經病變。\n依該季 Coding Clinic，下列結論何者正確？","o":["視神經病變與 DM 未由『with』推定→需 query;相關 E11.39+H46.9,無關 H46.9+E11.9。","記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。","卵巢漿液性交界性腫瘤須 query；惡性→C56.1，未定行為→D39.11。","前期糖尿病所致多發性神經病變編 G62.89 + R73.03；非 G63。"],"e":"正解：視神經病變與 DM 未由『with』推定→需 query;相關 E11.39+H46.9,無關 H46.9+E11.9。 應使用：相關→E11.39（DM 併其他眼併發症）+ H46.9（未特指視神經炎）；無關→H46.9 + E11.9。 不應使用：逕以『with』推定連結。 編碼順序：先 query。 實務：糖尿病神經病變指周邊;視神經病變與 DM 索引未以 with/due to/associated 連結。 （來源：AHA Coding Clinic 2023年第3季「糖尿病病人之視神經病變」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-23:d","q":"【AHA Coding Clinic 2023年第3季】\n骨髓移植後慢性 GVHD 所致周邊神經病變。\n依該季 Coding Clinic，下列結論何者正確？","o":["慢性 GVHD 所致周邊神經病變編 T86.09 + D89.811 + G63。","VA-ECMO 併發 NSS 編 T81.89XA + 呼吸衰竭 J96.21/J96.22 及各表現碼。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","恥骨聯合骨炎且病理排除骨髓炎編 M89.8X8；不可逕用 M86。"],"e":"正解：慢性 GVHD 所致周邊神經病變編 T86.09 + D89.811 + G63。 應使用：T86.09（骨髓移植其他併發症）+ D89.811（慢性 GVHD）+ G63（他處疾病之多發性神經病變）。 實務：無索引路徑至 G63,依 etiology/manifestation 組合。 （來源：AHA Coding Clinic 2023年第3季「慢性移植物對抗宿主病所致周邊神經病變」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-24:a","q":"【AHA Coding Clinic 2023年第3季｜L5 峽部骨折併脊椎滑脫】\nL5 移位峽部骨折併 L5-S1 峽部性滑脫。\n依該季 Coding Clinic，應如何編碼？","o":["M43.17","M43.16","M41.125","M47.817"],"e":"正解：M43.17。M43.17（腰薦部脊椎滑脫） 不應使用／不適用：另編 spondylolysis。 重點：峽部骨折致滑脫只編滑脫 M43.17。 實務：M43.0 之 Excludes1(→M43.1)支持:骨折致滑脫只編滑脫。 （來源：AHA Coding Clinic 2023年第3季「L5 峽部骨折併脊椎滑脫」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-24:d","q":"【AHA Coding Clinic 2023年第3季】\nL5 移位峽部骨折併 L5-S1 峽部性滑脫。\n依該季 Coding Clinic，下列結論何者正確？","o":["峽部骨折致滑脫只編滑脫 M43.17。","外傷性 CCS 併不完全四肢癱只編脊髓損傷碼；CCS 取最高頸髓節。","術後腹內膿瘍編 T81.43XA + K65.1。","因治療小腦血管母細胞瘤入院,主診 D43.1 + Q85.83。"],"e":"正解：峽部骨折致滑脫只編滑脫 M43.17。 應使用：M43.17（腰薦部脊椎滑脫）。 不應使用：另編 spondylolysis。 實務：M43.0 之 Excludes1(→M43.1)支持:骨折致滑脫只編滑脫。 （來源：AHA Coding Clinic 2023年第3季「L5 峽部骨折併脊椎滑脫」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-25:a","q":"【AHA Coding Clinic 2023年第3季｜右後足內翻】\n多重足部畸形,右後足內翻行 Malerba 跟骨截骨。\n依該季 Coding Clinic，應如何編碼？","o":["M21.6X1","M22.01","M24.28","M24.662"],"e":"正解：M21.6X1。M21.6X1（右足其他後天畸形） 不應使用／不適用：先天畸形碼(無記載)。 重點：後足內翻無先天記載編後天 M21.6X1。 實務：無先天記載→後天。 （來源：AHA Coding Clinic 2023年第3季「右後足內翻」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-25:d","q":"【AHA Coding Clinic 2023年第3季】\n多重足部畸形,右後足內翻行 Malerba 跟骨截骨。\n依該季 Coding Clinic，下列結論何者正確？","o":["後足內翻無先天記載編後天 M21.6X1。","肺黴菌球(fungus ball,多為麴菌)→新碼 J4B;咳血非其固有表現,有記載即另編 R04.2。","腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。","NSTEMI 編 I21.4；心肌橋（MB）為冠脈畸形編 Q24.5（非微血管疾病）。"],"e":"正解：後足內翻無先天記載編後天 M21.6X1。 應使用：M21.6X1（右足其他後天畸形）。 不應使用：先天畸形碼(無記載)。 實務：無先天記載→後天。 （來源：AHA Coding Clinic 2023年第3季「右後足內翻」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-26:a","q":"【AHA Coding Clinic 2023年第3季｜頸椎硬膜外血腫（非外傷非處置）】\n左肢無力,MRI 見頸椎硬膜外血腫壓迫脊髓,記無外傷/處置。\n依該季 Coding Clinic，應如何編碼？","o":["G95.19","I62.1","G92.8","G95.9"],"e":"正解：G95.19。G95.19（其他血管性脊髓病） 不應使用／不適用：I62.1（顱內硬膜外出血，非脊椎）。 重點：非外傷非處置之脊椎硬膜外血腫編 G95.19;非 I62.1。 實務：索引 Hemorrhage, spinal cord G95.19;I62.1 為顱內。 （來源：AHA Coding Clinic 2023年第3季「頸椎硬膜外血腫（非外傷非處置）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-26:d","q":"【AHA Coding Clinic 2023年第3季】\n左肢無力,MRI 見頸椎硬膜外血腫壓迫脊髓,記無外傷/處置。\n依該季 Coding Clinic，下列結論何者正確？","o":["非外傷非處置之脊椎硬膜外血腫編 G95.19;非 I62.1。","外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。","選擇性終止妊娠術中子宮無力出血編 O04.6 + O35.10X0;非 O72.1、不併 Z33.2。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。"],"e":"正解：非外傷非處置之脊椎硬膜外血腫編 G95.19;非 I62.1。 應使用：G95.19（其他血管性脊髓病）。 不應使用：I62.1（顱內硬膜外出血，非脊椎）。 實務：索引 Hemorrhage, spinal cord G95.19;I62.1 為顱內。 （來源：AHA Coding Clinic 2023年第3季「頸椎硬膜外血腫（非外傷非處置）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-27:d","q":"【AHA Coding Clinic 2023年第3季】\n巨乳症併背頸痛、乳下皺褶皮疹、胸罩肩帶壓溝,行縮乳術。\n依該季 Coding Clinic，下列結論何者正確？","o":["胸罩肩帶壓溝 ICD-10-CM 未分類,不報告。","COVID-19 所致病毒性心肌炎編 U07.1 + B33.22（非 I40.0/I41）。","ICD-10-CM 推定甲狀腺低下與失智相關，編 E03.- + F02.80。","RAD 但明確無氣喘時 ICD-10-CM 無 RAD 分類，改編症狀碼（如喘鳴），不可用氣喘碼。"],"e":"正解：胸罩肩帶壓溝 ICD-10-CM 未分類,不報告。 應使用：不報告胸罩肩帶壓溝(依巨乳症等實際病況編)。 不應使用：另編肩帶壓溝。 實務：ICD-10-CM 無此分類。 （來源：AHA Coding Clinic 2023年第3季「胸罩肩帶壓溝／巨乳症」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-28:a","q":"【AHA Coding Clinic 2023年第3季｜髕骨表面置換併襯墊更換】\n左 TKA 不穩,行髕骨表面置換與聚乙烯襯墊更換。\n依該季 Coding Clinic，應如何編碼？","o":["0QUF0JZ + 0SPD09Z + 0SUW09Z","0SPD09Z + 0SUW09Z","0QUF0JZ + 0SUW09Z","0QUF0JZ + 0SPD09Z"],"e":"正解：0QUF0JZ + 0SPD09Z + 0SUW09Z。0QUF0JZ（左髕骨 Supplement 合成替代物,開放）+ 0SPD09Z（左膝關節襯墊移除,開放）+ 0SUW09Z（左膝關節脛側襯墊 Supplement,開放） 重點：髕骨表面置換 + 脛側襯墊更換：0QUF0JZ + 0SPD09Z + 0SUW09Z。 實務：髕骨表面置換=Supplement;襯墊更換=移除+Supplement。 （來源：AHA Coding Clinic 2023年第3季「髕骨表面置換併襯墊更換」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-28:d","q":"【AHA Coding Clinic 2023年第3季】\n左 TKA 不穩,行髕骨表面置換與聚乙烯襯墊更換。\n依該季 Coding Clinic，下列結論何者正確？","o":["髕骨表面置換 + 脛側襯墊更換：0QUF0JZ + 0SPD09Z + 0SUW09Z。","緊急環甲切開(置氣管內管)編 0CUS0JZ + 後續氣切 0B110F4。","Hemospray 止血編 XW0G886 + 0W3P8ZZ。","翻修移位椎間融合器並再融合：0SW00AZ + 0RGA0K1 + 0SG10K1。"],"e":"正解：髕骨表面置換 + 脛側襯墊更換：0QUF0JZ + 0SPD09Z + 0SUW09Z。 應使用：0QUF0JZ（左髕骨 Supplement 合成替代物,開放）+ 0SPD09Z（左膝關節襯墊移除,開放）+ 0SUW09Z（左膝關節脛側襯墊 Supplement,開放）。 實務：髕骨表面置換=Supplement;襯墊更換=移除+Supplement。 （來源：AHA Coding Clinic 2023年第3季「髕骨表面置換併襯墊更換」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-29:d","q":"【AHA Coding Clinic 2023年第3季】\n右三踝骨折 ORIF,自跟骨抽 BMAC 注入骨折處。\n依該季 Coding Clinic，下列結論何者正確？","o":["ORIF 中 BMAC 抽吸與注射為手術固有,不另編。","CPB 中高血鉀以 Z-BUF 處理，為手術固有、不另編。","Norwood 手術中為顯露而切除胸腺,無獨立目的,不另編。","腹部手術中為輸尿管視覺化置支架、術末移除→為主處置固有，不另編。"],"e":"正解：ORIF 中 BMAC 抽吸與注射為手術固有,不另編。 應使用：不另編 BMAC 抽吸/注射(整合於骨折修補)。 不應使用：另編 BMAC。 實務：BMAC 整合於整體手術目的(骨折修補)。 （來源：AHA Coding Clinic 2023年第3季「ORIF 中骨髓抽吸濃縮液」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-30:a","q":"【AHA Coding Clinic 2023年第3季｜HeRO 移植片血栓清除】\n右上肢 HeRO 移植片血栓,以 AngioJet 與 Fogarty 血栓清除。\n依該季 Coding Clinic，應如何編碼？","o":["03C73ZZ + 05CY3ZZ","05CY3ZZ","03C73ZZ","03C73ZZ + 03H40DZ"],"e":"正解：03C73ZZ + 05CY3ZZ。03C73ZZ（右肱動脈物質清除,經皮=吻合處）+ 05CY3ZZ（上肢靜脈物質清除,經皮=中央/穿刺段） 不應使用／不適用：Revision(移植片未故障/移位)。 重點：HeRO 移植片血栓清除編 03C73ZZ + 05CY3ZZ(Extirpation)；非 Revision。 實務：移植片未故障/移位→非 Revision;清除血栓→Extirpation。 （來源：AHA Coding Clinic 2023年第3季「HeRO 移植片血栓清除」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-30:d","q":"【AHA Coding Clinic 2023年第3季】\n右上肢 HeRO 移植片血栓,以 AngioJet 與 Fogarty 血栓清除。\n依該季 Coding Clinic，下列結論何者正確？","o":["HeRO 移植片血栓清除編 03C73ZZ + 05CY3ZZ(Extirpation)；非 Revision。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。"],"e":"正解：HeRO 移植片血栓清除編 03C73ZZ + 05CY3ZZ(Extirpation)；非 Revision。 應使用：03C73ZZ（右肱動脈物質清除,經皮=吻合處）+ 05CY3ZZ（上肢靜脈物質清除,經皮=中央/穿刺段）。 不應使用：Revision(移植片未故障/移位)。 實務：移植片未故障/移位→非 Revision;清除血栓→Extirpation。 （來源：AHA Coding Clinic 2023年第3季「HeRO 移植片血栓清除」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-31:d","q":"【AHA Coding Clinic 2023年第3季】\nSVG-RCA 高度狹窄行 DES,術中置 Emboshield 濾器後移除。\n依該季 Coding Clinic，下列結論何者正確？","o":["術中 Emboshield 栓塞濾器不另編;只編主要處置。","於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。","【更正】vein graft 狹窄+血栓致 NSTEMI 編 T82.857A + T82.867A + I21.A9。","冠脈瘤併廔管行 CABG，但 vein graft 最終結紮/橫斷；編修補冠靜脈+修補冠動脈+隱靜脈取材。"],"e":"正解：術中 Emboshield 栓塞濾器不另編;只編主要處置。 應使用：不編 Emboshield 濾器(只編主要處置)。 不應使用：X2A6325（腦栓塞濾器,主動脈弓;不符本例）。 實務：術中栓塞濾器不另編;X2A6325 不符(2019 Q4 p.46)。 （來源：AHA Coding Clinic 2023年第3季「隱靜脈移植片藥物塗層支架併 Emboshield 濾器」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-32:a","q":"【AHA Coding Clinic 2023年第3季｜Tack 血管內系統】\n周邊動脈疾病,左 SFA 動脈粥狀切除+藥球後焦點剝離,置 6 個 Tack 裝置。\n依該季 Coding Clinic，應如何編碼？","o":["04UL3JZ","04130JR","04BH0ZZ","04BJ0ZZ"],"e":"正解：04UL3JZ。04UL3JZ（左股動脈 Supplement 合成替代物,經皮） 重點：SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。 實務：Tack 加固血管壁修補剝離→Supplement。 （來源：AHA Coding Clinic 2023年第3季「Tack 血管內系統」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-32:d","q":"【AHA Coding Clinic 2023年第3季】\n周邊動脈疾病,左 SFA 動脈粥狀切除+藥球後焦點剝離,置 6 個 Tack 裝置。\n依該季 Coding Clinic，下列結論何者正確？","o":["SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。","【釐清】2015 Q2 p.20-21 漏編 plate；椎板成形 plate 插入應加編 0PH304Z。","於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。"],"e":"正解：SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。 應使用：04UL3JZ（左股動脈 Supplement 合成替代物,經皮）。 實務：Tack 加固血管壁修補剝離→Supplement。 （來源：AHA Coding Clinic 2023年第3季「Tack 血管內系統」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-33:a","q":"【AHA Coding Clinic 2023年第3季｜Pipeline Shield 裝置（椎動脈 V4 剝離性動脈瘤）】\n左椎動脈 V4 剝離性動脈瘤置 2 個 pipeline shield。\n依該季 Coding Clinic，應如何編碼？","o":["03VG3HZ","03VK3HZ","03VK3DZ","03C73ZZ"],"e":"正解：03VG3HZ。03VG3HZ（顱內動脈 Restriction,血流導向,經皮） 不應使用／不適用：vertebral artery body part(V4 屬顱內)。 重點：V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。 實務：V4 段依 body part key 歸 intracranial artery;pipeline=flow diverter。 （來源：AHA Coding Clinic 2023年第3季「Pipeline Shield 裝置（椎動脈 V4 剝離性動脈瘤）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-33:d","q":"【AHA Coding Clinic 2023年第3季】\n左椎動脈 V4 剝離性動脈瘤置 2 個 pipeline shield。\n依該季 Coding Clinic，下列結論何者正確？","o":["V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。","NIFTP（borderline/pre-malignant）編 D44.0。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。"],"e":"正解：V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。 應使用：03VG3HZ（顱內動脈 Restriction,血流導向,經皮）。 不應使用：vertebral artery body part(V4 屬顱內)。 實務：V4 段依 body part key 歸 intracranial artery;pipeline=flow diverter。 （來源：AHA Coding Clinic 2023年第3季「Pipeline Shield 裝置（椎動脈 V4 剝離性動脈瘤）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-34:a","q":"【AHA Coding Clinic 2023年第3季｜主動脈剝離瓣開窗】\n急性 B 型主動脈剝離併腎灌流不良,開窗延伸至胸主動脈。\n依該季 Coding Clinic，應如何編碼？","o":["04Q03ZZ + 02QW3ZZ","02QW3ZZ","04Q03ZZ","04130JR + 02QW3ZZ"],"e":"正解：04Q03ZZ + 02QW3ZZ。04Q03ZZ（腹主動脈修補,經皮=腹段開窗）+ 02QW3ZZ（降胸主動脈修補,經皮=胸段開窗） 重點：腹主+降胸主動脈剝離瓣開窗編 04Q03ZZ + 02QW3ZZ(Repair)。 實務：開窗恢復正常結構/功能→Repair。 （來源：AHA Coding Clinic 2023年第3季「主動脈剝離瓣開窗」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-34:d","q":"【AHA Coding Clinic 2023年第3季】\n急性 B 型主動脈剝離併腎灌流不良,開窗延伸至胸主動脈。\n依該季 Coding Clinic，下列結論何者正確？","o":["腹主+降胸主動脈剝離瓣開窗編 04Q03ZZ + 02QW3ZZ(Repair)。","DeBakey type 1 多段胸主動脈剝離各編一碼。","腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。"],"e":"正解：腹主+降胸主動脈剝離瓣開窗編 04Q03ZZ + 02QW3ZZ(Repair)。 應使用：04Q03ZZ（腹主動脈修補,經皮=腹段開窗）+ 02QW3ZZ（降胸主動脈修補,經皮=胸段開窗）。 實務：開窗恢復正常結構/功能→Repair。 （來源：AHA Coding Clinic 2023年第3季「主動脈剝離瓣開窗」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q4-01:a","q":"【AHA Coding Clinic 2023年第4季｜鐮刀細胞病併指（趾）炎】\n6月大鐮刀細胞貧血,發燒併手足腫痛,診斷 SCD 併 dactylitis。\n依該季 Coding Clinic，應如何編碼？","o":["D57.04 + R50.81","R50.81","D57.04","D57.04 + D57.02"],"e":"正解：D57.04 + R50.81。D57.04（Hb-SS 病併指炎）+ R50.81（伴他處病況之發燒） 重點：SCD 併指炎編 D57.04(Hb-SS 併 dactylitis)+ 發燒 R50.81。 實務：dactylitis 為急性 VOC 表現;D57.x4 系列為 FY2024 新碼。 （來源：AHA Coding Clinic 2023年第4季「鐮刀細胞病併指（趾）炎」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-01:d","q":"【AHA Coding Clinic 2023年第4季】\n6月大鐮刀細胞貧血,發燒併手足腫痛,診斷 SCD 併 dactylitis。\n依該季 Coding Clinic，下列結論何者正確？","o":["SCD 併指炎編 D57.04(Hb-SS 併 dactylitis)+ 發燒 R50.81。","MCD 併 ATN 之 AKI 編 N17.0 + N04.0。","「左側」下背痛編 M54.50（非 M54.59）；ICD-10-CM 依 type 而非 laterality 分類。","鐮刀型貧血脾隔離危象併功能性無脾，編 D57.02 + D73.0；非 Q89.01。"],"e":"正解：SCD 併指炎編 D57.04(Hb-SS 併 dactylitis)+ 發燒 R50.81。 應使用：D57.04（Hb-SS 病併指炎）+ R50.81（伴他處病況之發燒）。 實務：dactylitis 為急性 VOC 表現;D57.x4 系列為 FY2024 新碼。 （來源：AHA Coding Clinic 2023年第4季「鐮刀細胞病併指（趾）炎」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q4-02:a","q":"【AHA Coding Clinic 2023年第4季｜自體顯性低血鈣】\n手足肌肉痙攣抽搐,診斷 autosomal dominant hypocalcemia。\n依該季 Coding Clinic，應如何編碼？","o":["E20.810","E27.49","E23.3","E23.6"],"e":"正解：E20.810。E20.810（自體顯性低血鈣） 重點：自體顯性低血鈣編 E20.810。 實務：E20.81- 為 FY2024 新碼(PTH 分泌不良之副甲低下)。 （來源：AHA Coding Clinic 2023年第4季「自體顯性低血鈣」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-02:d","q":"【AHA Coding Clinic 2023年第4季】\n手足肌肉痙攣抽搐,診斷 autosomal dominant hypocalcemia。\n依該季 Coding Clinic，下列結論何者正確？","o":["自體顯性低血鈣編 E20.810。","NIFTP（borderline/pre-malignant）編 D44.0。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","蛆蟲療法為非切除性清創,編 0JDR0ZZ。"],"e":"正解：自體顯性低血鈣編 E20.810。 應使用：E20.810（自體顯性低血鈣）。 實務：E20.81- 為 FY2024 新碼(PTH 分泌不良之副甲低下)。 （來源：AHA Coding Clinic 2023年第4季「自體顯性低血鈣」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q4-03:a","q":"【AHA Coding Clinic 2023年第4季｜A 型胰島素阻抗症候群】\n11歲多毛併皮膚黑色棘皮,基因檢測確診 TAIRS。\n依該季 Coding Clinic，應如何編碼？","o":["E88.811","E88.A","E87.6","E88.2"],"e":"正解：E88.811。E88.811（胰島素阻抗症候群,A 型） 重點：TAIRS 編 E88.811。 實務：E88.81- 為 FY2024 新碼(含代謝症候群 E88.810)。 （來源：AHA Coding Clinic 2023年第4季「A 型胰島素阻抗症候群」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-03:d","q":"【AHA Coding Clinic 2023年第4季】\n11歲多毛併皮膚黑色棘皮,基因檢測確診 TAIRS。\n依該季 Coding Clinic，下列結論何者正確？","o":["TAIRS 編 E88.811。","糖尿病微量白蛋白尿編 E11.29 + R80.8。","L2-L3 硬膜外脂肪增多症編 E88.2；並加編相關脊椎病變。","ESS 編 E23.6；僅影像「空蝶鞍」無 ESS 診斷則編 R93.0。"],"e":"正解：TAIRS 編 E88.811。 應使用：E88.811（胰島素阻抗症候群,A 型）。 實務：E88.81- 為 FY2024 新碼(含代謝症候群 E88.810)。 （來源：AHA Coding Clinic 2023年第4季「A 型胰島素阻抗症候群」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-04:d","q":"【AHA Coding Clinic 2023年第4季】\n虛弱、食慾差、顯著體重下降,惡病質 due to 嚴重營養不良 secondary to 重度失智併憂鬱。\n依該季 Coding Clinic，下列結論何者正確？","o":["重度失智併憂鬱致嚴重營養不良/惡病質:潛在病因先編,再 E88.A。","失智併焦慮與憂鬱推定相關，編 F03.94 + F03.93 + F32.A。","需 query 是續發性或原有惡化；續發 → D69.59（POA N）+ D69.6（POA Y）；若僅惡化 → 只 D69.6（POA Y）。","ATI 等同急性腎小管壞死，AKI due to ATI 編 N17.0。"],"e":"正解：重度失智併憂鬱致嚴重營養不良/惡病質:潛在病因先編,再 E88.A。 應使用：F03.C3（重度失智併情緒障礙）+ E43（未特指重度蛋白熱量營養不良）+ F32.A（憂鬱）+ E88.A（依潛在病因之消耗性疾病）。 編碼順序：潛在病因先編,E88.A 續後。 實務：E88.A『code first underlying condition』;cachexia due to underlying condition 為 inclusion。 （來源：AHA Coding Clinic 2023年第4季「依潛在病因之消耗性疾病」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-05:d","q":"【AHA Coding Clinic 2023年第4季】\n情境:輕度靜止性顫抖→G20.B1;晚期併 dyskinesia+wearing-off→G20.B2;有 ON/OFF 波動無 dyskinesia→G20.A2。\n依該季 Coding Clinic，下列結論何者正確？","o":["帕金森依 dyskinesia 與 fluctuations 分:G20.A1/A2/B1/B2/C。","Pott 膨脹瘤(額竇骨髓炎)→M86.8X81(顏面及鼻竇其他骨髓炎),該碼含 Pott puffy tumor 之 inclusion term。","體外切除肝腫瘤後自體再植：只編所行處置(切除)；非 Transplantation。","FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。"],"e":"正解：帕金森依 dyskinesia 與 fluctuations 分:G20.A1/A2/B1/B2/C。 應使用：無dyskinesia無波動 G20.A1／無dyskinesia有波動 G20.A2／有dyskinesia無波動 G20.B1／有dyskinesia有波動 G20.B2／未特指 parkinsonism G20.C。 編碼順序：依 dyskinesia/fluctuations 選碼。 實務：G20 擴充為 FY2024 新碼;fluctuations=ON/OFF episodes。 （來源：AHA Coding Clinic 2023年第4季「帕金森病併 OFF 現象」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-08:d","q":"【AHA Coding Clinic 2023年第4季】\n高血壓病人大量自發性腦幹出血致昏迷。\n依該季 Coding Clinic，下列結論何者正確？","o":["自發性腦幹出血致昏迷:主診 I61.3 + R40.2A(潛在病因先編)。","腦點狀出血編 I61.8（=出血性中風）。","產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。","非外傷性急性肝損傷（病因已知）編 K71.8 + C78.7 + T45.1X5A；非 S36.11-。"],"e":"正解：自發性腦幹出血致昏迷:主診 I61.3 + R40.2A(潛在病因先編)。 應使用：I61.3（腦幹非外傷性腦內出血）主診 + R40.2A（依潛在病因之非外傷性昏迷）+ I10。 編碼順序：潛在病因(I61.3)先編。 實務：R40.2A 為 FY2024 新碼(含 secondary coma);code first underlying。 （來源：AHA Coding Clinic 2023年第4季「依潛在病因之非外傷性昏迷」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q4-09:a","q":"【AHA Coding Clinic 2023年第4季｜乳房攝影緻密乳房】\n篩檢乳攝雙乳異質緻密,無惡性證據。\n依該季 Coding Clinic，應如何編碼？","o":["Z12.31 + R92.333","R92.333","Z12.31","Z12.31 + Z18.89"],"e":"正解：Z12.31 + R92.333。Z12.31（乳癌篩檢乳攝就診）主診 + R92.333（乳攝異質緻密,雙側） 編碼順序：Z12.31 為主診。 重點：篩檢乳攝發現異質緻密乳房:Z12.31 主診 + R92.333。 實務：R92.3- 為 FY2024 新碼;可與篩檢乳攝同就診並編。 （來源：AHA Coding Clinic 2023年第4季「乳房攝影緻密乳房」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-09:d","q":"【AHA Coding Clinic 2023年第4季】\n篩檢乳攝雙乳異質緻密,無惡性證據。\n依該季 Coding Clinic，下列結論何者正確？","o":["篩檢乳攝發現異質緻密乳房:Z12.31 主診 + R92.333。","中度失智併精神病性障礙與幻覺編 F03.B2 + R44.3。","同時診斷原發與轉移時,原發為主診(除非治療僅針對轉移灶)。","AML 所致全血球減少入院輸血支持，主診 D61.818 + C92.02。"],"e":"正解：篩檢乳攝發現異質緻密乳房:Z12.31 主診 + R92.333。 應使用：Z12.31（乳癌篩檢乳攝就診）主診 + R92.333（乳攝異質緻密,雙側）。 編碼順序：Z12.31 為主診。 實務：R92.3- 為 FY2024 新碼;可與篩檢乳攝同就診並編。 （來源：AHA Coding Clinic 2023年第4季「乳房攝影緻密乳房」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q4-10:a","q":"【AHA Coding Clinic 2023年第4季｜甲狀軟骨骨折開放復位】\n跌倒致移位甲狀軟骨骨折,開放復位以鋼板螺釘固定。\n依該季 Coding Clinic，應如何編碼？","o":["0CSS0ZZ","0CUS0JZ","009640Z","01580ZZ"],"e":"正解：0CSS0ZZ。0CSS0ZZ（喉 Reposition,開放） 重點：甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。 實務：甲狀軟骨骨折修補歸 Reposition larynx。 （來源：AHA Coding Clinic 2023年第4季「甲狀軟骨骨折開放復位」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-10:d","q":"【AHA Coding Clinic 2023年第4季】\n跌倒致移位甲狀軟骨骨折,開放復位以鋼板螺釘固定。\n依該季 Coding Clinic，下列結論何者正確？","o":["甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","內視鏡經蝶切除蝶鞍顱咽管瘤編 0NBC4ZZ（Excision，蝶骨）。","CABG 後胸骨剛性鋼板固定另編 0PH000Z。"],"e":"正解：甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。 應使用：0CSS0ZZ（喉 Reposition,開放）。 實務：甲狀軟骨骨折修補歸 Reposition larynx。 （來源：AHA Coding Clinic 2023年第4季「甲狀軟骨骨折開放復位」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-11:d","q":"【AHA Coding Clinic 2023年第4季】\n左下肢慢性靜脈功能不全/DVT,經縱切靜脈切開置左股靜脈生物瓣。\n依該季 Coding Clinic，下列結論何者正確？","o":["左股靜脈生物瓣(VenoValve)置入編 X2H30R9。","股靜脈結紮(止血)之自然結果 DVT 編 I82.412,非手術併發症;併骨折/血管傷碼。","改良 Bentall 瓣膜導管：主動脈根(升主/弓)置換 + 主動脈瓣置換分別編。","HPA 軸功能不全需三碼 E27.49 + E23.3 + E23.0。"],"e":"正解：左股靜脈生物瓣(VenoValve)置入編 X2H30R9。 應使用：X2H30R9（左股靜脈生物瓣腔內裝置置入,開放,新技術 group9）。 實務：X2H 新增股靜脈 body part(VenoValve)為 FY2024 新技術。 （來源：AHA Coding Clinic 2023年第4季「股靜脈生物瓣置入」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-12:d","q":"【AHA Coding Clinic 2023年第4季】\n移植右腎急性腎盂腎炎致 Klebsiella 敗血症(POA,無休克)。\n依該季 Coding Clinic，下列結論何者正確？","o":["移植腎腎盂腎炎所致敗血症:A41.59 主診 + T86.13 + N10 + N16。","CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。","MCD 併 ATN 之 AKI 編 N17.0 + N04.0。","橫紋肌溶解所致 AKF 編 N17.8 + 橫紋肌溶解碼。"],"e":"正解：移植腎腎盂腎炎所致敗血症:A41.59 主診 + T86.13 + N10 + N16。 應使用：A41.59（其他革蘭氏陰性敗血症）主診 + T86.13（腎移植感染）+ N10（急性腎盂腎炎）+ N16（他處疾病之腎小管間質疾患）。 不應使用：以 T86 類目為主診。 編碼順序：A41.59 為主診。 實務：移植併發症致全身感染時,敗血症為主診(I.C.1.d.4);索引 Pyelonephritis in sepsis A41.9 [N16]。 （來源：AHA Coding Clinic 2023年第4季「移植腎腎盂腎炎所致克雷伯氏菌敗血症」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q4-13:d","q":"【AHA Coding Clinic 2023年第4季】\n腹腔鏡右半結腸切除+沾黏鬆解,小漿膜撕裂縫合修補。\n依該季 Coding Clinic，下列結論何者正確？","o":["【釐清】輕微漿膜撕裂縫合(未改變手術進程)不編診斷亦不編修補。","同部位切除+非切除性清創(較深層)只編切除性 0JB70ZZ。","術中硬膜撕裂編 G97.41；有記載即應報告（含 inherent/inadvertent）。","剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。"],"e":"正解：【釐清】輕微漿膜撕裂縫合(未改變手術進程)不編診斷亦不編修補。 應使用：不編漿膜撕裂/修補(未改變手術進程)。 不應使用：以併發症編。 實務：除非記載廣泛/改變手術進程(需切除/吻合等)才編;類同沾黏。 （來源：AHA Coding Clinic 2023年第4季「釐清：術中漿膜撕裂」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2024Q1-01:d","q":"【AHA Coding Clinic 2024年第1季】\n復發乙狀結腸憩室炎行手輔助腹腔鏡乙狀結腸切除（GelPort），遠端腔鏡切除、近端經傷口取出體外離斷。\n依該季 Coding Clinic，下列結論何者正確？","o":["手輔助腹腔鏡（GelPort）以入路值 4 經皮內視鏡 + qualifier G 手輔助編。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。","經口直視、無需器械到達 → 入路值 External（非 Percutaneous）。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。"],"e":"正解：手輔助腹腔鏡（GelPort）以入路值 4 經皮內視鏡 + qualifier G 手輔助編。 應使用：入路值 4（經皮內視鏡）+ qualifier G（手輔助）。 實務：依 B5.2b：手輔助或延長切口協助完成之腔鏡手術仍編經皮內視鏡入路。 （來源：AHA Coding Clinic 2024年第1季「經皮內視鏡手輔助入路」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-02:a","q":"【AHA Coding Clinic 2024年第1季｜前驅產程】\n37+2週規則陣痛但子宮頸未擴張，選擇性剖腹；醫師確診 prodromal labor。\n依該季 Coding Clinic，應如何編碼？","o":["O62.0","O69.89X0","O02.1","O03.4"],"e":"正解：O62.0。O62.0（原發性子宮收縮不良；含 failure of cervical dilatation） 重點：前驅產程（併子宮頸未擴張）編 O62.0；與假性陣痛不同。 實務：prodromal labor ≠ false labor；索引 Delivery, complicated by, dilatation, cervix, incomplete/poor/slow O62.0。 （來源：AHA Coding Clinic 2024年第1季「前驅產程」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-02:d","q":"【AHA Coding Clinic 2024年第1季】\n37+2週規則陣痛但子宮頸未擴張，選擇性剖腹；醫師確診 prodromal labor。\n依該季 Coding Clinic，下列結論何者正確？","o":["前驅產程（併子宮頸未擴張）編 O62.0；與假性陣痛不同。","HIV 篩檢偽陽性經確認陰性，無現行 indication 之選擇性剖腹產編 O82；HIV 陰性結果加 Z71.7。","醫師記 class 3 肥胖（或同時記 morbid + class 3）→ 只編 E66.813，不編 E66.01。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。"],"e":"正解：前驅產程（併子宮頸未擴張）編 O62.0；與假性陣痛不同。 應使用：O62.0（原發性子宮收縮不良；含 failure of cervical dilatation）。 實務：prodromal labor ≠ false labor；索引 Delivery, complicated by, dilatation, cervix, incomplete/poor/slow O62.0。 （來源：AHA Coding Clinic 2024年第1季「前驅產程」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-03:d","q":"【AHA Coding Clinic 2024年第1季】\n前次剖腹史，37+6週因絨毛膜羊膜分離引產失敗改剖腹。\n依該季 Coding Clinic，下列結論何者正確？","o":["絨毛膜羊膜分離（CAS）編 O41.8X30（索引無專項）。","12週絨毛膜下出血編 O20.8。","因前次肩難產病史排定剖腹、無現行併發症，編 O82 + Z87.59。","鐳-223 治療所致全血球減少編 D61.811 + T50.995A；非 T50.8X5(診斷劑)。"],"e":"正解：絨毛膜羊膜分離（CAS）編 O41.8X30（索引無專項）。 應使用：O41.8X30（羊水及膜其他特指疾患,第三孕期,不適用/未特指）。 實務：CAS 為 16 週後絨毛膜與羊膜完全分離。 （來源：AHA Coding Clinic 2024年第1季「絨毛膜羊膜分離」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-04:d","q":"【AHA Coding Clinic 2024年第1季】\n多結節性甲狀腺腫併橋本氏甲狀腺炎所致甲狀腺低下。\n依該季 Coding Clinic，下列結論何者正確？","o":["橋本氏甲狀腺炎編 E06.3；甲狀腺低下為其成分、不另編。","移植腎腎盂腎炎所致敗血症:A41.59 主診 + T86.13 + N10 + N16。","剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。","腎細胞癌侵犯腎靜脈/腎竇只編 C64.1；病理侵犯發現非轉移、不另編。"],"e":"正解：橋本氏甲狀腺炎編 E06.3；甲狀腺低下為其成分、不另編。 應使用：E06.3（自體免疫甲狀腺炎）。 不應使用：另編甲狀腺低下。 實務：索引 Hypothyroidism, autoimmune → see Thyroiditis, autoimmune E06.3。 （來源：AHA Coding Clinic 2024年第1季「橋本氏甲狀腺炎所致甲狀腺低下」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-05:a","q":"【AHA Coding Clinic 2024年第1季｜下視丘-腦垂體-腎上腺軸功能不全】\nHPA 軸功能不全，長期類固醇治療；索引導向 E27.40 之疑義。\n依該季 Coding Clinic，應如何編碼？","o":["E27.49 + E23.3 + E23.0","E27.40 + E23.3 + E23.0","E23.3 + E23.0","E27.49 + E23.0"],"e":"正解：E27.49 + E23.3 + E23.0。E27.49（其他腎上腺皮質功能不全）+ E23.3（下視丘功能異常 NEC）+ E23.0（腦垂體功能低下） 不應使用／不適用：E27.40（未特指，無專碼時用 other specified）。 重點：HPA 軸功能不全需三碼 E27.49 + E23.3 + E23.0。 實務：無 HPA 軸專碼 → 以 other specified 組合三碼。 （來源：AHA Coding Clinic 2024年第1季「下視丘-腦垂體-腎上腺軸功能不全」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-05:d","q":"【AHA Coding Clinic 2024年第1季】\nHPA 軸功能不全，長期類固醇治療；索引導向 E27.40 之疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["HPA 軸功能不全需三碼 E27.49 + E23.3 + E23.0。","鐮刀型貧血脾隔離危象併功能性無脾，編 D57.02 + D73.0；非 Q89.01。","OSA 病人 PAP 治療後出現 ComSA，編 G47.33 + G47.39。","MCD 併腎病症候群編 N04.0；長期類固醇加 Z79.52。"],"e":"正解：HPA 軸功能不全需三碼 E27.49 + E23.3 + E23.0。 應使用：E27.49（其他腎上腺皮質功能不全）+ E23.3（下視丘功能異常 NEC）+ E23.0（腦垂體功能低下）。 不應使用：E27.40（未特指，無專碼時用 other specified）。 實務：無 HPA 軸專碼 → 以 other specified 組合三碼。 （來源：AHA Coding Clinic 2024年第1季「下視丘-腦垂體-腎上腺軸功能不全」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-06:a","q":"【AHA Coding Clinic 2024年第1季｜急性攝護腺炎併膀胱炎】\nCT 顯示急性攝護腺炎與膀胱炎。\n依該季 Coding Clinic，應如何編碼？","o":["N41.3 + N41.0","N41.0","N41.3","N04.0 + N41.0"],"e":"正解：N41.3 + N41.0。N41.3（攝護腺膀胱炎）+ N41.0（急性攝護腺炎） 重點：急性攝護腺炎併膀胱炎編 N41.3 + N41.0。 實務：prostatocystitis 索引至 N41.3，但需 N41.0 捕捉急性度。 （來源：AHA Coding Clinic 2024年第1季「急性攝護腺炎併膀胱炎」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-06:d","q":"【AHA Coding Clinic 2024年第1季】\nCT 顯示急性攝護腺炎與膀胱炎。\n依該季 Coding Clinic，下列結論何者正確？","o":["急性攝護腺炎併膀胱炎編 N41.3 + N41.0。","橋本氏甲狀腺炎編 E06.3；甲狀腺低下為其成分、不另編。","MCD 併 ATN 之 AKI 編 N17.0 + N04.0。","置導尿管創傷攝護腺致血尿屬術後出血，編 N99.820 + Y84.6 + R31.0。"],"e":"正解：急性攝護腺炎併膀胱炎編 N41.3 + N41.0。 應使用：N41.3（攝護腺膀胱炎）+ N41.0（急性攝護腺炎）。 實務：prostatocystitis 索引至 N41.3，但需 N41.0 捕捉急性度。 （來源：AHA Coding Clinic 2024年第1季「急性攝護腺炎併膀胱炎」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-07:a","q":"【AHA Coding Clinic 2024年第1季｜脂性皮膚硬化症併靜脈鬱滯潰瘍（無靜脈曲張）】\n肥胖病人雙側靜脈鬱滯病、淋巴水腫、右外側小腿靜脈鬱滯潰瘍併脂性皮膚硬化。\n依該季 Coding Clinic，應如何編碼？","o":["M79.3 + L97.219 + I87.2 + I89.0","L97.219 + I87.2 + I89.0","M79.3 + I87.2 + I89.0","M79.3 + L97.219 + I89.0"],"e":"正解：M79.3 + L97.219 + I87.2 + I89.0。M79.3（脂膜炎,未特指）+ L97.219（右小腿非壓瘡慢性潰瘍,未特指嚴重度）+ I87.2（慢性周邊靜脈功能不全）+ I89.0（淋巴水腫 NEC） 不應使用／不適用：靜脈曲張碼（無記載）。 重點：脂性皮膚硬化症編 M79.3（脂膜炎）；無靜脈曲張不可用靜脈曲張碼。 實務：lipodermatosclerosis = sclerosing panniculitis → M79.3；無靜脈曲張記載不可編 varix。 （來源：AHA Coding Clinic 2024年第1季「脂性皮膚硬化症併靜脈鬱滯潰瘍（無靜脈曲張）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-07:d","q":"【AHA Coding Clinic 2024年第1季】\n肥胖病人雙側靜脈鬱滯病、淋巴水腫、右外側小腿靜脈鬱滯潰瘍併脂性皮膚硬化。\n依該季 Coding Clinic，下列結論何者正確？","o":["脂性皮膚硬化症編 M79.3（脂膜炎）；無靜脈曲張不可用靜脈曲張碼。","苔癬樣角化症編 L82.0。","漿膜炎為克隆氏症固有表現，只編克隆氏症，不另編漿膜炎。","舊中風症狀復發編後遺症碼 I69.392 + I69.398。"],"e":"正解：脂性皮膚硬化症編 M79.3（脂膜炎）；無靜脈曲張不可用靜脈曲張碼。 應使用：M79.3（脂膜炎,未特指）+ L97.219（右小腿非壓瘡慢性潰瘍,未特指嚴重度）+ I87.2（慢性周邊靜脈功能不全）+ I89.0（淋巴水腫 NEC）。 不應使用：靜脈曲張碼（無記載）。 實務：lipodermatosclerosis = sclerosing panniculitis → M79.3；無靜脈曲張記載不可編 varix。 （來源：AHA Coding Clinic 2024年第1季「脂性皮膚硬化症併靜脈鬱滯潰瘍（無靜脈曲張）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-08:a","q":"【AHA Coding Clinic 2024年第1季｜發炎性多關節病併類風濕關節炎】\n類風濕關節炎併發炎性多關節病，關節痛行類固醇注射。\n依該季 Coding Clinic，應如何編碼？","o":["M06.4","M06.9","M00.061","M13.80"],"e":"正解：M06.4。M06.4（發炎性多關節病） 不應使用／不適用：M06.9（未特指，已載 polyarthropathy 時不用）。 重點：類風濕關節炎併發炎性多關節病編 M06.4（較 M06.9 特定）。 實務：inflammatory polyarthropathy 為 M06 下特定型 RA。對照 [[CC2025Q2-10 發炎性關節炎（未指部位/型別）]]（未載型別時用 M13.80）。 （來源：AHA Coding Clinic 2024年第1季「發炎性多關節病併類風濕關節炎」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-08:d","q":"【AHA Coding Clinic 2024年第1季】\n類風濕關節炎併發炎性多關節病，關節痛行類固醇注射。\n依該季 Coding Clinic，下列結論何者正確？","o":["類風濕關節炎併發炎性多關節病編 M06.4（較 M06.9 特定）。","左腓腸肌馬蹄攣縮編 M62.462。","術後脂肪肺栓塞編 T81.718A + I26.96。","MCD 併腎病症候群編 N04.0；長期類固醇加 Z79.52。"],"e":"正解：類風濕關節炎併發炎性多關節病編 M06.4（較 M06.9 特定）。 應使用：M06.4（發炎性多關節病）。 不應使用：M06.9（未特指，已載 polyarthropathy 時不用）。 實務：inflammatory polyarthropathy 為 M06 下特定型 RA。對照 [[CC2025Q2-10 發炎性關節炎（未指部位/型別）]]（未載型別時用 M13.80）。 （來源：AHA Coding Clinic 2024年第1季「發炎性多關節病併類風濕關節炎」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-09:a","q":"【AHA Coding Clinic 2024年第1季｜椎板切除術後腰椎滑脫】\n腰椎減壓術後滑脫、動態不穩、馬尾症候群，行 L4-S1 TLIF；醫師記滑脫因減壓削弱後張力帶等。\n依該季 Coding Clinic，應如何編碼？","o":["M96.89 + M43.16 + G83.4","M96.1 + M43.16 + G83.4","M43.16 + G83.4","M96.89 + G83.4"],"e":"正解：M96.89 + M43.16 + G83.4。M96.89（肌肉骨骼其他術中/術後併發症）+ M43.16（腰椎滑脫）+ G83.4（馬尾症候群） 不應使用／不適用：M96.1（postlaminectomy syndrome，已特指為滑脫時不用）。 重點：減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。 實務：依 I.B.16 因果記載即足；特指為滑脫時不用 M96.1。 （來源：AHA Coding Clinic 2024年第1季「椎板切除術後腰椎滑脫」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-09:d","q":"【AHA Coding Clinic 2024年第1季】\n腰椎減壓術後滑脫、動態不穩、馬尾症候群，行 L4-S1 TLIF；醫師記滑脫因減壓削弱後張力帶等。\n依該季 Coding Clinic，下列結論何者正確？","o":["減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。","妊娠肝內膽汁鬱積編 O26.62 + E78.79 + K76.89；無阻塞不用 K83.1。","峽部骨折致滑脫只編滑脫 M43.17。","只記 inflammatory arthritis 未指部位/型別時 query；無資訊→M13.80，非 M06.4。"],"e":"正解：減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。 應使用：M96.89（肌肉骨骼其他術中/術後併發症）+ M43.16（腰椎滑脫）+ G83.4（馬尾症候群）。 不應使用：M96.1（postlaminectomy syndrome，已特指為滑脫時不用）。 實務：依 I.B.16 因果記載即足；特指為滑脫時不用 M96.1。 （來源：AHA Coding Clinic 2024年第1季「椎板切除術後腰椎滑脫」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-10:a","q":"【AHA Coding Clinic 2024年第1季｜術後深部傷口感染性敗血症】\nCABG 後手術傷口膿性引流，記 sepsis due to staph pyogenes deep operative wound infection。\n依該季 Coding Clinic，應如何編碼？","o":["T81.42XA + T81.44XA + A41.1","T81.40XA + T81.44XA + A41.1","T81.44XA + A41.1","T81.42XA + A41.1"],"e":"正解：T81.42XA + T81.44XA + A41.1。T81.42XA（深部切開手術部位感染,初診）+ T81.44XA（術後敗血症,初診）+ A41.1（其他特指葡萄球菌敗血症） 不應使用／不適用：T81.40XA（未特指，本例已載深部）。 編碼順序：感染部位碼先，敗血症次。 重點：CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。 實務：依 I.C.1.d.5.b：感染部位碼(T81.41-43/49)先，加 T81.44 與致病菌。 （來源：AHA Coding Clinic 2024年第1季「術後深部傷口感染性敗血症」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-10:d","q":"【AHA Coding Clinic 2024年第1季】\nCABG 後手術傷口膿性引流，記 sepsis due to staph pyogenes deep operative wound infection。\n依該季 Coding Clinic，下列結論何者正確？","o":["CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。","failed back syndrome 為非特異詞、非 postlaminectomy；只編其表現(此為頸髓病變 G95.9)。","突出(prominent)脊椎內固定=protrusion 編 T84.296A；併疼痛加 T84.84XA。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。"],"e":"正解：CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。 應使用：T81.42XA（深部切開手術部位感染,初診）+ T81.44XA（術後敗血症,初診）+ A41.1（其他特指葡萄球菌敗血症）。 不應使用：T81.40XA（未特指，本例已載深部）。 編碼順序：感染部位碼先，敗血症次。 實務：依 I.C.1.d.5.b：感染部位碼(T81.41-43/49)先，加 T81.44 與致病菌。 （來源：AHA Coding Clinic 2024年第1季「術後深部傷口感染性敗血症」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-11:a","q":"【AHA Coding Clinic 2024年第1季｜術後腹內膿瘍】\n腸切除+腸皮廔切除後，CT 示術後腹內膿瘍經皮引流。\n依該季 Coding Clinic，應如何編碼？","o":["T81.43XA + K65.1","K65.1","T81.43XA","T84.82XA + K65.1"],"e":"正解：T81.43XA + K65.1。T81.43XA（器官/腔隙手術部位感染,初診）+ K65.1（腹膜膿瘍） 重點：術後腹內膿瘍編 T81.43XA + K65.1。 實務：T81.43 指示 use additional code to identify infection → K65.1。 （來源：AHA Coding Clinic 2024年第1季「術後腹內膿瘍」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-11:d","q":"【AHA Coding Clinic 2024年第1季】\n腸切除+腸皮廔切除後，CT 示術後腹內膿瘍經皮引流。\n依該季 Coding Clinic，下列結論何者正確？","o":["術後腹內膿瘍編 T81.43XA + K65.1。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","自行拔除導尿管致血尿屬裝置所致出血(非術後併發症)，編 T83.83XA + R31.9。","術後脂肪肺栓塞編 T81.718A + I26.96。"],"e":"正解：術後腹內膿瘍編 T81.43XA + K65.1。 應使用：T81.43XA（器官/腔隙手術部位感染,初診）+ K65.1（腹膜膿瘍）。 實務：T81.43 指示 use additional code to identify infection → K65.1。 （來源：AHA Coding Clinic 2024年第1季「術後腹內膿瘍」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-12:d","q":"【AHA Coding Clinic 2024年第1季】\n情境一：L4-L5 減壓/切除因沾黏致硬膜撕裂並修補；情境二：骨移除致薄硬膜小開口縫合+纖維膠。\n依該季 Coding Clinic，下列結論何者正確？","o":["術中硬膜撕裂編 G97.41；有記載即應報告（含 inherent/inadvertent）。","reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。","於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。","記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。"],"e":"正解：術中硬膜撕裂編 G97.41；有記載即應報告（含 inherent/inadvertent）。 應使用：G97.41（處置中意外穿刺或撕裂硬膜）。 實務：硬膜撕裂具臨床意義，醫師記載即應報告，即使為 inherent。 （來源：AHA Coding Clinic 2024年第1季「術中硬膜撕裂（硬膜切開）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-13:d","q":"【AHA Coding Clinic 2024年第1季】\n情境一：瘦弱致裝置突出行 pocket 修整 + 產生器更換；情境二：CRT-D 換雙腔 PPM，先前關閉之 LV 導線斷裂加帽。\n依該季 Coding Clinic，下列結論何者正確？","o":["ERI 產生器更換編 Z45.02；瘦弱致裝置突出/導線突出、或先前已關閉之 LV 導線斷裂，皆不視為裝置併發症。","DIEAP 皮瓣(乳房重建)靜脈血栓編 T85.868A。","自行拔除導尿管致血尿屬裝置所致出血(非術後併發症)，編 T83.83XA + R31.9。","生物瓣心內膜炎+生物性主動脈瓣狹窄(裝置併發症)+二尖瓣逆流；不編 I08 多瓣膜病。"],"e":"正解：ERI 產生器更換編 Z45.02；瘦弱致裝置突出/導線突出、或先前已關閉之 LV 導線斷裂，皆不視為裝置併發症。 應使用：Z45.02（自動植入式心臟去顫器調整與管理就診）。 不應使用：導線併發症碼（本二例皆不適用）。 編碼順序：Z45.02 為主診。 實務：突出/導線突出因體型、非併發症；先前已停用之斷裂導線本次未影響病人 → 不另編。 （來源：AHA Coding Clinic 2024年第1季「ICD/CRT-D 產生器更換之併發症判定」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-14:a","q":"【AHA Coding Clinic 2024年第1季｜脊椎側彎矯正術後 adding-on 現象】\n17歲 AIS T2-T12 融合後腰椎彎曲進展，行 T2-L3 融合矯正 adding-on。\n依該季 Coding Clinic，應如何編碼？","o":["M96.89 + M41.125 + Z98.1","M41.125 + Z98.1","M96.89 + Z98.1","M96.89 + M41.125"],"e":"正解：M96.89 + M41.125 + Z98.1。M96.89（肌肉骨骼其他術中/術後併發症）+ M41.125（青少年特發性側彎,胸腰段）+ Z98.1（關節固定術後狀態） 重點：前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。 實務：依 M96.89 指示加編以特指疾患；已融合故加 Z98.1。 （來源：AHA Coding Clinic 2024年第1季「脊椎側彎矯正術後 adding-on 現象」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-14:d","q":"【AHA Coding Clinic 2024年第1季】\n17歲 AIS T2-T12 融合後腰椎彎曲進展，行 T2-L3 融合矯正 adding-on。\n依該季 Coding Clinic，下列結論何者正確？","o":["前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。","Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。","術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。","塌陷性脊椎症候群為側彎進展，只編 M41.124。"],"e":"正解：前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。 應使用：M96.89（肌肉骨骼其他術中/術後併發症）+ M41.125（青少年特發性側彎,胸腰段）+ Z98.1（關節固定術後狀態）。 實務：依 M96.89 指示加編以特指疾患；已融合故加 Z98.1。 （來源：AHA Coding Clinic 2024年第1季「脊椎側彎矯正術後 adding-on 現象」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-15:a","q":"【AHA Coding Clinic 2024年第1季｜按需】\n氣喘惡化就診，因遺失吸入器未用 PRN albuterol。\n依該季 Coding Clinic，應如何編碼？","o":["Z91.198","Z98.84","Z98.1","Z90.411"],"e":"正解：Z91.198。Z91.198（病人因其他原因不遵從其他醫療處置） 不應使用／不適用：underdosing 碼（PRN 非長期用藥）。 重點：PRN 藥物未服用不編劑量不足；編 Z91.198。 實務：PRN 非維持用藥，惡化非因未用 albuterol 所致（2021 Q1 p.12-13）。 （來源：AHA Coding Clinic 2024年第1季「按需」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-15:d","q":"【AHA Coding Clinic 2024年第1季】\n氣喘惡化就診，因遺失吸入器未用 PRN albuterol。\n依該季 Coding Clinic，下列結論何者正確？","o":["PRN 藥物未服用不編劑量不足；編 Z91.198。","肺鈣化肉芽腫編 J98.4（無纖維化記載時不編 J84.10）。","SLL/CLL 依部位定碼；無淋巴結侵犯 → C91.12。","新生兒 RSV 預防性單株抗體(Nirsevimab/Beyfortus)就診編 Z29.11。"],"e":"正解：PRN 藥物未服用不編劑量不足；編 Z91.198。 應使用：Z91.198（病人因其他原因不遵從其他醫療處置）。 不應使用：underdosing 碼（PRN 非長期用藥）。 實務：PRN 非維持用藥，惡化非因未用 albuterol 所致（2021 Q1 p.12-13）。 （來源：AHA Coding Clinic 2024年第1季「按需」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-16:a","q":"【AHA Coding Clinic 2024年第1季｜CAR-T 免疫治療後入院】\n被套細胞淋巴瘤門診 CAR-T 輸注後依 protocol 入院監測。\n依該季 Coding Clinic，應如何編碼？","o":["Z51.12 + C83.10","C83.10","Z51.12","Z51.6 + C83.10"],"e":"正解：Z51.12 + C83.10。Z51.12（抗腫瘤免疫治療就診）主診 + C83.10（被套細胞淋巴瘤,未特指部位） 編碼順序：Z51.12 為主診。 重點：門診 CAR-T 輸注後計畫入院續照護，主診 Z51.12 + C83.10。 實務：計畫性續照護入院 → Z51.12 為主診。 （來源：AHA Coding Clinic 2024年第1季「CAR-T 免疫治療後入院」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-16:d","q":"【AHA Coding Clinic 2024年第1季】\n被套細胞淋巴瘤門診 CAR-T 輸注後依 protocol 入院監測。\n依該季 Coding Clinic，下列結論何者正確？","o":["門診 CAR-T 輸注後計畫入院續照護，主診 Z51.12 + C83.10。","既存 T2DM 因免疫治療惡化高血糖編 E11.65 + T45.1X5A；不併編 E10。","兒童健檢確認 stage 2 前症狀期 T1D，主診 Z00.121 + E10.A2 + Z23。","到院前心臟停止但入院續照護，編 I46.2（非個人史 Z86.74）。"],"e":"正解：門診 CAR-T 輸注後計畫入院續照護，主診 Z51.12 + C83.10。 應使用：Z51.12（抗腫瘤免疫治療就診）主診 + C83.10（被套細胞淋巴瘤,未特指部位）。 編碼順序：Z51.12 為主診。 實務：計畫性續照護入院 → Z51.12 為主診。 （來源：AHA Coding Clinic 2024年第1季「CAR-T 免疫治療後入院」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-17:a","q":"【AHA Coding Clinic 2024年第1季｜非外傷性急性肝損傷（肝轉移+化療）】\n轉移性平滑肌肉瘤至肝，acute liver injury due to metastatic liver disease and chemotherapy。\n依該季 Coding Clinic，應如何編碼？","o":["K71.8 + C78.7 + T45.1X5A","S36.11 + C78.7 + T45.1X5A","C78.7 + T45.1X5A","K71.8 + T45.1X5A"],"e":"正解：K71.8 + C78.7 + T45.1X5A。K71.8（毒性肝病併其他肝疾患）+ C78.7（肝續發惡性腫瘤）+ T45.1X5A（抗腫瘤/免疫抑制劑不良反應,初診） 不應使用／不適用：S36.11-（外傷肝損傷，本例非外傷）。 重點：非外傷性急性肝損傷（病因已知）編 K71.8 + C78.7 + T45.1X5A；非 S36.11-。 實務：acute liver injury 非外傷 → 依病因編（K71.8）；正確處方之不良反應加 T 碼(第5/6碼5)。 （來源：AHA Coding Clinic 2024年第1季「非外傷性急性肝損傷（肝轉移+化療）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-17:d","q":"【AHA Coding Clinic 2024年第1季】\n轉移性平滑肌肉瘤至肝，acute liver injury due to metastatic liver disease and chemotherapy。\n依該季 Coding Clinic，下列結論何者正確？","o":["非外傷性急性肝損傷（病因已知）編 K71.8 + C78.7 + T45.1X5A；非 S36.11-。","僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。","【更正】應編 J45.42（中度持續性氣喘併 status asthmaticus），非 J45.41。","Ozempic（GLP-1）所致藥物性急性胰臟炎編 K85.30 + T38.895A；非 T38.3X5A。"],"e":"正解：非外傷性急性肝損傷（病因已知）編 K71.8 + C78.7 + T45.1X5A；非 S36.11-。 應使用：K71.8（毒性肝病併其他肝疾患）+ C78.7（肝續發惡性腫瘤）+ T45.1X5A（抗腫瘤/免疫抑制劑不良反應,初診）。 不應使用：S36.11-（外傷肝損傷，本例非外傷）。 實務：acute liver injury 非外傷 → 依病因編（K71.8）；正確處方之不良反應加 T 碼(第5/6碼5)。 （來源：AHA Coding Clinic 2024年第1季「非外傷性急性肝損傷（肝轉移+化療）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-18:a","q":"【AHA Coding Clinic 2024年第1季｜脊椎按摩所致椎動脈剝離併腦梗塞】\n脊椎按摩後椎動脈剝離致左腦梗塞。\n依該季 Coding Clinic，應如何編碼？","o":["I97.89 + I77.74 + I63.89 + Y84.8","I77.74 + I63.89 + Y84.8","I97.89 + I63.89 + Y84.8","I97.89 + I77.74 + Y84.8"],"e":"正解：I97.89 + I77.74 + I63.89 + Y84.8。I97.89（循環系統其他術後併發症）+ I77.74（椎動脈剝離）+ I63.89（其他腦梗塞）+ Y84.8（其他醫療處置為異常反應原因） 不應使用／不適用：外傷損傷碼。 重點：脊椎按摩所致椎動脈剝離併腦梗塞編術後併發症碼組合；不用外傷碼。 實務：醫療介入所致病況不編外傷碼。 （來源：AHA Coding Clinic 2024年第1季「脊椎按摩所致椎動脈剝離併腦梗塞」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-18:d","q":"【AHA Coding Clinic 2024年第1季】\n脊椎按摩後椎動脈剝離致左腦梗塞。\n依該季 Coding Clinic，下列結論何者正確？","o":["脊椎按摩所致椎動脈剝離併腦梗塞編術後併發症碼組合；不用外傷碼。","過期流產後(已非孕)不編 Trisomy 21 妊娠併發症碼。","術後異位性骨化編 M61.552；可 query 是否術後併發症。","切除副甲狀腺癌不可避免犧牲喉返神經致聲帶麻痺，編 J38.01，非術後併發症碼。"],"e":"正解：脊椎按摩所致椎動脈剝離併腦梗塞編術後併發症碼組合；不用外傷碼。 應使用：I97.89（循環系統其他術後併發症）+ I77.74（椎動脈剝離）+ I63.89（其他腦梗塞）+ Y84.8（其他醫療處置為異常反應原因）。 不應使用：外傷損傷碼。 實務：醫療介入所致病況不編外傷碼。 （來源：AHA Coding Clinic 2024年第1季「脊椎按摩所致椎動脈剝離併腦梗塞」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-19:d","q":"【AHA Coding Clinic 2024年第1季】\n67歲居家心臟停止，EMS 復甦後到院，確診完全性心臟阻滯行緊急節律器。\n依該季 Coding Clinic，下列結論何者正確？","o":["到院前心臟停止但入院續照護，編 I46.2（非個人史 Z86.74）。","轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。","COVID-19 所致病毒性心肌炎編 U07.1 + B33.22（非 I40.0/I41）。","自體骨瓣吸收診斷 T86.838 + M95.2；移除 PCS 為 Removal 0NP007Z。"],"e":"正解：到院前心臟停止但入院續照護，編 I46.2（非個人史 Z86.74）。 應使用：I46.2（因潛在心臟病之心臟停止）；潛在病因先編。 不應使用：Z86.74（個人史，病況現行時不用）。 編碼順序：潛在病因先編。 實務：無論發生地/是否復甦，現行且續治療 → 編 I46.-，非個人史。 （來源：AHA Coding Clinic 2024年第1季「到院前心臟停止」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-20:d","q":"【AHA Coding Clinic 2024年第1季】\nCABG 後 vein graft 近端狹窄併血栓致 NSTEMI，另有原生多支病變。\n依該季 Coding Clinic，下列結論何者正確？","o":["vein graft 血栓致 NSTEMI，主診 I21.4 + I25.10；MI 情境不編心絞痛。","CABG 後胸骨剛性鋼板固定另編 0PH000Z。","前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。"],"e":"正解：vein graft 血栓致 NSTEMI，主診 I21.4 + I25.10；MI 情境不編心絞痛。 應使用：I21.4（NSTEMI）主診 + I25.10（原生冠狀動脈粥狀硬化性心臟病,無心絞痛）。 不應使用：MI 情境下之心絞痛碼。 編碼順序：I21.4 為主診。 實務：註：此建議後於 2026 Q1 更正（graft 狹窄/血栓致 NSTEMI 改 T82.857A+T82.867A+I21.A9）；見 [[CC2026Q1-23 更正：靜脈移植片狹窄/血栓致 NSTEMI]]。 （來源：AHA Coding Clinic 2024年第1季「心肌梗塞情境下 CAD 之胸痛」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-21:a","q":"【AHA Coding Clinic 2024年第1季｜改良式 Graham patch 修補胃穿孔】\n急性腹痛併氣腹，剖腹見胃前壁穿孔縫合並以網膜補強。\n依該季 Coding Clinic，應如何編碼？","o":["0DQ60ZZ","0D9Q70Z","0DB18ZZ","0DB80ZZ"],"e":"正解：0DQ60ZZ。0DQ60ZZ（胃修補,開放） 不應使用／不適用：另編網膜補強。 重點：改良式 Graham patch 修補胃穿孔編 0DQ60ZZ；網膜補強為附帶不另編。 實務：主處置為胃穿孔修補，網膜補強為 incidental。 （來源：AHA Coding Clinic 2024年第1季「改良式 Graham patch 修補胃穿孔」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-21:d","q":"【AHA Coding Clinic 2024年第1季】\n急性腹痛併氣腹，剖腹見胃前壁穿孔縫合並以網膜補強。\n依該季 Coding Clinic，下列結論何者正確？","o":["改良式 Graham patch 修補胃穿孔編 0DQ60ZZ；網膜補強為附帶不另編。","左腋淋巴靜脈繞道編 07160Z3。","V-Y 肛門成形(皮瓣前移)為 Transfer 0HX9XZZ;黏膜外翻切除 0DBQ0ZZ。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。"],"e":"正解：改良式 Graham patch 修補胃穿孔編 0DQ60ZZ；網膜補強為附帶不另編。 應使用：0DQ60ZZ（胃修補,開放）。 不應使用：另編網膜補強。 實務：主處置為胃穿孔修補，網膜補強為 incidental。 （來源：AHA Coding Clinic 2024年第1季「改良式 Graham patch 修補胃穿孔」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-22:a","q":"【AHA Coding Clinic 2024年第1季｜肛門廔管掛線】\n肛周廔管治療中，於廔管內置 seton。\n依該季 Coding Clinic，應如何編碼？","o":["0D9Q70Z","0DB18ZZ","0DB80ZZ","0DBE4ZZ"],"e":"正解：0D9Q70Z。0D9Q70Z（肛門引流併引流裝置,經自然孔） 重點：肛門廔管掛線（不含廔管切除）編 0D9Q70Z（Drainage）。 實務：seton 維持廔管開放引流、降膿瘍風險 → root operation Drainage。 （來源：AHA Coding Clinic 2024年第1季「肛門廔管掛線」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-22:d","q":"【AHA Coding Clinic 2024年第1季】\n肛周廔管治療中，於廔管內置 seton。\n依該季 Coding Clinic，下列結論何者正確？","o":["肛門廔管掛線（不含廔管切除）編 0D9Q70Z（Drainage）。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。","蛆蟲療法為非切除性清創,編 0JDR0ZZ。","記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。"],"e":"正解：肛門廔管掛線（不含廔管切除）編 0D9Q70Z（Drainage）。 應使用：0D9Q70Z（肛門引流併引流裝置,經自然孔）。 實務：seton 維持廔管開放引流、降膿瘍風險 → root operation Drainage。 （來源：AHA Coding Clinic 2024年第1季「肛門廔管掛線」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q1-23:a","q":"【AHA Coding Clinic 2024年第1季｜PROTEKDuo 套管併 CentriMag】\nRoss 手術脫離 CPB 後嚴重右心室功能不良，經頸置 PROTEKDuo 套管接 CentriMag 作 RVAD。\n依該季 Coding Clinic，應如何編碼？","o":["02HA3RZ + 5A02216","5A02216","02HA3RZ","02HA3RZ + 02HM3KZ"],"e":"正解：02HA3RZ + 5A02216。02HA3RZ（短期外部心臟輔助系統置入,經皮）+ 5A02216（心臟輸出輔助,其他幫浦,連續） 不應使用／不適用：另編 PROTEKDuo 套管。 重點：PROTEKDuo + CentriMag 作 RVAD：編 02HA3RZ + 5A02216；套管不另編。 實務：CentriMag 之 device key → 短期外部心臟輔助系統。 （來源：AHA Coding Clinic 2024年第1季「PROTEKDuo 套管併 CentriMag」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-23:d","q":"【AHA Coding Clinic 2024年第1季】\nRoss 手術脫離 CPB 後嚴重右心室功能不良，經頸置 PROTEKDuo 套管接 CentriMag 作 RVAD。\n依該季 Coding Clinic，下列結論何者正確？","o":["PROTEKDuo + CentriMag 作 RVAD：編 02HA3RZ + 5A02216；套管不另編。","Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。","CPB 中高血鉀以 Z-BUF 處理，為手術固有、不另編。"],"e":"正解：PROTEKDuo + CentriMag 作 RVAD：編 02HA3RZ + 5A02216；套管不另編。 應使用：02HA3RZ（短期外部心臟輔助系統置入,經皮）+ 5A02216（心臟輸出輔助,其他幫浦,連續）。 不應使用：另編 PROTEKDuo 套管。 實務：CentriMag 之 device key → 短期外部心臟輔助系統。 （來源：AHA Coding Clinic 2024年第1季「PROTEKDuo 套管併 CentriMag」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-24:d","q":"【AHA Coding Clinic 2024年第1季】\n大腸鏡切片闌尾口（腫脹、紅斑、潰瘍）。\n依該季 Coding Clinic，下列結論何者正確？","o":["闌尾口之處置歸 body part Appendix（闌尾）。","自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。","AIVR 編 I49.8；非 I44.2（idioventricular 索引導向不適用）。","腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。"],"e":"正解：闌尾口之處置歸 body part Appendix（闌尾）。 應使用：body part = Appendix（闌尾）；依實際 root operation 編。 實務：「appendiceal orifice」已加入 body part key，歸 Appendix。 （來源：AHA Coding Clinic 2024年第1季「闌尾口切片」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q1-26:d","q":"【AHA Coding Clinic 2024年第1季】\n釐清 EVAS 是否限橈動脈熱阻力，或可用於肱動脈接下臂靜脈。\n依該季 Coding Clinic，下列結論何者正確？","o":["【釐清】肱動脈接下臂靜脈之 AVF 用 Table 031 + qualifier F；Ellipsys 熱阻力僅限橈動脈（X2K）。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。","手輔助腹腔鏡（GelPort）以入路值 4 經皮內視鏡 + qualifier G 手輔助編。","NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。"],"e":"正解：【釐清】肱動脈接下臂靜脈之 AVF 用 Table 031 + qualifier F；Ellipsys 熱阻力僅限橈動脈（X2K）。 應使用：肱動脈-下臂靜脈 AVF：Table 031（Bypass 上肢動脈）+ 適當肱動脈 body part + qualifier F（下臂靜脈）。 實務：Ellipsys 熱阻力經皮 AVF 目前僅分類至右/左橈動脈（X2K 新技術）。 （來源：AHA Coding Clinic 2024年第1季「釐清：Ellipsys 經皮動靜脈廔管建立」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-02:a","q":"【AHA Coding Clinic 2024年第2季｜肺氣腫／支氣管擴張與 COPD】\n2023/10/1 起 J43/J44 Excludes1 改 Excludes2 後之疑義。\n依該季 Coding Clinic，應如何編碼？","o":["J43.9","J44.9","J44.0","J45.41"],"e":"正解：J43.9。J43.9（肺氣腫,未特指） 不應使用／不適用：J44.9（COPD 未特指，與 J43.9 併用）。 重點：COPD 併肺氣腫只編 J43.9（肺氣腫為 COPD 之一型），除非另有特指。 實務：肺氣腫為 COPD 一型；除非 COPD 進一步特指(感染/惡化)否則不另編。 （來源：AHA Coding Clinic 2024年第2季「肺氣腫／支氣管擴張與 COPD」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-02:d","q":"【AHA Coding Clinic 2024年第2季】\n2023/10/1 起 J43/J44 Excludes1 改 Excludes2 後之疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["COPD 併肺氣腫只編 J43.9（肺氣腫為 COPD 之一型），除非另有特指。","FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。","食道扁平苔癬編 K22.89（非皮膚科 L43.9）。","T2DM 緩解編 E11.A；但有糖尿病併發症時不可用 E11.A（Excludes1）。"],"e":"正解：COPD 併肺氣腫只編 J43.9（肺氣腫為 COPD 之一型），除非另有特指。 應使用：J43.9（肺氣腫,未特指）。 不應使用：J44.9（COPD 未特指，與 J43.9 併用）。 實務：肺氣腫為 COPD 一型；除非 COPD 進一步特指(感染/惡化)否則不另編。 （來源：AHA Coding Clinic 2024年第2季「肺氣腫／支氣管擴張與 COPD」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-03:a","q":"【AHA Coding Clinic 2024年第2季｜COPD、肺炎與支氣管擴張】\n雙側肺炎、COPD 惡化、急性呼衰、敗血症；慢性支氣管擴張為次診斷。\n依該季 Coding Clinic，應如何編碼？","o":["J44.0 + J44.1 + J47.9","J44.1 + J47.9","J44.0 + J47.9","J44.0 + J44.1"],"e":"正解：J44.0 + J44.1 + J47.9。J44.0（COPD 併急性下呼吸道感染）+ J44.1（COPD 併急性惡化）+ J47.9（支氣管擴張,無併發症）+ 肺炎/呼衰/敗血症碼 重點：COPD 惡化併肺炎與慢性支氣管擴張編 J44.0 + J44.1 + J47.9（+肺炎/呼衰/敗血症）。 實務：J44 之 Excludes2 允許 J44 與 J47 併編；但 COPD 未特指(J44.9)+支氣管擴張時只編後者。 （來源：AHA Coding Clinic 2024年第2季「COPD、肺炎與支氣管擴張」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-03:d","q":"【AHA Coding Clinic 2024年第2季】\n雙側肺炎、COPD 惡化、急性呼衰、敗血症；慢性支氣管擴張為次診斷。\n依該季 Coding Clinic，下列結論何者正確？","o":["COPD 惡化併肺炎與慢性支氣管擴張編 J44.0 + J44.1 + J47.9（+肺炎/呼衰/敗血症）。","憩室炎併結腸膀胱廔與膀胱前膿瘍編 K57.20 + K68.19 + N32.1。","MCD 併 ATN 之 AKI 編 N17.0 + N04.0。","氣喘併 COPD 編 J44.89；除非載明氣喘型別或惡化才另編 J45-。"],"e":"正解：COPD 惡化併肺炎與慢性支氣管擴張編 J44.0 + J44.1 + J47.9（+肺炎/呼衰/敗血症）。 應使用：J44.0（COPD 併急性下呼吸道感染）+ J44.1（COPD 併急性惡化）+ J47.9（支氣管擴張,無併發症）+ 肺炎/呼衰/敗血症碼。 實務：J44 之 Excludes2 允許 J44 與 J47 併編；但 COPD 未特指(J44.9)+支氣管擴張時只編後者。 （來源：AHA Coding Clinic 2024年第2季「COPD、肺炎與支氣管擴張」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-04:a","q":"【AHA Coding Clinic 2024年第2季｜便秘併糞便阻塞】\n同次就診記便秘與糞便阻塞；兩者互為 Excludes1。\n依該季 Coding Clinic，應如何編碼？","o":["K56.41","K59.0","K56.2","K59.02"],"e":"正解：K56.41。K56.41（糞便阻塞） 不應使用／不適用：K59.0-（便秘，為固有不另編）。 重點：便秘併糞便阻塞只編 K56.41（便秘為糞便阻塞之固有）。 實務：糞便阻塞較嚴重，便秘為其固有。 （來源：AHA Coding Clinic 2024年第2季「便秘併糞便阻塞」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-04:d","q":"【AHA Coding Clinic 2024年第2季】\n同次就診記便秘與糞便阻塞；兩者互為 Excludes1。\n依該季 Coding Clinic，下列結論何者正確？","o":["便秘併糞便阻塞只編 K56.41（便秘為糞便阻塞之固有）。","吻合口腸套疊編 K56.1(非併發症)；Whipple 後無幽門不用 K31.1。","胃空腸狹窄編 K56.699(腸阻塞)；無記載不當併發症。","分娩時發現巴氏腺膿瘍編 O23.593；因 Excludes1 不另編 N75.1，亦不用 O75.3。"],"e":"正解：便秘併糞便阻塞只編 K56.41（便秘為糞便阻塞之固有）。 應使用：K56.41（糞便阻塞）。 不應使用：K59.0-（便秘，為固有不另編）。 實務：糞便阻塞較嚴重，便秘為其固有。 （來源：AHA Coding Clinic 2024年第2季「便秘併糞便阻塞」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-05:a","q":"【AHA Coding Clinic 2024年第2季｜深下腹壁動脈穿通枝皮瓣併發症（血栓）】\n乳房重建 DIEAP 皮瓣後左皮瓣腫脹、靜脈血，診斷靜脈血栓行血栓切除與吻合修整。\n依該季 Coding Clinic，應如何編碼？","o":["T85.868A","T81.44XA","T82.6XXA","T83.86XA"],"e":"正解：T85.868A。T85.868A（其他內置義器/植入物/移植物血栓,初診） 重點：DIEAP 皮瓣(乳房重建)靜脈血栓編 T85.868A。 實務：DIEAP 皮瓣屬乳房重建；索引 Thrombosis, due to device, breast T85.868。 （來源：AHA Coding Clinic 2024年第2季「深下腹壁動脈穿通枝皮瓣併發症（血栓）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-05:d","q":"【AHA Coding Clinic 2024年第2季】\n乳房重建 DIEAP 皮瓣後左皮瓣腫脹、靜脈血，診斷靜脈血栓行血栓切除與吻合修整。\n依該季 Coding Clinic，下列結論何者正確？","o":["DIEAP 皮瓣(乳房重建)靜脈血栓編 T85.868A。","DIEP 游離皮瓣失敗(不存活)編 T85.898A。","唇癌切除併頦下皮瓣重建後回院切除皮瓣多餘軟組織，主診斷 Z42.8。","DIEP 皮瓣重建併 IMF 鄰近組織轉移(Ryan flap)為獨立目的,雙側各編 0HX5XZZ。"],"e":"正解：DIEAP 皮瓣(乳房重建)靜脈血栓編 T85.868A。 應使用：T85.868A（其他內置義器/植入物/移植物血栓,初診）。 實務：DIEAP 皮瓣屬乳房重建；索引 Thrombosis, due to device, breast T85.868。 （來源：AHA Coding Clinic 2024年第2季「深下腹壁動脈穿通枝皮瓣併發症（血栓）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-06:a","q":"【AHA Coding Clinic 2024年第2季｜深下腹壁穿通枝皮瓣失敗】\n雙側 DIEP 皮瓣重建後左乳皮瓣失敗、不存活，移除左 DIEP 皮瓣。\n依該季 Coding Clinic，應如何編碼？","o":["T85.898A","T82.6XXA","T81.718A","T83.83XA"],"e":"正解：T85.898A。T85.898A（其他內置義器/植入物/移植物其他特指併發症,初診） 重點：DIEP 游離皮瓣失敗(不存活)編 T85.898A。 實務：DIEP 皮瓣屬乳房重建；歸 T85.89-。 （來源：AHA Coding Clinic 2024年第2季「深下腹壁穿通枝皮瓣失敗」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-06:d","q":"【AHA Coding Clinic 2024年第2季】\n雙側 DIEP 皮瓣重建後左乳皮瓣失敗、不存活，移除左 DIEP 皮瓣。\n依該季 Coding Clinic，下列結論何者正確？","o":["DIEP 游離皮瓣失敗(不存活)編 T85.898A。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。","術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。","唇癌切除併頦下皮瓣重建後回院切除皮瓣多餘軟組織，主診斷 Z42.8。"],"e":"正解：DIEP 游離皮瓣失敗(不存活)編 T85.898A。 應使用：T85.898A（其他內置義器/植入物/移植物其他特指併發症,初診）。 實務：DIEP 皮瓣屬乳房重建；歸 T85.89-。 （來源：AHA Coding Clinic 2024年第2季「深下腹壁穿通枝皮瓣失敗」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-07:a","q":"【AHA Coding Clinic 2024年第2季｜失智與癲癇】\n失智與癲癇；索引 Dementia in epilepsy 之 etiology/manifestation 疑義。\n依該季 Coding Clinic，應如何編碼？","o":["F03.90 + G40.909","F02.80 + G40.909","G40.909","F03.90"],"e":"正解：F03.90 + G40.909。F03.90（未特指失智,無行為/精神/情緒/焦慮障礙）+ G40.909（癲癇,未特指,非頑固,無 status） 不應使用／不適用：F02.80（除非醫師明載因果）。 編碼順序：先 query。 重點：失智與癲癇未載因果時 query；無法澄清→F03.90 + G40.909，不逕用 F02.80。 實務：失智可能因癲癇、或癲癇因失智，需醫師澄清。對照 [[CC2026Q1-05 失智併甲狀腺低下]]（該情形推定相關）。 （來源：AHA Coding Clinic 2024年第2季「失智與癲癇」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-07:d","q":"【AHA Coding Clinic 2024年第2季】\n失智與癲癇；索引 Dementia in epilepsy 之 etiology/manifestation 疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["失智與癲癇未載因果時 query；無法澄清→F03.90 + G40.909，不逕用 F02.80。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。","多關節發炎性關節炎未指特定關節/型別時 query；無資訊→M13.89，非 M06.4。","帕金森依 dyskinesia 與 fluctuations 分:G20.A1/A2/B1/B2/C。"],"e":"正解：失智與癲癇未載因果時 query；無法澄清→F03.90 + G40.909，不逕用 F02.80。 應使用：F03.90（未特指失智,無行為/精神/情緒/焦慮障礙）+ G40.909（癲癇,未特指,非頑固,無 status）。 不應使用：F02.80（除非醫師明載因果）。 編碼順序：先 query。 實務：失智可能因癲癇、或癲癇因失智，需醫師澄清。對照 [[CC2026Q1-05 失智併甲狀腺低下]]（該情形推定相關）。 （來源：AHA Coding Clinic 2024年第2季「失智與癲癇」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-08:d","q":"【AHA Coding Clinic 2024年第2季】\n心臟 AL 類澱粉沉積併 acute on chronic diastolic HF。\n依該季 Coding Clinic，下列結論何者正確？","o":["心臟 AL 類澱粉沉積編 E85.81 + I43；併急性慢性舒張性心衰竭 I50.33。","Ozempic（GLP-1）所致藥物性急性胰臟炎編 K85.30 + T38.895A；非 T38.3X5A。","因治療小腦血管母細胞瘤入院,主診 D43.1 + Q85.83。","整流術後新發急性舒張性 CHF 編 I97.89 + I50.31。"],"e":"正解：心臟 AL 類澱粉沉積編 E85.81 + I43；併急性慢性舒張性心衰竭 I50.33。 應使用：E85.81（輕鏈 AL 類澱粉沉積）+ I43（他處疾病之心肌病）+ I50.33（急性慢性舒張性心衰竭）。 實務：AL 類澱粉沉積之心臟侵犯以 E85.81 + I43 表達。 （來源：AHA Coding Clinic 2024年第2季「心臟與輕鏈類澱粉沉積症」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-09:a","q":"【AHA Coding Clinic 2024年第2季｜胰島素瘤所致低血糖（遠端胰切除後）】\nPNET 肝轉移、遠端胰切除史，Y90 前嚴重低血糖入院，診斷惡性胰島素瘤所致低血糖。\n依該季 Coding Clinic，應如何編碼？","o":["C7B.8 + E16.1 + Z85.858 + Z90.411","E16.1 + Z85.858 + Z90.411","C7B.8 + Z85.858 + Z90.411","C7B.8 + E16.1 + Z90.411"],"e":"正解：C7B.8 + E16.1 + Z85.858 + Z90.411。C7B.8（其他續發性神經內分泌腫瘤=肝轉移）主診 + E16.1（其他低血糖）+ Z85.858（其他內分泌腺惡性腫瘤個人史）+ Z90.411（後天部分胰缺如） 編碼順序：C7B.8 為主診。 重點：轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。 實務：胰原發已切除→以個人史；肝轉移(仍分泌胰島素致低血糖)為主診。 （來源：AHA Coding Clinic 2024年第2季「胰島素瘤所致低血糖（遠端胰切除後）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-09:d","q":"【AHA Coding Clinic 2024年第2季】\nPNET 肝轉移、遠端胰切除史，Y90 前嚴重低血糖入院，診斷惡性胰島素瘤所致低血糖。\n依該季 Coding Clinic，下列結論何者正確？","o":["轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。","惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。","非外傷性急性肝損傷（病因已知）編 K71.8 + C78.7 + T45.1X5A；非 S36.11-。","到院前心臟停止但入院續照護，編 I46.2（非個人史 Z86.74）。"],"e":"正解：轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。 應使用：C7B.8（其他續發性神經內分泌腫瘤=肝轉移）主診 + E16.1（其他低血糖）+ Z85.858（其他內分泌腺惡性腫瘤個人史）+ Z90.411（後天部分胰缺如）。 編碼順序：C7B.8 為主診。 實務：胰原發已切除→以個人史；肝轉移(仍分泌胰島素致低血糖)為主診。 （來源：AHA Coding Clinic 2024年第2季「胰島素瘤所致低血糖（遠端胰切除後）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-10:a","q":"【AHA Coding Clinic 2024年第2季｜惡性肋膜積液】\n陰蒂癌切除+放療史，本次肺轉移併惡性肋膜積液致急性呼衰；醫師記積液源自原發陰蒂癌。\n依該季 Coding Clinic，應如何編碼？","o":["C78.01 + J91.0 + J96.01 + Z85.44","J91.0 + J96.01 + Z85.44","C78.01 + J96.01 + Z85.44","C78.01 + J91.0 + Z85.44"],"e":"正解：C78.01 + J91.0 + J96.01 + Z85.44。C78.01（右肺續發惡性腫瘤）主診 + J91.0（惡性肋膜積液）+ J96.01（急性呼衰併缺氧）+ Z85.44（其他女性生殖器官惡性腫瘤個人史） 不應使用／不適用：以已切除之陰蒂癌為主診。 編碼順序：C78.01 為主診。 重點：惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。 實務：J91.0 指示先編潛在腫瘤；原發已切除故以肺轉移為主診、原發以個人史。 （來源：AHA Coding Clinic 2024年第2季「惡性肋膜積液」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-10:d","q":"【AHA Coding Clinic 2024年第2季】\n陰蒂癌切除+放療史，本次肺轉移併惡性肋膜積液致急性呼衰；醫師記積液源自原發陰蒂癌。\n依該季 Coding Clinic，下列結論何者正確？","o":["惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。","轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。","溺水所致急性肺水腫編 J81.0（已知效應）+ 外因；不用 T75.1-。","COPD 惡化併肺炎與慢性支氣管擴張編 J44.0 + J44.1 + J47.9（+肺炎/呼衰/敗血症）。"],"e":"正解：惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。 應使用：C78.01（右肺續發惡性腫瘤）主診 + J91.0（惡性肋膜積液）+ J96.01（急性呼衰併缺氧）+ Z85.44（其他女性生殖器官惡性腫瘤個人史）。 不應使用：以已切除之陰蒂癌為主診。 編碼順序：C78.01 為主診。 實務：J91.0 指示先編潛在腫瘤；原發已切除故以肺轉移為主診、原發以個人史。 （來源：AHA Coding Clinic 2024年第2季「惡性肋膜積液」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-11:a","q":"【AHA Coding Clinic 2024年第2季｜疼痛且突出之後段脊椎植入物】\n因疼痛且突出之後段脊椎內固定行移除。\n依該季 Coding Clinic，應如何編碼？","o":["T84.296A + T84.84XA","T84.84XA","T84.296A","T84.296A + T84.53XA"],"e":"正解：T84.296A + T84.84XA。T84.296A（椎骨內固定裝置其他機械性併發症,初診）+ T84.84XA（骨科植入物所致疼痛,初診） 重點：突出(prominent)脊椎內固定=protrusion 編 T84.296A；併疼痛加 T84.84XA。 實務：「prominent」編為 protrusion(機械性併發症)；併疼痛需兩碼。 （來源：AHA Coding Clinic 2024年第2季「疼痛且突出之後段脊椎植入物」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-11:d","q":"【AHA Coding Clinic 2024年第2季】\n因疼痛且突出之後段脊椎內固定行移除。\n依該季 Coding Clinic，下列結論何者正確？","o":["突出(prominent)脊椎內固定=protrusion 編 T84.296A；併疼痛加 T84.84XA。","減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。","左膝多部位軟骨軟化，單一碼 M94.262 涵蓋全膝各 component。","AIVR 編 I49.8；非 I44.2（idioventricular 索引導向不適用）。"],"e":"正解：突出(prominent)脊椎內固定=protrusion 編 T84.296A；併疼痛加 T84.84XA。 應使用：T84.296A（椎骨內固定裝置其他機械性併發症,初診）+ T84.84XA（骨科植入物所致疼痛,初診）。 實務：「prominent」編為 protrusion(機械性併發症)；併疼痛需兩碼。 （來源：AHA Coding Clinic 2024年第2季「疼痛且突出之後段脊椎植入物」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-12:d","q":"【AHA Coding Clinic 2024年第2季】\n舊左皮質旁中風，本次左顏面無力、麻木刺痛，無急性病灶，診斷舊中風復發。\n依該季 Coding Clinic，下列結論何者正確？","o":["舊中風症狀復發編後遺症碼 I69.392 + I69.398。","心臟 AL 類澱粉沉積編 E85.81 + I43；併急性慢性舒張性心衰竭 I50.33。","妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。","整流術後新發急性舒張性 CHF 編 I97.89 + I50.31。"],"e":"正解：舊中風症狀復發編後遺症碼 I69.392 + I69.398。 應使用：I69.392（腦梗塞後顏面無力）+ I69.398（腦梗塞其他後遺症=麻木刺痛）。 實務：recrudescence=舊中風缺損復發；2023/10/1 起索引新增 Recrudescence→see Sequelae。 （來源：AHA Coding Clinic 2024年第2季「舊中風症狀復發」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-13:a","q":"【AHA Coding Clinic 2024年第2季｜代謝性腦病變併毒性腦病變】\nUTI 敗血症所致代謝性腦病變 + 正確使用之止痛藥所致毒性腦病變。\n依該季 Coding Clinic，應如何編碼？","o":["G93.41 + G92.8","G92.8","G93.41","G90.8 + G92.8"],"e":"正解：G93.41 + G92.8。G93.41（代謝性腦病變）+ G92.8（其他毒性腦病變）+ 止痛藥不良反應碼 重點：兩種不同病因之腦病變分別編 G93.41 + G92.8（+藥物不良反應碼）。 實務：G93.4 之 Excludes2 允許與 G92.8 併編(不同病因)。 （來源：AHA Coding Clinic 2024年第2季「代謝性腦病變併毒性腦病變」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-13:d","q":"【AHA Coding Clinic 2024年第2季】\nUTI 敗血症所致代謝性腦病變 + 正確使用之止痛藥所致毒性腦病變。\n依該季 Coding Clinic，下列結論何者正確？","o":["兩種不同病因之腦病變分別編 G93.41 + G92.8（+藥物不良反應碼）。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","UTI 所致敗血症未載病原編 A41.9（非 A41.89）。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。"],"e":"正解：兩種不同病因之腦病變分別編 G93.41 + G92.8（+藥物不良反應碼）。 應使用：G93.41（代謝性腦病變）+ G92.8（其他毒性腦病變）+ 止痛藥不良反應碼。 實務：G93.4 之 Excludes2 允許與 G92.8 併編(不同病因)。 （來源：AHA Coding Clinic 2024年第2季「代謝性腦病變併毒性腦病變」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-14:a","q":"【AHA Coding Clinic 2024年第2季｜外傷性顱內積氣併硬膜下血腫與顱骨骨折】\nATV 事故無意識喪失，外傷性顱內積氣、左 SDH、雙顳骨骨折。\n依該季 Coding Clinic，應如何編碼？","o":["G93.89 + S06.890A","T79.0XXA + S06.890A","S06.890A","G93.89"],"e":"正解：G93.89 + S06.890A。G93.89（腦其他特指疾患=pneumocephalus）+ S06.890A（其他特指顱內損傷,無意識喪失,初診）+ SDH/骨折碼 不應使用／不適用：T79.0XXA（空氣栓塞，顱內積氣非血中空氣）。 重點：外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。 實務：顱內積氣(intracranial aerocele)≠air embolism；S06.890A 捕捉外傷性。 （來源：AHA Coding Clinic 2024年第2季「外傷性顱內積氣併硬膜下血腫與顱骨骨折」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-14:d","q":"【AHA Coding Clinic 2024年第2季】\nATV 事故無意識喪失，外傷性顱內積氣、左 SDH、雙顳骨骨折。\n依該季 Coding Clinic，下列結論何者正確？","o":["外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。","長期使用 semaglutide/tirzepatide 編 Z79.899（現無 GLP-1 專碼）。","乙狀竇裂開編 I67.89 + M89.8X8 + H93.A1(搏動性耳鳴);表面重建 PCS 0NU50JZ。","妊娠肝內膽汁鬱積編 O26.62 + E78.79 + K76.89；無阻塞不用 K83.1。"],"e":"正解：外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。 應使用：G93.89（腦其他特指疾患=pneumocephalus）+ S06.890A（其他特指顱內損傷,無意識喪失,初診）+ SDH/骨折碼。 不應使用：T79.0XXA（空氣栓塞，顱內積氣非血中空氣）。 實務：顱內積氣(intracranial aerocele)≠air embolism；S06.890A 捕捉外傷性。 （來源：AHA Coding Clinic 2024年第2季「外傷性顱內積氣併硬膜下血腫與顱骨骨折」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-15:a","q":"【AHA Coding Clinic 2024年第2季｜腎上】\n腎上 AAA；2022/10/1 新 AAA 碼無 suprarenal 之疑義。\n依該季 Coding Clinic，應如何編碼？","o":["I71.41","I71.012","I71.010","I74.5"],"e":"正解：I71.41。I71.41（pararenal 腹主動脈瘤,未破裂） 重點：腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。 實務：suprarenal AAA 為 pararenal AAA 之一型。 （來源：AHA Coding Clinic 2024年第2季「腎上」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-15:d","q":"【AHA Coding Clinic 2024年第2季】\n腎上 AAA；2022/10/1 新 AAA 碼無 suprarenal 之疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。","FY2026 新增 0DD body part U 網膜、V 腸繫膜；超音波抽吸腸繫膜腫瘤減積編 Extraction。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。","AP 側枝線圈栓塞，body part 取右肺動脈，編 02LQ3DZ。"],"e":"正解：腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。 應使用：I71.41（pararenal 腹主動脈瘤,未破裂）。 實務：suprarenal AAA 為 pararenal AAA 之一型。 （來源：AHA Coding Clinic 2024年第2季「腎上」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-16:a","q":"【AHA Coding Clinic 2024年第2季｜升主動脈、主動脈弓與降胸主動脈剝離】\nDeBakey type 1 剝離，涉升主動脈、弓、降胸主動脈。\n依該季 Coding Clinic，應如何編碼？","o":["I71.010 + I71.011 + I71.012","I71.011 + I71.012","I71.010 + I71.012","I71.010 + I71.011"],"e":"正解：I71.010 + I71.011 + I71.012。I71.010（升主動脈剝離）+ I71.011（主動脈弓剝離）+ I71.012（降胸主動脈剝離） 重點：DeBakey type 1 多段胸主動脈剝離各編一碼。 實務：多解剖段剝離分別編碼以完整呈現。 （來源：AHA Coding Clinic 2024年第2季「升主動脈、主動脈弓與降胸主動脈剝離」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-16:d","q":"【AHA Coding Clinic 2024年第2季】\nDeBakey type 1 剝離，涉升主動脈、弓、降胸主動脈。\n依該季 Coding Clinic，下列結論何者正確？","o":["DeBakey type 1 多段胸主動脈剝離各編一碼。","改良 Bentall 瓣膜導管：主動脈根(升主/弓)置換 + 主動脈瓣置換分別編。","自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。","腹主+降胸主動脈剝離瓣開窗編 04Q03ZZ + 02QW3ZZ(Repair)。"],"e":"正解：DeBakey type 1 多段胸主動脈剝離各編一碼。 應使用：I71.010（升主動脈剝離）+ I71.011（主動脈弓剝離）+ I71.012（降胸主動脈剝離）。 實務：多解剖段剝離分別編碼以完整呈現。 （來源：AHA Coding Clinic 2024年第2季「升主動脈、主動脈弓與降胸主動脈剝離」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-17:a","q":"【AHA Coding Clinic 2024年第2季｜蝶鞍顱咽管瘤切除】\n內視鏡經蝶切除大蝶鞍/鞍上顱咽管瘤(含囊性成分)。\n依該季 Coding Clinic，應如何編碼？","o":["0NBC4ZZ","0NP007Z","0NR00JZ","0NU50JZ"],"e":"正解：0NBC4ZZ。0NBC4ZZ（蝶骨切除,經皮內視鏡） 重點：內視鏡經蝶切除蝶鞍顱咽管瘤編 0NBC4ZZ（Excision，蝶骨）。 實務：顱咽管瘤為單一複雜病灶→Excision；sella turcica 歸蝶骨(body part key)。 （來源：AHA Coding Clinic 2024年第2季「蝶鞍顱咽管瘤切除」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-17:d","q":"【AHA Coding Clinic 2024年第2季】\n內視鏡經蝶切除大蝶鞍/鞍上顱咽管瘤(含囊性成分)。\n依該季 Coding Clinic，下列結論何者正確？","o":["內視鏡經蝶切除蝶鞍顱咽管瘤編 0NBC4ZZ（Excision，蝶骨）。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","內視鏡經腦室鑽孔引流鞍上囊腫，編 009640Z 腦室引流併引流裝置,經皮內視鏡。"],"e":"正解：內視鏡經蝶切除蝶鞍顱咽管瘤編 0NBC4ZZ（Excision，蝶骨）。 應使用：0NBC4ZZ（蝶骨切除,經皮內視鏡）。 實務：顱咽管瘤為單一複雜病灶→Excision；sella turcica 歸蝶骨(body part key)。 （來源：AHA Coding Clinic 2024年第2季「蝶鞍顱咽管瘤切除」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-18:a","q":"【AHA Coding Clinic 2024年第2季｜升主動脈與全主動脈弓修補併冰凍象鼻】\nBSAFER 技術：升主動脈/弓置換，LSA 置 Fluency、LCC 置 Viabahn 支架，innominate 島狀植入。\n依該季 Coding Clinic，應如何編碼？","o":["02RX0JZ + 03HJ0DZ + 03H40DZ","03HJ0DZ + 03H40DZ","02RX0JZ + 03H40DZ","02RX0JZ + 03HJ0DZ"],"e":"正解：02RX0JZ + 03HJ0DZ + 03H40DZ。02RX0JZ（胸主動脈升/弓合成替代物置換,開放）+ 03HJ0DZ（左總頸動脈腔內裝置置入,開放）+ 03H40DZ（左鎖骨下動脈腔內裝置置入,開放） 不應使用／不適用：以 02V/04V branched/fenestrated 描述現成器。 重點：升主動脈/弓置換 + LSA/LCC 支架延伸(獨立目的)各編。 實務：LSA/LCC 延伸為維持通暢之獨立目的→Insertion(2019 Q1 p.23、2020 Q1 p.25-27)。 （來源：AHA Coding Clinic 2024年第2季「升主動脈與全主動脈弓修補併冰凍象鼻」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-18:d","q":"【AHA Coding Clinic 2024年第2季】\nBSAFER 技術：升主動脈/弓置換，LSA 置 Fluency、LCC 置 Viabahn 支架，innominate 島狀植入。\n依該季 Coding Clinic，下列結論何者正確？","o":["升主動脈/弓置換 + LSA/LCC 支架延伸(獨立目的)各編。","術中硬膜撕裂編 G97.41；有記載即應報告（含 inherent/inadvertent）。","帕金森依 dyskinesia 與 fluctuations 分:G20.A1/A2/B1/B2/C。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。"],"e":"正解：升主動脈/弓置換 + LSA/LCC 支架延伸(獨立目的)各編。 應使用：02RX0JZ（胸主動脈升/弓合成替代物置換,開放）+ 03HJ0DZ（左總頸動脈腔內裝置置入,開放）+ 03H40DZ（左鎖骨下動脈腔內裝置置入,開放）。 不應使用：以 02V/04V branched/fenestrated 描述現成器。 實務：LSA/LCC 延伸為維持通暢之獨立目的→Insertion(2019 Q1 p.23、2020 Q1 p.25-27)。 （來源：AHA Coding Clinic 2024年第2季「升主動脈與全主動脈弓修補併冰凍象鼻」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-19:a","q":"【AHA Coding Clinic 2024年第2季｜肺鈣化肉芽腫】\n健檢記 calcified granuloma of lung；索引導向 see also Fibrosis, lung。\n依該季 Coding Clinic，應如何編碼？","o":["J98.4","J84.10","J96.22","J98.8"],"e":"正解：J98.4。J98.4（肺其他疾患；含 calcification of lung） 不應使用／不適用：J84.10（肺纖維化，無記載不用）。 重點：肺鈣化肉芽腫編 J98.4（無纖維化記載時不編 J84.10）。 實務：無纖維化記載→用 J98.4；索引標題不符時須進一步查證。 （來源：AHA Coding Clinic 2024年第2季「肺鈣化肉芽腫」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-19:d","q":"【AHA Coding Clinic 2024年第2季】\n健檢記 calcified granuloma of lung；索引導向 see also Fibrosis, lung。\n依該季 Coding Clinic，下列結論何者正確？","o":["肺鈣化肉芽腫編 J98.4（無纖維化記載時不編 J84.10）。","AIVR 編 I49.8；非 I44.2（idioventricular 索引導向不適用）。","vein graft 血栓致 NSTEMI，主診 I21.4 + I25.10；MI 情境不編心絞痛。","EDAC 編 J98.8（無特定索引條目）。"],"e":"正解：肺鈣化肉芽腫編 J98.4（無纖維化記載時不編 J84.10）。 應使用：J98.4（肺其他疾患；含 calcification of lung）。 不應使用：J84.10（肺纖維化，無記載不用）。 實務：無纖維化記載→用 J98.4；索引標題不符時須進一步查證。 （來源：AHA Coding Clinic 2024年第2季「肺鈣化肉芽腫」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-20:d","q":"【AHA Coding Clinic 2024年第2季】\n8歲頭痛暈眩不能走路嘔吐，診斷 EBV 腦炎併急性 EBV 感染。\n依該季 Coding Clinic，下列結論何者正確？","o":["急性 EBV 腦炎編 B10.09 + B27.09。","HPA 軸功能不全需三碼 E27.49 + E23.3 + E23.0。","整流術後新發急性舒張性 CHF 編 I97.89 + I50.31。","COVID-19 所致病毒性心肌炎編 U07.1 + B33.22（非 I40.0/I41）。"],"e":"正解：急性 EBV 腦炎編 B10.09 + B27.09。 應使用：B10.09（其他人類疱疹病毒腦炎）+ B27.09（伽瑪疱疹病毒單核球增多症併其他併發症=EBV）。 編碼順序：任一可為主診。 實務：EBV=HHV-4；B10 之 Excludes2 允許與 B27.09 併編。 （來源：AHA Coding Clinic 2024年第2季「急性 EBV 感染所致腦炎」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-21:a","q":"【AHA Coding Clinic 2024年第2季｜腹疝併阻塞與腸扭轉】\n小腸閉環性阻塞併缺血、內疝入網膜、小腸壞死缺血，行切除吻合。\n依該季 Coding Clinic，應如何編碼？","o":["K45.1 + K56.2","K56.2","K45.1","K22.11 + K56.2"],"e":"正解：K45.1 + K56.2。K45.1（其他特指腹疝併壞疽）+ K56.2（腸扭轉） 重點：內疝併壞疽阻塞編 K45.1（含壞疽與阻塞）；腸扭轉(volvulus)另編 K56.2。 實務：K45.1 已含壞疽與阻塞；volvulus 為獨立病況另編。 （來源：AHA Coding Clinic 2024年第2季「腹疝併阻塞與腸扭轉」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-21:d","q":"【AHA Coding Clinic 2024年第2季】\n小腸閉環性阻塞併缺血、內疝入網膜、小腸壞死缺血，行切除吻合。\n依該季 Coding Clinic，下列結論何者正確？","o":["內疝併壞疽阻塞編 K45.1（含壞疽與阻塞）；腸扭轉(volvulus)另編 K56.2。","胃繞道後吻合處穿孔編 K63.1；無醫師記載不可逕當繞道併發症。","分娩時發現巴氏腺膿瘍編 O23.593；因 Excludes1 不另編 N75.1，亦不用 O75.3。","憩室炎穿孔所致骨盆/腹內膿瘍（非 PID、非腹膜炎）編 K65.1 + K57.20，不編 N73.3。"],"e":"正解：內疝併壞疽阻塞編 K45.1（含壞疽與阻塞）；腸扭轉(volvulus)另編 K56.2。 應使用：K45.1（其他特指腹疝併壞疽）+ K56.2（腸扭轉）。 實務：K45.1 已含壞疽與阻塞；volvulus 為獨立病況另編。 （來源：AHA Coding Clinic 2024年第2季「腹疝併阻塞與腸扭轉」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-22:a","q":"【AHA Coding Clinic 2024年第2季｜頸椎骨折併中央脊髓症候群與不完全四肢癱（外傷）】\n跌倒後 C2 骨折併 C3-4、C4-5 CCS，不完全四肢癱 s/p C3/C4 椎板切除。\n依該季 Coding Clinic，應如何編碼？","o":["S14.123A + S12.100A","G82.52 + S12.100A","S12.100A","S14.123A"],"e":"正解：S14.123A + S12.100A。S14.123A（C3 中央脊髓症候群,初診）+ S12.100A（C2 未特指移位骨折,初診/閉鎖） 不應使用／不適用：G82.52（不完全四肢癱，外傷情境不另編）。 重點：外傷性 CCS 併不完全四肢癱只編脊髓損傷碼；CCS 取最高頸髓節。 實務：S14 指示報告最高頸髓節(此為 C3)；外傷併四肢癱只編脊髓損傷碼。 （來源：AHA Coding Clinic 2024年第2季「頸椎骨折併中央脊髓症候群與不完全四肢癱（外傷）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-22:d","q":"【AHA Coding Clinic 2024年第2季】\n跌倒後 C2 骨折併 C3-4、C4-5 CCS，不完全四肢癱 s/p C3/C4 椎板切除。\n依該季 Coding Clinic，下列結論何者正確？","o":["外傷性 CCS 併不完全四肢癱只編脊髓損傷碼；CCS 取最高頸髓節。","自發性顱內低壓併 CSF 廔編 G96.811 + G96.08。","息肉切除電凝造成透壁灼傷/局部腹膜炎（無穿孔），編 K91.89 並加各表現碼。","非外傷性急性肝損傷（病因已知）編 K71.8 + C78.7 + T45.1X5A；非 S36.11-。"],"e":"正解：外傷性 CCS 併不完全四肢癱只編脊髓損傷碼；CCS 取最高頸髓節。 應使用：S14.123A（C3 中央脊髓症候群,初診）+ S12.100A（C2 未特指移位骨折,初診/閉鎖）。 不應使用：G82.52（不完全四肢癱，外傷情境不另編）。 實務：S14 指示報告最高頸髓節(此為 C3)；外傷併四肢癱只編脊髓損傷碼。 （來源：AHA Coding Clinic 2024年第2季「頸椎骨折併中央脊髓症候群與不完全四肢癱（外傷）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-23:a","q":"【AHA Coding Clinic 2024年第2季｜Hill-Sachs 與 Bankart 病灶】\n滑雪意外致左肩 bony Bankart 與 Hill-Sachs 病灶行手術矯正。\n依該季 Coding Clinic，應如何編碼？","o":["S43.432A + S42.292A","S42.292A","S43.432A","S43.432A + S06.890A"],"e":"正解：S43.432A + S42.292A。S43.432A（左肩上盂唇病灶,初診=Bankart）+ S42.292A（左肱骨上端其他移位骨折,初診/閉鎖=Hill-Sachs） 重點：Bankart 病灶編 S43.432A；Hill-Sachs 病灶編 S42.292A。 實務：Bankart(盂唇)歸 S43.43-；Hill-Sachs 為肱骨頭壓迫性骨折(displaced)。 （來源：AHA Coding Clinic 2024年第2季「Hill-Sachs 與 Bankart 病灶」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-23:d","q":"【AHA Coding Clinic 2024年第2季】\n滑雪意外致左肩 bony Bankart 與 Hill-Sachs 病灶行手術矯正。\n依該季 Coding Clinic，下列結論何者正確？","o":["Bankart 病灶編 S43.432A；Hill-Sachs 病灶編 S42.292A。","飢餓性酮酸中毒編 E87.29 + T73.0XXA。","複雜性偏頭痛所致單側無力(醫師連結)編 G43.409。","重度憂鬱所致成人異食癖：F32.2 + F50.83。"],"e":"正解：Bankart 病灶編 S43.432A；Hill-Sachs 病灶編 S42.292A。 應使用：S43.432A（左肩上盂唇病灶,初診=Bankart）+ S42.292A（左肱骨上端其他移位骨折,初診/閉鎖=Hill-Sachs）。 實務：Bankart(盂唇)歸 S43.43-；Hill-Sachs 為肱骨頭壓迫性骨折(displaced)。 （來源：AHA Coding Clinic 2024年第2季「Hill-Sachs 與 Bankart 病灶」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-24:a","q":"【AHA Coding Clinic 2024年第2季｜腦點狀出血】\n急性栓塞性左 MCA 中風、左 ACA 中風併點狀出血、亞急性右額頂中風。\n依該季 Coding Clinic，應如何編碼？","o":["I61.8","I63.89","I61.0","I69.392"],"e":"正解：I61.8。I61.8（其他非外傷性腦內出血=點狀出血）+ 各中風碼 重點：腦點狀出血編 I61.8（=出血性中風）。 實務：腦點狀出血=hemorrhagic stroke，另編出血碼。 （來源：AHA Coding Clinic 2024年第2季「腦點狀出血」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-24:d","q":"【AHA Coding Clinic 2024年第2季】\n急性栓塞性左 MCA 中風、左 ACA 中風併點狀出血、亞急性右額頂中風。\n依該季 Coding Clinic，下列結論何者正確？","o":["腦點狀出血編 I61.8（=出血性中風）。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","顱內海綿狀血管瘤（cavernoma）併皮質下出血，編 D18.02 + I61.0。","本例治療焦點為出血病灶 → 以 K25.0 或 K31.811 為主診。"],"e":"正解：腦點狀出血編 I61.8（=出血性中風）。 應使用：I61.8（其他非外傷性腦內出血=點狀出血）+ 各中風碼。 實務：腦點狀出血=hemorrhagic stroke，另編出血碼。 （來源：AHA Coding Clinic 2024年第2季「腦點狀出血」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-25:a","q":"【AHA Coding Clinic 2024年第2季｜食道胃接合處出口阻塞】\nEGJOO 行上消化道內視鏡與 Endoflip。\n依該季 Coding Clinic，應如何編碼？","o":["K22.89 + K31.89","K22.2 + K31.89","K31.89","K22.89"],"e":"正解：K22.89 + K31.89。K22.89（食道其他特指疾病）+ K31.89（胃十二指腸其他疾病） 不應使用／不適用：K22.2（食道阻塞，非真性阻塞）。 重點：EGJOO(蠕動障礙)編 K22.89 + K31.89；非真性阻塞不用 K22.2。 實務：EGJOO 為蠕動障礙、非真性機械阻塞。 （來源：AHA Coding Clinic 2024年第2季「食道胃接合處出口阻塞」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-25:d","q":"【AHA Coding Clinic 2024年第2季】\nEGJOO 行上消化道內視鏡與 Endoflip。\n依該季 Coding Clinic，下列結論何者正確？","o":["EGJOO(蠕動障礙)編 K22.89 + K31.89；非真性阻塞不用 K22.2。","憩室炎併結腸膀胱廔與膀胱前膿瘍編 K57.20 + K68.19 + N32.1。","環咽肌功能障礙(上食道括約肌痙攣)編 K22.4。","妊娠肝內膽汁鬱積編 O26.62 + E78.79 + K76.89；無阻塞不用 K83.1。"],"e":"正解：EGJOO(蠕動障礙)編 K22.89 + K31.89；非真性阻塞不用 K22.2。 應使用：K22.89（食道其他特指疾病）+ K31.89（胃十二指腸其他疾病）。 不應使用：K22.2（食道阻塞，非真性阻塞）。 實務：EGJOO 為蠕動障礙、非真性機械阻塞。 （來源：AHA Coding Clinic 2024年第2季「食道胃接合處出口阻塞」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-26:d","q":"【AHA Coding Clinic 2024年第2季】\n新診斷 DM 出院帶 metformin 與 SGLT2 抑制劑，擬長期使用。\n依該季 Coding Clinic，下列結論何者正確？","o":["擬長期使用之降糖藥可編 Z79 系列（依藥物：口服 Z79.84、SGLT2 屬 Z79.899），與是否新開立無關。","副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。","醫療處方大麻(僅記 use)編所治病況 + Z79.899;不編物質使用碼。","陰道成形術後新陰道狹窄，編術後泌尿生殖併發症 N99.89 + N89.5。"],"e":"正解：擬長期使用之降糖藥可編 Z79 系列（依藥物：口服 Z79.84、SGLT2 屬 Z79.899），與是否新開立無關。 應使用：Z79 系列（口服降糖藥 Z79.84；其他長期用藥 Z79.899）；依實際藥物。 不應使用：短期治療急性病之用藥（不編 Z79）。 實務：依『擬長期使用』而非『是否新藥』判定；短期(如抗生素治急性支氣管炎)不編 Z79。 （來源：AHA Coding Clinic 2024年第2季「新開立擬長期使用之降血糖藥」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-27:d","q":"【AHA Coding Clinic 2024年第2季】\nC2-L2 硬體移除+清創後回手術室行融合，以 Stimulan(含抗生素)骨珠作 allograft 於 C2-L2 減皮質處。\n依該季 Coding Clinic，下列結論何者正確？","o":["以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。","輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。","HeRO 移植片血栓清除編 03C73ZZ + 05CY3ZZ(Extirpation)；非 Revision。"],"e":"正解：以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。 應使用：root operation Fusion，device value J（合成替代物）。 實務：Stimulan 為可吸收硫酸鈣抗生素載體；作融合植骨→device J。 （來源：AHA Coding Clinic 2024年第2季「Stimulan 抗生素骨珠置放（融合）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-28:a","q":"【AHA Coding Clinic 2024年第2季｜深腦刺激延長導線置放】\n帕金森 stage II DBS，於胸部囊袋置產生器並經皮下隧道置延長連接導線。\n依該季 Coding Clinic，應如何編碼？","o":["0JHS3YZ","0JH637Z","0JB70ZZ","0JDR0ZZ"],"e":"正解：0JHS3YZ。0JHS3YZ（頭頸皮下組織與筋膜其他裝置置入,經皮） 不應使用／不適用：延長導線視為產生器置入之固有。 重點：DBS 第二階段置延長導線編 0JHS3YZ（與脈衝產生器分開）。 實務：延長導線為連接 DBS 導線與產生器之獨立裝置→另編。 （來源：AHA Coding Clinic 2024年第2季「深腦刺激延長導線置放」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-28:d","q":"【AHA Coding Clinic 2024年第2季】\n帕金森 stage II DBS，於胸部囊袋置產生器並經皮下隧道置延長連接導線。\n依該季 Coding Clinic，下列結論何者正確？","o":["DBS 第二階段置延長導線編 0JHS3YZ（與脈衝產生器分開）。","FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。","蛆蟲療法為非切除性清創,編 0JDR0ZZ。"],"e":"正解：DBS 第二階段置延長導線編 0JHS3YZ（與脈衝產生器分開）。 應使用：0JHS3YZ（頭頸皮下組織與筋膜其他裝置置入,經皮）。 不應使用：延長導線視為產生器置入之固有。 實務：延長導線為連接 DBS 導線與產生器之獨立裝置→另編。 （來源：AHA Coding Clinic 2024年第2季「深腦刺激延長導線置放」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-29:a","q":"【AHA Coding Clinic 2024年第2季｜WiSE-CRT 左心室無導線起搏系統分階段置放】\n非缺血性心肌病等升級為 WiSE-CRT：皮下囊袋置超音波發射器/電池，左心室植入米粒大接收電極。\n依該季 Coding Clinic，應如何編碼？","o":["0JH637Z + 02HL3YZ","02HL3YZ","0JH637Z","0JHS3YZ + 02HL3YZ"],"e":"正解：0JH637Z + 02HL3YZ。0JH637Z（心臟再同步節律器產生器置入胸皮下,經皮=發射器/電池）+ 02HL3YZ（左心室其他裝置置入,經皮=接收電極） 重點：WiSE-CRT 電池/發射器 + 左心室接收電極分別編 0JH637Z + 02HL3YZ。 實務：leadless 左心室刺激系統之兩組件分別編。 （來源：AHA Coding Clinic 2024年第2季「WiSE-CRT 左心室無導線起搏系統分階段置放」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-29:d","q":"【AHA Coding Clinic 2024年第2季】\n非缺血性心肌病等升級為 WiSE-CRT：皮下囊袋置超音波發射器/電池，左心室植入米粒大接收電極。\n依該季 Coding Clinic，下列結論何者正確？","o":["WiSE-CRT 電池/發射器 + 左心室接收電極分別編 0JH637Z + 02HL3YZ。","SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。"],"e":"正解：WiSE-CRT 電池/發射器 + 左心室接收電極分別編 0JH637Z + 02HL3YZ。 應使用：0JH637Z（心臟再同步節律器產生器置入胸皮下,經皮=發射器/電池）+ 02HL3YZ（左心室其他裝置置入,經皮=接收電極）。 實務：leadless 左心室刺激系統之兩組件分別編。 （來源：AHA Coding Clinic 2024年第2季「WiSE-CRT 左心室無導線起搏系統分階段置放」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q2-30:a","q":"【AHA Coding Clinic 2024年第2季｜主動脈瓣與主動脈根置換（瓣膜導管）】\n主動脈瓣狹窄併主動脈根動脈瘤行 Konect Resilia 瓣膜導管(Gelweave 聚酯+牛心包瓣)置換。\n依該季 Coding Clinic，應如何編碼？","o":["02RX0JZ + 02RF08Z","02RF08Z","02RX0JZ","028G3Z1 + 02RF08Z"],"e":"正解：02RX0JZ + 02RF08Z。02RX0JZ（胸主動脈升/弓合成替代物置換,開放=主動脈根導管）+ 02RF08Z（主動脈瓣異種組織置換,開放=牛心包瓣） 不應使用／不適用：僅編一碼(aortic valve)。 重點：改良 Bentall 瓣膜導管：主動脈根(升主/弓)置換 + 主動脈瓣置換分別編。 實務：依 B3.2a：同 root operation 於不同 body part 各編。 （來源：AHA Coding Clinic 2024年第2季「主動脈瓣與主動脈根置換（瓣膜導管）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q2-30:d","q":"【AHA Coding Clinic 2024年第2季】\n主動脈瓣狹窄併主動脈根動脈瘤行 Konect Resilia 瓣膜導管(Gelweave 聚酯+牛心包瓣)置換。\n依該季 Coding Clinic，下列結論何者正確？","o":["改良 Bentall 瓣膜導管：主動脈根(升主/弓)置換 + 主動脈瓣置換分別編。","腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。","升主動脈/弓置換 + LSA/LCC 支架延伸(獨立目的)各編。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。"],"e":"正解：改良 Bentall 瓣膜導管：主動脈根(升主/弓)置換 + 主動脈瓣置換分別編。 應使用：02RX0JZ（胸主動脈升/弓合成替代物置換,開放=主動脈根導管）+ 02RF08Z（主動脈瓣異種組織置換,開放=牛心包瓣）。 不應使用：僅編一碼(aortic valve)。 實務：依 B3.2a：同 root operation 於不同 body part 各編。 （來源：AHA Coding Clinic 2024年第2季「主動脈瓣與主動脈根置換（瓣膜導管）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-01:a","q":"【AHA Coding Clinic 2024年第3季｜非侵襲性濾泡型甲狀腺腫瘤併乳突樣核特徵】\n甲狀腺病灶行左甲狀腺切除，診斷 NIFTP。\n依該季 Coding Clinic，應如何編碼？","o":["D44.0","D43.1","D47.Z9","D15.2"],"e":"正解：D44.0。D44.0（甲狀腺未定行為腫瘤） 重點：NIFTP（borderline/pre-malignant）編 D44.0。 實務：NIFTP 為包膜性非侵襲性、良惡難分之交界病灶→未定行為。 （來源：AHA Coding Clinic 2024年第3季「非侵襲性濾泡型甲狀腺腫瘤併乳突樣核特徵」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-01:d","q":"【AHA Coding Clinic 2024年第3季】\n甲狀腺病灶行左甲狀腺切除，診斷 NIFTP。\n依該季 Coding Clinic，下列結論何者正確？","o":["NIFTP（borderline/pre-malignant）編 D44.0。","經口直視、無需器械到達 → 入路值 External（非 Percutaneous）。","【釐清】XRG device R 用於「custom-made anatomically designed」病人專屬椎間融合器（如 Aprevo），非現成器。","FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。"],"e":"正解：NIFTP（borderline/pre-malignant）編 D44.0。 應使用：D44.0（甲狀腺未定行為腫瘤）。 實務：NIFTP 為包膜性非侵襲性、良惡難分之交界病灶→未定行為。 （來源：AHA Coding Clinic 2024年第3季「非侵襲性濾泡型甲狀腺腫瘤併乳突樣核特徵」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-02:a","q":"【AHA Coding Clinic 2024年第3季｜縱膈胸腺脂肪瘤】\n胸腔鏡切除前縱膈腫塊，病理為縱膈胸腺脂肪瘤。\n依該季 Coding Clinic，應如何編碼？","o":["D15.2","D18.01","D18.02","D39.11"],"e":"正解：D15.2。D15.2（縱膈良性腫瘤） 重點：胸腺脂肪瘤（良性）編 D15.2。 實務：thymolipoma 為前縱膈罕見良性腫瘤。 （來源：AHA Coding Clinic 2024年第3季「縱膈胸腺脂肪瘤」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-02:d","q":"【AHA Coding Clinic 2024年第3季】\n胸腔鏡切除前縱膈腫塊，病理為縱膈胸腺脂肪瘤。\n依該季 Coding Clinic，下列結論何者正確？","o":["胸腺脂肪瘤（良性）編 D15.2。","分類不推定高血壓與甲狀腺低下相關;無醫師連結不編 I15.2。","副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。","顱內海綿狀血管瘤（cavernoma）併皮質下出血，編 D18.02 + I61.0。"],"e":"正解：胸腺脂肪瘤（良性）編 D15.2。 應使用：D15.2（縱膈良性腫瘤）。 實務：thymolipoma 為前縱膈罕見良性腫瘤。 （來源：AHA Coding Clinic 2024年第3季「縱膈胸腺脂肪瘤」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-03:a","q":"【AHA Coding Clinic 2024年第3季｜胰肋膜廔】\n腫瘤減積+脾切除+遠端胰切除史，本次胰肋膜廔併左肋膜積液(高 amylase)。\n依該季 Coding Clinic，應如何編碼？","o":["T81.83XA + K86.89 + J94.8 + J91.8","T81.83XA + K86.89 + J86.0 + J91.8","K86.89 + J94.8 + J91.8","T81.83XA + J94.8 + J91.8"],"e":"正解：T81.83XA + K86.89 + J94.8 + J91.8。T81.83XA（持續性術後廔管,初診）+ K86.89（胰其他特指疾病）+ J94.8（其他特指肋膜情況）+ J91.8（他處疾病之肋膜積液） 不應使用／不適用：J86.0（膿胸併廔，本例無感染）。 編碼順序：先 query 是否術後廔。 重點：術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。 實務：pyothorax 含感染，本例無感染→不用 J86.0；索引標題不符須進一步查證。 （來源：AHA Coding Clinic 2024年第3季「胰肋膜廔」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-03:d","q":"【AHA Coding Clinic 2024年第3季】\n腫瘤減積+脾切除+遠端胰切除史，本次胰肋膜廔併左肋膜積液(高 amylase)。\n依該季 Coding Clinic，下列結論何者正確？","o":["術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。","VA-ECMO 併發 NSS 編 T81.89XA + 呼吸衰竭 J96.21/J96.22 及各表現碼。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","術後脂肪肺栓塞編 T81.718A + I26.96。"],"e":"正解：術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。 應使用：T81.83XA（持續性術後廔管,初診）+ K86.89（胰其他特指疾病）+ J94.8（其他特指肋膜情況）+ J91.8（他處疾病之肋膜積液）。 不應使用：J86.0（膿胸併廔，本例無感染）。 編碼順序：先 query 是否術後廔。 實務：pyothorax 含感染，本例無感染→不用 J86.0；索引標題不符須進一步查證。 （來源：AHA Coding Clinic 2024年第3季「胰肋膜廔」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-04:a","q":"【AHA Coding Clinic 2024年第3季｜蒙古斑】\n39週新生兒臀部及腰椎皮膚蒙古斑，出院摘要載明。\n依該季 Coding Clinic，應如何編碼？","o":["Q82.5","Q87.11","Q85.83","Q23.81"],"e":"正解：Q82.5。Q82.5（先天非腫瘤性痣） 重點：蒙古斑編 Q82.5（先天非腫瘤性痣）。 實務：蒙古斑可與代謝遺傳疾病共存→醫師識別時可編。 （來源：AHA Coding Clinic 2024年第3季「蒙古斑」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-04:d","q":"【AHA Coding Clinic 2024年第3季】\n39週新生兒臀部及腰椎皮膚蒙古斑，出院摘要載明。\n依該季 Coding Clinic，下列結論何者正確？","o":["蒙古斑編 Q82.5（先天非腫瘤性痣）。","因臀位剖腹娩出之新生兒編 P01.7（臀位嬰兒髖問題風險增加）。","苔癬樣角化症編 L82.0。","氣切還原後未自然閉合之氣管皮膚廔編 J39.8；非 T81.83。"],"e":"正解：蒙古斑編 Q82.5（先天非腫瘤性痣）。 應使用：Q82.5（先天非腫瘤性痣）。 實務：蒙古斑可與代謝遺傳疾病共存→醫師識別時可編。 （來源：AHA Coding Clinic 2024年第3季「蒙古斑」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-05:a","q":"【AHA Coding Clinic 2024年第3季｜椎板切除術後硬膜外血腫】\nL3-L4、L4-L5 椎板切除/內側面切除/椎間孔切開後硬膜外血腫。\n依該季 Coding Clinic，應如何編碼？","o":["G97.62","G95.89","G95.19","G93.41"],"e":"正解：G97.62。G97.62（他手術後神經系統器官/構造血腫） 不應使用／不適用：G95.89/G95.19（不另標部位）。 重點：椎板切除術後硬膜外血腫編 G97.62；不加 G95.19/G95.89 標示部位。 實務：⚠️ 註：此建議後於 2025 Q2 更正——椎板切除為神經系統手術，應改 G97.61；見 [[CC2025Q2-30 更正：椎板切除術後硬膜外血腫]]。 （來源：AHA Coding Clinic 2024年第3季「椎板切除術後硬膜外血腫」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-05:d","q":"【AHA Coding Clinic 2024年第3季】\nL3-L4、L4-L5 椎板切除/內側面切除/椎間孔切開後硬膜外血腫。\n依該季 Coding Clinic，下列結論何者正確？","o":["椎板切除術後硬膜外血腫編 G97.62；不加 G95.19/G95.89 標示部位。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。","非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。","外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。"],"e":"正解：椎板切除術後硬膜外血腫編 G97.62；不加 G95.19/G95.89 標示部位。 應使用：G97.62（他手術後神經系統器官/構造血腫）。 不應使用：G95.89/G95.19（不另標部位）。 實務：⚠️ 註：此建議後於 2025 Q2 更正——椎板切除為神經系統手術，應改 G97.61；見 [[CC2025Q2-30 更正：椎板切除術後硬膜外血腫]]。 （來源：AHA Coding Clinic 2024年第3季「椎板切除術後硬膜外血腫」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-06:a","q":"【AHA Coding Clinic 2024年第3季｜陰莖成形術失敗/不存活】\n性別不安行橈側前臂皮瓣陰莖成形，術中 Doppler 無訊號、微循環廣泛血栓，皮瓣失敗。\n依該季 Coding Clinic，應如何編碼？","o":["T83.86XA","T81.44XA","T81.89XA","T84.84XA"],"e":"正解：T83.86XA。T83.86XA（泌尿生殖義器/植入物/移植物血栓,初診） 重點：前臂皮瓣陰莖成形失敗(微循環血栓)編 T83.86XA。 實務：前臂皮瓣陰莖成形之血栓失敗歸 T83.86-。 （來源：AHA Coding Clinic 2024年第3季「陰莖成形術失敗/不存活」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-06:d","q":"【AHA Coding Clinic 2024年第3季】\n性別不安行橈側前臂皮瓣陰莖成形，術中 Doppler 無訊號、微循環廣泛血栓，皮瓣失敗。\n依該季 Coding Clinic，下列結論何者正確？","o":["前臂皮瓣陰莖成形失敗(微循環血栓)編 T83.86XA。","ACL 重建後 cyclops 病灶（關節纖維化）編 T84.82XA + M24.662。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。"],"e":"正解：前臂皮瓣陰莖成形失敗(微循環血栓)編 T83.86XA。 應使用：T83.86XA（泌尿生殖義器/植入物/移植物血栓,初診）。 實務：前臂皮瓣陰莖成形之血栓失敗歸 T83.86-。 （來源：AHA Coding Clinic 2024年第3季「陰莖成形術失敗/不存活」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-07:a","q":"【AHA Coding Clinic 2024年第3季｜腦脊髓液廔所致自發性顱內低壓】\nT8-T9 CSF 廔致自發性顱內低壓(姿勢性頭痛、左肢無力等)。\n依該季 Coding Clinic，應如何編碼？","o":["G96.811 + G96.08","G96.08","G96.811","G96.811 + G97.82"],"e":"正解：G96.811 + G96.08。G96.811（自發性顱內低壓）+ G96.08（其他顱腦脊髓液漏=CSF 廔） 重點：自發性顱內低壓併 CSF 廔編 G96.811 + G96.08。 實務：CSF fistula 索引至 G96.08；G96.0 指示 code also 顱內低壓。 （來源：AHA Coding Clinic 2024年第3季「腦脊髓液廔所致自發性顱內低壓」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-07:d","q":"【AHA Coding Clinic 2024年第3季】\nT8-T9 CSF 廔致自發性顱內低壓(姿勢性頭痛、左肢無力等)。\n依該季 Coding Clinic，下列結論何者正確？","o":["自發性顱內低壓併 CSF 廔編 G96.811 + G96.08。","CAR-T 所致全血球減少編 T80.82XA +

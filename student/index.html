/* ---------- 03 電子書庫 ---------- */
var DB = (function(){
  var p;
  function open(){
    return p || (p = new Promise(function(res, rej){
      if (!window.indexedDB) return rej(new Error('no indexedDB'));
      var r;
      try { r = indexedDB.open('dx-books', 1); } catch(e) { return rej(e); }
      r.onupgradeneeded = function(){ var d = r.result; d.createObjectStore('meta', {keyPath:'id'}); d.createObjectStore('files'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
      r.onblocked = function(){ rej(new Error('blocked')); };
    }));
  }
  function run(store, mode, fn){
    return open().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction(store, mode), s = t.objectStore(store), req;
        try { req = fn(s); } catch(e) { return rej(e); }
        t.oncomplete = function(){ res(req ? req.result : undefined); };
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    list: function(){ return run('meta', 'readonly', function(s){ return s.getAll(); }); },
    putMeta: function(m){ return run('meta', 'readwrite', function(s){ return s.put(m); }); },
    putFile: function(id, b){ return run('files', 'readwrite', function(s){ return s.put(b, id); }); },
    getFile: function(id){ return run('files', 'readonly', function(s){ return s.get(id); }); },
    del: function(id){ return run('meta', 'readwrite', function(s){ return s.delete(id); }).then(function(){ return run('files', 'readwrite', function(s){ return s.delete(id); }); }); }
  };
})();
var sessionBooks = []; /* 無法寫入 IndexedDB 時，只在本次瀏覽中保留 */
var loaded = {};
function loadScript(src){
  if (loaded[src]) return loaded[src];
  loaded[src] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = function(){ delete loaded[src]; rej(new Error('無法載入閱讀元件')); };
    document.head.append(s);
  });
  return loaded[src];
}
var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
var EPUBJS = 'https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js';

function kindOf(name){
  var m = /\.([a-z0-9]+)$/i.exec(name || '');
  var ext = m ? m[1].toLowerCase() : '';
  if (ext === 'pdf') return 'pdf';
  if (ext === 'epub') return 'epub';
  if (ext === 'txt' || ext === 'md' || ext === 'markdown' || ext === 'text') return 'text';
  return null;
}
function persistMeta(meta){
  if (sessionBooks.some(function(b){ return b.meta.id === meta.id; })) return;
  DB.putMeta(meta).catch(function(){});
}
function progressText(m){
  if (m.kind === 'pdf') return m.last ? '讀到第 ' + m.last + (m.total ? ' / ' + m.total : '') + ' 頁' : '尚未開始';
  if (m.kind === 'epub') return m.cfi ? '已讀過' : '尚未開始';
  return m.ratio ? '讀到約 ' + Math.round(m.ratio * 100) + '%' : '尚未開始';
}
function booksView(){
  var root = h('section', {class:'sec', 'aria-labelledby':'books-h'});
  root.append(secHead('03｜電子書庫', '上傳自己的電子書，一邊讀一邊記', 'books-h'));
  var body = h('div', {class:'stack'});
  root.append(body);
  showLibrary(body);
  return root;
}
function showLibrary(body){
  body.replaceChildren();
  var msg = h('div', {'aria-live':'polite'});
  var input = h('input', {type:'file', id:'bookfile', class:'sr-file', accept:'.pdf,.epub,.txt,.md,.markdown,application/pdf,application/epub+zip,text/plain', multiple:true, onChange:function(){ var f = Array.prototype.slice.call(input.files); input.value = ''; handleFiles(f); }});
  var drop = h('label', {class:'drop', for:'bookfile'}, input, h('strong', null, '選擇檔案，或把檔案拖曳到這裡'), h('span', {class:'muted'}, '支援 PDF、EPUB、TXT、Markdown，單檔上限 200 MB'));
  drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files) handleFiles(Array.prototype.slice.call(e.dataTransfer.files)); });
  var listBox = h('div');
  body.append(h('div', {class:'card pad'}, drop, msg), listBox);

  function say(text){
    msg.replaceChildren();
    if (text) msg.append(h('div', {class:'notice', style:'margin:14px 0 0'}, text));
  }
  function handleFiles(files){
    var chain = Promise.resolve(); var problems = []; var added = 0;
    files.forEach(function(f){
      chain = chain.then(function(){
        var kind = kindOf(f.name);
        if (!kind) { problems.push('「' + f.name + '」格式不支援'); return; }
        if (f.size > 200 * 1048576) { problems.push('「' + f.name + '」超過 200 MB'); return; }
        var meta = { id: uid(), name: f.name.replace(/\.[^.]+$/, ''), kind: kind, size: f.size, added: Date.now(), last: 1, total: 0, cfi: '', ratio: 0 };
        return DB.putFile(meta.id, f).then(function(){ return DB.putMeta(meta); }).then(function(){ added++; }, function(){
          sessionBooks.push({meta: meta, blob: f}); added++; problems.push('「' + f.name + '」無法長期保存，只能在這次瀏覽中閱讀');
        });
      });
    });
    chain.then(function(){
      say(problems.length ? problems.join('；') + '。' : '');
      if (added && !problems.length) toast('已加入 ' + added + ' 本');
      refresh();
    });
  }
  function refresh(){
    listBox.replaceChildren(h('p', {class:'muted'}, '讀取書庫中…'));
    DB.list().catch(function(){ return []; }).then(function(metas){
      var all = metas.concat(sessionBooks.map(function(b){ return b.meta; })).sort(function(a,b){ return b.added - a.added; });
      listBox.replaceChildren();
      if (!all.length) { listBox.append(h('div', {class:'card pad empty'}, '書庫是空的。上傳第一本電子書，之後可以從上次讀到的地方繼續。')); return; }
      var ul = h('ul', {class:'book-list'});
      all.forEach(function(m){
        var del = h('button', {type:'button', class:'btn quiet small'});
        twoStep(del, '刪除', '再按一次確定', function(){
          sessionBooks = sessionBooks.filter(function(b){ return b.meta.id !== m.id; });
          DB.del(m.id).catch(function(){}).then(refresh);
        });
        ul.append(h('li', {class:'card book'},
          h('div', {class:'book-info'}, h('b', null, m.name), h('span', null, m.kind.toUpperCase() + '・' + fmtSize(m.size) + '・' + progressText(m))),
          h('div', {class:'row'}, h('button', {type:'button', class:'btn primary small', onClick:function(){ openReader(body, m); }}, '開啟閱讀'), del)));
      });
      listBox.append(ul);
    });
  }
  refresh();
  body.append(h('p', {class:'closing'}, '檔案只存在你的瀏覽器，不會上傳到任何伺服器。'));
}

function openReader(body, meta){
  body.replaceChildren(h('p', {class:'muted'}, '開啟中…'));
  var sb = sessionBooks.filter(function(b){ return b.meta.id === meta.id; })[0];
  var getBlob = sb ? Promise.resolve(sb.blob) : DB.getFile(meta.id);
  getBlob.catch(function(){ return null; }).then(function(blob){
    function back(){ if (S.reader) { S.reader.destroy(); S.reader = null; } showLibrary(body); }
    if (!blob) {
      body.replaceChildren(h('div', {class:'notice'}, '找不到這本書的檔案，可能已被清除。請重新上傳。'), h('button', {type:'button', class:'btn', onClick:back}, '回到書庫'));
      return;
    }
    var stage = h('div', {class:'stage', tabindex:'0', 'aria-label':'閱讀區'});
    var indicator = h('span', {class:'status', 'aria-live':'polite'}, '');
    var controlsBox = h('div', {class:'row'});
    var saveMeta = debounce(function(){ persistMeta(meta); }, 500);
    var ctl = { destroy:function(){} };
    S.reader = { destroy:function(){ try { ctl.destroy(); } catch(e) {} document.removeEventListener('keydown', onKey); } };

    var page = function(){ return meta.kind === 'pdf' ? meta.last : null; };
    var notePanel = h('div', {class:'card pad note-panel', hidden:true});
    var noteArea = h('textarea', {id:'reader-note', rows:'4', placeholder:'寫下這一頁的重點或疑問'});
    var noteHint = h('p', {class:'status', style:'margin:0 0 8px'}, '');
    notePanel.append(h('label', {for:'reader-note', class:'label', style:'display:block'}, '讀書筆記'), noteHint, noteArea,
      h('div', {class:'row', style:'margin-top:10px'},
        h('button', {type:'button', class:'btn primary small', onClick:function(){
          var text = noteArea.value.trim();
          if (!text) { noteHint.textContent = '請先寫一點內容。'; return; }
          var pg = page();
          var n = { id: uid(), title: '《' + meta.name + '》' + (pg ? '第 ' + pg + ' 頁' : ''), body: text, tags:['讀書筆記'], ref:{type:'book', id:meta.id, page:pg}, updated: Date.now() };
          notes.unshift(n); saveNotes(); S.notesUi.sel = n.id; noteArea.value = ''; renderTabs();
          toast('已存成筆記', '前往筆記', function(){ go('notes'); });
        }}, '存成筆記'),
        h('button', {type:'button', class:'btn quiet small', onClick:function(){ notePanel.hidden = true; }}, '收起')));
    var noteBtn = h('button', {type:'button', class:'btn small', onClick:function(){
      notePanel.hidden = !notePanel.hidden;
      noteHint.textContent = page() ? '這則筆記會記錄在第 ' + page() + ' 頁。' : '這則筆記會連到這本書。';
      if (!notePanel.hidden) noteArea.focus();
    }}, '記筆記');

    var bar = h('div', {class:'reader-bar'},
      h('button', {type:'button', class:'btn small quiet', onClick:back}, '回到書庫'),
      h('div', {class:'grow'}, meta.name), controlsBox, noteBtn);
    body.replaceChildren(h('div', null, bar, stage, h('div', {style:'margin-top:8px'}, indicator), notePanel));

    function onKey(e){
      if (/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) return;
      if (ctl.prev && e.key === 'ArrowLeft') ctl.prev();
      if (ctl.next && e.key === 'ArrowRight') ctl.next();
    }
    document.addEventListener('keydown', onKey);

    function fail(err){
      stage.replaceChildren(h('div', {class:'notice', style:'text-align:left'}, '這個檔案無法在頁面內開啟（' + (err && err.message ? err.message : '未知原因') + '）。請確認檔案沒有加密或損毀，或換成 PDF 格式再試一次。'));
    }
    var start = meta.kind === 'pdf' ? pdfReader : meta.kind === 'epub' ? epubReader : textReader;
    start(blob).then(function(c){ ctl = c; }, fail);

    /* PDF */
    function pdfReader(blob){
      stage.replaceChildren(h('p', {class:'muted'}, '載入 PDF 中…'));
      return loadScript(PDFJS).then(function(){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        return blob.arrayBuffer();
      }).then(function(buf){
        return window.pdfjsLib.getDocument({data: buf}).promise;
      }).then(function(doc){
        var total = doc.numPages, zoom = meta.zoom || 1, token = 0, task = null, dead = false;
        meta.total = total; meta.last = Math.min(Math.max(1, meta.last || 1), total);
        var pg = h('input', {type:'number', class:'pg', min:'1', max:String(total), value:String(meta.last), 'aria-label':'跳到頁碼', onChange:function(){ goTo(Number(pg.value)); }});
        function goTo(n){ if (!isFinite(n)) return; n = Math.min(Math.max(1, Math.round(n)), total); meta.last = n; pg.value = String(n); draw(); }
        function setZoom(z){ zoom = Math.min(3, Math.max(0.5, z)); meta.zoom = zoom; draw(); }
        controlsBox.replaceChildren(
          h('button', {type:'button', class:'btn small', onClick:function(){ goTo(meta.last - 1); }}, '上一頁'),
          pg, h('span', {class:'status'}, '/ ' + total),
          h('button', {type:'button', class:'btn small', onClick:function(){ goTo(meta.last + 1); }}, '下一頁'),
          h('button', {type:'button', class:'btn small quiet', 'aria-label':'縮小', onClick:function(){ setZoom(zoom - 0.15); }}, '縮小'),
          h('button', {type:'button', class:'btn small quiet', 'aria-label':'放大', onClick:function(){ setZoom(zoom + 0.15); }}, '放大'));
        function draw(){
          var my = ++token;
          indicator.textContent = '第 ' + meta.last + ' / ' + total + ' 頁';
          doc.getPage(meta.last).then(function(p){
            if (my !== token || dead) return;
            var base = p.getViewport({scale:1});
            var avail = Math.max(260, stage.clientWidth - 28);
            var vp = p.getViewport({scale: avail / base.width * zoom});
            var dpr = window.devicePixelRatio || 1;
            var cv = document.createElement('canvas');
            cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
            cv.style.width = Math.floor(vp.width) + 'px'; cv.style.height = Math.floor(vp.height) + 'px';
            if (task) { try { task.cancel(); } catch(e) {} }
            task = p.render({canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null});
            return task.promise.then(function(){
              if (my !== token || dead) return;
              stage.replaceChildren(cv); stage.scrollTop = 0; saveMeta();
            });
          }).catch(function(e){ if (e && e.name === 'RenderingCancelledException') return; fail(e); });
        }
        draw();
        return { prev:function(){ goTo(meta.last - 1); }, next:function(){ goTo(meta.last + 1); }, destroy:function(){ dead = true; token++; if (task) { try { task.cancel(); } catch(e) {} } try { doc.destroy(); } catch(e) {} } };
      });
    }

    /* EPUB */
    function epubReader(blob){
      stage.replaceChildren(h('p', {class:'muted'}, '載入 EPUB 中…'));
      return loadScript(JSZIP).then(function(){ return loadScript(EPUBJS); }).then(function(){ return blob.arrayBuffer(); }).then(function(buf){
        var book = window.ePub(buf);
        var host = h('div', {class:'epub-host'});
        stage.replaceChildren(host);
        var cs = getComputedStyle(stage);
        var rend = book.renderTo(host, {width:'100%', height:'100%', flow:'paginated', spread:'none'});
        rend.themes.default({ body: { color: getComputedStyle(document.body).color + ' !important', 'line-height': '1.85 !important', 'font-family': "'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif !important" }, a: { color: 'inherit' } });
        rend.on('relocated', function(loc){
          try { meta.cfi = loc.start.cfi; indicator.textContent = '閱讀中，進度已自動記錄'; saveMeta(); } catch(e) {}
        });
        controlsBox.replaceChildren(
          h('button', {type:'button', class:'btn small', onClick:function(){ rend.prev(); }}, '上一頁'),
          h('button', {type:'button', class:'btn small', onClick:function(){ rend.next(); }}, '下一頁'));
        return rend.display(meta.cfi || undefined).then(function(){
          return { prev:function(){ rend.prev(); }, next:function(){ rend.next(); }, destroy:function(){ try { rend.destroy(); } catch(e) {} try { book.destroy(); } catch(e) {} } };
        });
      });
    }

    /* 純文字／Markdown */
    function textReader(blob){
      return blob.arrayBuffer().then(function(buf){
        var text;
        try { text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
        catch(e) { try { text = new TextDecoder('big5').decode(buf); } catch(e2) { text = new TextDecoder('utf-8').decode(buf); } }
        var box = h('div', {class:'textbook'}, text);
        stage.replaceChildren(box);
        controlsBox.replaceChildren(h('span', {class:'status'}, '捲動閱讀，進度會自動記錄'));
        function ratio(){ var max = stage.scrollHeight - stage.clientHeight; return max > 0 ? stage.scrollTop / max : 0; }
        var onScroll = debounce(function(){ meta.ratio = ratio(); indicator.textContent = '讀到約 ' + Math.round(meta.ratio * 100) + '%'; saveMeta(); }, 300);
        stage.addEventListener('scroll', onScroll);
        setTimeout(function(){ var max = stage.scrollHeight - stage.clientHeight; stage.scrollTop = (meta.ratio || 0) * Math.max(0, max); }, 0);
        return { destroy:function(){ stage.removeEventListener('scroll', onScroll); } };
      });
    }
  });
}

render();
})();
</script>

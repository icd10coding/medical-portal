 D61.818。","Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。","兩種不同病因之腦病變分別編 G93.41 + G92.8（+藥物不良反應碼）。"],"e":"正解：自發性顱內低壓併 CSF 廔編 G96.811 + G96.08。 應使用：G96.811（自發性顱內低壓）+ G96.08（其他顱腦脊髓液漏=CSF 廔）。 實務：CSF fistula 索引至 G96.08；G96.0 指示 code also 顱內低壓。 （來源：AHA Coding Clinic 2024年第3季「腦脊髓液廔所致自發性顱內低壓」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-08:a","q":"【AHA Coding Clinic 2024年第3季｜神經根動脈瘤夾置放（治 CSF 廔）】\nT8-T9 椎板切除修補 CSF 廔，電燒廔管靜脈並於神經根置 2 枚動脈瘤夾。\n依該季 Coding Clinic，應如何編碼？","o":["065Y0ZZ + 01580ZZ","01580ZZ","065Y0ZZ","065Y0ZZ + 06BF0ZZ"],"e":"正解：065Y0ZZ + 01580ZZ。065Y0ZZ（下腔靜脈 Destruction,開放=電燒廔管靜脈）+ 01580ZZ（胸神經 Destruction,開放=神經根夾閉） 重點：電燒廔管靜脈 + 神經根夾閉治 CSF 廔：065Y0ZZ + 01580ZZ。 實務：動脈瘤夾 off-label 用以抑制神經根功能→Destruction。 （來源：AHA Coding Clinic 2024年第3季「神經根動脈瘤夾置放（治 CSF 廔）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-08:d","q":"【AHA Coding Clinic 2024年第3季】\nT8-T9 椎板切除修補 CSF 廔，電燒廔管靜脈並於神經根置 2 枚動脈瘤夾。\n依該季 Coding Clinic，下列結論何者正確？","o":["電燒廔管靜脈 + 神經根夾閉治 CSF 廔：065Y0ZZ + 01580ZZ。","【更正】椎板切除為神經系統手術，術後硬膜外血腫應編 G97.61（非 G97.62）。","【更正】抽吸下葉分泌物應分別編右下葉 0B9F8ZZ + 左下葉 0B9J8ZZ，非雙側肺 0B9M8ZZ。","肛門廔管掛線（不含廔管切除）編 0D9Q70Z（Drainage）。"],"e":"正解：電燒廔管靜脈 + 神經根夾閉治 CSF 廔：065Y0ZZ + 01580ZZ。 應使用：065Y0ZZ（下腔靜脈 Destruction,開放=電燒廔管靜脈）+ 01580ZZ（胸神經 Destruction,開放=神經根夾閉）。 實務：動脈瘤夾 off-label 用以抑制神經根功能→Destruction。 （來源：AHA Coding Clinic 2024年第3季「神經根動脈瘤夾置放（治 CSF 廔）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-09:d","q":"【AHA Coding Clinic 2024年第3季】\n結腸造口還原併機器手臂直腸切除，術前膀胱鏡置輸尿管支架供術中視覺化。\n依該季 Coding Clinic，下列結論何者正確？","o":["腹部手術中為輸尿管視覺化置支架、術末移除→為主處置固有，不另編。","Norwood 手術中為顯露而切除胸腺,無獨立目的,不另編。","輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。"],"e":"正解：腹部手術中為輸尿管視覺化置支架、術末移除→為主處置固有，不另編。 應使用：不另編（無獨立目的，術末移除）。 不應使用：另編支架置入。 實務：純為視覺化且術末移除→整合於主處置。 （來源：AHA Coding Clinic 2024年第3季「為視覺化置放輸尿管導管」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-10:a","q":"【AHA Coding Clinic 2024年第3季｜因致命胎兒異常之選擇性終止妊娠】\n22週因致命胎兒異常(全前腦症)引產終止，陰道娩出活產，2 小時後死亡。\n依該季 Coding Clinic，應如何編碼？","o":["Z33.2 + O35.05X0 + Z37.0","O35.05X0 + Z37.0","Z33.2 + Z37.0","Z33.2 + O35.05X0"],"e":"正解：Z33.2 + O35.05X0 + Z37.0。Z33.2（選擇性終止妊娠就診）+ O35.05X0（胎兒 CNS 異常母體照護,全前腦症）+ Z37.0（單一活產） 重點：終止妊娠娩出活產(後死亡)：Z33.2 + O35.05X0 + Z37.0。 實務：依 I.C.15.q.1：嘗試終止妊娠娩出活產→Z33.2 + Z37 outcome 碼。對照 [[CC2024Q3-11 引產終止妊娠之墮胎藥給予]]。 （來源：AHA Coding Clinic 2024年第3季「因致命胎兒異常之選擇性終止妊娠」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-10:d","q":"【AHA Coding Clinic 2024年第3季】\n22週因致命胎兒異常(全前腦症)引產終止，陰道娩出活產，2 小時後死亡。\n依該季 Coding Clinic，下列結論何者正確？","o":["終止妊娠娩出活產(後死亡)：Z33.2 + O35.05X0 + Z37.0。","產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。","妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。","飢餓性酮酸中毒編 E87.29 + T73.0XXA。"],"e":"正解：終止妊娠娩出活產(後死亡)：Z33.2 + O35.05X0 + Z37.0。 應使用：Z33.2（選擇性終止妊娠就診）+ O35.05X0（胎兒 CNS 異常母體照護,全前腦症）+ Z37.0（單一活產）。 實務：依 I.C.15.q.1：嘗試終止妊娠娩出活產→Z33.2 + Z37 outcome 碼。對照 [[CC2024Q3-11 引產終止妊娠之墮胎藥給予]]。 （來源：AHA Coding Clinic 2024年第3季「因致命胎兒異常之選擇性終止妊娠」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-11:a","q":"【AHA Coding Clinic 2024年第3季｜引產終止妊娠之墮胎藥給予】\n承上，頰含墮胎藥引產終止妊娠。\n依該季 Coding Clinic，應如何編碼？","o":["10A07ZX","10D00Z1","009640Z","01580ZZ"],"e":"正解：10A07ZX。10A07ZX（妊娠物墮胎,墮胎藥,經自然孔） 重點：頰含墮胎藥引產終止妊娠編 10A07ZX。 實務：墮胎藥途徑含口服/陰道/直腸。 （來源：AHA Coding Clinic 2024年第3季「引產終止妊娠之墮胎藥給予」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-11:d","q":"【AHA Coding Clinic 2024年第3季】\n承上，頰含墮胎藥引產終止妊娠。\n依該季 Coding Clinic，下列結論何者正確？","o":["頰含墮胎藥引產終止妊娠編 10A07ZX。","選擇性終止妊娠術中子宮無力出血編 O04.6 + O35.10X0;非 O72.1、不併 Z33.2。","自體骨瓣吸收診斷 T86.838 + M95.2；移除 PCS 為 Removal 0NP007Z。","妊娠「慢性高血壓」= 既存高血壓，編 O10 系列；未特指型別→O10.91-。"],"e":"正解：頰含墮胎藥引產終止妊娠編 10A07ZX。 應使用：10A07ZX（妊娠物墮胎,墮胎藥,經自然孔）。 實務：墮胎藥途徑含口服/陰道/直腸。 （來源：AHA Coding Clinic 2024年第3季「引產終止妊娠之墮胎藥給予」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-12:a","q":"【AHA Coding Clinic 2024年第3季｜胎兒生長受限】\n38+4週因胎位不正與 FGR 排定初次剖腹。\n依該季 Coding Clinic，應如何編碼？","o":["O36.5930","O35.10X0","O32.8XX0","O35.05X0"],"e":"正解：O36.5930。O36.5930（其他已知/疑似胎兒生長不良母體照護,第三孕期） 重點：FGR 編 O36.5930（=IUGR）。 實務：FGR = fetal/intrauterine growth restriction。 （來源：AHA Coding Clinic 2024年第3季「胎兒生長受限」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-12:d","q":"【AHA Coding Clinic 2024年第3季】\n38+4週因胎位不正與 FGR 排定初次剖腹。\n依該季 Coding Clinic，下列結論何者正確？","o":["FGR 編 O36.5930（=IUGR）。","剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。","因前次肩難產病史排定剖腹、無現行併發症，編 O82 + Z87.59。","K. pneumoniae 敗血症源於 UTI，編 A41.59 + N39.0 + B96.1。"],"e":"正解：FGR 編 O36.5930（=IUGR）。 應使用：O36.5930（其他已知/疑似胎兒生長不良母體照護,第三孕期）。 實務：FGR = fetal/intrauterine growth restriction。 （來源：AHA Coding Clinic 2024年第3季「胎兒生長受限」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-13:d","q":"【AHA Coding Clinic 2024年第3季】\n記 polyneuropathy due to prediabetes。\n依該季 Coding Clinic，下列結論何者正確？","o":["前期糖尿病所致多發性神經病變編 G62.89 + R73.03；非 G63。","視神經病變與 DM 未由『with』推定→需 query;相關 E11.39+H46.9,無關 H46.9+E11.9。","『due to』不觸發 With 推定;需醫師記載連結。若明載則編 D64.81。","自發性顱內低壓併 CSF 廔編 G96.811 + G96.08。"],"e":"正解：前期糖尿病所致多發性神經病變編 G62.89 + R73.03；非 G63。 應使用：G62.89（其他特指多發性神經病變）+ R73.03（前期糖尿病）。 不應使用：G63（manifestation 碼，前期糖尿病屬第18章不適用）。 編碼順序：R73.03 為潛在病因。 實務：G63 為 manifestation 碼須接潛在病；prediabetes 屬 Ch18 徵候→用 G62.89。 （來源：AHA Coding Clinic 2024年第3季「前期糖尿病與多發性神經病變」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-14:d","q":"【AHA Coding Clinic 2024年第3季】\n常規心血管檢查記 DM without complications，另有 CKD 3 期。\n依該季 Coding Clinic，下列結論何者正確？","o":["記『DM 無併發症』但有 CKD 3 期時 query；分類推定相關除非明載無關。","記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。","記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。","高輸出量迴腸造口須 query 病因(感染/營養不良/dumping/術後併發症)後編碼。"],"e":"正解：記『DM 無併發症』但有 CKD 3 期時 query；分類推定相關除非明載無關。 應使用：query 醫師；未澄清前不可逕以『無併發症』切斷 DM-CKD 連結。 不應使用：逕編 DM 無併發症。 編碼順序：先 query。 實務：ICD-10-CM 推定 DM 與 CKD 相關，除非明載無關。 （來源：AHA Coding Clinic 2024年第3季「糖尿病無併發症但有慢性腎臟病」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-15:d","q":"【AHA Coding Clinic 2024年第3季】\n健檢記 DM without complications，另有皮膚炎。\n依該季 Coding Clinic，下列結論何者正確？","o":["記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。","RSV 未載相關疾病時 query 醫師；ICD-10-CM 不分類「無相關病況之 RSV」。","視神經病變與 DM 未由『with』推定→需 query;相關 E11.39+H46.9,無關 H46.9+E11.9。"],"e":"正解：記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。 應使用：query 醫師以釐清皮膚炎是否與 DM 無關。 不應使用：逕依『with』連結。 編碼順序：先 query。 實務：推定相關除非明載無關；不確定時 query。 （來源：AHA Coding Clinic 2024年第3季「糖尿病無併發症但有皮膚炎」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-16:d","q":"【AHA Coding Clinic 2024年第3季】\n血培 Candida glabrata 陽性診斷念珠菌血症，靜脈抗黴菌治療。\n依該季 Coding Clinic，下列結論何者正確？","o":["念珠菌血症編 B37.7（念珠菌敗血症）。","體外切除肝腫瘤後自體再植：只編所行處置(切除)；非 Transplantation。","志賀氏菌（Shigella flexneri）結腸炎併敗血症，編 A41.59 + A03.1。","CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。"],"e":"正解：念珠菌血症編 B37.7（念珠菌敗血症）。 應使用：B37.7（念珠菌敗血症）。 實務：candida fungemia = 全身性念珠菌感染；索引 Candidiasis, systemic B37.7。 （來源：AHA Coding Clinic 2024年第3季「念珠菌血症」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-17:a","q":"【AHA Coding Clinic 2024年第3季｜塌陷性脊椎症候群併進行性青少年特發性側彎】\n20歲進行性胸椎 AIS 因塌陷性脊椎症候群行複雜重建。\n依該季 Coding Clinic，應如何編碼？","o":["M41.124","M47.817","M47.022","M41.125"],"e":"正解：M41.124。M41.124（青少年特發性側彎,胸段） 不應使用／不適用：另編塌陷性脊椎症候群。 重點：塌陷性脊椎症候群為側彎進展，只編 M41.124。 實務：collapsing spine syndrome 無獨立碼，為側彎之進展。 （來源：AHA Coding Clinic 2024年第3季「塌陷性脊椎症候群併進行性青少年特發性側彎」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-17:d","q":"【AHA Coding Clinic 2024年第3季】\n20歲進行性胸椎 AIS 因塌陷性脊椎症候群行複雜重建。\n依該季 Coding Clinic，下列結論何者正確？","o":["塌陷性脊椎症候群為側彎進展，只編 M41.124。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。","前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。","靜脈型胸廓出口症候群編 I87.1；非 G54.0。"],"e":"正解：塌陷性脊椎症候群為側彎進展，只編 M41.124。 應使用：M41.124（青少年特發性側彎,胸段）。 不應使用：另編塌陷性脊椎症候群。 實務：collapsing spine syndrome 無獨立碼，為側彎之進展。 （來源：AHA Coding Clinic 2024年第3季「塌陷性脊椎症候群併進行性青少年特發性側彎」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-18:a","q":"【AHA Coding Clinic 2024年第3季｜術後異位性骨化】\n髖表面置換轉全髖置換併切除左大腿肌肉異位骨化(術後發生)。\n依該季 Coding Clinic，應如何編碼？","o":["M61.552","M62.82","M62.462","M00.061"],"e":"正解：M61.552。M61.552（其他肌肉骨化,左大腿） 重點：術後異位性骨化編 M61.552；可 query 是否術後併發症。 實務：術後發生之肌肉骨化→other ossification of muscle；可 query 併發症碼。 （來源：AHA Coding Clinic 2024年第3季「術後異位性骨化」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-18:d","q":"【AHA Coding Clinic 2024年第3季】\n髖表面置換轉全髖置換併切除左大腿肌肉異位骨化(術後發生)。\n依該季 Coding Clinic，下列結論何者正確？","o":["術後異位性骨化編 M61.552；可 query 是否術後併發症。","黃韌帶肥厚須 query 是否為脊椎狹窄成分;若無關編 M24.28,若為成分只編狹窄。","自行拔除導尿管致血尿屬裝置所致出血(非術後併發症)，編 T83.83XA + R31.9。","記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。"],"e":"正解：術後異位性骨化編 M61.552；可 query 是否術後併發症。 應使用：M61.552（其他肌肉骨化,左大腿）。 實務：術後發生之肌肉骨化→other ossification of muscle；可 query 併發症碼。 （來源：AHA Coding Clinic 2024年第3季「術後異位性骨化」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-19:d","q":"【AHA Coding Clinic 2024年第3季】\n類固醇依賴型 MCD 併腎病症候群。\n依該季 Coding Clinic，下列結論何者正確？","o":["MCD 併腎病症候群編 N04.0；長期類固醇加 Z79.52。","旋轉性椎動脈症候群編 M47.022；另加中風史碼。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。","擬長期使用之降糖藥可編 Z79 系列（依藥物：口服 Z79.84、SGLT2 屬 Z79.899），與是否新開立無關。"],"e":"正解：MCD 併腎病症候群編 N04.0；長期類固醇加 Z79.52。 應使用：N04.0（腎病症候群併輕微腎絲球異常；含 minimal change lesion）+ Z79.52（長期全身性類固醇使用）。 實務：索引 Nephrosis, minimal change N04.0。 （來源：AHA Coding Clinic 2024年第3季「微小變化疾病併腎病症候群」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-20:d","q":"【AHA Coding Clinic 2024年第3季】\nAKI 併腎病性血尿/蛋白尿 due to MCD with ATN。\n依該季 Coding Clinic，下列結論何者正確？","o":["MCD 併 ATN 之 AKI 編 N17.0 + N04.0。","NG 管置放所致鼻出血(長期抗凝)編 J95.831 + R04.0 + Z79.01 + Y84.8。","SCD 併指炎編 D57.04(Hb-SS 併 dactylitis)+ 發燒 R50.81。","急性攝護腺炎併膀胱炎編 N41.3 + N41.0。"],"e":"正解：MCD 併 ATN 之 AKI 編 N17.0 + N04.0。 應使用：N17.0（急性腎衰竭併腎小管壞死）+ N04.0（腎病症候群併輕微腎絲球異常）。 實務：N04.0 含 minimal change lesion。 （來源：AHA Coding Clinic 2024年第3季「微小變化疾病併急性腎小管壞死」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-21:a","q":"【AHA Coding Clinic 2024年第3季｜乾性角結膜炎】\n雙眼乾性角結膜炎行 Prokera；索引預設 M35.0(Sjögren)之疑義。\n依該季 Coding Clinic，應如何編碼？","o":["H16.223","M35.0","H26.8","H46.9"],"e":"正解：H16.223。H16.223（乾性角結膜炎,非 Sjögren,雙側） 不應使用／不適用：M35.0-（Sjögren，無記載不用）。 編碼順序：有疑義 query。 重點：未載 Sjögren 之乾性角結膜炎編 H16.223；不用 M35.0-。 實務：乾性角結膜炎可為 Sjögren 表現；有疑義時 query。對照 [[CC2024Q3-21 乾性角結膜炎]] 與 2024 Q3 Prokera 案例一致。 （來源：AHA Coding Clinic 2024年第3季「乾性角結膜炎」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-22:a","q":"【AHA Coding Clinic 2024年第3季｜跌倒所致肋骨疼痛】\n跌倒後左胸痛與頭皮撕裂，記 rib pain due to fall。\n依該季 Coding Clinic，應如何編碼？","o":["R07.89","R07.81","R04.0","R04.2"],"e":"正解：R07.89。R07.89（其他胸痛） 不應使用／不適用：R07.81（胸膜痛/pleurodynia，為病毒性肌痛）。 重點：外傷性肋骨疼痛編 R07.89；非 R07.81（胸膜痛）。 實務：索引導向 R07.81 不符→用 R07.89。 （來源：AHA Coding Clinic 2024年第3季「跌倒所致肋骨疼痛」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-22:d","q":"【AHA Coding Clinic 2024年第3季】\n跌倒後左胸痛與頭皮撕裂，記 rib pain due to fall。\n依該季 Coding Clinic，下列結論何者正確？","o":["外傷性肋骨疼痛編 R07.89；非 R07.81（胸膜痛）。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","『due to』不觸發 With 推定;需醫師記載連結。若明載則編 D64.81。","Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。"],"e":"正解：外傷性肋骨疼痛編 R07.89；非 R07.81（胸膜痛）。 應使用：R07.89（其他胸痛）。 不應使用：R07.81（胸膜痛/pleurodynia，為病毒性肌痛）。 實務：索引導向 R07.81 不符→用 R07.89。 （來源：AHA Coding Clinic 2024年第3季「跌倒所致肋骨疼痛」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-23:a","q":"【AHA Coding Clinic 2024年第3季｜新膀胱成形】\n晚期膀胱癌行腹腔鏡根除性膀胱切除併原位新膀胱(55cm 小腸,保留血供)。\n依該季 Coding Clinic，應如何編碼？","o":["0DX84ZB","0D9Q70Z","0DB18ZZ","0DB80ZZ"],"e":"正解：0DX84ZB。0DX84ZB（小腸轉移至膀胱,經皮內視鏡） 重點：以連著血管之腸段成形新膀胱→Transfer，編 0DX84ZB。 實務：腸段仍連血供以取代膀胱功能→Transfer。 （來源：AHA Coding Clinic 2024年第3季「新膀胱成形」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-23:d","q":"【AHA Coding Clinic 2024年第3季】\n晚期膀胱癌行腹腔鏡根除性膀胱切除併原位新膀胱(55cm 小腸,保留血供)。\n依該季 Coding Clinic，下列結論何者正確？","o":["以連著血管之腸段成形新膀胱→Transfer，編 0DX84ZB。","肛門廔管掛線（不含廔管切除）編 0D9Q70Z（Drainage）。","FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。"],"e":"正解：以連著血管之腸段成形新膀胱→Transfer，編 0DX84ZB。 應使用：0DX84ZB（小腸轉移至膀胱,經皮內視鏡）。 實務：腸段仍連血供以取代膀胱功能→Transfer。 （來源：AHA Coding Clinic 2024年第3季「新膀胱成形」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-24:a","q":"【AHA Coding Clinic 2024年第3季｜二次小腸吻合併腸切開與修補】\n壞死小腸切除+暫時關腹，兩日後再探查行吻合，過程需再切除腸段。\n依該季 Coding Clinic，應如何編碼？","o":["0DB80ZZ","0DB18ZZ","0DBQ0ZZ","0DBE4ZZ"],"e":"正解：0DB80ZZ。0DB80ZZ（小腸切除,開放） 不應使用／不適用：另編吻合。 重點：計畫吻合但需先切除小腸→最終處置為 Excision，只編 0DB80ZZ(吻合為固有)。 實務：B3.1b：吻合為 tubular body part 之固有步驟不另編；因需再切除→Excision。 （來源：AHA Coding Clinic 2024年第3季「二次小腸吻合併腸切開與修補」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-24:d","q":"【AHA Coding Clinic 2024年第3季】\n壞死小腸切除+暫時關腹，兩日後再探查行吻合，過程需再切除腸段。\n依該季 Coding Clinic，下列結論何者正確？","o":["計畫吻合但需先切除小腸→最終處置為 Excision，只編 0DB80ZZ(吻合為固有)。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","改良式 Graham patch 修補胃穿孔編 0DQ60ZZ；網膜補強為附帶不另編。","本例 Zenker 憩室切除以 Excision：0DB18ZZ + 環咽肌切除 0KB44ZZ。"],"e":"正解：計畫吻合但需先切除小腸→最終處置為 Excision，只編 0DB80ZZ(吻合為固有)。 應使用：0DB80ZZ（小腸切除,開放）。 不應使用：另編吻合。 實務：B3.1b：吻合為 tubular body part 之固有步驟不另編；因需再切除→Excision。 （來源：AHA Coding Clinic 2024年第3季「二次小腸吻合併腸切開與修補」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-25:a","q":"【AHA Coding Clinic 2024年第3季｜俯臥經腰肌椎間融合】\n俯臥單一體位經側腹腔後腰肌 L3-L4 前腰椎椎間融合。\n依該季 Coding Clinic，應如何編碼？","o":["0SG00A0","0SGJ07Z","0SG10K1","0SGJ04Z"],"e":"正解：0SG00A0。0SG00A0（腰椎關節椎間融合器融合,前入路前柱,開放） 重點：PTP(XLIF 一型)L3-L4 前柱椎間融合編 0SG00A0。 實務：PTP 為 XLIF 一型→qualifier 0 前入路前柱。 （來源：AHA Coding Clinic 2024年第3季「俯臥經腰肌椎間融合」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-25:d","q":"【AHA Coding Clinic 2024年第3季】\n俯臥單一體位經側腹腔後腰肌 L3-L4 前腰椎椎間融合。\n依該季 Coding Clinic，下列結論何者正確？","o":["PTP(XLIF 一型)L3-L4 前柱椎間融合編 0SG00A0。","L2-L3 硬膜外脂肪增多症編 E88.2；並加編相關脊椎病變。","Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。","頰含墮胎藥引產終止妊娠編 10A07ZX。"],"e":"正解：PTP(XLIF 一型)L3-L4 前柱椎間融合編 0SG00A0。 應使用：0SG00A0（腰椎關節椎間融合器融合,前入路前柱,開放）。 實務：PTP 為 XLIF 一型→qualifier 0 前入路前柱。 （來源：AHA Coding Clinic 2024年第3季「俯臥經腰肌椎間融合」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-26:a","q":"【AHA Coding Clinic 2024年第3季｜Nuss 手術併纖維膠帶與冷凍消融】\n嚴重漏斗胸行雙側 Nuss + T3-T7 胸神經冷凍消融，pectus bar 以纖維膠帶穩定。\n依該季 Coding Clinic，應如何編碼？","o":["0PS004Z + 01584ZZ","01584ZZ","0PS004Z","0PS004Z + 0PH000Z"],"e":"正解：0PS004Z + 01584ZZ。0PS004Z（胸骨 reposition 併內固定,開放=Nuss）+ 01584ZZ（胸神經 Destruction,經皮內視鏡=冷凍消融） 不應使用／不適用：另編膠帶。 重點：Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。 實務：膠帶穩定 bar 為固有；冷凍消融為獨立目的另編。 （來源：AHA Coding Clinic 2024年第3季「Nuss 手術併纖維膠帶與冷凍消融」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-26:d","q":"【AHA Coding Clinic 2024年第3季】\n嚴重漏斗胸行雙側 Nuss + T3-T7 胸神經冷凍消融，pectus bar 以纖維膠帶穩定。\n依該季 Coding Clinic，下列結論何者正確？","o":["Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。","NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。","CABG 後胸骨剛性鋼板固定另編 0PH000Z。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。"],"e":"正解：Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。 應使用：0PS004Z（胸骨 reposition 併內固定,開放=Nuss）+ 01584ZZ（胸神經 Destruction,經皮內視鏡=冷凍消融）。 不應使用：另編膠帶。 實務：膠帶穩定 bar 為固有；冷凍消融為獨立目的另編。 （來源：AHA Coding Clinic 2024年第3季「Nuss 手術併纖維膠帶與冷凍消融」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-27:d","q":"【AHA Coding Clinic 2024年第3季】\n內視鏡鼻手術後於額竇置可溶性藥物釋放 mini stent。\n依該季 Coding Clinic，下列結論何者正確？","o":["可溶性藥物釋放支架目的為給藥；住院一般不編，如需可用 table 3E0 依藥物編。","NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。","輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。","記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。"],"e":"正解：可溶性藥物釋放支架目的為給藥；住院一般不編，如需可用 table 3E0 依藥物編。 應使用：（如需）3E0 Introduction，第6碼依所給藥物(如抗發炎)。 不應使用：逕以裝置置入編。 實務：支架目的為給藥→住院一般不編；如編以 3E0。 （來源：AHA Coding Clinic 2024年第3季「鼻竇可溶性藥物釋放支架置入」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-28:d","q":"【AHA Coding Clinic 2024年第3季】\n瓣中瓣 TAVR 新瓣受限，快速心室起搏行舊瓣破裂使新瓣完全展開。\n依該季 Coding Clinic，下列結論何者正確？","o":["瓣中瓣 TAVR 中破裂舊生物瓣為手術固有，不另編。","NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。","剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。","漿膜炎為克隆氏症固有表現，只編克隆氏症，不另編漿膜炎。"],"e":"正解：瓣中瓣 TAVR 中破裂舊生物瓣為手術固有，不另編。 應使用：不另編（破裂舊瓣為新瓣置放之固有）。 不應使用：另編瓣膜破裂。 實務：B3.1b：root operation 定義固有之組件不另編。 （來源：AHA Coding Clinic 2024年第3季「瓣中瓣 TAVR 中之生物瓣破裂」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q3-29:a","q":"【AHA Coding Clinic 2024年第3季｜氣切修整併 Bjork flap】\n氣切後呼吸困難併皮下氣腫，行氣切修整以 Bjork flap 縮短氣切道並換管。\n依該季 Coding Clinic，應如何編碼？","o":["0BS10ZZ + 0B21XFZ","0B21XFZ","0BS10ZZ","0BS10ZZ + 0B110D6"],"e":"正解：0BS10ZZ + 0B21XFZ。0BS10ZZ（氣管 reposition,開放=Bjork flap）+ 0B21XFZ（氣管氣切裝置更換,外部） 重點：Bjork flap 氣切修整編 0BS10ZZ + 氣切管更換 0B21XFZ。 實務：Bjork flap 使氣切道前移→Reposition；換管以 Change 編。 （來源：AHA Coding Clinic 2024年第3季「氣切修整併 Bjork flap」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q3-29:d","q":"【AHA Coding Clinic 2024年第3季】\n氣切後呼吸困難併皮下氣腫，行氣切修整以 Bjork flap 縮短氣切道並換管。\n依該季 Coding Clinic，下列結論何者正確？","o":["Bjork flap 氣切修整編 0BS10ZZ + 氣切管更換 0B21XFZ。","DIEP 皮瓣重建併 IMF 鄰近組織轉移(Ryan flap)為獨立目的,雙側各編 0HX5XZZ。","腹主+降胸主動脈剝離瓣開窗編 04Q03ZZ + 02QW3ZZ(Repair)。","環甲切開轉正式氣切編 0B110F4。"],"e":"正解：Bjork flap 氣切修整編 0BS10ZZ + 氣切管更換 0B21XFZ。 應使用：0BS10ZZ（氣管 reposition,開放=Bjork flap）+ 0B21XFZ（氣管氣切裝置更換,外部）。 實務：Bjork flap 使氣切道前移→Reposition；換管以 Change 編。 （來源：AHA Coding Clinic 2024年第3季「氣切修整併 Bjork flap」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-01:d","q":"【AHA Coding Clinic 2024年第4季】\n5歲健檢併接種疫苗，islet 自體抗體篩檢確認 stage 2 前症狀期 T1D。\n依該季 Coding Clinic，下列結論何者正確？","o":["兒童健檢確認 stage 2 前症狀期 T1D，主診 Z00.121 + E10.A2 + Z23。","未特指低血糖 + 分級：E16.2 + E16.A2（分級碼為次診斷）。","同時記錄第1型與第2型糖尿病（hybrid / double DM），E10 與 E11 互為 Excludes1 不可併編，改編 E13（其他特指糖尿病）。","糖尿病微量白蛋白尿編 E11.29 + R80.8。"],"e":"正解：兒童健檢確認 stage 2 前症狀期 T1D，主診 Z00.121 + E10.A2 + Z23。 應使用：Z00.121（健檢有異常發現）主診 + E10.A2（第1型糖尿病前症狀期,Stage 2）+ Z23（接種就診）。 編碼順序：Z00.121 為主診。 實務：E10.A- 為 FY2025 新碼；Stage 1=多抗體正常血糖、Stage 2=抗體併血糖異常。 （來源：AHA Coding Clinic 2024年第4季「第1型糖尿病前症狀期」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q4-02:a","q":"【AHA Coding Clinic 2024年第4季｜低血糖分級】\n癲癇發作、血糖<54mg/dL，診斷 level 2 低血糖。\n依該季 Coding Clinic，應如何編碼？","o":["E16.2 + E16.A2","E16.A2","E16.2","E11.69 + E16.A2"],"e":"正解：E16.2 + E16.A2。E16.2（低血糖,未特指）+ E16.A2（低血糖 level 2） 不應使用／不適用：以分級碼(E16.A-)為主診。 編碼順序：E16.2 先。 重點：未特指低血糖 + 分級：E16.2 + E16.A2（分級碼為次診斷）。 實務：E16.A- 為次診斷碼；E16.2 之 use additional code 指示併編。 （來源：AHA Coding Clinic 2024年第4季「低血糖分級」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-02:d","q":"【AHA Coding Clinic 2024年第4季】\n癲癇發作、血糖<54mg/dL，診斷 level 2 低血糖。\n依該季 Coding Clinic，下列結論何者正確？","o":["未特指低血糖 + 分級：E16.2 + E16.A2（分級碼為次診斷）。","同時記錄第1型與第2型糖尿病（hybrid / double DM），E10 與 E11 互為 Excludes1 不可併編，改編 E13（其他特指糖尿病）。","reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。","Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。"],"e":"正解：未特指低血糖 + 分級：E16.2 + E16.A2（分級碼為次診斷）。 應使用：E16.2（低血糖,未特指）+ E16.A2（低血糖 level 2）。 不應使用：以分級碼(E16.A-)為主診。 編碼順序：E16.2 先。 實務：E16.A- 為次診斷碼；E16.2 之 use additional code 指示併編。 （來源：AHA Coding Clinic 2024年第4季「低血糖分級」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-03:d","q":"【AHA Coding Clinic 2024年第4季】\n肝轉移神經內分泌腫瘤併嚴重腹瀉，TTE 診斷類癌心臟病。\n依該季 Coding Clinic，下列結論何者正確？","o":["類癌心臟病編新碼 E34.01。","成人 DIPNECH 編 J98.4。","發炎性乳癌(IBC)以新碼 C50.A- 編；放療就診主診 Z51.0。","SCLC 併神經內分泌特徵編 C7A.1。"],"e":"正解：類癌心臟病編新碼 E34.01。 應使用：E34.01（類癌心臟症候群）。 實務：E34.0 擴充：E34.00/E34.01/E34.09；CaHD 多見於肝轉移 NET。 （來源：AHA Coding Clinic 2024年第4季「類癌心臟病」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q4-04:a","q":"【AHA Coding Clinic 2024年第4季｜MC4R 路徑破壞所致肥胖】\nPrader-Willi 追蹤，記 class 2 obesity due to disruption of MC4R pathway。\n依該季 Coding Clinic，應如何編碼？","o":["Q87.11 + E88.82 + E66.812","E88.82 + E66.812","Q87.11 + E66.812","Q87.11 + E88.82"],"e":"正解：Q87.11 + E88.82 + E66.812。Q87.11（Prader-Willi 症候群）+ E88.82（MC4R 路徑破壞所致肥胖）+ E66.812（肥胖 class 2） 重點：Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。 實務：E88.82、E66.81- 為 FY2025 新碼。 （來源：AHA Coding Clinic 2024年第4季「MC4R 路徑破壞所致肥胖」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-04:d","q":"【AHA Coding Clinic 2024年第4季】\nPrader-Willi 追蹤，記 class 2 obesity due to disruption of MC4R pathway。\n依該季 Coding Clinic，下列結論何者正確？","o":["Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。","醫師記 class 3 肥胖（或同時記 morbid + class 3）→ 只編 E66.813，不編 E66.01。","前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。","輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。"],"e":"正解：Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。 應使用：Q87.11（Prader-Willi 症候群）+ E88.82（MC4R 路徑破壞所致肥胖）+ E66.812（肥胖 class 2）。 實務：E88.82、E66.81- 為 FY2025 新碼。 （來源：AHA Coding Clinic 2024年第4季「MC4R 路徑破壞所致肥胖」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q4-05:a","q":"【AHA Coding Clinic 2024年第4季｜飲食疾患—厭食症（依 BMI 判嚴重度）】\n41歲厭食症限制型 BMI 15.4。\n依該季 Coding Clinic，應如何編碼？","o":["F50.012","F50.83","F50.023","F02.80"],"e":"正解：F50.012。F50.012（厭食症,限制型,重度） 重點：厭食症限制型 BMI 15.4 → F50.012（severe）；不需醫師明寫『severe』。 實務：inclusion term(BMI 15.0-15.99=severe)支持編碼，不需明寫『severe』。 （來源：AHA Coding Clinic 2024年第4季「飲食疾患—厭食症（依 BMI 判嚴重度）」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-05:d","q":"【AHA Coding Clinic 2024年第4季】\n41歲厭食症限制型 BMI 15.4。\n依該季 Coding Clinic，下列結論何者正確？","o":["厭食症限制型 BMI 15.4 → F50.012（severe）；不需醫師明寫『severe』。","只編 active phase 產程停滯；胎位不正是否為併發症/阻塞需 query 醫師。","早產兒黃疸編 P59.0（分類推定黃疸與早產相關，不需醫師特別連結）。","重度憂鬱所致成人異食癖：F32.2 + F50.83。"],"e":"正解：厭食症限制型 BMI 15.4 → F50.012（severe）；不需醫師明寫『severe』。 應使用：F50.012（厭食症,限制型,重度）。 實務：inclusion term(BMI 15.0-15.99=severe)支持編碼，不需明寫『severe』。 （來源：AHA Coding Clinic 2024年第4季「飲食疾患—厭食症（依 BMI 判嚴重度）」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q4-06:a","q":"【AHA Coding Clinic 2024年第4季｜飲食疾患—厭食症】\n厭食症暴食/清除型，住院 BMI 波動 15.5/16.2/14.89。\n依該季 Coding Clinic，應如何編碼？","o":["F50.023 + Z68.1","Z68.1","F50.023","F50.023 + F50.012"],"e":"正解：F50.023 + Z68.1。F50.023（厭食症,暴食/清除型,extreme）+ Z68.1（BMI ≤19.9,成人） 重點：住院 BMI 波動時取最嚴重值：F50.023（extreme）+ Z68.1。 實務：波動時依住院期間最嚴重 BMI(依 inclusion term)編。 （來源：AHA Coding Clinic 2024年第4季「飲食疾患—厭食症」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-06:d","q":"【AHA Coding Clinic 2024年第4季】\n厭食症暴食/清除型，住院 BMI 波動 15.5/16.2/14.89。\n依該季 Coding Clinic，下列結論何者正確？","o":["住院 BMI 波動時取最嚴重值：F50.023（extreme）+ Z68.1。","未載 Sjögren 之乾性角結膜炎編 H16.223；不用 M35.0-。","前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。","重度憂鬱所致成人異食癖：F32.2 + F50.83。"],"e":"正解：住院 BMI 波動時取最嚴重值：F50.023（extreme）+ Z68.1。 應使用：F50.023（厭食症,暴食/清除型,extreme）+ Z68.1（BMI ≤19.9,成人）。 實務：波動時依住院期間最嚴重 BMI(依 inclusion term)編。 （來源：AHA Coding Clinic 2024年第4季「飲食疾患—厭食症」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q4-07:a","q":"【AHA Coding Clinic 2024年第4季｜成人異食癖】\n20歲食用紙板/紙，併低落情緒等，診斷異食癖續發於重度憂鬱(無精神病症狀)。\n依該季 Coding Clinic，應如何編碼？","o":["F32.2 + F50.83","F50.83","F32.2","F32.A + F50.83"],"e":"正解：F32.2 + F50.83。F32.2（重鬱症,單次,重度無精神病症狀）+ F50.83（成人 切除植入物重建併包膜攣縮，移除植入物後以 LAP 皮瓣(接深下腹壁動靜脈移植)重建。\n依該季 Coding Clinic，下列結論何者正確？","o":["雙側 LAP 皮瓣乳房重建 0HRV07B + 取血管(髂外動靜脈)各編。","DIEP 游離皮瓣失敗(不存活)編 T85.898A。","SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。","DIEP 皮瓣重建併 IMF 鄰近組織轉移(Ryan flap)為獨立目的,雙側各編 0HX5XZZ。"],"e":"正解：雙側 LAP 皮瓣乳房重建 0HRV07B + 取血管(髂外動靜脈)各編。 應使用：0HRV07B（雙側乳房置換,腰動脈穿通枝皮瓣,開放）+ 04BH0ZZ/04BJ0ZZ（右/左髂外動脈切除）+ 06BF0ZZ/06BG0ZZ（右/左髂外靜脈切除）。 實務：0HR 新增 qualifier B（LAP flap）為 FY2025 新增；取血管另編。 （來源：AHA Coding Clinic 2024年第4季「腰動脈穿通枝皮瓣乳房重建」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-16:d","q":"【AHA Coding Clinic 2024年第4季】\nCOVID-19 併呼衰以 Seraph 100 Microbind 過濾(右股靜脈導管)。\n依該季 Coding Clinic，下列結論何者正確？","o":["Seraph 100 血液病原體體外過濾編 XXA536A。","RSV 未載相關疾病時 query 醫師；ICD-10-CM 不分類「無相關病況之 RSV」。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。","胸罩肩帶壓溝 ICD-10-CM 未分類,不報告。"],"e":"正解：Seraph 100 血液病原體體外過濾編 XXA536A。 應使用：XXA536A（循環過濾,血液病原體,經皮,新技術 group 10）。 實務：XXA 表為 FY2025 新技術；Seraph 100 結合病原體降低血中負荷。 （來源：AHA Coding Clinic 2024年第4季「血液病原體體外過濾」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2024Q4-17:a","q":"【AHA Coding Clinic 2024年第4季｜Kerecis 魚皮移植】\n右拇趾壞死清創至伸拇長肌腱後置 Kerecis 魚皮移植。\n依該季 Coding Clinic，應如何編碼？","o":["0HRMXK3","0HRV07B","0HQ0XZZ","0HX5XZZ"],"e":"正解：0HRMXK3。0HRMXK3（右足皮膚置換,非自體組織替代物,全層,外部） 重點：Kerecis 魚皮移植編 0HRMXK3（非自體組織替代物）。 實務：生物來源移植物用 nonautologous tissue substitute；2024/10/1 Kerecis 加入 device key。 （來源：AHA Coding Clinic 2024年第4季「Kerecis 魚皮移植」）","s":"cc2024"},{"c":"ccconcept","id":"cc:CC2024Q4-17:d","q":"【AHA Coding Clinic 2024年第4季】\n右拇趾壞死清創至伸拇長肌腱後置 Kerecis 魚皮移植。\n依該季 Coding Clinic，下列結論何者正確？","o":["Kerecis 魚皮移植編 0HRMXK3（非自體組織替代物）。","reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。","本例 Zenker 憩室切除以 Excision：0DB18ZZ + 環咽肌切除 0KB44ZZ。","DIEP 皮瓣重建併 IMF 鄰近組織轉移(Ryan flap)為獨立目的,雙側各編 0HX5XZZ。"],"e":"正解：Kerecis 魚皮移植編 0HRMXK3（非自體組織替代物）。 應使用：0HRMXK3（右足皮膚置換,非自體組織替代物,全層,外部）。 實務：生物來源移植物用 nonautologous tissue substitute；2024/10/1 Kerecis 加入 device key。 （來源：AHA Coding Clinic 2024年第4季「Kerecis 魚皮移植」）","s":"cc2024"},{"c":"cccode","id":"cc:CC2025Q1-01:a","q":"【AHA Coding Clinic 2025年第1季｜機械性子宮頸成熟（引產）】\n40週妊娠糖尿病引產，以合成水凝膠擴張桿×5 行子宮頸成熟。\n依該季 Coding Clinic，應如何編碼？","o":["0U7C7DJ","0UPH0JZ","009640Z","01580ZZ"],"e":"正解：0U7C7DJ。0U7C7DJ（子宮頸擴張,腔內裝置,暫時,經自然孔）；root operation Dilation、qualifier J 不應使用／不適用：以 Introduction（如 Cervidil 荷爾蒙）編。 重點：以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。 實務：機械擴張（球囊/laminaria/桿）目的為機械擴張 → Dilation；產後不留置 → qualifier J 暫時。與荷爾蒙成熟劑（Cytotec/Cervidil）不同。 （來源：AHA Coding Clinic 2025年第1季「機械性子宮頸成熟（引產）」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-01:d","q":"【AHA Coding Clinic 2025年第1季】\n40週妊娠糖尿病引產，以合成水凝膠擴張桿×5 行子宮頸成熟。\n依該季 Coding Clinic，下列結論何者正確？","o":["以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。","手輔助腹腔鏡（GelPort）以入路值 4 經皮內視鏡 + qualifier G 手輔助編。","以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。"],"e":"正解：以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。 應使用：0U7C7DJ（子宮頸擴張,腔內裝置,暫時,經自然孔）；root operation Dilation、qualifier J。 不應使用：以 Introduction（如 Cervidil 荷爾蒙）編。 實務：機械擴張（球囊/laminaria/桿）目的為機械擴張 → Dilation；產後不留置 → qualifier J 暫時。與荷爾蒙成熟劑（Cytotec/Cervidil）不同。 （來源：AHA Coding Clinic 2025年第1季「機械性子宮頸成熟（引產）」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-02:d","q":"【AHA Coding Clinic 2025年第1季】\n難治復發性 VT 行非侵入性心臟 SBRT。\n依該季 Coding Clinic，下列結論何者正確？","o":["難治性室性心搏過速之心臟 SBRT（radio-ablation）編 D228DZZ。","輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。"],"e":"正解：難治性室性心搏過速之心臟 SBRT（radio-ablation）編 D228DZZ。 應使用：D228DZZ（傳導機轉立體定位其他光子放射手術）。 實務：新增 D22 表；心臟 SBRT 以高劑量放射針對產生異常電訊號之區域，導管電燒難及處之替代。 （來源：AHA Coding Clinic 2025年第1季「心臟立體定位放射治療」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-03:d","q":"【AHA Coding Clinic 2025年第1季】\n重度三尖瓣逆流，經股靜脈於 IVC/SVC 及右心房置入自膨生物瓣。\n依該季 Coding Clinic，下列結論何者正確？","o":["TricValve 雙腔靜脈瓣治療重度三尖瓣逆流，需三碼；取代 2023 Q4 p.58-59 建議。","FY2026 新增 02H body part M 心室中膈；CRT-D 三導線分別編右心室、心室中膈、右心房。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。","PHE(2023/5/11)後 COVID-19 篩檢續用 Z20.822；2023/10/1 起改 Z11.52。術前篩檢 Z01.812 主診 + Z20.822(後改 Z11.52)。"],"e":"正解：TricValve 雙腔靜脈瓣治療重度三尖瓣逆流，需三碼；取代 2023 Q4 p.58-59 建議。 應使用：X2H03R9（IVC 生物瓣置入,group9）+ X2H13R9（SVC 生物瓣置入,group9）+ X2U93YA（右心房 Supplement 異位生物瓣,group10）。 編碼順序：三碼並用。 實務：新增 X2U 右心房 device Y；此建議取代 Coding Clinic 2023 Q4 p.58-59。 （來源：AHA Coding Clinic 2025年第1季「異位雙腔靜脈瓣置入」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-04:d","q":"【AHA Coding Clinic 2025年第1季】\n成人多重慢性病追蹤，記 class 3 肥胖；另一情境同時記 morbid obesity 與 class 3。\n依該季 Coding Clinic，下列結論何者正確？","o":["醫師記 class 3 肥胖（或同時記 morbid + class 3）→ 只編 E66.813，不編 E66.01。","慢性 GVHD 所致周邊神經病變編 T86.09 + D89.811 + G63。","Pott 膨脹瘤(額竇骨髓炎)→M86.8X81(顏面及鼻竇其他骨髓炎),該碼含 Pott puffy tumor 之 inclusion term。","減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。"],"e":"正解：醫師記 class 3 肥胖（或同時記 morbid + class 3）→ 只編 E66.813，不編 E66.01。 應使用：E66.813（肥胖,class 3）+ 加編 BMI（若知）。 不應使用：E66.01（morbid obesity due to excess calories，已特指 class 3 時不用）。 實務：class 3 較 morbid 更特定；兩者並存只編 class 3（呼應 FY2025 指引第4章）。 （來源：AHA Coding Clinic 2025年第1季「肥胖分級」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-05:d","q":"【AHA Coding Clinic 2025年第1季】\n16週 IUFD，20週行抽吸擴刮術後出血性休克；O02 無流產併發症碼之疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["過期流產 D&C 後出血性休克，主診 O02.1 + O04.6 + O04.81。","減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。","糜爛性食道炎併出血編 K22.11。","大麻劇吐症候群編新碼 R11.16 為主診；併低血鉀 E87.6。"],"e":"正解：過期流產 D&C 後出血性休克，主診 O02.1 + O04.6 + O04.81。 應使用：O02.1（過期流產）主診 + O04.6（終止妊娠後延遲/過度出血）+ O04.81（終止妊娠後休克）。 不應使用：O03（自然流產,不含過期流產）；O08（僅限異位/葡萄胎）。 編碼順序：O02.1 為主診。 實務：過期流產併發症借用 O04 系列；與 2019 Q3 p.11-12 一致。 （來源：AHA Coding Clinic 2025年第1季「過期流產併出血性休克」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-06:a","q":"【AHA Coding Clinic 2025年第1季｜二尖瓣逆流併生物性主動脈瓣狹窄】\n生物性主動脈瓣置換後入院，診斷生物瓣心內膜炎、中度生物性主動脈瓣狹窄、中度二尖瓣逆流。\n依該季 Coding Clinic，應如何編碼？","o":["I33.0 + T82.6XXA + T82.857A + I34.0","I08.0 + T82.6XXA + T82.857A + I34.0","T82.6XXA + T82.857A + I34.0","I33.0 + T82.857A + I34.0"],"e":"正解：I33.0 + T82.6XXA + T82.857A + I34.0。I33.0（急性/亞急性感染性心內膜炎）主診 + T82.6XXA（心臟瓣膜義器感染,初診）+ T82.857A（其他心臟義器狹窄,初診）+ I34.0（非風濕性二尖瓣閉鎖不全） 不應使用／不適用：I08.0（風濕性多瓣膜病）——義瓣狹窄屬裝置併發症非瓣膜病。 編碼順序：I33.0 為主診。 重點：生物瓣心內膜炎+生物性主動脈瓣狹窄(裝置併發症)+二尖瓣逆流；不編 I08 多瓣膜病。 實務：義瓣狹窄=裝置併發症(T82.857A)，非瓣膜疾病，故不歸 I08。 （來源：AHA Coding Clinic 2025年第1季「二尖瓣逆流併生物性主動脈瓣狹窄」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-06:d","q":"【AHA Coding Clinic 2025年第1季】\n生物性主動脈瓣置換後入院，診斷生物瓣心內膜炎、中度生物性主動脈瓣狹窄、中度二尖瓣逆流。\n依該季 Coding Clinic，下列結論何者正確？","o":["生物瓣心內膜炎+生物性主動脈瓣狹窄(裝置併發症)+二尖瓣逆流；不編 I08 多瓣膜病。","腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。","脊椎按摩所致椎動脈剝離併腦梗塞編術後併發症碼組合；不用外傷碼。","TricValve 雙腔靜脈瓣治療重度三尖瓣逆流，需三碼；取代 2023 Q4 p.58-59 建議。"],"e":"正解：生物瓣心內膜炎+生物性主動脈瓣狹窄(裝置併發症)+二尖瓣逆流；不編 I08 多瓣膜病。 應使用：I33.0（急性/亞急性感染性心內膜炎）主診 + T82.6XXA（心臟瓣膜義器感染,初診）+ T82.857A（其他心臟義器狹窄,初診）+ I34.0（非風濕性二尖瓣閉鎖不全）。 不應使用：I08.0（風濕性多瓣膜病）——義瓣狹窄屬裝置併發症非瓣膜病。 編碼順序：I33.0 為主診。 實務：義瓣狹窄=裝置併發症(T82.857A)，非瓣膜疾病，故不歸 I08。 （來源：AHA Coding Clinic 2025年第1季「二尖瓣逆流併生物性主動脈瓣狹窄」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-07:d","q":"【AHA Coding Clinic 2025年第1季】\n多支 CAD、RCA 多個重疊阻塞支架併明顯 neoatherosclerosis，NSTEMI 行氣球擴張。\n依該季 Coding Clinic，下列結論何者正確？","o":["支架內新生動脈粥狀硬化致 NSTEMI，主診 I21.4 + T82.855A + I25 系列。","CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。","【更正】vein graft 狹窄+血栓致 NSTEMI 編 T82.857A + T82.867A + I21.A9。","ACL 重建後 cyclops 病灶（關節纖維化）編 T84.82XA + M24.662。"],"e":"正解：支架內新生動脈粥狀硬化致 NSTEMI，主診 I21.4 + T82.855A + I25 系列。 應使用：I21.4（NSTEMI）主診 + T82.855A（冠狀動脈支架狹窄,初診）+ I25.-（慢性缺血性心臟病）。 編碼順序：I21.4 為主診。 實務：支架阻塞併 neoatherosclerosis 以 T82.855A 表達裝置狹窄。 （來源：AHA Coding Clinic 2025年第1季「冠狀動脈支架新生動脈粥狀硬化」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-08:d","q":"【AHA Coding Clinic 2025年第1季】\n草綠色鏈球菌菌血症併移植主動脈瓣心內膜炎；已編 T82.6XXA、I33.0、B95.4。\n依該季 Coding Clinic，下列結論何者正確？","o":["已確立義瓣心內膜炎，菌血症為其症狀，不另編 R78.81。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","BAV 併主動脈瓣狹窄：I35.0 + Q23.81。","舊槍傷處膕窩筋膜下深部膿瘍：診斷 M72.8 + S81.031S + X95.9XXS；I&D 編 0Y9F0ZZ。"],"e":"正解：已確立義瓣心內膜炎，菌血症為其症狀，不另編 R78.81。 應使用：T82.6XXA + I33.0 + B95.4（維持）。 不應使用：R78.81（菌血症）——為心內膜炎之症狀，不另編。 實務：已有確定診斷(心內膜炎)時，菌血症為症狀不另編。 （來源：AHA Coding Clinic 2025年第1季「義瓣心內膜炎併菌血症」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-09:a","q":"【AHA Coding Clinic 2025年第1季｜剖腹產子宮切口延伸併子宮裂傷】\n前次剖腹史，重複剖腹產經低橫切口娩出；術中子宮下段薄、切口延伸併子宮裂傷(疑左子宮動脈)並縫合。\n依該季 Coding Clinic，應如何編碼？","o":["O75.4 + O71.81","O71.81","O75.4","O02.1 + O71.81"],"e":"正解：O75.4 + O71.81。O75.4（產科手術其他併發症）+ O71.81（子宮裂傷 NEC） 重點：剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。 實務：索引 Complication, obstetric, procedure, specified NEC → O75.4。 （來源：AHA Coding Clinic 2025年第1季「剖腹產子宮切口延伸併子宮裂傷」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-09:d","q":"【AHA Coding Clinic 2025年第1季】\n前次剖腹史，重複剖腹產經低橫切口娩出；術中子宮下段薄、切口延伸併子宮裂傷(疑左子宮動脈)並縫合。\n依該季 Coding Clinic，下列結論何者正確？","o":["剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。","NASH 所致肝硬化編 K75.81 + K74.69（非 K74.60）。","溺水所致急性肺水腫編 J81.0（已知效應）+ 外因；不用 T75.1-。","刻意留置斷裂鑽頭尖(移除風險大於留置)編 Y65.4；非 T81.590A（意外留置）。"],"e":"正解：剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。 應使用：O75.4（產科手術其他併發症）+ O71.81（子宮裂傷 NEC）。 實務：索引 Complication, obstetric, procedure, specified NEC → O75.4。 （來源：AHA Coding Clinic 2025年第1季「剖腹產子宮切口延伸併子宮裂傷」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-10:a","q":"【AHA Coding Clinic 2025年第1季｜巴氏腺膿瘍併發分娩】\n重複剖腹產時引流並袋形縫合右巴氏腺大膿瘍。\n依該季 Coding Clinic，應如何編碼？","o":["O23.593","N75.1","O75.3","O20.8"],"e":"正解：O23.593。O23.593（妊娠其他部位生殖道感染,第三孕期） 不應使用／不適用：N75.1（巴氏腺膿瘍,Excludes1）；O75.3（產程其他感染）。 重點：分娩時發現巴氏腺膿瘍編 O23.593；因 Excludes1 不另編 N75.1，亦不用 O75.3。 實務：特指生殖道感染歸 O23.59-；無「in childbirth」選項時用當前孕期碼。 （來源：AHA Coding Clinic 2025年第1季「巴氏腺膿瘍併發分娩」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-10:d","q":"【AHA Coding Clinic 2025年第1季】\n重複剖腹產時引流並袋形縫合右巴氏腺大膿瘍。\n依該季 Coding Clinic，下列結論何者正確？","o":["分娩時發現巴氏腺膿瘍編 O23.593；因 Excludes1 不另編 N75.1，亦不用 O75.3。","術後腹內膿瘍編 T81.43XA + K65.1。","剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。","FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。"],"e":"正解：分娩時發現巴氏腺膿瘍編 O23.593；因 Excludes1 不另編 N75.1，亦不用 O75.3。 應使用：O23.593（妊娠其他部位生殖道感染,第三孕期）。 不應使用：N75.1（巴氏腺膿瘍,Excludes1）；O75.3（產程其他感染）。 實務：特指生殖道感染歸 O23.59-；無「in childbirth」選項時用當前孕期碼。 （來源：AHA Coding Clinic 2025年第1季「巴氏腺膿瘍併發分娩」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-11:a","q":"【AHA Coding Clinic 2025年第1季｜新生兒臀位產】\n臀位剖腹娩出，新生兒檢查無髖異常，但安排產後6週髖超音波。\n依該季 Coding Clinic，應如何編碼？","o":["P01.7","P02.5","P28.9","P59.0"],"e":"正解：P01.7。P01.7（產前胎位不正影響新生兒） 重點：因臀位剖腹娩出之新生兒編 P01.7（臀位嬰兒髖問題風險增加）。 實務：臀位嬰兒髖問題風險增加，需後續評估始能排除。 （來源：AHA Coding Clinic 2025年第1季「新生兒臀位產」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-11:d","q":"【AHA Coding Clinic 2025年第1季】\n臀位剖腹娩出，新生兒檢查無髖異常，但安排產後6週髖超音波。\n依該季 Coding Clinic，下列結論何者正確？","o":["因臀位剖腹娩出之新生兒編 P01.7（臀位嬰兒髖問題風險增加）。","膠質母細胞瘤 sonodynamic 聚焦超音波燒灼 + SONALA-001 灌注，編 X053X4B + 3E033GN。","惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。","術後脂肪肺栓塞編 T81.718A + I26.96。"],"e":"正解：因臀位剖腹娩出之新生兒編 P01.7（臀位嬰兒髖問題風險增加）。 應使用：P01.7（產前胎位不正影響新生兒）。 實務：臀位嬰兒髖問題風險增加，需後續評估始能排除。 （來源：AHA Coding Clinic 2025年第1季「新生兒臀位產」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-12:a","q":"【AHA Coding Clinic 2025年第1季｜早產兒黃疸】\n23週早產危重新生兒黃疸，行光照治療並監測膽紅素。\n依該季 Coding Clinic，應如何編碼？","o":["P59.0","P01.7","P02.5","P28.9"],"e":"正解：P59.0。P59.0（與早產相關之新生兒黃疸） 重點：早產兒黃疸編 P59.0（分類推定黃疸與早產相關，不需醫師特別連結）。 實務：分類推定黃疸與早產之關係。 （來源：AHA Coding Clinic 2025年第1季「早產兒黃疸」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-12:d","q":"【AHA Coding Clinic 2025年第1季】\n23週早產危重新生兒黃疸，行光照治療並監測膽紅素。\n依該季 Coding Clinic，下列結論何者正確？","o":["早產兒黃疸編 P59.0（分類推定黃疸與早產相關，不需醫師特別連結）。","骨盆底協調不良編 K59.02（出口功能障礙型便秘）。","記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。","TricValve 雙腔靜脈瓣治療重度三尖瓣逆流，需三碼；取代 2023 Q4 p.58-59 建議。"],"e":"正解：早產兒黃疸編 P59.0（分類推定黃疸與早產相關，不需醫師特別連結）。 應使用：P59.0（與早產相關之新生兒黃疸）。 實務：分類推定黃疸與早產之關係。 （來源：AHA Coding Clinic 2025年第1季「早產兒黃疸」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-13:a","q":"【AHA Coding Clinic 2025年第1季｜鐮刀型貧血所致功能性無脾】\n5歲鐮刀型貧血急性腹痛，診斷脾隔離危象併功能性無脾。\n依該季 Coding Clinic，應如何編碼？","o":["D57.02 + D73.0","Q89.01 + D73.0","D73.0","D57.02"],"e":"正解：D57.02 + D73.0。D57.02（Hb-SS 併脾隔離）+ D73.0（脾功能低下） 不應使用／不適用：Q89.01（先天無脾）——功能性無脾為功能喪失但脾仍存在。 編碼順序：D57.02 先。 重點：鐮刀型貧血脾隔離危象併功能性無脾，編 D57.02 + D73.0；非 Q89.01。 實務：D73.0 含脾功能低下與脾萎縮；功能性無脾非脾缺如。 （來源：AHA Coding Clinic 2025年第1季「鐮刀型貧血所致功能性無脾」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-13:d","q":"【AHA Coding Clinic 2025年第1季】\n5歲鐮刀型貧血急性腹痛，診斷脾隔離危象併功能性無脾。\n依該季 Coding Clinic，下列結論何者正確？","o":["鐮刀型貧血脾隔離危象併功能性無脾，編 D57.02 + D73.0；非 Q89.01。","COVID-19 所致病毒性心肌炎編 U07.1 + B33.22（非 I40.0/I41）。","憩室炎穿孔所致骨盆/腹內膿瘍（非 PID、非腹膜炎）編 K65.1 + K57.20，不編 N73.3。","顱內海綿狀血管瘤（cavernoma）併皮質下出血，編 D18.02 + I61.0。"],"e":"正解：鐮刀型貧血脾隔離危象併功能性無脾，編 D57.02 + D73.0；非 Q89.01。 應使用：D57.02（Hb-SS 併脾隔離）+ D73.0（脾功能低下）。 不應使用：Q89.01（先天無脾）——功能性無脾為功能喪失但脾仍存在。 編碼順序：D57.02 先。 實務：D73.0 含脾功能低下與脾萎縮；功能性無脾非脾缺如。 （來源：AHA Coding Clinic 2025年第1季「鐮刀型貧血所致功能性無脾」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-14:a","q":"【AHA Coding Clinic 2025年第1季｜獨眼巨人病灶】\n左 ACL 重建後追蹤 MRI 見髁間窩前方大塊關節纖維化，診斷 cyclops 病灶。\n依該季 Coding Clinic，應如何編碼？","o":["T84.82XA + M24.662","M24.662","T84.82XA","T83.86XA + M24.662"],"e":"正解：T84.82XA + M24.662。T84.82XA（骨科義器/移植物纖維化,初診）+ M24.662（僵直,左膝） 編碼順序：T84.82XA 先。 重點：ACL 重建後 cyclops 病灶（關節纖維化）編 T84.82XA + M24.662。 實務：cyclops 病灶=arthrofibrosis，為 ACL 重建已知併發症；關節纖維化在 ICD-10-CM 歸僵直。 （來源：AHA Coding Clinic 2025年第1季「獨眼巨人病灶」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-14:d","q":"【AHA Coding Clinic 2025年第1季】\n左 ACL 重建後追蹤 MRI 見髁間窩前方大塊關節纖維化，診斷 cyclops 病灶。\n依該季 Coding Clinic，下列結論何者正確？","o":["ACL 重建後 cyclops 病灶（關節纖維化）編 T84.82XA + M24.662。","術後腹內膿瘍編 T81.43XA + K65.1。","CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。","置導尿管創傷攝護腺致血尿屬術後出血，編 N99.820 + Y84.6 + R31.0。"],"e":"正解：ACL 重建後 cyclops 病灶（關節纖維化）編 T84.82XA + M24.662。 應使用：T84.82XA（骨科義器/移植物纖維化,初診）+ M24.662（僵直,左膝）。 編碼順序：T84.82XA 先。 實務：cyclops 病灶=arthrofibrosis，為 ACL 重建已知併發症；關節纖維化在 ICD-10-CM 歸僵直。 （來源：AHA Coding Clinic 2025年第1季「獨眼巨人病灶」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-15:a","q":"【AHA Coding Clinic 2025年第1季｜脊椎硬膜外脂肪增多症】\nL2-L3 硬膜外脂肪增多症行手術切除。\n依該季 Coding Clinic，應如何編碼？","o":["E88.2","E87.6","E88.A","E88.811"],"e":"正解：E88.2。E88.2（脂肪增多症 NEC）+ 相關脊椎病變（如腰椎狹窄） 重點：L2-L3 硬膜外脂肪增多症編 E88.2；並加編相關脊椎病變。 實務：索引 Lipomatosis E88.2。 （來源：AHA Coding Clinic 2025年第1季「脊椎硬膜外脂肪增多症」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-15:d","q":"【AHA Coding Clinic 2025年第1季】\nL2-L3 硬膜外脂肪增多症行手術切除。\n依該季 Coding Clinic，下列結論何者正確？","o":["L2-L3 硬膜外脂肪增多症編 E88.2；並加編相關脊椎病變。","【更正】椎板切除為神經系統手術，術後硬膜外血腫應編 G97.61（非 G97.62）。","混合型高血脂併高膽固醇血症編 E78.2(已含高膽固醇)。","TAIRS 編 E88.811。"],"e":"正解：L2-L3 硬膜外脂肪增多症編 E88.2；並加編相關脊椎病變。 應使用：E88.2（脂肪增多症 NEC）+ 相關脊椎病變（如腰椎狹窄）。 實務：索引 Lipomatosis E88.2。 （來源：AHA Coding Clinic 2025年第1季「脊椎硬膜外脂肪增多症」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-16:a","q":"【AHA Coding Clinic 2025年第1季｜肝腎症候群併急性腎損傷】\nAKI 疑續發於 HRS，續發於肝轉移乳癌。\n依該季 Coding Clinic，應如何編碼？","o":["N17.8 + K76.7","K76.7","N17.8","N17.8 + N17.9"],"e":"正解：N17.8 + K76.7。N17.8（其他急性腎衰竭）+ K76.7（肝腎症候群） 重點：肝腎症候群併 AKI 兩碼並編 N17.8 + K76.7。 實務：N17 指示 code also underlying condition；N17-N19 對 HRS 有 Excludes2，故兩碼皆編；病因已知→N17.8。 （來源：AHA Coding Clinic 2025年第1季「肝腎症候群併急性腎損傷」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-16:d","q":"【AHA Coding Clinic 2025年第1季】\nAKI 疑續發於 HRS，續發於肝轉移乳癌。\n依該季 Coding Clinic，下列結論何者正確？","o":["肝腎症候群併 AKI 兩碼並編 N17.8 + K76.7。","AKI(POA)後院內發生 ATN(敗血症所致)，N17.0 之 POA 指標為「N」。","非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。","TAIRS 編 E88.811。"],"e":"正解：肝腎症候群併 AKI 兩碼並編 N17.8 + K76.7。 應使用：N17.8（其他急性腎衰竭）+ K76.7（肝腎症候群）。 實務：N17 指示 code also underlying condition；N17-N19 對 HRS 有 Excludes2，故兩碼皆編；病因已知→N17.8。 （來源：AHA Coding Clinic 2025年第1季「肝腎症候群併急性腎損傷」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-17:a","q":"【AHA Coding Clinic 2025年第1季｜副甲狀腺切除術犧牲喉神經致聲帶麻痺】\n復發副甲狀腺癌包覆喉返神經，切除中犧牲神經，術後聲帶麻痺。\n依該季 Coding Clinic，應如何編碼？","o":["J38.01","J39.8","J16.8","J43.9"],"e":"正解：J38.01。J38.01（單側聲帶及喉麻痺） 不應使用／不適用：術後併發症碼。 重點：切除副甲狀腺癌不可避免犧牲喉返神經致聲帶麻痺，編 J38.01，非術後併發症碼。 實務：神經無法與腫塊分離、犧牲為必要且為預期結果 → 非併發症。 （來源：AHA Coding Clinic 2025年第1季「副甲狀腺切除術犧牲喉神經致聲帶麻痺」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-17:d","q":"【AHA Coding Clinic 2025年第1季】\n復發副甲狀腺癌包覆喉返神經，切除中犧牲神經，術後聲帶麻痺。\n依該季 Coding Clinic，下列結論何者正確？","o":["切除副甲狀腺癌不可避免犧牲喉返神經致聲帶麻痺，編 J38.01，非術後併發症碼。","惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。","腦膜瘤放療後 SMART 症候群，編術後神經併發症 + 偏癱偏頭痛 + 局部癲癇 + 放療外因。","生化復發(PSA上升)攝護腺癌(前列腺切除後)編 C79.9 + R97.21 + Z90.79 + Z85.46。"],"e":"正解：切除副甲狀腺癌不可避免犧牲喉返神經致聲帶麻痺，編 J38.01，非術後併發症碼。 應使用：J38.01（單側聲帶及喉麻痺）。 不應使用：術後併發症碼。 實務：神經無法與腫塊分離、犧牲為必要且為預期結果 → 非併發症。 （來源：AHA Coding Clinic 2025年第1季「副甲狀腺切除術犧牲喉神經致聲帶麻痺」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-18:a","q":"【AHA Coding Clinic 2025年第1季｜剖腹取出死胎併修補子宮破裂】\n32週妊娠，中線剖腹發現子宮於前次切口處破裂、死胎與胎盤位於腹腔，取出並修補。\n依該季 Coding Clinic，應如何編碼？","o":["10D00Z1","10A07ZX","009640Z","01580ZZ"],"e":"正解：10D00Z1。10D00Z1（妊娠物取出,low,開放） 不應使用／不適用：另編子宮修補（縫合子宮為固有）。 重點：剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。 實務：取出死胎後縫合子宮為程序固有，不另編。 （來源：AHA Coding Clinic 2025年第1季「剖腹取出死胎併修補子宮破裂」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-18:d","q":"【AHA Coding Clinic 2025年第1季】\n32週妊娠，中線剖腹發現子宮於前次切口處破裂、死胎與胎盤位於腹腔，取出並修補。\n依該季 Coding Clinic，下列結論何者正確？","o":["剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。","CPB 中高血鉀以 Z-BUF 處理，為手術固有、不另編。","腹部手術中為輸尿管視覺化置支架、術末移除→為主處置固有，不另編。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。"],"e":"正解：剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。 應使用：10D00Z1（妊娠物取出,low,開放）。 不應使用：另編子宮修補（縫合子宮為固有）。 實務：取出死胎後縫合子宮為程序固有，不另編。 （來源：AHA Coding Clinic 2025年第1季「剖腹取出死胎併修補子宮破裂」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-19:a","q":"【AHA Coding Clinic 2025年第1季｜CAR-NK 細胞輸注】\n復發難治 DLBCL 行 CAR-NK 輸注（經 port-a-cath）。\n依該季 Coding Clinic，應如何編碼？","o":["3E043GC","3E00XGC","3E0Q3E0","3E0E3KZ"],"e":"正解：3E043GC。3E043GC（其他治療物質導入中央靜脈,經皮） 重點：CAR-NK 經 port-a-cath 中央靜脈輸注編 3E043GC。 實務：CAR-NK 為研究性療法（臍帶血 NK 細胞加 CAR）。 （來源：AHA Coding Clinic 2025年第1季「CAR-NK 細胞輸注」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-19:d","q":"【AHA Coding Clinic 2025年第1季】\n復發難治 DLBCL 行 CAR-NK 輸注（經 port-a-cath）。\n依該季 Coding Clinic，下列結論何者正確？","o":["CAR-NK 經 port-a-cath 中央靜脈輸注編 3E043GC。","FA-DLBCL(EBV 陽性)編 D47.Z9 + B27.09；與一般 DLBCL 不同。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","MCA 內幹細胞灌注編 table 3E0，body region Q（顱腔及腦）、經皮，依幹細胞種類選 qualifier。"],"e":"正解：CAR-NK 經 port-a-cath 中央靜脈輸注編 3E043GC。 應使用：3E043GC（其他治療物質導入中央靜脈,經皮）。 實務：CAR-NK 為研究性療法（臍帶血 NK 細胞加 CAR）。 （來源：AHA Coding Clinic 2025年第1季「CAR-NK 細胞輸注」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-20:a","q":"【AHA Coding Clinic 2025年第1季｜Mazor X 機器手臂導航輔助】\n脊椎側彎後路融合，Mazor X 機器手臂輔助 T5-T11 雙側椎弓螺釘。\n依該季 Coding Clinic，應如何編碼？","o":["8E0W0CZ","8E0W4CZ","009640Z","01580ZZ"],"e":"正解：8E0W0CZ。8E0W0CZ（軀幹區機器手臂輔助處置,開放） 編碼順序：融合主碼另編。 重點：後路脊椎融合以 Mazor X 機器手臂輔助置椎弓螺釘，加編 8E0W0CZ。 實務：機器手臂輔助以確保螺釘置放正確。 （來源：AHA Coding Clinic 2025年第1季「Mazor X 機器手臂導航輔助」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-20:d","q":"【AHA Coding Clinic 2025年第1季】\n脊椎側彎後路融合，Mazor X 機器手臂輔助 T5-T11 雙側椎弓螺釘。\n依該季 Coding Clinic，下列結論何者正確？","o":["後路脊椎融合以 Mazor X 機器手臂輔助置椎弓螺釘，加編 8E0W0CZ。","機器手臂結腸膀胱廔切除併膀胱前膿瘍引流：body part 取骨盆腔，編 0W9J4ZZ + 8E0W4CZ。","以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。","Hemospray + 止血夾各編：XW0G886 + 0W3P8ZZ。"],"e":"正解：後路脊椎融合以 Mazor X 機器手臂輔助置椎弓螺釘，加編 8E0W0CZ。 應使用：8E0W0CZ（軀幹區機器手臂輔助處置,開放）。 編碼順序：融合主碼另編。 實務：機器手臂輔助以確保螺釘置放正確。 （來源：AHA Coding Clinic 2025年第1季「Mazor X 機器手臂導航輔助」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-21:a","q":"【AHA Coding Clinic 2025年第1季｜遠端股骨軟骨肉瘤切除併人工關節重建】\n左遠端股骨軟骨肉瘤切除後以 Zimmer 節段系統重建、鉸鏈關節骨水泥固定於脛骨。\n依該季 Coding Clinic，應如何編碼？","o":["0QBC0ZZ + 0QRC0JZ + 0SRD0J9","0QRC0JZ + 0SRD0J9","0QBC0ZZ + 0SRD0J9","0QBC0ZZ + 0QRC0JZ"],"e":"正解：0QBC0ZZ + 0QRC0JZ + 0SRD0J9。0QBC0ZZ（左下股骨切除,開放）+ 0QRC0JZ（左下股骨合成替代物置換,開放）+ 0SRD0J9（左膝關節合成替代物置換,骨水泥,開放） 重點：遠端股骨軟骨肉瘤切除(獨立目的)+節段系統置換+鉸鏈膝關節置換，三碼。 實務：切除具移除腫瘤之獨立目的 → 另編 Excision（B3.18）。 （來源：AHA Coding Clinic 2025年第1季「遠端股骨軟骨肉瘤切除併人工關節重建」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-21:d","q":"【AHA Coding Clinic 2025年第1季】\n左遠端股骨軟骨肉瘤切除後以 Zimmer 節段系統重建、鉸鏈關節骨水泥固定於脛骨。\n依該季 Coding Clinic，下列結論何者正確？","o":["遠端股骨軟骨肉瘤切除(獨立目的)+節段系統置換+鉸鏈膝關節置換，三碼。","股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。","右 TKA 後義關節感染併敗血性關節炎（Staph. caprae），三碼並用。","於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。"],"e":"正解：遠端股骨軟骨肉瘤切除(獨立目的)+節段系統置換+鉸鏈膝關節置換，三碼。 應使用：0QBC0ZZ（左下股骨切除,開放）+ 0QRC0JZ（左下股骨合成替代物置換,開放）+ 0SRD0J9（左膝關節合成替代物置換,骨水泥,開放）。 實務：切除具移除腫瘤之獨立目的 → 另編 Excision（B3.18）。 （來源：AHA Coding Clinic 2025年第1季「遠端股骨軟骨肉瘤切除併人工關節重建」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-22:d","q":"【AHA Coding Clinic 2025年第1季】\n右膕窩舊槍傷後疼痛併膿性引流，診斷筋膜下深部感染；行 I&D。\n依該季 Coding Clinic，下列結論何者正確？","o":["舊槍傷處膕窩筋膜下深部膿瘍：診斷 M72.8 + S81.031S + X95.9XXS；I&D 編 0Y9F0ZZ。","NG 管置放所致鼻出血(長期抗凝)編 J95.831 + R04.0 + Z79.01 + Y84.8。","術後腹內膿瘍編 T81.43XA + K65.1。","剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。"],"e":"正解：舊槍傷處膕窩筋膜下深部膿瘍：診斷 M72.8 + S81.031S + X95.9XXS；I&D 編 0Y9F0ZZ。 應使用：M72.8（其他纖維母細胞疾患=筋膜膿瘍）+ S81.031S（右膝穿刺傷,後遺症）+ X95.9XXS（槍擊外因,後遺症）；PCS 0Y9F0ZZ（右膝區引流,開放）。 實務：索引 Abscess, fascia M72.8；膕窩→膝(knee)；術末放置引流不另編。 （來源：AHA Coding Clinic 2025年第1季「膕窩深部膿瘍併切開引流」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-23:d","q":"【AHA Coding Clinic 2025年第1季】\nCABG 中 CPB 出現高血鉀需 Z-BUF。\n依該季 Coding Clinic，下列結論何者正確？","o":["CPB 中高血鉀以 Z-BUF 處理，為手術固有、不另編。","腹部手術中為輸尿管視覺化置支架、術末移除→為主處置固有，不另編。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。"],"e":"正解：CPB 中高血鉀以 Z-BUF 處理，為手術固有、不另編。 應使用：不另編（Z-BUF 為支持手術之輔助處置）。 不應使用：Z-BUF 另編碼。 實務：純為支持手術之輔助處置不另編；超過濾用於容積管理/減少血液稀釋不良影響。 （來源：AHA Coding Clinic 2025年第1季「零平衡超過濾」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-24:a","q":"【AHA Coding Clinic 2025年第1季｜肩峰下氣球墊片置入】\n關節鏡修補巨大旋轉肌袖撕裂併脂肪萎縮，以可溶性氣球墊片(25cc 生理食鹽水)增補。\n依該季 Coding Clinic，應如何編碼？","o":["0MU24JZ","0MSN0ZZ","009640Z","01580ZZ"],"e":"正解：0MU24JZ。0MU24JZ（左肩滑囊與韌帶合成替代物增補,經皮內視鏡） 重點：巨大旋轉肌袖撕裂修補以可吸收肩峰下氣球墊片增補，編 0MU24JZ。 實務：氣球墊片緩衝關節、無縫合固定，可生物降解(約1年)。 （來源：AHA Coding Clinic 2025年第1季「肩峰下氣球墊片置入」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-24:d","q":"【AHA Coding Clinic 2025年第1季】\n關節鏡修補巨大旋轉肌袖撕裂併脂肪萎縮，以可溶性氣球墊片(25cc 生理食鹽水)增補。\n依該季 Coding Clinic，下列結論何者正確？","o":["巨大旋轉肌袖撕裂修補以可吸收肩峰下氣球墊片增補，編 0MU24JZ。","SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。","緊急環甲切開(置氣管內管)編 0CUS0JZ + 後續氣切 0B110F4。","MMA 顱骨成形替換切除之顱骨編 0NR00JZ（Replacement）。"],"e":"正解：巨大旋轉肌袖撕裂修補以可吸收肩峰下氣球墊片增補，編 0MU24JZ。 應使用：0MU24JZ（左肩滑囊與韌帶合成替代物增補,經皮內視鏡）。 實務：氣球墊片緩衝關節、無縫合固定，可生物降解(約1年)。 （來源：AHA Coding Clinic 2025年第1季「肩峰下氣球墊片置入」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-25:d","q":"【AHA Coding Clinic 2025年第1季】\n薦部第3期全層壓傷行 Veraflo NPWTi（Cleanse Choice 敷料），抽除感染/非活性物質。\n依該季 Coding Clinic，下列結論何者正確？","o":["薦部第3期壓傷 NPWTi 併灌洗清除非活性物質，編 F08G5YZ。","縫合胸壁傷口單獨行 NPWT 促癒合編 F08F5AZ。","Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。","志賀氏菌（Shigella flexneri）結腸炎併敗血症，編 A41.59 + A03.1。"],"e":"正解：薦部第3期壓傷 NPWTi 併灌洗清除非活性物質，編 F08G5YZ。 應使用：F08G5YZ（整形系統傷口管理-下背/下肢,其他設備）。 實務：NPWTi 於 NPWT 加上灌洗以增強療效。 （來源：AHA Coding Clinic 2025年第1季「Veraflo 負壓傷口治療併灌洗」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-26:d","q":"【AHA Coding Clinic 2025年第1季】\n16歲急性 COVID-19，診斷病毒性心肌炎 due to acute COVID-19。\n依該季 Coding Clinic，下列結論何者正確？","o":["COVID-19 所致病毒性心肌炎編 U07.1 + B33.22（非 I40.0/I41）。","鐳-223 治療所致全血球減少編 D61.811 + T50.995A；非 T50.8X5(診斷劑)。","憩室炎穿孔所致骨盆/腹內膿瘍（非 PID、非腹膜炎）編 K65.1 + K57.20，不編 N73.3。","SLE 所致急性心肌炎編 M32.19 + I40.8。"],"e":"正解：COVID-19 所致病毒性心肌炎編 U07.1 + B33.22（非 I40.0/I41）。 應使用：U07.1（COVID-19）+ B33.22（病毒性心肌炎）。 不應使用：I40.0（感染性心肌炎）、I41。 實務：B33.22 特指病毒所致；2025/4/1 索引新增 Myocarditis, virus, viral B33.22。 （來源：AHA Coding Clinic 2025年第1季「COVID-19 所致病毒性心肌炎」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-27:a","q":"【AHA Coding Clinic 2025年第1季｜糖尿病與靜脈功能不全】\n第2型 DM、靜脈功能不全與鬱滯性皮膚炎病史，入院左小腿鬱滯性潰瘍併蜂窩組織炎、水腫。\n依該季 Coding Clinic，應如何編碼？","o":["I87.2 + L97.929 + E11.9","L97.929 + E11.9","I87.2 + E11.9","I87.2 + L97.929"],"e":"正解：I87.2 + L97.929 + E11.9。I87.2（慢性周邊靜脈功能不全）+ L97.929（左小腿未特指部位非壓瘡慢性潰瘍,未特指嚴重度）+ E11.9（第2型DM無併發症） 不應使用／不適用：將靜脈功能不全連結為糖尿病周邊血管病變。 重點：靜脈功能不全非糖尿病周邊血管病變，不可假定相關；分別編碼。 實務：PVD 為動脈疾病；靜脈功能不全屬深靜脈、非 diabetic peripheral angiopathy，不假定相關。 （來源：AHA Coding Clinic 2025年第1季「糖尿病與靜脈功能不全」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-27:d","q":"【AHA Coding Clinic 2025年第1季】\n第2型 DM、靜脈功能不全與鬱滯性皮膚炎病史，入院左小腿鬱滯性潰瘍併蜂窩組織炎、水腫。\n依該季 Coding Clinic，下列結論何者正確？","o":["靜脈功能不全非糖尿病周邊血管病變，不可假定相關；分別編碼。","高血壓「續發於糖尿病」→ I12 遇 I15 Excludes1，只編 I15.2；併 DM 腎病與 CKD 分期。","脂性皮膚硬化症編 M79.3（脂膜炎）；無靜脈曲張不可用靜脈曲張碼。","記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。"],"e":"正解：靜脈功能不全非糖尿病周邊血管病變，不可假定相關；分別編碼。 應使用：I87.2（慢性周邊靜脈功能不全）+ L97.929（左小腿未特指部位非壓瘡慢性潰瘍,未特指嚴重度）+ E11.9（第2型DM無併發症）。 不應使用：將靜脈功能不全連結為糖尿病周邊血管病變。 實務：PVD 為動脈疾病；靜脈功能不全屬深靜脈、非 diabetic peripheral angiopathy，不假定相關。 （來源：AHA Coding Clinic 2025年第1季「糖尿病與靜脈功能不全」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q1-28:a","q":"【AHA Coding Clinic 2025年第1季｜氣管食道造廔併環咽肌切開及發聲義器置入】\n復發喉鱗癌全喉切除+頸清，重建行 TEP 併環咽肌切開，置 8mm 發聲義器。\n依該季 Coding Clinic，應如何編碼？","o":["0B110D6","0B110F4","0B21XFZ","0B9F8ZZ"],"e":"正解：0B110D6。0B110D6（氣管接食道 Bypass 併腔內裝置,開放） 不應使用／不適用：另編環咽肌切開。 重點：全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。 實務：myotomy 為手術一部分，不另編。 （來源：AHA Coding Clinic 2025年第1季「氣管食道造廔併環咽肌切開及發聲義器置入」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q1-28:d","q":"【AHA Coding Clinic 2025年第1季】\n復發喉鱗癌全喉切除+頸清，重建行 TEP 併環咽肌切開，置 8mm 發聲義器。\n依該季 Coding Clinic，下列結論何者正確？","o":["全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。","瓣中瓣 TAVR 中破裂舊生物瓣為手術固有，不另編。","緊急環甲切開(置氣管內管)編 0CUS0JZ + 後續氣切 0B110F4。"],"e":"正解：全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。 應使用：0B110D6（氣管接食道 Bypass 併腔內裝置,開放）。 不應使用：另編環咽肌切開。 實務：myotomy 為手術一部分，不另編。 （來源：AHA Coding Clinic 2025年第1季「氣管食道造廔併環咽肌切開及發聲義器置入」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-02:a","q":"【AHA Coding Clinic 2025年第2季｜加速性心室自身節律】\n心導管電燒後心悸，診斷 AIVR 而無 VT；索引 Rhythm, idioventricular→I44.2 之疑義。\n依該季 Coding Clinic，應如何編碼？","o":["I49.8","I44.2","I40.8","I46.2"],"e":"正解：I49.8。I49.8（其他特指心律不整） 不應使用／不適用：I44.2（完全性房室阻滯）。 重點：AIVR 編 I49.8；非 I44.2（idioventricular 索引導向不適用）。 實務：AIVR≠idioventricular rhythm；索引碼經 Tabular 驗證不符時須進一步查證。 （來源：AHA Coding Clinic 2025年第2季「加速性心室自身節律」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-03:a","q":"【AHA Coding Clinic 2025年第2季｜胃小凹化生】\n缺鐵性貧血行上消化道內視鏡，十二指腸球部糜爛切片，診斷慢性十二指腸炎併 GFM。\n依該季 Coding Clinic，應如何編碼？","o":["K29.80 + R89.7","R89.7","K29.80","K29.80 + K28.4"],"e":"正解：K29.80 + R89.7。K29.80（十二指腸炎,無出血）+ R89.7（其他器官檢體異常組織學發現） 重點：慢性十二指腸炎併 GFM 編 K29.80 + R89.7（GFM 為組織學發現無專碼）。 實務：GFM 為組織學發現，ICD-10-CM 無特定分類 → R89.7。 （來源：AHA Coding Clinic 2025年第2季「胃小凹化生」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-03:d","q":"【AHA Coding Clinic 2025年第2季】\n缺鐵性貧血行上消化道內視鏡，十二指腸球部糜爛切片，診斷慢性十二指腸炎併 GFM。\n依該季 Coding Clinic，下列結論何者正確？","o":["慢性十二指腸炎併 GFM 編 K29.80 + R89.7（GFM 為組織學發現無專碼）。","貧血與 GI 出血皆符合主診斷時任一可排序在前；若明載何者致入院則以其為主診。","妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。","長期使用 semaglutide/tirzepatide 編 Z79.899（現無 GLP-1 專碼）。"],"e":"正解：慢性十二指腸炎併 GFM 編 K29.80 + R89.7（GFM 為組織學發現無專碼）。 應使用：K29.80（十二指腸炎,無出血）+ R89.7（其他器官檢體異常組織學發現）。 實務：GFM 為組織學發現，ICD-10-CM 無特定分類 → R89.7。 （來源：AHA Coding Clinic 2025年第2季「胃小凹化生」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-04:a","q":"【AHA Coding Clinic 2025年第2季｜心臟整流術後急性舒張性心衰竭】\n心房顫動整流後，急性舒張性 CHF，醫師疑為整流所致。\n依該季 Coding Clinic，應如何編碼？","o":["I97.89 + I50.31","I50.31","I97.89","I97.88 + I50.31"],"e":"正解：I97.89 + I50.31。I97.89（循環系統其他術後併發症）+ I50.31（急性舒張性心衰竭） 編碼順序：I97.89 先。 重點：整流術後新發急性舒張性 CHF 編 I97.89 + I50.31。 實務：索引 Complication, postprocedural, specified NEC, circulatory I97.89。 （來源：AHA Coding Clinic 2025年第2季「心臟整流術後急性舒張性心衰竭」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-04:d","q":"【AHA Coding Clinic 2025年第2季】\n心房顫動整流後，急性舒張性 CHF，醫師疑為整流所致。\n依該季 Coding Clinic，下列結論何者正確？","o":["整流術後新發急性舒張性 CHF 編 I97.89 + I50.31。","心臟 AL 類澱粉沉積編 E85.81 + I43；併急性慢性舒張性心衰竭 I50.33。","MitraClip 經中膈穿刺後穿刺處雙向分流（後天心中膈缺損），編術中併發症 I97.88 + I51.0。","乙狀竇裂開編 I67.89 + M89.8X8 + H93.A1(搏動性耳鳴);表面重建 PCS 0NU50JZ。"],"e":"正解：整流術後新發急性舒張性 CHF 編 I97.89 + I50.31。 應使用：I97.89（循環系統其他術後併發症）+ I50.31（急性舒張性心衰竭）。 編碼順序：I97.89 先。 實務：索引 Complication, postprocedural, specified NEC, circulatory I97.89。 （來源：AHA Coding Clinic 2025年第2季「心臟整流術後急性舒張性心衰竭」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-05:a","q":"【AHA Coding Clinic 2025年第2季｜憩室炎、膀胱前膿瘍與結腸膀胱廔】\n73歲憩室炎併結腸膀胱廔與膀胱前(prevesical)膿瘍。\n依該季 Coding Clinic，應如何編碼？","o":["K57.20 + K68.19 + N32.1","K68.19 + N32.1","K57.20 + N32.1","K57.20 + K68.19"],"e":"正解：K57.20 + K68.19 + N32.1。K57.20（大腸憩室炎併穿孔及膿瘍,無出血）+ K68.19（其他腹膜後膿瘍）+ N32.1（膀胱腸廔） 重點：憩室炎併結腸膀胱廔與膀胱前膿瘍編 K57.20 + K68.19 + N32.1。 實務：索引 Abscess, extraperitoneal K68.19；Fistula, colovesical N32.1。 （來源：AHA Coding Clinic 2025年第2季「憩室炎、膀胱前膿瘍與結腸膀胱廔」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-05:d","q":"【AHA Coding Clinic 2025年第2季】\n73歲憩室炎併結腸膀胱廔與膀胱前(prevesical)膿瘍。\n依該季 Coding Clinic，下列結論何者正確？","o":["憩室炎併結腸膀胱廔與膀胱前膿瘍編 K57.20 + K68.19 + N32.1。","【釐清】XRG device R 用於「custom-made anatomically designed」病人專屬椎間融合器（如 Aprevo），非現成器。","K. pneumoniae 敗血症源於 UTI，編 A41.59 + N39.0 + B96.1。","EGJOO(蠕動障礙)編 K22.89 + K31.89；非真性阻塞不用 K22.2。"],"e":"正解：憩室炎併結腸膀胱廔與膀胱前膿瘍編 K57.20 + K68.19 + N32.1。 應使用：K57.20（大腸憩室炎併穿孔及膿瘍,無出血）+ K68.19（其他腹膜後膿瘍）+ N32.1（膀胱腸廔）。 實務：索引 Abscess, extraperitoneal K68.19；Fistula, colovesical N32.1。 （來源：AHA Coding Clinic 2025年第2季「憩室炎、膀胱前膿瘍與結腸膀胱廔」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-06:a","q":"【AHA Coding Clinic 2025年第2季｜膀胱前膿瘍引流】\n承上，機器手臂 takedown 結腸膀胱廔並引流膀胱前膿瘍。\n依該季 Coding Clinic，應如何編碼？","o":["0W9J4ZZ + 8E0W4CZ","8E0W4CZ","0W9J4ZZ","0W3P8ZZ + 8E0W4CZ"],"e":"正解：0W9J4ZZ + 8E0W4CZ。0W9J4ZZ（骨盆腔引流,經皮內視鏡）+ 8E0W4CZ（軀幹區機器手臂輔助,經皮內視鏡） 重點：機器手臂結腸膀胱廔切除併膀胱前膿瘍引流：body part 取骨盆腔，編 0W9J4ZZ + 8E0W4CZ。 實務：prevesical space 屬骨盆腹膜外最大潛在腔；索引 Drainage, Pelvic Cavity 0W9J。 （來源：AHA Coding Clinic 2025年第2季「膀胱前膿瘍引流」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-06:d","q":"【AHA Coding Clinic 2025年第2季】\n承上，機器手臂 takedown 結腸膀胱廔並引流膀胱前膿瘍。\n依該季 Coding Clinic，下列結論何者正確？","o":["機器手臂結腸膀胱廔切除併膀胱前膿瘍引流：body part 取骨盆腔，編 0W9J4ZZ + 8E0W4CZ。","FY2026 新增 0DD body part U 網膜、V 腸繫膜；超音波抽吸腸繫膜腫瘤減積編 Extraction。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。","憩室炎併結腸膀胱廔與膀胱前膿瘍編 K57.20 + K68.19 + N32.1。"],"e":"正解：機器手臂結腸膀胱廔切除併膀胱前膿瘍引流：body part 取骨盆腔，編 0W9J4ZZ + 8E0W4CZ。 應使用：0W9J4ZZ（骨盆腔引流,經皮內視鏡）+ 8E0W4CZ（軀幹區機器手臂輔助,經皮內視鏡）。 實務：prevesical space 屬骨盆腹膜外最大潛在腔；索引 Drainage, Pelvic Cavity 0W9J。 （來源：AHA Coding Clinic 2025年第2季「膀胱前膿瘍引流」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-07:a","q":"【AHA Coding Clinic 2025年第2季｜過度動態呼吸道塌陷】\n亞急性咳嗽發燒，支氣管鏡見全呼吸道明顯 EDAC。\n依該季 Coding Clinic，應如何編碼？","o":["J98.8","J96.21","J95.831","J98.4"],"e":"正解：J98.8。J98.8（其他特指呼吸道疾患） 重點：EDAC 編 J98.8（無特定索引條目）。 實務：EDAC 為呼氣時氣道塌陷(氣管肌纖維萎縮)。 （來源：AHA Coding Clinic 2025年第2季「過度動態呼吸道塌陷」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-07:d","q":"【AHA Coding Clinic 2025年第2季】\n亞急性咳嗽發燒，支氣管鏡見全呼吸道明顯 EDAC。\n依該季 Coding Clinic，下列結論何者正確？","o":["EDAC 編 J98.8（無特定索引條目）。","NG 管置放所致鼻出血(長期抗凝)編 J95.831 + R04.0 + Z79.01 + Y84.8。","副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。","肺鈣化肉芽腫編 J98.4（無纖維化記載時不編 J84.10）。"],"e":"正解：EDAC 編 J98.8（無特定索引條目）。 應使用：J98.8（其他特指呼吸道疾患）。 實務：EDAC 為呼氣時氣道塌陷(氣管肌纖維萎縮)。 （來源：AHA Coding Clinic 2025年第2季「過度動態呼吸道塌陷」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-08:a","q":"【AHA Coding Clinic 2025年第2季｜分期慢性腎功能損害】\n健檢記慢性腎功能損害 3a 期；能否逕編 CKD 3a 之疑義。\n依該季 Coding Clinic，應如何編碼？","o":["N18.31 + N28.89","N28.89","N18.31","N18.31 + N17.0POA"],"e":"正解：N18.31 + N28.89。確認 CKD → N18.31（CKD 3a 期）；僅腎損害 → N28.89（腎及輸尿管其他疾患） 不應使用／不適用：未經確認逕假定 CKD。 編碼順序：先 query。 重點：記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。 實務：醫師未明載 CKD 不可假定。 （來源：AHA Coding Clinic 2025年第2季「分期慢性腎功能損害」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-08:d","q":"【AHA Coding Clinic 2025年第2季】\n健檢記慢性腎功能損害 3a 期；能否逕編 CKD 3a 之疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。","記『DM 無併發症』但有 CKD 3 期時 query；分類推定相關除非明載無關。","僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。","【更正】第3期 CKD 應編 N18.30（非 N18.3）。"],"e":"正解：記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。 應使用：確認 CKD → N18.31（CKD 3a 期）；僅腎損害 → N28.89（腎及輸尿管其他疾患）。 不應使用：未經確認逕假定 CKD。 編碼順序：先 query。 實務：醫師未明載 CKD 不可假定。 （來源：AHA Coding Clinic 2025年第2季「分期慢性腎功能損害」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-09:a","q":"【AHA Coding Clinic 2025年第2季｜胃空腸吻合處穿孔】\nloop 胃繞道史，腹痛，吻合處臟器穿孔需手術修補。\n依該季 Coding Clinic，應如何編碼？","o":["K63.1","K65.1","K68.19","K6A.09"],"e":"正解：K63.1。K63.1（腸穿孔,非外傷性） 不應使用／不適用：逕報為胃繞道併發症（無醫師記載）。 重點：胃繞道後吻合處穿孔編 K63.1；無醫師記載不可逕當繞道併發症。 實務：與 2023 Q3 p.10-12 一致；併發症須醫師記載。 （來源：AHA Coding Clinic 2025年第2季「胃空腸吻合處穿孔」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-09:d","q":"【AHA Coding Clinic 2025年第2季】\nloop 胃繞道史，腹痛，吻合處臟器穿孔需手術修補。\n依該季 Coding Clinic，下列結論何者正確？","o":["胃繞道後吻合處穿孔編 K63.1；無醫師記載不可逕當繞道併發症。","吻合口腸套疊編 K56.1(非併發症)；Whipple 後無幽門不用 K31.1。","憩室炎穿孔所致骨盆/腹內膿瘍（非 PID、非腹膜炎）編 K65.1 + K57.20，不編 N73.3。","以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。"],"e":"正解：胃繞道後吻合處穿孔編 K63.1；無醫師記載不可逕當繞道併發症。 應使用：K63.1（腸穿孔,非外傷性）。 不應使用：逕報為胃繞道併發症（無醫師記載）。 實務：與 2023 Q3 p.10-12 一致；併發症須醫師記載。 （來源：AHA Coding Clinic 2025年第2季「胃空腸吻合處穿孔」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-10:a","q":"【AHA Coding Clinic 2025年第2季｜發炎性關節炎（未指部位/型別）】\n風濕科就診 inflammatory arthritis；能否用 M06.4 之疑義。\n依該季 Coding Clinic，應如何編碼？","o":["M13.80","M06.4","M13.89","M00.061"],"e":"正解：M13.80。M13.80（其他特指關節炎,未特指部位） 不應使用／不適用：M06.4（發炎性多關節病，除非醫師明載 polyarthritis/polyarthropathy）。 編碼順序：先 query。 重點：只記 inflammatory arthritis 未指部位/型別時 query；無資訊→M13.80，非 M06.4。 實務：與 [[CC2026Q2-05 膝關節軟骨軟化]] 類主題；M06.4 僅限明載多關節。 （來源：AHA Coding Clinic 2025年第2季「發炎性關節炎（未指部位/型別）」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-11:a","q":"【AHA Coding Clinic 2025年第2季｜多關節發炎性關節炎】\n健檢評估多關節發炎性關節炎；能否用 M06.4。\n依該季 Coding Clinic，應如何編碼？","o":["M13.89","M06.4","M13.80","M00.061"],"e":"正解：M13.89。M13.89（其他特指關節炎,多部位） 不應使用／不適用：M06.4（除非明載 polyarthritis/polyarthropathy）。 編碼順序：先 query。 重點：多關節發炎性關節炎未指特定關節/型別時 query；無資訊→M13.89，非 M06.4。 實務：提及多部位但未指特定關節 → 用 multiple sites 碼。 （來源：AHA Coding Clinic 2025年第2季「多關節發炎性關節炎」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-12:d","q":"【AHA Coding Clinic 2025年第2季】\n左髂骨骨折手術中鑽頭尖斷裂於骨內，醫師評估移除風險大於留置而留下。\n依該季 Coding Clinic，下列結論何者正確？","o":["刻意留置斷裂鑽頭尖(移除風險大於留置)編 Y65.4；非 T81.590A（意外留置）。","氣切還原後未自然閉合之氣管皮膚廔編 J39.8；非 T81.83。","小腸-橫結腸吻合口崩裂編 T81.320A；不另編身體系統併發症碼。","術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。"],"e":"正解：刻意留置斷裂鑽頭尖(移除風險大於留置)編 Y65.4；非 T81.590A（意外留置）。 應使用：Y65.4（未成功置入或移除其他管/器械）。 不應使用：T81.590A（意外留置異物）。 實務：刻意留置(風險考量)非意外留置；符合 NQF SRE 1D 之排除(microneedle/斷螺絲等)。 （來源：AHA Coding Clinic 2025年第2季「術中刻意留置之異物」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-13:a","q":"【AHA Coding Clinic 2025年第2季｜腎癌局部侵犯腎靜脈與腎竇】\n右腎腫塊行機器手臂根除性腎切除，病理示低分化癌侵犯腎靜脈與腎竇。\n依該季 Coding Clinic，應如何編碼？","o":["C64.1","C67.3","C67.2","C67.1"],"e":"正解：C64.1。C64.1（右腎惡性腫瘤,除腎盂） 不應使用／不適用：另編侵犯之附加碼。 重點：腎細胞癌侵犯腎靜脈/腎竇只編 C64.1；病理侵犯發現非轉移、不另編。 實務：住院不可逕由病理報告編碼(需醫師確認)；局部侵犯為侵襲性指標、非轉移部位。 （來源：AHA Coding Clinic 2025年第2季「腎癌局部侵犯腎靜脈與腎竇」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-13:d","q":"【AHA Coding Clinic 2025年第2季】\n右腎腫塊行機器手臂根除性腎切除，病理示低分化癌侵犯腎靜脈與腎竇。\n依該季 Coding Clinic，下列結論何者正確？","o":["腎細胞癌侵犯腎靜脈/腎竇只編 C64.1；病理侵犯發現非轉移、不另編。","靜脈型胸廓出口症候群編 I87.1；非 G54.0。","淋巴結無腫瘤時，淋巴血管侵犯不另編(為侵襲性指標非轉移)。","SCLC 併神經內分泌特徵編 C7A.1。"],"e":"正解：腎細胞癌侵犯腎靜脈/腎竇只編 C64.1；病理侵犯發現非轉移、不另編。 應使用：C64.1（右腎惡性腫瘤,除腎盂）。 不應使用：另編侵犯之附加碼。 實務：住院不可逕由病理報告編碼(需醫師確認)；局部侵犯為侵襲性指標、非轉移部位。 （來源：AHA Coding Clinic 2025年第2季「腎癌局部侵犯腎靜脈與腎竇」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-14:d","q":"【AHA Coding Clinic 2025年第2季】\n攝護腺癌根除+骨盆淋巴結廓清，病理示淋巴血管侵犯但淋巴結無腫瘤。\n依該季 Coding Clinic，下列結論何者正確？","o":["淋巴結無腫瘤時，淋巴血管侵犯不另編(為侵襲性指標非轉移)。","腋淋巴結切片/乳房腫瘤切除處術後血清腫編 M96.843。","腎細胞癌侵犯腎靜脈/腎竇只編 C64.1；病理侵犯發現非轉移、不另編。","急性攝護腺炎併膀胱炎編 N41.3 + N41.0。"],"e":"正解：淋巴結無腫瘤時，淋巴血管侵犯不另編(為侵襲性指標非轉移)。 應使用：不另編淋巴血管侵犯（攝護腺癌本體另依 C61 編）。 不應使用：為淋巴血管侵犯另編轉移碼。 實務：淋巴血管侵犯為侵襲性評估指標、非轉移部位。 （來源：AHA Coding Clinic 2025年第2季「攝護腺淋巴血管侵犯」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-15:d","q":"【AHA Coding Clinic 2025年第2季】\n左下腹痛，MRI 疑骨髓炎併恥骨聯合關節感染，切片陰性，診斷恥骨聯合骨炎。\n依該季 Coding Clinic，下列結論何者正確？","o":["恥骨聯合骨炎且病理排除骨髓炎編 M89.8X8；不可逕用 M86。","高乳酸血症 ≠ 酸中毒；未載酸中毒不可編 E87.20；query 後僅確認高乳酸 → R79.89。","脂性皮膚硬化症編 M79.3（脂膜炎）；無靜脈曲張不可用靜脈曲張碼。","TKA 中移除舊骨釘造成脛骨平台骨折(醫師記為併發症)編 M96.89 + Y83.8。"],"e":"正解：恥骨聯合骨炎且病理排除骨髓炎編 M89.8X8；不可逕用 M86。 應使用：M89.8X8（其他特指骨疾患,其他部位）。 不應使用：M86（骨髓炎，無醫師記載不可用）。 實務：索引 Osteitis→see also osteomyelitis，但無記載不可編 M86。 （來源：AHA Coding Clinic 2025年第2季「恥骨聯合骨炎（無骨髓炎）」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-16:a","q":"【AHA Coding Clinic 2025年第2季｜捐贈者淋巴球輸注（幹細胞 boost）】\n異體幹細胞移植後 ALL 未緩解，經 CVC 行非冷凍(allo/haplo/syngeneic)淋巴球輸注。\n依該季 Coding Clinic，應如何編碼？","o":["30243Q1","302A3H1","3E00XGC","3E023GC"],"e":"正解：30243Q1。30243Q1（非自體白血球輸血入中央靜脈,經皮） 重點：非冷凍捐贈者淋巴球(stem cell boost)經中央靜脈輸注編 30243Q1。 實務：DLI 輸注原捐贈者健康白血球作為 stem cell boost。 （來源：AHA Coding Clinic 2025年第2季「捐贈者淋巴球輸注（幹細胞 boost）」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-16:d","q":"【AHA Coding Clinic 2025年第2季】\n異體幹細胞移植後 ALL 未緩解，經 CVC 行非冷凍(allo/haplo/syngeneic)淋巴球輸注。\n依該季 Coding Clinic，下列結論何者正確？","o":["非冷凍捐贈者淋巴球(stem cell boost)經中央靜脈輸注編 30243Q1。","以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。","減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。","經骨內管路輸注非自體全血編 302A3H1。"],"e":"正解：非冷凍捐贈者淋巴球(stem cell boost)經中央靜脈輸注編 30243Q1。 應使用：30243Q1（非自體白血球輸血入中央靜脈,經皮）。 實務：DLI 輸注原捐贈者健康白血球作為 stem cell boost。 （來源：AHA Coding Clinic 2025年第2季「捐贈者淋巴球輸注（幹細胞 boost）」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-17:a","q":"【AHA Coding Clinic 2025年第2季｜腦肌血管融合術】\n9歲 Moyamoya，左側間接血管重建，顳肌作帶蒂血管化皮瓣覆蓋腦表。\n依該季 Coding Clinic，應如何編碼？","o":["0KX00ZZ","0KB44ZZ","0KPY0JZ","0KSQ0ZZ"],"e":"正解：0KX00ZZ。0KX00ZZ（頭部肌肉 Transfer,開放） 重點：以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。 實務：顳肌帶蒂移轉以取代/輔助功能 → 符合 Transfer 定義。 （來源：AHA Coding Clinic 2025年第2季「腦肌血管融合術」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-17:d","q":"【AHA Coding Clinic 2025年第2季】\n9歲 Moyamoya，左側間接血管重建，顳肌作帶蒂血管化皮瓣覆蓋腦表。\n依該季 Coding Clinic，下列結論何者正確？","o":["以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。","體外切除肝腫瘤後自體再植：只編所行處置(切除)；非 Transplantation。","皮膚櫻桃狀血管瘤(Campbell de Morgan spots)→D18.01(皮膚及皮下血管瘤)。","V-Y 肛門成形(皮瓣前移)為 Transfer 0HX9XZZ;黏膜外翻切除 0DBQ0ZZ。"],"e":"正解：以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。 應使用：0KX00ZZ（頭部肌肉 Transfer,開放）。 實務：顳肌帶蒂移轉以取代/輔助功能 → 符合 Transfer 定義。 （來源：AHA Coding Clinic 2025年第2季「腦肌血管融合術」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-18:a","q":"【AHA Coding Clinic 2025年第2季｜化療減敏】\n右卵巢癌併腹膜轉移，化療中兩次過敏，住院行化療減敏(遞增劑量)。\n依該季 Coding Clinic，應如何編碼？","o":["Z51.11 + C56.1 + C78.6 + Z51.6 + Z87.892 + Z88.8","C56.1 + C78.6 + Z51.6 + Z87.892 + Z88.8","Z51.11 + C78.6 + Z51.6 + Z87.892 + Z88.8","Z51.11 + C56.1 + Z51.6 + Z87.892 + Z88.8"],"e":"正解：Z51.11 + C56.1 + C78.6 + Z51.6 + Z87.892 + Z88.8。Z51.11（抗腫瘤化療就診）主診 + C56.1（右卵巢惡性腫瘤）+ C78.6（腹膜後/腹膜續發惡性）+ Z51.6（過敏原減敏）+ Z87.892（過敏性休克個人史）+ Z88.8（其他藥物過敏狀態） 不應使用／不適用：Z51.6 當主診。 編碼順序：Z51.11 為主診。 重點：化療減敏住院主診 Z51.11；另編腫瘤、減敏、過敏史等。 實務：化療減敏=遞增劑量誘導耐受；仍以化療就診 Z51.11 為主診。 （來源：AHA Coding Clinic 2025年第2季「化療減敏」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-18:d","q":"【AHA Coding Clinic 2025年第2季】\n右卵巢癌併腹膜轉移，化療中兩次過敏，住院行化療減敏(遞增劑量)。\n依該季 Coding Clinic，下列結論何者正確？","o":["化療減敏住院主診 Z51.11；另編腫瘤、減敏、過敏史等。","發炎性乳癌(IBC)以新碼 C50.A- 編；放療就診主診 Z51.0。","同時診斷原發與轉移時,原發為主診(除非治療僅針對轉移灶)。","卵巢漿液性交界性腫瘤須 query；惡性→C56.1，未定行為→D39.11。"],"e":"正解：化療減敏住院主診 Z51.11；另編腫瘤、減敏、過敏史等。 應使用：Z51.11（抗腫瘤化療就診）主診 + C56.1（右卵巢惡性腫瘤）+ C78.6（腹膜後/腹膜續發惡性）+ Z51.6（過敏原減敏）+ Z87.892（過敏性休克個人史）+ Z88.8（其他藥物過敏狀態）。 不應使用：Z51.6 當主診。 編碼順序：Z51.11 為主診。 實務：化療減敏=遞增劑量誘導耐受；仍以化療就診 Z51.11 為主診。 （來源：AHA Coding Clinic 2025年第2季「化療減敏」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-19:a","q":"【AHA Coding Clinic 2025年第2季｜環咽肌功能障礙】\n環咽肌功能障礙、進食後上食道痙攣、食物逆流，行 EGD 併球囊擴張。\n依該季 Coding Clinic，應如何編碼？","o":["K22.4","K29.80","K26.7","K28.4"],"e":"正解：K22.4。K22.4（食道運動異常） 重點：環咽肌功能障礙(上食道括約肌痙攣)編 K22.4。 實務：索引 Spasm, esophagus K22.4；環咽肌障礙=上食道括約肌障礙/痙攣。 （來源：AHA Coding Clinic 2025年第2季「環咽肌功能障礙」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-19:d","q":"【AHA Coding Clinic 2025年第2季】\n環咽肌功能障礙、進食後上食道痙攣、食物逆流，行 EGD 併球囊擴張。\n依該季 Coding Clinic，下列結論何者正確？","o":["環咽肌功能障礙(上食道括約肌痙攣)編 K22.4。","左腓腸肌馬蹄攣縮編 M62.462。","骨盆底協調不良編 K59.02（出口功能障礙型便秘）。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。"],"e":"正解：環咽肌功能障礙(上食道括約肌痙攣)編 K22.4。 應使用：K22.4（食道運動異常）。 實務：索引 Spasm, esophagus K22.4；環咽肌障礙=上食道括約肌障礙/痙攣。 （來源：AHA Coding Clinic 2025年第2季「環咽肌功能障礙」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-20:a","q":"【AHA Coding Clinic 2025年第2季｜妊娠慢性高血壓】\n產檢，妊娠併慢性高血壓經評估處理。\n依該季 Coding Clinic，應如何編碼？","o":["O10.91","O02.1","O03.4","O04.6"],"e":"正解：O10.91。O10.91-（未特指既存高血壓併發妊娠） 重點：妊娠「慢性高血壓」= 既存高血壓，編 O10 系列；未特指型別→O10.91-。 實務：慢性高血壓於妊娠等同 pre-existing hypertension。 （來源：AHA Coding Clinic 2025年第2季「妊娠慢性高血壓」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-20:d","q":"【AHA Coding Clinic 2025年第2季】\n產檢，妊娠併慢性高血壓經評估處理。\n依該季 Coding Clinic，下列結論何者正確？","o":["妊娠「慢性高血壓」= 既存高血壓，編 O10 系列；未特指型別→O10.91-。","選擇性終止妊娠術中子宮無力出血編 O04.6 ],"e":"正解：自行拔除導尿管致血尿屬裝置所致出血(非術後併發症)，編 T83.83XA + R31.9。 應使用：T83.83XA（泌尿生殖義器/植入物出血,初診）+ R31.9（血尿,未特指）。 不應使用：N99.820（術後出血，本例非）。 實務：為拔管造成之傷害出血、非術後併發症。對照 [[CC2025Q2-23 導尿管創傷所致血尿]]。 （來源：AHA Coding Clinic 2025年第2季「拔除導尿管所致血尿」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-25:a","q":"【AHA Coding Clinic 2025年第2季｜水蛭療法】\n右乳皮瓣靜脈鬱血，住院行全抗凝與水蛭療法。\n依該季 Coding Clinic，應如何編碼？","o":["3E00XGC","3E033GN","3E043GC","3E023GC"],"e":"正解：3E00XGC。3E00XGC（其他治療物質導入皮膚及黏膜,外部入路） 重點：皮瓣靜脈鬱血之水蛭療法編 3E00XGC。 實務：水蛭唾液含 hirudin 抗凝、局部血管擴張與麻醉，緩解靜脈鬱血。 （來源：AHA Coding Clinic 2025年第2季「水蛭療法」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-25:d","q":"【AHA Coding Clinic 2025年第2季】\n右乳皮瓣靜脈鬱血，住院行全抗凝與水蛭療法。\n依該季 Coding Clinic，下列結論何者正確？","o":["皮瓣靜脈鬱血之水蛭療法編 3E00XGC。","靛胭脂注射檢測 PROM 編 3E0E3KZ。","以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。","脂性皮膚硬化症編 M79.3（脂膜炎）；無靜脈曲張不可用靜脈曲張碼。"],"e":"正解：皮瓣靜脈鬱血之水蛭療法編 3E00XGC。 應使用：3E00XGC（其他治療物質導入皮膚及黏膜,外部入路）。 實務：水蛭唾液含 hirudin 抗凝、局部血管擴張與麻醉，緩解靜脈鬱血。 （來源：AHA Coding Clinic 2025年第2季「水蛭療法」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-26:a","q":"【AHA Coding Clinic 2025年第2季｜腰椎椎間融合翻修】\n前次腰椎融合硬體失效，L2-L3 椎間融合翻修：取出移位 cage 復位再置、換桿、T12-L4 後外側植骨融合。\n依該季 Coding Clinic，應如何編碼？","o":["0SW00AZ + 0RGA0K1 + 0SG10K1","0RGA0K1 + 0SG10K1","0SW00AZ + 0SG10K1","0SW00AZ + 0RGA0K1"],"e":"正解：0SW00AZ + 0RGA0K1 + 0SG10K1。0SW00AZ（腰椎關節椎間融合器 Revision,開放）+ 0RGA0K1（胸腰椎關節融合,非自體,後入路後柱,開放=T12-L1）+ 0SG10K1（2+腰椎關節融合,非自體,後入路後柱,開放=L1-L4） 重點：翻修移位椎間融合器並再融合：0SW00AZ + 0RGA0K1 + 0SG10K1。 實務：移位 cage 復位=Revision；新增融合節段另編 Fusion。 （來源：AHA Coding Clinic 2025年第2季「腰椎椎間融合翻修」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-26:d","q":"【AHA Coding Clinic 2025年第2季】\n前次腰椎融合硬體失效，L2-L3 椎間融合翻修：取出移位 cage 復位再置、換桿、T12-L4 後外側植骨融合。\n依該季 Coding Clinic，下列結論何者正確？","o":["翻修移位椎間融合器並再融合：0SW00AZ + 0RGA0K1 + 0SG10K1。","髕骨表面置換 + 脛側襯墊更換：0QUF0JZ + 0SPD09Z + 0SUW09Z。","頰含墮胎藥引產終止妊娠編 10A07ZX。","【釐清】XRG device R 用於「custom-made anatomically designed」病人專屬椎間融合器（如 Aprevo），非現成器。"],"e":"正解：翻修移位椎間融合器並再融合：0SW00AZ + 0RGA0K1 + 0SG10K1。 應使用：0SW00AZ（腰椎關節椎間融合器 Revision,開放）+ 0RGA0K1（胸腰椎關節融合,非自體,後入路後柱,開放=T12-L1）+ 0SG10K1（2+腰椎關節融合,非自體,後入路後柱,開放=L1-L4）。 實務：移位 cage 復位=Revision；新增融合節段另編 Fusion。 （來源：AHA Coding Clinic 2025年第2季「腰椎椎間融合翻修」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-27:a","q":"【AHA Coding Clinic 2025年第2季｜環甲切開術轉氣切】\n他院緊急 slash 環甲切開置氣管內管，轉院將其轉為氣切(Bjork flap)。\n依該季 Coding Clinic，應如何編碼？","o":["0B110F4","0B110D6","0B21XFZ","0B9F8ZZ"],"e":"正解：0B110F4。0B110F4（氣管接皮膚併氣切裝置,開放） 重點：環甲切開轉正式氣切編 0B110F4。 實務：轉為氣切以 Bypass trachea to cutaneous 編。對照 [[CC2025Q2-28 緊急環甲切開併轉氣切]]。 （來源：AHA Coding Clinic 2025年第2季「環甲切開術轉氣切」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-27:d","q":"【AHA Coding Clinic 2025年第2季】\n他院緊急 slash 環甲切開置氣管內管，轉院將其轉為氣切(Bjork flap)。\n依該季 Coding Clinic，下列結論何者正確？","o":["環甲切開轉正式氣切編 0B110F4。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","Bjork flap 氣切修整編 0BS10ZZ + 氣切管更換 0B21XFZ。"],"e":"正解：環甲切開轉正式氣切編 0B110F4。 應使用：0B110F4（氣管接皮膚併氣切裝置,開放）。 實務：轉為氣切以 Bypass trachea to cutaneous 編。對照 [[CC2025Q2-28 緊急環甲切開併轉氣切]]。 （來源：AHA Coding Clinic 2025年第2季「環甲切開術轉氣切」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-28:a","q":"【AHA Coding Clinic 2025年第2季｜緊急環甲切開併轉氣切】\n心臟停止無法插管，床邊緊急環甲切開置管，穩定後至手術室轉正式氣切。\n依該季 Coding Clinic，應如何編碼？","o":["0CUS0JZ + 0B110F4","0B110F4","0CUS0JZ","0CUS0JZ + 0CSS0ZZ"],"e":"正解：0CUS0JZ + 0B110F4。0CUS0JZ（喉 Supplement 合成替代物,開放=環甲切開併氣管內管）+ 0B110F4（氣管接皮膚併氣切裝置,開放） 重點：緊急環甲切開(置氣管內管)編 0CUS0JZ + 後續氣切 0B110F4。 實務：此組合與單純轉氣切(僅 0B110F4)不同：緊急環甲切開另編 0CUS0JZ。 （來源：AHA Coding Clinic 2025年第2季「緊急環甲切開併轉氣切」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-28:d","q":"【AHA Coding Clinic 2025年第2季】\n心臟停止無法插管，床邊緊急環甲切開置管，穩定後至手術室轉正式氣切。\n依該季 Coding Clinic，下列結論何者正確？","o":["緊急環甲切開(置氣管內管)編 0CUS0JZ + 後續氣切 0B110F4。","SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","到院前心臟停止但入院續照護，編 I46.2（非個人史 Z86.74）。"],"e":"正解：緊急環甲切開(置氣管內管)編 0CUS0JZ + 後續氣切 0B110F4。 應使用：0CUS0JZ（喉 Supplement 合成替代物,開放=環甲切開併氣管內管）+ 0B110F4（氣管接皮膚併氣切裝置,開放）。 實務：此組合與單純轉氣切(僅 0B110F4)不同：緊急環甲切開另編 0CUS0JZ。 （來源：AHA Coding Clinic 2025年第2季「緊急環甲切開併轉氣切」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-29:d","q":"【AHA Coding Clinic 2025年第2季】\n更正 2025 Q1 之 neoatherosclerosis 案例排序。\n依該季 Coding Clinic，下列結論何者正確？","o":["【更正】2025 Q1 排序錯誤：主診應為 T82.855A，I21.4 與 I25 為次診斷。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","PHE(2023/5/11)後 COVID-19 篩檢續用 Z20.822；2023/10/1 起改 Z11.52。術前篩檢 Z01.812 主診 + Z20.822(後改 Z11.52)。","椎體成形術後水泥肺栓塞：主診 S22.089A + J95.821 + T81.718A + I26.95。"],"e":"正解：【更正】2025 Q1 排序錯誤：主診應為 T82.855A，I21.4 與 I25 為次診斷。 應使用：T82.855A（冠狀動脈支架狹窄,初診）主診 + I21.4（NSTEMI）次 + I25.-（慢性缺血性心臟病）。 不應使用：以 I21.4 為主診（原錯誤）。 編碼順序：T82.855A 為主診。 實務：更正 [[CC2025Q1-07 冠狀動脈支架新生動脈粥狀硬化]] 之排序。 （來源：AHA Coding Clinic 2025年第2季「更正：冠狀動脈支架新生動脈粥狀硬化（排序）」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q2-30:a","q":"【AHA Coding Clinic 2025年第2季｜更正：椎板切除術後硬膜外血腫】\n更正 2024 Q3 之椎板切除術後硬膜外血腫編碼。\n依該季 Coding Clinic，應如何編碼？","o":["G97.61","G97.62","G93.89","G93.41"],"e":"正解：G97.61。G97.61（神經系統手術後之神經系統器官/構造血腫） 不應使用／不適用：G97.62（其他手術後，原錯誤）。 重點：【更正】椎板切除為神經系統手術，術後硬膜外血腫應編 G97.61（非 G97.62）。 實務：laminectomy 屬神經系統手術 → 用 G97.61。 （來源：AHA Coding Clinic 2025年第2季「更正：椎板切除術後硬膜外血腫」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q2-30:d","q":"【AHA Coding Clinic 2025年第2季】\n更正 2024 Q3 之椎板切除術後硬膜外血腫編碼。\n依該季 Coding Clinic，下列結論何者正確？","o":["【更正】椎板切除為神經系統手術，術後硬膜外血腫應編 G97.61（非 G97.62）。","【更正】妊娠合併慢性疼痛應編 O99.354（神經系統疾病），非 O99.892。","【更正】抽吸下葉分泌物應分別編右下葉 0B9F8ZZ + 左下葉 0B9J8ZZ，非雙側肺 0B9M8ZZ。","術中硬膜撕裂編 G97.41；有記載即應報告（含 inherent/inadvertent）。"],"e":"正解：【更正】椎板切除為神經系統手術，術後硬膜外血腫應編 G97.61（非 G97.62）。 應使用：G97.61（神經系統手術後之神經系統器官/構造血腫）。 不應使用：G97.62（其他手術後，原錯誤）。 實務：laminectomy 屬神經系統手術 → 用 G97.61。 （來源：AHA Coding Clinic 2025年第2季「更正：椎板切除術後硬膜外血腫」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-01:a","q":"【AHA Coding Clinic 2025年第3季｜高血脂併第2型糖尿病】\n診斷 hyperlipidemia associated with type 2 DM。\n依該季 Coding Clinic，應如何編碼？","o":["E11.69 + E78.49","E78.49","E11.69","E11.69 + E11.65"],"e":"正解：E11.69 + E78.49。E11.69（DM 併其他特指併發症）+ E78.49（其他高血脂） 重點：DM 相關高血脂編 E11.69 + E78.49（有因果連結）。 實務：「associated with/due to」支持因果；DM 相關高血脂為特定型高血脂→E78.49。索引 Hyperlipidemia, specified NEC E78.49。 （來源：AHA Coding Clinic 2025年第3季「高血脂併第2型糖尿病」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-01:d","q":"【AHA Coding Clinic 2025年第3季】\n診斷 hyperlipidemia associated with type 2 DM。\n依該季 Coding Clinic，下列結論何者正確？","o":["DM 相關高血脂編 E11.69 + E78.49（有因果連結）。","視神經病變與 DM 未由『with』推定→需 query;相關 E11.39+H46.9,無關 H46.9+E11.9。","失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。","「左側」下背痛編 M54.50（非 M54.59）；ICD-10-CM 依 type 而非 laterality 分類。"],"e":"正解：DM 相關高血脂編 E11.69 + E78.49（有因果連結）。 應使用：E11.69（DM 併其他特指併發症）+ E78.49（其他高血脂）。 實務：「associated with/due to」支持因果；DM 相關高血脂為特定型高血脂→E78.49。索引 Hyperlipidemia, specified NEC E78.49。 （來源：AHA Coding Clinic 2025年第3季「高血脂併第2型糖尿病」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-02:a","q":"【AHA Coding Clinic 2025年第3季｜糖尿病所致微量白蛋白尿】\n第2型 DM 追蹤，控制良好，記 microalbuminuria due to diabetes。\n依該季 Coding Clinic，應如何編碼？","o":["E11.29 + R80.8","R80.8","E11.29","E11.29 + E11.39"],"e":"正解：E11.29 + R80.8。E11.29（DM 併其他糖尿病腎併發症）+ R80.8（其他蛋白尿） 重點：糖尿病微量白蛋白尿編 E11.29 + R80.8。 實務：糖尿病微量白蛋白尿為腎併發症(E11.29)；蛋白尿以 R80.8 表達。 （來源：AHA Coding Clinic 2025年第3季「糖尿病所致微量白蛋白尿」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-02:d","q":"【AHA Coding Clinic 2025年第3季】\n第2型 DM 追蹤，控制良好，記 microalbuminuria due to diabetes。\n依該季 Coding Clinic，下列結論何者正確？","o":["糖尿病微量白蛋白尿編 E11.29 + R80.8。","前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。","DM 相關高血脂編 E11.69 + E78.49（有因果連結）。","既存 T2DM 因免疫治療惡化高血糖編 E11.65 + T45.1X5A；不併編 E10。"],"e":"正解：糖尿病微量白蛋白尿編 E11.29 + R80.8。 應使用：E11.29（DM 併其他糖尿病腎併發症）+ R80.8（其他蛋白尿）。 實務：糖尿病微量白蛋白尿為腎併發症(E11.29)；蛋白尿以 R80.8 表達。 （來源：AHA Coding Clinic 2025年第3季「糖尿病所致微量白蛋白尿」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-03:d","q":"【AHA Coding Clinic 2025年第3季】\n38+5週 SROM 併 Pitocin 加強，順產健康嬰兒。\n依該季 Coding Clinic，下列結論何者正確？","o":["產程中自然破水非可報告病況；除非記載早期/延遲破水，否則不編 SROM 碼。","『due to』不觸發 With 推定;需醫師記載連結。若明載則編 D64.81。","肺鈣化肉芽腫編 J98.4（無纖維化記載時不編 J84.10）。","只記 inflammatory arthritis 未指部位/型別時 query；無資訊→M13.80，非 M06.4。"],"e":"正解：產程中自然破水非可報告病況；除非記載早期/延遲破水，否則不編 SROM 碼。 應使用：不編 SROM 碼。 不應使用：逕編 SROM 為併發症。 實務：產程自然破水為正常過程，不可報告；premature/delayed 才編。 （來源：AHA Coding Clinic 2025年第3季「自然破水」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-04:a","q":"【AHA Coding Clinic 2025年第3季｜失智併憂鬱/情緒障礙】\n憂鬱與失智並存、未記載關係之疑義（索引無 depression 子項）。\n依該季 Coding Clinic，應如何編碼？","o":["F03.93 + F32.A","F32.A","F03.93","F03.93 + F03.B2"],"e":"正解：F03.93 + F32.A。F03.93（未特指失智,未特指嚴重度,併情緒障礙）+ F32.A（憂鬱,未特指） 重點：失智併憂鬱推定相關，編 F03.93 + F32.A。 實務：depression 為 Dementia, with, mood disturbance 之非必要修飾詞→推定相關；F03.93 含 mood disturbance such as depression。 （來源：AHA Coding Clinic 2025年第3季「失智併憂鬱/情緒障礙」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-04:d","q":"【AHA Coding Clinic 2025年第3季】\n憂鬱與失智並存、未記載關係之疑義（索引無 depression 子項）。\n依該季 Coding Clinic，下列結論何者正確？","o":["失智併憂鬱推定相關，編 F03.93 + F32.A。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。","ICD-10-CM 推定甲狀腺低下與失智相關，編 E03.- + F02.80。"],"e":"正解：失智併憂鬱推定相關，編 F03.93 + F32.A。 應使用：F03.93（未特指失智,未特指嚴重度,併情緒障礙）+ F32.A（憂鬱,未特指）。 實務：depression 為 Dementia, with, mood disturbance 之非必要修飾詞→推定相關；F03.93 含 mood disturbance such as depression。 （來源：AHA Coding Clinic 2025年第3季「失智併憂鬱/情緒障礙」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-05:a","q":"【AHA Coding Clinic 2025年第3季｜失智併焦慮與憂鬱】\n門診記失智、焦慮、憂鬱。\n依該季 Coding Clinic，應如何編碼？","o":["F03.94 + F03.93 + F32.A","F03.93 + F32.A","F03.94 + F32.A","F03.94 + F03.93"],"e":"正解：F03.94 + F03.93 + F32.A。F03.94（失智併焦慮）+ F03.93（失智併情緒障礙）+ F32.A（憂鬱） 重點：失智併焦慮與憂鬱推定相關，編 F03.94 + F03.93 + F32.A。 實務：失智與憂鬱、失智與焦慮皆推定相關（除非醫師記另因）。 （來源：AHA Coding Clinic 2025年第3季「失智併焦慮與憂鬱」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-05:d","q":"【AHA Coding Clinic 2025年第3季】\n門診記失智、焦慮、憂鬱。\n依該季 Coding Clinic，下列結論何者正確？","o":["失智併焦慮與憂鬱推定相關，編 F03.94 + F03.93 + F32.A。","Bankart 病灶編 S43.432A；Hill-Sachs 病灶編 S42.292A。","中度失智併精神病性障礙與幻覺編 F03.B2 + R44.3。","自然流產後(已非孕)之慢性氣喘不用第15章碼；O03.4 + 氣喘碼。"],"e":"正解：失智併焦慮與憂鬱推定相關，編 F03.94 + F03.93 + F32.A。 應使用：F03.94（失智併焦慮）+ F03.93（失智併情緒障礙）+ F32.A（憂鬱）。 實務：失智與憂鬱、失智與焦慮皆推定相關（除非醫師記另因）。 （來源：AHA Coding Clinic 2025年第3季「失智併焦慮與憂鬱」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-06:a","q":"【AHA Coding Clinic 2025年第3季｜失智併行為障礙/精神病性障礙與幻覺】\n最終診斷中度失智併行為障礙與精神病性障礙合併幻覺。\n依該季 Coding Clinic，應如何編碼？","o":["F03.B2 + R44.3","R44.3","F03.B2","F03.B2 + F02.80"],"e":"正解：F03.B2 + R44.3。F03.B2（未特指失智,中度,併精神病性障礙）+ R44.3（幻覺,未特指） 重點：中度失智併精神病性障礙與幻覺編 F03.B2 + R44.3。 實務：失智與精神病性障礙推定相關；醫師記精神病性障礙 due to 失智(生理病況)。 （來源：AHA Coding Clinic 2025年第3季「失智併行為障礙/精神病性障礙與幻覺」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-06:d","q":"【AHA Coding Clinic 2025年第3季】\n最終診斷中度失智併行為障礙與精神病性障礙合併幻覺。\n依該季 Coding Clinic，下列結論何者正確？","o":["中度失智併精神病性障礙與幻覺編 F03.B2 + R44.3。","前期糖尿病所致多發性神經病變編 G62.89 + R73.03；非 G63。","失智併焦慮與憂鬱推定相關，編 F03.94 + F03.93 + F32.A。","舊槍傷處膕窩筋膜下深部膿瘍：診斷 M72.8 + S81.031S + X95.9XXS；I&D 編 0Y9F0ZZ。"],"e":"正解：中度失智併精神病性障礙與幻覺編 F03.B2 + R44.3。 應使用：F03.B2（未特指失智,中度,併精神病性障礙）+ R44.3（幻覺,未特指）。 實務：失智與精神病性障礙推定相關；醫師記精神病性障礙 due to 失智(生理病況)。 （來源：AHA Coding Clinic 2025年第3季「失智併行為障礙/精神病性障礙與幻覺」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-07:a","q":"【AHA Coding Clinic 2025年第3季｜胸骨鋼板固定】\n不穩定心絞痛多支 CAD 行 CABG，完成後行胸骨鋼板螺釘剛性固定。\n依該季 Coding Clinic，應如何編碼？","o":["0PH000Z","0PH304Z","0PS004Z","0PUC47Z"],"e":"正解：0PH000Z。0PH000Z（胸骨剛性鋼板內固定裝置置入,開放）+ CABG 碼 編碼順序：CABG 另編。 重點：CABG 後胸骨剛性鋼板固定另編 0PH000Z。 實務：胸骨鋼板為獨立目的(穩定胸骨、降感染)→另編。 （來源：AHA Coding Clinic 2025年第3季「胸骨鋼板固定」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-07:d","q":"【AHA Coding Clinic 2025年第3季】\n不穩定心絞痛多支 CAD 行 CABG，完成後行胸骨鋼板螺釘剛性固定。\n依該季 Coding Clinic，下列結論何者正確？","o":["CABG 後胸骨剛性鋼板固定另編 0PH000Z。","vein graft 血栓致 NSTEMI，主診 I21.4 + I25.10；MI 情境不編心絞痛。","Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。","以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。"],"e":"正解：CABG 後胸骨剛性鋼板固定另編 0PH000Z。 應使用：0PH000Z（胸骨剛性鋼板內固定裝置置入,開放）+ CABG 碼。 編碼順序：CABG 另編。 實務：胸骨鋼板為獨立目的(穩定胸骨、降感染)→另編。 （來源：AHA Coding Clinic 2025年第3季「胸骨鋼板固定」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-08:a","q":"【AHA Coding Clinic 2025年第3季｜Prolift 網膜移除】\n骨盆/陰道痛併脫垂，移除總 Prolift 網膜(自陰道、膀胱、小腸、閉孔/內收肌、直腸、提肛肌)。\n依該季 Coding Clinic，應如何編碼？","o":["0UPH0JZ + 0TPB0JZ + 0DPD0JZ + 0KPY0JZ","0TPB0JZ + 0DPD0JZ + 0KPY0JZ","0UPH0JZ + 0DPD0JZ + 0KPY0JZ","0UPH0JZ + 0TPB0JZ + 0KPY0JZ"],"e":"正解：0UPH0JZ + 0TPB0JZ + 0DPD0JZ + 0KPY0JZ。0UPH0JZ（陰道/子宮直腸窩移除合成替代物）+ 0TPB0JZ（膀胱）+ 0DPD0JZ（下腸道）+ 0KPY0JZ（下肌肉）,皆開放 不應使用／不適用：單一 removal 碼。 重點：自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。 實務：各以獨立切口自不同 body part 移除→同 root operation 不同 body part 各編(B3.2)。 （來源：AHA Coding Clinic 2025年第3季「Prolift 網膜移除」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-08:d","q":"【AHA Coding Clinic 2025年第3季】\n骨盆/陰道痛併脫垂，移除總 Prolift 網膜(自陰道、膀胱、小腸、閉孔/內收肌、直腸、提肛肌)。\n依該季 Coding Clinic，下列結論何者正確？","o":["自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。","血流導向支架 + 線圈治頸內動脈假性動脈瘤,各編一碼。","胸椎「中線」壓瘡無法定側，L89.1 無中背碼，左右上背各編一碼。","闌尾口之處置歸 body part Appendix（闌尾）。"],"e":"正解：自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。 應使用：0UPH0JZ（陰道/子宮直腸窩移除合成替代物）+ 0TPB0JZ（膀胱）+ 0DPD0JZ（下腸道）+ 0KPY0JZ（下肌肉）,皆開放。 不應使用：單一 removal 碼。 實務：各以獨立切口自不同 body part 移除→同 root operation 不同 body part 各編(B3.2)。 （來源：AHA Coding Clinic 2025年第3季「Prolift 網膜移除」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-09:a","q":"【AHA Coding Clinic 2025年第3季｜暫時性經靜脈節律器置入】\n85歲心搏過緩心臟停止，右鎖骨下靜脈置暫時性經靜脈節律器至右心室，數日後移除。\n依該季 Coding Clinic，應如何編碼？","o":["5A1223Z","5A02216","009640Z","01580ZZ"],"e":"正解：5A1223Z。5A1223Z（心臟起搏 Performance,連續） 不應使用／不適用：暫時節律器置入/移除另編。 重點：暫時性經靜脈節律器之心臟起搏編 5A1223Z（無置入/移除專碼）。 實務：暫時性經靜脈節律器無置入/移除專碼，以起搏 Performance 編。 （來源：AHA Coding Clinic 2025年第3季「暫時性經靜脈節律器置入」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-09:d","q":"【AHA Coding Clinic 2025年第3季】\n85歲心搏過緩心臟停止，右鎖骨下靜脈置暫時性經靜脈節律器至右心室，數日後移除。\n依該季 Coding Clinic，下列結論何者正確？","o":["暫時性經靜脈節律器之心臟起搏編 5A1223Z（無置入/移除專碼）。","TricValve 雙腔靜脈瓣治療重度三尖瓣逆流，需三碼；取代 2023 Q4 p.58-59 建議。","未載 Sjögren 之乾性角結膜炎編 H16.223；不用 M35.0-。","FY2026 新增 02H body part M 心室中膈；CRT-D 三導線分別編右心室、心室中膈、右心房。"],"e":"正解：暫時性經靜脈節律器之心臟起搏編 5A1223Z（無置入/移除專碼）。 應使用：5A1223Z（心臟起搏 Performance,連續）。 不應使用：暫時節律器置入/移除另編。 實務：暫時性經靜脈節律器無置入/移除專碼，以起搏 Performance 編。 （來源：AHA Coding Clinic 2025年第3季「暫時性經靜脈節律器置入」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-10:d","q":"【AHA Coding Clinic 2025年第3季】\n新生兒接受長效單株抗體預防 RSV 之就診診斷。\n依該季 Coding Clinic，下列結論何者正確？","o":["新生兒 RSV 預防性單株抗體(Nirsevimab/Beyfortus)就診編 Z29.11。","以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。","【釐清】XRG device R 用於「custom-made anatomically designed」病人專屬椎間融合器（如 Aprevo），非現成器。","reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。"],"e":"正解：新生兒 RSV 預防性單株抗體(Nirsevimab/Beyfortus)就診編 Z29.11。 應使用：Z29.11（RSV 預防性免疫治療就診）。 實務：Nirsevimab-alip 為單株抗體，Z29.11 捕捉其 RSV 預防用途。對照 [[CC2025Q3-11 RSV 預防性單株抗體給予（PCS）]]。 （來源：AHA Coding Clinic 2025年第3季「新生兒 RSV 預防性單株抗體就診」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-11:a","q":"【AHA Coding Clinic 2025年第3季｜RSV 預防性單株抗體給予】\n肌肉注射長效單株抗體(Nirsevimab/Beyfortus)預防 RSV 之 PCS 碼。\n依該季 Coding Clinic，應如何編碼？","o":["3E023GC","3E0E3KZ","3E0Q3E0","3E033GN"],"e":"正解：3E023GC。3E023GC（其他治療物質導入肌肉,經皮） 不應使用／不適用：XW023Y7（為 COVID-19 單株抗體而設,不適用）。 重點：肌肉給予 RSV 預防性單株抗體編 3E023GC；不用 XW023Y7。 實務：XW023Y7 專為 COVID-19 單株抗體；RSV 用 3E023GC。 （來源：AHA Coding Clinic 2025年第3季「RSV 預防性單株抗體給予」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-11:d","q":"【AHA Coding Clinic 2025年第3季】\n肌肉注射長效單株抗體(Nirsevimab/Beyfortus)預防 RSV 之 PCS 碼。\n依該季 Coding Clinic，下列結論何者正確？","o":["肌肉給予 RSV 預防性單株抗體編 3E023GC；不用 XW023Y7。","新生兒 RSV 預防性單株抗體(Nirsevimab/Beyfortus)就診編 Z29.11。","皮瓣靜脈鬱血之水蛭療法編 3E00XGC。","後路脊椎融合以 Mazor X 機器手臂輔助置椎弓螺釘，加編 8E0W0CZ。"],"e":"正解：肌肉給予 RSV 預防性單株抗體編 3E023GC；不用 XW023Y7。 應使用：3E023GC（其他治療物質導入肌肉,經皮）。 不應使用：XW023Y7（為 COVID-19 單株抗體而設,不適用）。 實務：XW023Y7 專為 COVID-19 單株抗體；RSV 用 3E023GC。 （來源：AHA Coding Clinic 2025年第3季「RSV 預防性單株抗體給予」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-12:a","q":"【AHA Coding Clinic 2025年第3季｜二手電子煙相關疾患】\n7歲氣喘童因二手電子煙暴露致急性缺氧呼衰與中度持續氣喘惡化。\n依該季 Coding Clinic，應如何編碼？","o":["J96.01 + J45.41 + Z77.29","J45.41 + Z77.29","J96.01 + Z77.29","J96.01 + J45.41"],"e":"正解：J96.01 + J45.41 + Z77.29。J96.01（急性呼衰併缺氧）+ J45.41（中度持續氣喘併急性惡化）+ Z77.29（接觸其他有害物質） 不應使用／不適用：U07.0（電子煙相關疾患，二手暴露不適用）。 重點：二手電子煙暴露所致病況編症狀碼 + Z77.29；不用 U07.0。 實務：U07.0 用於使用者本人；二手暴露以 Z77.29 表達。 （來源：AHA Coding Clinic 2025年第3季「二手電子煙相關疾患」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-12:d","q":"【AHA Coding Clinic 2025年第3季】\n7歲氣喘童因二手電子煙暴露致急性缺氧呼衰與中度持續氣喘惡化。\n依該季 Coding Clinic，下列結論何者正確？","o":["二手電子煙暴露所致病況編症狀碼 + Z77.29；不用 U07.0。","低血壓所致 AKI 編 N17.8。","溺水所致急性肺水腫編 J81.0（已知效應）+ 外因；不用 T75.1-。","終止妊娠娩出活產(後死亡)：Z33.2 + O35.05X0 + Z37.0。"],"e":"正解：二手電子煙暴露所致病況編症狀碼 + Z77.29；不用 U07.0。 應使用：J96.01（急性呼衰併缺氧）+ J45.41（中度持續氣喘併急性惡化）+ Z77.29（接觸其他有害物質）。 不應使用：U07.0（電子煙相關疾患，二手暴露不適用）。 實務：U07.0 用於使用者本人；二手暴露以 Z77.29 表達。 （來源：AHA Coding Clinic 2025年第3季「二手電子煙相關疾患」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-13:d","q":"【AHA Coding Clinic 2025年第3季】\n電子煙使用非尼古丁物質(調味、CBD、THC 或未特指)之編碼原則。\n依該季 Coding Clinic，下列結論何者正確？","o":["CBD/調味/未特指物質之電子煙目前無碼；尼古丁比照吸菸編尼古丁使用/濫用/依賴。","未特指低血糖 + 分級：E16.2 + E16.A2（分級碼為次診斷）。","醫療處方大麻(僅記 use)編所治病況 + Z79.899;不編物質使用碼。","Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。"],"e":"正解：CBD/調味/未特指物質之電子煙目前無碼；尼古丁比照吸菸編尼古丁使用/濫用/依賴。 應使用：尼古丁 → 尼古丁使用/濫用/依賴；娛樂性大麻無相關疾患時不編。 不應使用：CBD/調味/未特指物質逕編碼。 實務：無 CBD/調味/未特指之碼；娛樂性大麻無伴隨身心行為疾患不編。 （來源：AHA Coding Clinic 2025年第3季「電子煙使用：THC/CBD/未特指物質」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-14:a","q":"【AHA Coding Clinic 2025年第3季｜大麻電子煙使用】\n醫師記 vaping/daily vaping of marijuana 未進一步specification。\n依該季 Coding Clinic，應如何編碼？","o":["F12.9","F19.139","F02.80","F03.90"],"e":"正解：F12.9。僅在使用/濫用/依賴且伴隨疾患時依 I.C.5.b.3 編 F12.9- 等 不應使用／不適用：無伴隨疾患逕編。 重點：大麻電子煙使用無伴隨物質相關疾患/醫療病況時不可報告。 實務：未伴隨物質相關疾患或醫療病況之大麻使用非可報告診斷。 （來源：AHA Coding Clinic 2025年第3季「大麻電子煙使用」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-14:d","q":"【AHA Coding Clinic 2025年第3季】\n醫師記 vaping/daily vaping of marijuana 未進一步specification。\n依該季 Coding Clinic，下列結論何者正確？","o":["大麻電子煙使用無伴隨物質相關疾患/醫療病況時不可報告。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。","HIV 篩檢偽陽性經確認陰性，無現行 indication 之選擇性剖腹產編 O82；HIV 陰性結果加 Z71.7。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。"],"e":"正解：大麻電子煙使用無伴隨物質相關疾患/醫療病況時不可報告。 應使用：僅在使用/濫用/依賴且伴隨疾患時依 I.C.5.b.3 編 F12.9- 等。 不應使用：無伴隨疾患逕編。 實務：未伴隨物質相關疾患或醫療病況之大麻使用非可報告診斷。 （來源：AHA Coding Clinic 2025年第3季「大麻電子煙使用」）"

inic，應如何編碼？","o":["0LBV0ZZ","009640Z","01580ZZ","01584ZZ"],"e":"正解：0LBV0ZZ。0LBV0ZZ（Excision of right foot tendon, open approach） 重點：糖尿病足潰瘍切除性清創至肌肉與肌腱，取最深層（肌腱）編 0LBV0ZZ。 實務：PCS B3.5——Excision 在重疊肌肉骨骼層時編最深層；跟部阿基里斯腱附著跟骨結節，肌腱為最深層。 （來源：AHA Coding Clinic 2026年第3季「肌肉與肌腱切除性清創」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-24:d","q":"【AHA Coding Clinic 2026年第3季】\n右糖尿病足跟潰瘍，切除性清創含肌肉與肌腱壞死組織。\n依該季 Coding Clinic，下列結論何者正確？","o":["糖尿病足潰瘍切除性清創至肌肉與肌腱，取最深層（肌腱）編 0LBV0ZZ。","計畫吻合但需先切除小腸→最終處置為 Excision，只編 0DB80ZZ(吻合為固有)。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。"],"e":"正解：糖尿病足潰瘍切除性清創至肌肉與肌腱，取最深層（肌腱）編 0LBV0ZZ。 應使用：0LBV0ZZ（Excision of right foot tendon, open approach）。 實務：PCS B3.5——Excision 在重疊肌肉骨骼層時編最深層；跟部阿基里斯腱附著跟骨結節，肌腱為最深層。 （來源：AHA Coding Clinic 2026年第3季「肌肉與肌腱切除性清創」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-25:a","q":"【AHA Coding Clinic 2026年第3季｜單層裂傷修補】\n外傷後頭皮後方裂傷深及皮下，單層縫合（簡單 + 連續縫合）。\n依該季 Coding Clinic，應如何編碼？","o":["0HQ0XZZ","0HRMXK3","0HRV07B","0HX5XZZ"],"e":"正解：0HQ0XZZ。0HQ0XZZ（Repair scalp skin, external approach） 編碼順序：依實際修補層次（皮膚）。 重點：頭皮裂傷單層縫合（至皮膚），編 0HQ0XZZ 頭皮皮膚修補、外部入路。 實務：單層皮膚縫合 → body part 為皮膚；external approach 涵蓋直接於皮膚進行之處置。 （來源：AHA Coding Clinic 2026年第3季「單層裂傷修補」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-25:d","q":"【AHA Coding Clinic 2026年第3季】\n外傷後頭皮後方裂傷深及皮下，單層縫合（簡單 + 連續縫合）。\n依該季 Coding Clinic，下列結論何者正確？","o":["頭皮裂傷單層縫合（至皮膚），編 0HQ0XZZ 頭皮皮膚修補、外部入路。","計畫吻合但需先切除小腸→最終處置為 Excision，只編 0DB80ZZ(吻合為固有)。","DIEP 皮瓣重建併 IMF 鄰近組織轉移(Ryan flap)為獨立目的,雙側各編 0HX5XZZ。","【釐清】輕微漿膜撕裂縫合(未改變手術進程)不編診斷亦不編修補。"],"e":"正解：頭皮裂傷單層縫合（至皮膚），編 0HQ0XZZ 頭皮皮膚修補、外部入路。 應使用：0HQ0XZZ（Repair scalp skin, external approach）。 編碼順序：依實際修補層次（皮膚）。 實務：單層皮膚縫合 → body part 為皮膚；external approach 涵蓋直接於皮膚進行之處置。 （來源：AHA Coding Clinic 2026年第3季「單層裂傷修補」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-26:a","q":"【AHA Coding Clinic 2026年第3季｜肺下葉引流（更正 2017 Q3 p.15）】\n2017 Q3 p.15 原用「雙側肺」body part；因無「雙側下葉」值。\n依該季 Coding Clinic，應如何編碼？","o":["0B9F8ZZ + 0B9J8ZZ","0B9M8ZZ + 0B9J8ZZ","0B9J8ZZ","0B9F8ZZ"],"e":"正解：0B9F8ZZ + 0B9J8ZZ。0B9F8ZZ（右下葉引流,NAO內視鏡）+ 0B9J8ZZ（左下葉引流,NAO內視鏡） 不應使用／不適用：0B9M8ZZ（雙側肺）。 編碼順序：各部位分別編碼。 重點：【更正】抽吸下葉分泌物應分別編右下葉 0B9F8ZZ + 左下葉 0B9J8ZZ，非雙側肺 0B9M8ZZ。 實務：PCS B4.3——無雙側 body part 值時，各部位分別編碼。 （來源：AHA Coding Clinic 2026年第3季「肺下葉引流（更正 2017 Q3 p.15）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-26:d","q":"【AHA Coding Clinic 2026年第3季】\n2017 Q3 p.15 原用「雙側肺」body part；因無「雙側下葉」值。\n依該季 Coding Clinic，下列結論何者正確？","o":["【更正】抽吸下葉分泌物應分別編右下葉 0B9F8ZZ + 左下葉 0B9J8ZZ，非雙側肺 0B9M8ZZ。","自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。","【更正】TMT 關節融合應各關節各編一次（第1/2/3 TMT 共三次），原答不完整。"],"e":"正解：【更正】抽吸下葉分泌物應分別編右下葉 0B9F8ZZ + 左下葉 0B9J8ZZ，非雙側肺 0B9M8ZZ。 應使用：0B9F8ZZ（右下葉引流,NAO內視鏡）+ 0B9J8ZZ（左下葉引流,NAO內視鏡）。 不應使用：0B9M8ZZ（雙側肺）。 編碼順序：各部位分別編碼。 實務：PCS B4.3——無雙側 body part 值時，各部位分別編碼。 （來源：AHA Coding Clinic 2026年第3季「肺下葉引流（更正 2017 Q3 p.15）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-27:a","q":"【AHA Coding Clinic 2026年第3季｜中足融合（更正 2021 Q3 p.24）】\n2021 Q3 p.24 原答僅兩碼；實際第1/2/3 TMT 三關節皆以內固定 + 骨移植融合。\n依該季 Coding Clinic，應如何編碼？","o":["0SGJ04Z + 0SGJ07Z + 0SGL04Z + 0SGL07Z","0SGJ07Z + 0SGL04Z + 0SGL07Z","0SGJ04Z + 0SGL04Z + 0SGL07Z","0SGJ04Z + 0SGJ07Z + 0SGL07Z"],"e":"正解：0SGJ04Z + 0SGJ07Z + 0SGL04Z + 0SGL07Z。0SGJ04Z + 0SGJ07Z（navicular-cuneiform 融合,內固定+自體組織）；0SGL04Z（左 TMT 融合,內固定）×3 + 0SGL07Z（左 TMT 融合,自體組織）×3 編碼順序：TMT 融合碼各編三次。 重點：【更正】TMT 關節融合應各關節各編一次（第1/2/3 TMT 共三次），原答不完整。 實務：PCS B3.2b——同 root operation 於分屬同一 body part 值之 separate/distinct 部位重複時，各編一次。 （來源：AHA Coding Clinic 2026年第3季「中足融合（更正 2021 Q3 p.24）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-27:d","q":"【AHA Coding Clinic 2026年第3季】\n2021 Q3 p.24 原答僅兩碼；實際第1/2/3 TMT 三關節皆以內固定 + 骨移植融合。\n依該季 Coding Clinic，下列結論何者正確？","o":["【更正】TMT 關節融合應各關節各編一次（第1/2/3 TMT 共三次），原答不完整。","【更正】椎板切除為神經系統手術，術後硬膜外血腫應編 G97.61（非 G97.62）。","【更正】抽吸下葉分泌物應分別編右下葉 0B9F8ZZ + 左下葉 0B9J8ZZ，非雙側肺 0B9M8ZZ。","TricValve 雙腔靜脈瓣治療重度三尖瓣逆流，需三碼；取代 2023 Q4 p.58-59 建議。"],"e":"正解：【更正】TMT 關節融合應各關節各編一次（第1/2/3 TMT 共三次），原答不完整。 應使用：0SGJ04Z + 0SGJ07Z（navicular-cuneiform 融合,內固定+自體組織）；0SGL04Z（左 TMT 融合,內固定）×3 + 0SGL07Z（左 TMT 融合,自體組織）×3。 編碼順序：TMT 融合碼各編三次。 實務：PCS B3.2b——同 root operation 於分屬同一 body part 值之 separate/distinct 部位重複時，各編一次。 （來源：AHA Coding Clinic 2026年第3季「中足融合（更正 2021 Q3 p.24）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-28:a","q":"【AHA Coding Clinic 2026年第3季｜克雷伯氏菌肺炎型敗血症（源於 UTI）】\n醫師記錄 Klebsiella pneumoniae sepsis due to urinary tract infection。\n依該季 Coding Clinic，應如何編碼？","o":["A41.59 + N39.0 + B96.1","N39.0 + B96.1","A41.59 + B96.1","A41.59 + N39.0"],"e":"正解：A41.59 + N39.0 + B96.1。A41.59（其他革蘭氏陰性敗血症）+ N39.0（泌尿道感染,部位未特指）+ B96.1（K. pneumoniae 為他處疾病致病菌） 重點：K. pneumoniae 敗血症源於 UTI，編 A41.59 + N39.0 + B96.1。 實務：Klebsiella 為革蘭氏陰性；索引 Sepsis → other gram-negative A41.59；與 2023 Q4 p.88 一致。 （來源：AHA Coding Clinic 2026年第3季「克雷伯氏菌肺炎型敗血症（源於 UTI）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-28:d","q":"【AHA Coding Clinic 2026年第3季】\n醫師記錄 Klebsiella pneumoniae sepsis due to urinary tract infection。\n依該季 Coding Clinic，下列結論何者正確？","o":["K. pneumoniae 敗血症源於 UTI，編 A41.59 + N39.0 + B96.1。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","帕金森依 dyskinesia 與 fluctuations 分:G20.A1/A2/B1/B2/C。","只記 inflammatory arthritis 未指部位/型別時 query；無資訊→M13.80，非 M06.4。"],"e":"正解：K. pneumoniae 敗血症源於 UTI，編 A41.59 + N39.0 + B96.1。 應使用：A41.59（其他革蘭氏陰性敗血症）+ N39.0（泌尿道感染,部位未特指）+ B96.1（K. pneumoniae 為他處疾病致病菌）。 實務：Klebsiella 為革蘭氏陰性；索引 Sepsis → other gram-negative A41.59；與 2023 Q4 p.88 一致。 （來源：AHA Coding Clinic 2026年第3季「克雷伯氏菌肺炎型敗血症（源於 UTI）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-01:d","q":"【AHA Coding Clinic 2026年第4季】\n急診無症狀心搏過緩,居家監測見二聯律約 30 分鐘後自行緩解,記載『ventricular bigeminy』。\n依該季 Coding Clinic，下列結論何者正確？","o":["心室二聯律(每隔一次正常竇性搏動即出現一次早發心室收縮)→新碼 I49.82。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。"],"e":"正解：心室二聯律(每隔一次正常竇性搏動即出現一次早發心室收縮)→新碼 I49.82。 應使用：I49.82（心室二聯律）。 不應使用：舊的 I49.8 籠統碼。 實務：FY2027 I49.8 細分:I49.81 Brugada、I49.82 二聯律、I49.89 其他。 （來源：AHA Coding Clinic 2026年第4季「心室二聯律」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-02:d","q":"【AHA Coding Clinic 2026年第4季】\n肺結節病史因咳血入院,記載『recurrent hemoptysis likely secondary to mycetomas』。\n依該季 Coding Clinic，下列結論何者正確？","o":["肺黴菌球(fungus ball,多為麴菌)→新碼 J4B;咳血非其固有表現,有記載即另編 R04.2。","failed back syndrome 為非特異詞、非 postlaminectomy；只編其表現(此為頸髓病變 G95.9)。","術中硬膜撕裂編 G97.41；有記載即應報告（含 inherent/inadvertent）。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。"],"e":"正解：肺黴菌球(fungus ball,多為麴菌)→新碼 J4B;咳血非其固有表現,有記載即另編 R04.2。 應使用：J4B（肺黴菌球）+ R04.2（咳血）。 不應使用：僅 J4B。 編碼順序：J4B 首列。 實務：咳血非肺黴菌球內含→另編。 （來源：AHA Coding Clinic 2026年第4季「肺黴菌球」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q4-03:a","q":"【AHA Coding Clinic 2026年第4季｜穿孔性憩室炎致骨盆膿瘍】\n乙狀結腸憩室炎穿孔致大骨盆膿瘍,行沖洗引流。\n依該季 Coding Clinic，應如何編碼？","o":["K6A.09 + K57.20","K57.20","K6A.09","K68.19 + K57.20"],"e":"正解：K6A.09 + K57.20。K6A.09（其他骨盆膿瘍）+ K57.20（大腸憩室炎併穿孔及膿瘍,無出血） 不應使用／不適用：僅憩室炎碼。 重點：骨盆膿瘍→新碼 K6A.0-(K6A.09 其他骨盆膿瘍);穿孔性憩室炎併膿瘍另編。 實務：骨盆膿瘍 FY2027 新類目 K6A。 （來源：AHA Coding Clinic 2026年第4季「穿孔性憩室炎致骨盆膿瘍」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-03:d","q":"【AHA Coding Clinic 2026年第4季】\n乙狀結腸憩室炎穿孔致大骨盆膿瘍,行沖洗引流。\n依該季 Coding Clinic，下列結論何者正確？","o":["骨盆膿瘍→新碼 K6A.0-(K6A.09 其他骨盆膿瘍);穿孔性憩室炎併膿瘍另編。","肺黴菌球(fungus ball,多為麴菌)→新碼 J4B;咳血非其固有表現,有記載即另編 R04.2。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。","術後腹內膿瘍編 T81.43XA + K65.1。"],"e":"正解：骨盆膿瘍→新碼 K6A.0-(K6A.09 其他骨盆膿瘍);穿孔性憩室炎併膿瘍另編。 應使用：K6A.09（其他骨盆膿瘍）+ K57.20（大腸憩室炎併穿孔及膿瘍,無出血）。 不應使用：僅憩室炎碼。 實務：骨盆膿瘍 FY2027 新類目 K6A。 （來源：AHA Coding Clinic 2026年第4季「穿孔性憩室炎致骨盆膿瘍」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q4-04:a","q":"【AHA Coding Clinic 2026年第4季｜Pott 膨脹瘤（顏面及鼻竇骨髓炎）】\n左額竇 Pott 膨脹瘤之診斷碼?\n依該季 Coding Clinic，應如何編碼？","o":["M86.8X81","M86.8","M89.8X8","M00.061"],"e":"正解：M86.8X81。M86.8X81（其他骨髓炎,顏面及鼻竇） 不應使用／不適用：舊籠統 M86.8。 重點：Pott 膨脹瘤(額竇骨髓炎)→M86.8X81(顏面及鼻竇其他骨髓炎),該碼含 Pott puffy tumor 之 inclusion term。 實務：FY2027 M86.8X 新增 24 碼分部位/側別。 （來源：AHA Coding Clinic 2026年第4季「Pott 膨脹瘤（顏面及鼻竇骨髓炎）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-04:d","q":"【AHA Coding Clinic 2026年第4季】\n左額竇 Pott 膨脹瘤之診斷碼?\n依該季 Coding Clinic，下列結論何者正確？","o":["Pott 膨脹瘤(額竇骨髓炎)→M86.8X81(顏面及鼻竇其他骨髓炎),該碼含 Pott puffy tumor 之 inclusion term。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","自體骨瓣吸收診斷 T86.838 + M95.2；移除 PCS 為 Removal 0NP007Z。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。"],"e":"正解：Pott 膨脹瘤(額竇骨髓炎)→M86.8X81(顏面及鼻竇其他骨髓炎),該碼含 Pott puffy tumor 之 inclusion term。 應使用：M86.8X81（其他骨髓炎,顏面及鼻竇）。 不應使用：舊籠統 M86.8。 實務：FY2027 M86.8X 新增 24 碼分部位/側別。 （來源：AHA Coding Clinic 2026年第4季「Pott 膨脹瘤（顏面及鼻竇骨髓炎）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q4-05:a","q":"【AHA Coding Clinic 2026年第4季｜術中/術後乳頭壞死】\nNSM 後乳頭壞死需清創。\n依該季 Coding Clinic，應如何編碼？","o":["N99.861","N99.89","N99.820","N04.0"],"e":"正解：N99.861。N99.861（術中及術後乳頭壞死） 不應使用／不適用：一般壞死碼。 重點：NSM(保留乳頭乳房切除)後乳頭壞死→新碼 N99.861;缺血為 N99.860。 實務：新 subcategory N99.86:860 缺血／861 壞死。 （來源：AHA Coding Clinic 2026年第4季「術中/術後乳頭壞死」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-05:d","q":"【AHA Coding Clinic 2026年第4季】\nNSM 後乳頭壞死需清創。\n依該季 Coding Clinic，下列結論何者正確？","o":["NSM(保留乳頭乳房切除)後乳頭壞死→新碼 N99.861;缺血為 N99.860。","恥骨聯合骨炎且病理排除骨髓炎編 M89.8X8；不可逕用 M86。","副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。","腋淋巴結切片/乳房腫瘤切除處術後血清腫編 M96.843。"],"e":"正解：NSM(保留乳頭乳房切除)後乳頭壞死→新碼 N99.861;缺血為 N99.860。 應使用：N99.861（術中及術後乳頭壞死）。 不應使用：一般壞死碼。 實務：新 subcategory N99.86:860 缺血／861 壞死。 （來源：AHA Coding Clinic 2026年第4季「術中/術後乳頭壞死」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q4-06:a","q":"【AHA Coding Clinic 2026年第4季｜有機溶劑毒性效應併接觸性皮膚炎】\n工業噴漆工以有機溶劑清手,手部癢紅,診斷接觸性皮膚炎。\n依該季 Coding Clinic，應如何編碼？","o":["T52.891A + L25.3","L25.3","T52.891A","T52.891A + T50.995A"],"e":"正解：T52.891A + L25.3。T52.891A（其他有機溶劑毒性,意外,初診）+ L25.3（其他化學品接觸性皮膚炎,未特定） 不應使用／不適用：僅皮膚炎碼。 編碼順序：T52.891A 首列。 重點：有機溶劑毒性效應→新碼 T52.89-(需第7字元);接觸性皮膚炎另編,毒性碼在前。 實務：FY2027 T52 新增烯烴/環烷烴/其他有機溶劑子類目。 （來源：AHA Coding Clinic 2026年第4季「有機溶劑毒性效應併接觸性皮膚炎」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-06:d","q":"【AHA Coding Clinic 2026年第4季】\n工業噴漆工以有機溶劑清手,手部癢紅,診斷接觸性皮膚炎。\n依該季 Coding Clinic，下列結論何者正確？","o":["有機溶劑毒性效應→新碼 T52.89-(需第7字元);接觸性皮膚炎另編,毒性碼在前。","EGJOO(蠕動障礙)編 K22.89 + K31.89；非真性阻塞不用 K22.2。","心室二聯律(每隔一次正常竇性搏動即出現一次早發心室收縮)→新碼 I49.82。","氣喘併 COPD 編 J44.89；除非載明氣喘型別或惡化才另編 J45-。"],"e":"正解：有機溶劑毒性效應→新碼 T52.89-(需第7字元);接觸性皮膚炎另編,毒性碼在前。 應使用：T52.891A（其他有機溶劑毒性,意外,初診）+ L25.3（其他化學品接觸性皮膚炎,未特定）。 不應使用：僅皮膚炎碼。 編碼順序：T52.891A 首列。 實務：FY2027 T52 新增烯烴/環烷烴/其他有機溶劑子類目。 （來源：AHA Coding Clinic 2026年第4季「有機溶劑毒性效應併接觸性皮膚炎」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q4-07:a","q":"【AHA Coding Clinic 2026年第4季｜經導管二尖瓣置換併 LAMPOON（二尖瓣小葉分割）】\n經中隔 valve-in-valve TMVR(牛瓣),對人工瓣小葉行 tip-to-base LAMPOON 後置入新瓣。\n依該季 Coding Clinic，應如何編碼？","o":["028G3Z1","02H63KZ","02HA3RZ","02HK3KZ"],"e":"正解：028G3Z1。028G3Z1（二尖瓣分割,經皮,prosthetic leaflet）+ 二尖瓣置換碼 不應使用／不適用：僅置換碼。 重點：LAMPOON(撕裂二尖瓣小葉防 LVOT 阻塞)有獨立手術目的→另編 028;另編瓣膜置換。 實務：FY2027 028 新增 native/prosthetic leaflet qualifier(主動脈 F/二尖瓣 G);對應 BASILICA/LAMPOON。 （來源：AHA Coding Clinic 2026年第4季「經導管二尖瓣置換併 LAMPOON（二尖瓣小葉分割）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-07:d","q":"【AHA Coding Clinic 2026年第4季】\n經中隔 valve-in-valve TMVR(牛瓣),對人工瓣小葉行 tip-to-base LAMPOON 後置入新瓣。\n依該季 Coding Clinic，下列結論何者正確？","o":["LAMPOON(撕裂二尖瓣小葉防 LVOT 阻塞)有獨立手術目的→另編 028;另編瓣膜置換。","以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。","TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。"],"e":"正解：LAMPOON(撕裂二尖瓣小葉防 LVOT 阻塞)有獨立手術目的→另編 028;另編瓣膜置換。 應使用：028G3Z1（二尖瓣分割,經皮,prosthetic leaflet）+ 二尖瓣置換碼。 不應使用：僅置換碼。 實務：FY2027 028 新增 native/prosthetic leaflet qualifier(主動脈 F/二尖瓣 G);對應 BASILICA/LAMPOON。 （來源：AHA Coding Clinic 2026年第4季「經導管二尖瓣置換併 LAMPOON（二尖瓣小葉分割）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q4-08:a","q":"【AHA Coding Clinic 2026年第4季｜皮膚櫻桃狀血管瘤】\n皮膚檢查見散在鮮紅平滑丘疹,診斷 cherry angiomas。\n依該季 Coding Clinic，應如何編碼？","o":["D18.01","D18.02","D15.2","D39.11"],"e":"正解：D18.01。D18.01（皮膚及皮下組織血管瘤） 不應使用／不適用：贅生物/痣碼。 重點：皮膚櫻桃狀血管瘤(Campbell de Morgan spots)→D18.01(皮膚及皮下血管瘤)。 實務：Ask the Editor。索引 Angioma→D18.-。 （來源：AHA Coding Clinic 2026年第4季「皮膚櫻桃狀血管瘤」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-08:d","q":"【AHA Coding Clinic 2026年第4季】\n皮膚檢查見散在鮮紅平滑丘疹,診斷 cherry angiomas。\n依該季 Coding Clinic，下列結論何者正確？","o":["皮膚櫻桃狀血管瘤(Campbell de Morgan spots)→D18.01(皮膚及皮下血管瘤)。","Prader-Willi 併 MC4R 路徑破壞所致 class 2 肥胖：Q87.11 + E88.82 + E66.812。","失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。"],"e":"正解：皮膚櫻桃狀血管瘤(Campbell de Morgan spots)→D18.01(皮膚及皮下血管瘤)。 應使用：D18.01（皮膚及皮下組織血管瘤）。 不應使用：贅生物/痣碼。 實務：Ask the Editor。索引 Angioma→D18.-。 （來源：AHA Coding Clinic 2026年第4季「皮膚櫻桃狀血管瘤」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q4-09:d","q":"【AHA Coding Clinic 2026年第4季】\n晚期 HIV 併瀰漫性皮膚利什曼病,HAART 後 CD4 升至 184,診斷 IRIS。\n依該季 Coding Clinic，下列結論何者正確？","o":["HAART 後 IRIS→B20 + D89.3(免疫重建症候群)+ Z79.899(長期抗病毒藥物);IRIS 是治療成功清除病毒、免疫恢復之徵象。","【更正】妊娠合併慢性疼痛應編 O99.354（神經系統疾病），非 O99.892。","擬長期使用之降糖藥可編 Z79 系列（依藥物：口服 Z79.84、SGLT2 屬 Z79.899），與是否新開立無關。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。"],"e":"正解：HAART 後 IRIS→B20 + D89.3(免疫重建症候群)+ Z79.899(長期抗病毒藥物);IRIS 是治療成功清除病毒、免疫恢復之徵象。 應使用：B20（HIV 病）+ D89.3（免疫重建症候群）+ Z79.899（其他長期用藥）。 不應使用：僅 B20。 編碼順序：B20 首列。 實務：Ask the Editor。IRIS 為潛伏感染之過度發炎反應,治療直接結果。 （來源：AHA Coding Clinic 2026年第4季「HIV 併免疫重建發炎症候群」）","s":"cc2026"},{"c":"g27cm","id":"g27cm:exc1","q":"依 ICD-10-CM 慣例，Excludes1 註記的意義是什麼？","o":["被排除的碼不應與該碼同時使用（兩病況無法並存），但兩病況互不相關時為例外","被排除的病況不屬於該碼，但病人可同時有兩者，適當時可併用","被排除的碼必須作為次要診斷一併申報","僅表示該碼不得作為主診斷"],"e":"Excludes1 為「NOT CODED HERE」，表示不應與上方碼同時使用；若兩病況彼此無關（如 F45.8 與 G47.63 的例子，心因性經痛與睡眠磨牙），可例外併報。選項二描述的是 Excludes2。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.12.a）","s":"g27cm"},{"c":"g27cm","id":"g27cm:exc2","q":"ICD-10-CM 中 Excludes2 註記表示什麼？","o":["被排除的病況不屬於該碼的一部分，病人可同時有兩者，適當時可兩碼併用","兩碼絕不可同時申報","被排除的碼必須排在該碼之前","該碼僅限於住院病人使用"],"e":"Excludes2 意為「Not included here」，被排除的病況不是該碼所代表病況的一部分，但病人可能同時存在，適當時可同時編兩碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.12.b）","s":"g27cm"},{"c":"g27cm","id":"g27cm:manif","q":"標題含「in diseases classified elsewhere」的表現碼（manifestation code），其使用規則為何？","o":["不得作為主診斷或第一順位診斷，必須排在潛在病因碼之後","可作為主診斷，視就診原因而定","必須排在潛在病因碼之前","只在門診可單獨使用"],"e":"病因／表現慣例要求先編病因再編表現；標題為「in diseases classified elsewhere」的碼是表現碼，永遠不可作為第一順位或主診斷，須接在潛在病因碼之後（如巴金森氏症 G20- 後接 F02.80/F02.81-）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.13）","s":"g27cm"},{"c":"g27cm","id":"g27cm:codealso","q":"Tabular List 中「Code also」註記的意義為何？","o":["可能需要兩個碼才能完整描述病況，但此註記不提供排序指示，排序依該次就診情況決定","必須先編註記所指的碼，再編本碼","註記所指的碼僅在住院時才可使用","兩碼互相排斥，只能擇一"],"e":"「Code also」表示兩個碼可能都需要，但不提供排序方向，順序視該次就診的情況而定。與「Code first」不同，後者規定了順序。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.17）","s":"g27cm"},{"c":"g27cm","id":"g27cm:with","q":"ICD-10-CM 中標題、索引或註記裡的「with」或「in」應如何解讀？","o":["解讀為「associated with」或「due to」，分類假定兩者有因果關係，除非文件明確指出無關","必須有醫師明確記載兩者相關才能編為相關","僅表示兩者在同一次就診出現，不假定因果","只適用於 Tabular List，不適用於 Alphabetic Index"],"e":"「with」在標題、Alphabetic Index（主詞或次詞）或 Tabular List 註記中，推定兩病況有因果關係，即使缺乏醫師明確連結；除非文件明確寫兩者無關，或另有指引要求明確記載連結（如敗血症的急性器官功能障礙）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.15）","s":"g27cm"},{"c":"g27cm","id":"g27cm:and","q":"ICD-10-CM 碼標題中的「and」應如何解讀？","o":["解讀為「and 或 or」（和／或）","僅能解讀為「and」，兩者須同時存在","僅能解讀為「or」，兩者擇一","視病人年齡決定"],"e":"標題中的 and 視為 and/or。例如「骨結核」「關節結核」與「骨及關節結核」都歸 A18.0 結核性骨與關節。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.14）","s":"g27cm"},{"c":"g27cm","id":"g27cm:default","q":"病歷只記載「appendicitis」，沒有「急性」「慢性」等進一步資訊時，ICD-10-CM 應如何選碼？","o":["指定 Alphabetic Index 主詞旁的預設碼（default code）","必須先向醫師查詢才能編碼","一律選「其他特指」碼","一律選最嚴重（急性）的碼"],"e":"Alphabetic Index 主詞旁的碼為預設碼，代表最常見或未特指的病況；病歷只有主詞而無進一步資訊時，指定預設碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.18）","s":"g27cm"},{"c":"g27cm","id":"g27cm:clin","q":"關於診斷碼的指定與臨床診斷標準（clinical criteria），指引的規定為何？","o":["診斷碼依提供者的診斷陳述指定，不依其所用的臨床標準；紀錄互相矛盾時須查詢醫師","編碼員須自行核對臨床標準是否成立才可編碼","只有實驗室數據支持時才可編碼","提供者陳述不足時，應依檢驗數值自行判定診斷"],"e":"診斷碼的指定依據是提供者「病況存在」的診斷陳述；提供者的陳述即已足夠，不是依其建立診斷所用的臨床標準。如病歷記載互相衝突，須查詢提供者。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.19）","s":"g27cm"},{"c":"g27cm","id":"g27cm:detail","q":"關於診斷碼的詳細程度（level of detail），下列何者正確？","o":["碼必須編至可用的最多字元數（含適用的第 7 碼），否則視為無效碼","三碼類目即使有細分，只要已有診斷也可直接使用","第 7 碼為選擇性，可省略","只要編到第 5 碼就算完整"],"e":"三碼類目僅在沒有再細分時才可使用；若未編至該碼所需的完整字元數（含 7th character），則該碼無效。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:acchr","q":"同一病況被描述為既屬急性（亞急性）又屬慢性，且 Alphabetic Index 在同一縮排層級有各自的次詞，應如何編碼？","o":["兩者都編，急性（亞急性）碼排在前","只編慢性碼","只編急性碼","兩者都編，慢性碼排在前"],"e":"依指引，同一病況同時為急性（亞急性）與慢性，且 Index 在同一縮排層級各有次詞時，兩者皆編，急性（亞急性）碼先排。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.8）","s":"g27cm"},{"c":"g27cm","id":"g27cm:combo","q":"當分類中已有組合碼（combination code）能完整涵蓋所記載的診斷與其合併症／表現時，應如何處理？","o":["只編組合碼；僅在組合碼缺乏所需特異性時才加碼","組合碼與各別碼都要編","優先編各別碼以提高特異性","先編組合碼，再把每個元素各自加編"],"e":"指引指出：組合碼已能完整識別所有診斷元素時，不應再多重編碼；只有組合碼對表現或併發症的描述不夠時，才以次要碼補充。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.9）","s":"g27cm"},{"c":"g27cm","id":"g27cm:sequela","q":"殘餘效應（sequela）通常需要兩個碼，其排序為何？","o":["先編殘餘病況或其性質，再編 sequela（後遺症）碼；導致後遺症的急性期疾病碼不得與 sequela 碼併用","先編 sequela 碼，再編殘餘病況","急性期疾病碼與 sequela 碼併用，急性碼排第一","只編 sequela 碼，不編殘餘病況"],"e":"編 sequela 通常需兩碼：殘餘病況或其性質在先，sequela 碼在後（例外：sequela 碼後有表現碼，或已擴充至含表現）。導致後遺症的急性期碼永不與 late effect 碼併用；sequela 無時間限制。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.10）","s":"g27cm"},{"c":"g27cm","id":"g27cm:threat","q":"出院時被描述為「threatened（威脅性）」的病況但並未實際發生，且 Alphabetic Index 沒有 threatened 次詞，應如何編碼？","o":["編現存的潛在病況，不編被描述為 threatened 的病況","當作已確診編碼","不編任何碼","編為疑似診斷的症狀碼 R69"],"e":"「impending/threatened」若確實發生則編為確診；未發生時須查 Index 有無「impending」「threatened」次詞，有則編之；沒有則編現存的潛在病況。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.11）","s":"g27cm"},{"c":"g27cm","id":"g27cm:dup","q":"同一次就診中，同一個 ICD-10-CM 診斷碼可報告幾次？","o":["每個不重複的診斷碼一次就診只報告一次，包括沒有側別專屬碼的雙側病況","雙側病況可報告兩次以表達左右兩側","只要在不同日期記載就可重複報告","有不同醫師記載時可重複報告"],"e":"每個獨特的診斷碼一次就診只可報告一次；這也適用於沒有區分側別的碼的雙側病況，以及兩個不同病況歸到同一碼的情形。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.12）","s":"g27cm"},{"c":"g27cm","id":"g27cm:lat","q":"雙側白內障於不同次住院／就診分別手術，第一側手術那次就診，應如何選擇側別碼？","o":["雙側碼（病況仍在兩側），第二次則依仍存在病況的一側編單側碼","第一次就編單側碼，第二次再編另一側","兩次都編雙側碼","兩次都編側別未特指碼"],"e":"雙側病況分次治療時，第一次治療那次仍因兩側皆有病況而編雙側碼；第二次治療前，已治療側的病況不再存在，所以編仍存在一側的單側碼（若第一次未完全解決，才仍可用雙側碼）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.13）","s":"g27cm"},{"c":"g27cm","id":"g27cm:oth","q":"下列哪項資訊可依非「病人提供者」之其他臨床人員（如護理師、營養師）的紀錄編碼？","o":["壓瘡的分期（pressure ulcer stage）","敗血症的診斷","肺炎的診斷","手術併發症與手術的因果關係"],"e":"例外清單包含 BMI、非壓力性慢性潰瘍深度、壓瘡分期、昏迷量表、NIHSS、SDOH、側別、血液酒精濃度、免疫不足狀態、槍傷意圖等；但相關診斷（如壓瘡本身）仍須由病人的提供者記載。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.14）","s":"g27cm"},{"c":"g27cm","id":"g27cm:bmi","q":"關於 BMI、昏迷量表、NIHSS 等碼的報告，指引的規定為何？","o":["只能作為次要診斷報告，且相關診斷（如肥胖）須由病人的提供者記載","可作為主診斷","只要營養師記載了 BMI 就可同時推定有肥胖診斷","只能在門診報告"],"e":"BMI、昏迷量表、NIHSS、血液酒精濃度、SDOH 與免疫不足狀態碼只能作為次要診斷；雖可依其他臨床人員記錄，但相關診斷（肥胖、急性中風、F10 等）必須由病人的提供者記載。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.14）","s":"g27cm"},{"c":"g27cm","id":"g27cm:comp","q":"關於「醫療照護併發症」的編碼，下列何者正確？","o":["須有照護與病況間的因果關係且具臨床意義；不必明確寫出「complication」一詞","病歷必須明確使用「complication」才能編碼","手術後發生的任何病況都視為併發症","併發症碼只能由編碼員依時間先後推定"],"e":"編碼依提供者對病況與照護／手術關係的記載；須有因果關係，且病況具臨床意義，但不必明確寫「complication」（如病況改變了手術過程）。關係不清時須查詢提供者。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.16）","s":"g27cm"},{"c":"g27cm","id":"g27cm:border","q":"出院時診斷記載為「borderline」，且 ICD-10-CM 無專屬索引條目時，應如何編碼？","o":["依確診編碼；若索引有專屬條目（如 borderline diabetes）則依該條目","依疑似診斷處理，門診不編","一律改編症狀碼","不編任何碼"],"e":"「borderline」診斷除非分類有專屬條目（如 borderline diabetes），否則當作確診編碼。因為 borderline 不屬於不確定診斷，所以不分門診或住院。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.17）","s":"g27cm"},{"c":"g27cm","id":"g27cm:unspec","q":"關於使用症狀碼與「未特指（unspecified）」碼，指引的立場為何？","o":["當它們最能反映該次就診已知的資訊時是可接受的；不應為求更特定的碼而做不必要的檢查","未特指碼一律禁止使用","應要求醫師進一步檢查，直到可編特定碼為止","診斷尚未確立時一律不可編症狀碼"],"e":"症狀／未特指碼有時是最佳選擇：若診斷尚未確立，可編症狀碼；資訊不足以更特定時可編未特指碼。選用病歷無法支持的特定碼，或為了得到更特定的碼而做不必要檢查，都是不適當的。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.18）","s":"g27cm"},{"c":"g27cm","id":"g27cm:multi","q":"ICD-10-CM 對「multiple（多處）」的定義，以及在無章節專屬指引時的處理為何？","o":["兩處以上；有記載特定部位時各自編碼，部位未記載時才編「multiple sites」碼","三處以上；一律編 multiple sites 碼","兩處以上；一律編 multiple sites 碼","一處以上；一律各自編碼"],"e":"分類將「multiple」定義為涉及兩處以上；無章節專屬指引時，有記載特定部位就各部位分別編碼，部位未記載時才選 multiple sites 碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.20）","s":"g27cm"},{"c":"g27cm","id":"g27cm:hiv1","q":"病人因 HIV 相關疾病住院，主診斷應如何選擇？","o":["B20（人類免疫缺乏病毒［HIV］病），後接所有 HIV 相關病況碼","HIV 相關疾病本身的碼，B20 作為次要診斷","Z21（無症狀 HIV 感染狀態）","R75（HIV 實驗室證據）"],"e":"因 HIV 相關病況入院，主診斷為 B20，再加所有報告的 HIV 相關病況碼；例外是 HIV 相關溶血性尿毒症候群，先編 D59.31 再編 B20。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.a.2(b)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:hiv2","q":"HIV 病人因外傷（與 HIV 無關）住院，主診斷為何？","o":["外傷的碼（傷害性質碼）；B20 作為次要診斷","B20","Z21","外傷的外因碼"],"e":"HIV 病人因無關的疾病（如外傷）入院，無關病況碼（如傷害的性質碼）作主診斷，B20 與其他記載的病況為次要診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.a.2(c)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:uro","q":"提供者在病歷中使用「urosepsis」一詞，編碼員應如何處理？","o":["它是非特異性詞彙，不等於 sepsis，Index 沒有預設碼，須向提供者查詢","編為敗血症 A41.9","編為泌尿道感染 N39.0","編為菌血症 R78.81"],"e":"urosepsis 是不具特異性的用語，不可視為與 sepsis 同義，在 Alphabetic Index 中沒有預設碼；提供者用此詞時須查詢澄清。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.1(a)(ii)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:sevsep","q":"「嚴重敗血症（severe sepsis）」的編碼，下列何者正確？","o":["至少兩碼：先編潛在的全身性感染，再編 R65.2-，並加編相關急性器官功能障礙碼；未記載病原時感染編 A41.9","只需一個 R65.2- 碼","R65.2- 碼可作為主診斷","先編 R65.2-，再編全身性感染碼"],"e":"嚴重敗血症至少需要兩碼：先為潛在全身性感染（無病原則 A41.9），再為 R65.2- 嚴重敗血症，並加編相關急性器官功能障礙碼；R65.2- 永遠不可作為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.1(b) 與 I.C.1.d.3）","s":"g27cm"},{"c":"g27cm","id":"g27cm:shock","q":"敗血性休克（septic shock）碼的使用，下列何者正確？","o":["全身性感染碼排第一，再編 R65.21；敗血性休克碼不可作為主診斷","R65.21 可作為主診斷","只編 R65.21，不必編感染碼","R65.21 排在其他器官功能障礙碼之前即可，不需先編感染碼"],"e":"敗血性休克是一種急性器官功能障礙：先編全身性感染碼，再編 R65.21（或術後 T81.12），其他急性器官功能障礙另加；依 Tabular List 排序註記，敗血性休克碼不可為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:orgdys","q":"病人有敗血症，也有急性器官功能障礙，但病歷顯示該器官功能障礙與敗血症以外的其他病況有關。是否可編 R65.2-？","o":["不可，急性器官功能障礙須與敗血症相關才可編嚴重敗血症碼；關聯不清時須查詢提供者","可以，只要同時存在即可","可以，但須排在第二順位","視檢驗數值而定，不必查詢"],"e":"嚴重敗血症碼要求急性器官功能障礙與敗血症有關；若病歷顯示器官功能障礙與其他病況有關，不編 R65.2-；關聯不清則查詢。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.1(a)(iv)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:seploc","q":"病人因敗血症合併局部感染（如肺炎）入院，應如何排序？","o":["先編全身性感染（敗血症）碼，局部感染為次要；若敗血症是入院後才發生，則局部感染先編","局部感染一律排第一","兩者可任意排序","敗血症一律排在局部感染之後"],"e":"入院原因為敗血症合併局部感染時，全身性感染碼為第一，局部感染為次要診斷；若入院時只有局部感染（如肺炎），敗血症／嚴重敗血症在入院後才發生，則局部感染先編。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.4）","s":"g27cm"},{"c":"g27cm","id":"g27cm:obcls","q":"病歷同時記載「第 3 級肥胖（class 3 obesity）」與「病態肥胖（morbid obesity）」，應如何編碼？","o":["只編第 3 級肥胖碼，因它較為特定","兩者都編","只編病態肥胖碼","兩者都不編，改編 E66.9"],"e":"肥胖級別碼（E66.81-）須由提供者記載級別，可與 Chapter 4、15 的其他肥胖碼併報；但若同時記載第 3 級與病態肥胖，只編第 3 級肥胖碼（較為特定）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.4.b.1）","s":"g27cm"},{"c":"g27cm","id":"g27cm:f4541","q":"純粹與心理因素相關的疼痛，應編哪個碼？此時能否同時編 G89 類疼痛碼？","o":["F45.41；不可，因 G89 類目下有 Excludes1 註記","F45.41；可以，同時編 G89","F45.42；不可同時編 G89","G89.4；不可同時編 F45.41"],"e":"純心理因素的疼痛編 F45.41；G89 類目的 Excludes1 註記使二者不能併報。F45.42（疼痛症併相關心理因素）才與 G89 碼併用。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.5.a）","s":"g27cm"},{"c":"g27cm","id":"g27cm:hcrisis","q":"依 FY2027 指引，病歷記載「高血壓急迫（hypertensive urgency）」時，應如何編碼？","o":["編 I16 類目碼，並加編已確認的高血壓疾病（I10–I15、I1A）；排序依就診原因","僅編 I10，不另編 I16","僅編 I16，不編其他高血壓碼","一律把 I16 排在高血壓疾病碼之前"],"e":"高血壓急迫、高血壓緊急或未特指的高血壓危象都編 I16；同時編碼任何已確認的高血壓疾病（I10–I15、I1A），排序視就診原因而定。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.10）","s":"g27cm"},{"c":"g27cm","id":"g27cm:transht","q":"門診血壓偏高，但無高血壓診斷，也沒有既往高血壓診斷。應如何編碼？","o":["R03.0（無高血壓診斷的血壓讀數升高）","I10","I15.9","I16.9"],"e":"「暫時性高血壓」：除非病人已有高血壓的確立診斷，否則編 R03.0；妊娠的暫時性高血壓則依 O13.- 或 O14.-。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.7）","s":"g27cm"},{"c":"g27cm","id":"g27cm:uncon","q":"病歷記載「uncontrolled hypertension」，應如何選碼？","o":["依其病況編 I10–I15 類碼，不另有專屬的「未控制」碼","I16（高血壓危象）","I1A.0（抗藥性高血壓）","R03.0"],"e":"「未控制」可能指未治療或對現行療法無反應，兩者都編 I10–I15 的適當碼；「controlled」同理。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.8–9）","s":"g27cm"},{"c":"g27cm","id":"g27cm:secht","q":"次發性高血壓（secondary hypertension）的編碼要求為何？","o":["需要兩碼：潛在病因碼與 I15 類碼，排序依入院／就診原因","只編 I10","只編病因碼","必須先編 I15，再編病因碼"],"e":"次發性高血壓由潛在病況引起，需要兩碼：一為病因，一為 I15；排序由入院或就診的原因決定。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.6）","s":"g27cm"},{"c":"g27cm","id":"g27cm:resist","q":"病歷記載「treatment resistant hypertension」，應如何編 I1A.0？","o":["作為附加碼（additional code），並同時編高血壓的類型","作為第一順位診斷碼，取代其他高血壓碼","只編 I1A.0，不編高血壓類型","與 I16 併報"],"e":"提供者記載明顯抗藥性、抗藥性或真正抗藥性高血壓時，I1A.0 作為附加碼，另須編高血壓的特定類型碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.12）","s":"g27cm"},{"c":"g27cm","id":"g27cm:pu1","q":"病人入院時病歷記載壓瘡「已完全癒合」，應如何編碼？","o":["不編壓瘡碼","編 L89 的未特指分期碼","編 L89 第 1 期","編 L89 無法分期碼"],"e":"入院時壓瘡已記載完全癒合，不指定任何壓瘡碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.12.a.4）","s":"g27cm"},{"c":"g27cm","id":"g27cm:pu2","q":"無法分期的壓瘡（unstageable），在清創後揭露出分期，應如何編碼？","o":["只編清創後揭露的分期碼","同時編無法分期碼與揭露的分期碼","只編無法分期碼","編未特指分期碼"],"e":"無法分期（L89.--0）依臨床記載，如被焦痂覆蓋或已植皮；與「未特指分期（L89.--9）」不同，後者用於完全沒有分期記載。若同一次就診清創後揭露分期，只編揭露的分期碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.12.a.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:z05","q":"健康新生兒為排除疑似疾病而做觀察與評估，結果未發現問題，應如何使用 Z05 類目？","o":["Z05 用於疑似病況經評估後確定不存在者；若記載有疑似問題的症狀或徵象，則編該症狀或徵象","只要有疑似問題就編 Z05，即使有症狀","Z05 只能作為主診斷","Z05 不可與 Z38 同時使用"],"e":"Z05 用於健康新生兒評估疑似疾病，經檢查排除者；有疑似問題的徵象或症狀時不可用 Z05，應編徵象／症狀。在出生紀錄上，Z05 作次要碼，排在 Z38 之後。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.16.b.1 與 b.3）","s":"g27cm"},{"c":"g27cm","id":"g27cm:z05b","q":"FY2027 指引中，非出生紀錄（如再入院）上的 Z05 碼，何時可作主診斷／第一順位診斷？","o":["當 Z38 已不再適用，且為健康新生兒／嬰兒、檢查後未發現病況時","任何時候","只有在出生紀錄上","只有新生兒有症狀時"],"e":"指引 I.C.16.b.2：Z05 可為再入院或就診的主診斷／第一順位診斷，條件是 Z38 不再適用；Z05 僅供健康新生兒與嬰兒、經研判沒有病況者使用。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.16.b.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2a","q":"主診斷選擇：當相關的確定診斷已確立時，第 18 章的症狀、徵象與不明確病況碼可否作主診斷？","o":["不可","可以，只要為入院的第一個原因","可以，只要住院天數超過 3 天","可以，但須附加原因碼"],"e":"當相關的確定診斷已確立，症狀、徵象與不明確病況碼（第 18 章）不可作為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.A）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2b","q":"兩個以上互相關聯的病況都可能符合主診斷定義（如同一章中的疾病），選擇主診斷的原則為何？","o":["任一病況都可排第一，除非就診情況、所給治療、Tabular List 或 Alphabetic Index 另有指示","一律由編碼員依國際慣例排最嚴重者","一律依字母／碼序排序","一律須查詢醫師"],"e":"互相關聯且皆符合主診斷定義時，哪一個排第一均可，除非入院情況、治療、Tabular List 或 Index 另有指示。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.B）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2d","q":"病歷記載「肺炎或心衰竭（either/or）」兩個對比診斷，如何編碼與排序？","o":["兩者都當作已確診編碼，依入院情況排序；若無法判斷，任一個先編皆可","只編較嚴重者","兩者都不編，改編症狀碼","一律先編 Chapter 9"],"e":"兩個以上對比（comparative/contrasting）診斷以「either/or」記載時，都當作確診編碼，並依入院情況排序；無法進一步決定時，任一均可為第一。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.D）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2f","q":"原定治療計畫因意外情況而未能執行，主診斷應選什麼？","o":["經檢查後造成住院的病況，即使治療未執行","治療計畫改變後的新病況","造成治療取消的原因","一律改編 Z53 類碼"],"e":"原治療計畫未執行時，仍以經檢查後造成住院的病況作為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.F）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2g","q":"因手術或其他醫療照護的併發症而入院治療，主診斷應如何選？","o":["併發症碼作為主診斷；若併發症屬 T80–T88 且特異性不足，另加特定併發症碼","原手術的原因","併發症碼作為次要診斷","T80–T88 碼不可作為主診斷"],"e":"入院原因是治療手術或其他醫療照護的併發症時，併發症碼為主診斷；若屬 T80–T88 且特異性不足以描述，須另加指出特定併發症的碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.G）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2h","q":"出院時診斷記載為「probable」「suspected」「likely」，在哪些設施，這些不確定診斷可當作確立診斷編碼？","o":["僅限於短期急性、長期照護與精神科醫院的住院，門診不適用","所有門診與住院皆適用","只限於門診","只限於手術病人"],"e":"不確定診斷（probable、suspected、likely、questionable、possible、still to be ruled out、compatible with、consistent with 等）在出院時視為確診編碼，但這項指引僅適用於短期急性、長期照護與精神科醫院的住院；門診不適用。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.H 與 IV）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2j","q":"病人在醫院門診手術後接著因併發症而轉為同院住院，主診斷如何選？","o":["住院原因是併發症時，併發症為主診斷","一律是門診手術的原因","一律是手術碼","一律由編碼員自行裁量"],"e":"門診手術後轉住院：住院理由是併發症則併發症為主診斷；沒有併發症或其他病況記載時，門診手術的原因為主診斷；住院理由是與手術無關的其他病況，該病況為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.J）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2k","q":"為復健（rehabilitation）而入院，第一順位診斷應如何選？","o":["編接受復健的病況；若該病況已不存在則編追蹤照護（aftercare）碼，但損傷後的復健編損傷碼加第 7 碼 D","一律編 Z51.89","一律編原因急性病況的初診碼","一律編 aftercare 碼"],"e":"復健入院先編正在接受服務的病況（如 I69.351）；病況已不存在時編 aftercare（如髖關節置換後復健 Z47.1），但損傷後復健例外，編損傷碼加 D（如 S72.141D）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.K）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p3a","q":"Section III 對「先前病況（previous conditions）」的規定為何？","o":["對本次住院無影響的已解決病況不報告；但歷史碼（Z80–Z87）對現行照護有影響時可作次要碼","所有出現在診斷陳述上的病況皆須報告","歷史碼絕不可使用","已解決的病況只要有 ICD 碼就須報告"],"e":"提供者列在最終診斷陳述的診斷通常應編碼，但對本次住院無影響、已解決的病況與過往手術狀態不報告（除非醫院政策要求）；歷史碼若對現行照護有影響可作次要碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section III.A）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p3b","q":"住院病人檢驗結果異常，但提供者未表示其臨床意義，是否應編碼？","o":["不編；若異常值已安排其他檢查或治療，可向提供者查詢是否加入","一律編碼","異常值超過正常範圍就編碼","由編碼員依數值判斷嚴重度後編碼"],"e":"住院的異常發現（實驗室、X光、病理）除非提供者指出臨床意義，否則不編碼；超出正常範圍並已安排其他檢查或治療時，可詢問提供者。（來源：ICD-10-CM 官方編碼指引 FY2027 Section III.B）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p4a","q":"門診手術病人因禁忌症而未能執行手術，第一順位診斷應如何選？","o":["編手術的原因（reason for the surgery）","編禁忌症","編 Z53 類目碼","不報告任何診斷"],"e":"門診手術時，即使手術因禁忌症未執行，仍以手術原因為第一順位診斷（reason for the encounter）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section IV.A.1）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p4b","q":"門診手術後出現併發症而收住觀察室，診斷如何排序？","o":["手術原因為第一順位，併發症為次要診斷","併發症為第一順位","兩者任意排序","只報告併發症"],"e":"門診手術後因併發症入觀察：第一報告手術原因（就診原因），再報告併發症為次要診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section IV.A.2）","s":"g27cm"},{"c":"g27pcs","id":"g27pcs:a1","q":"ICD-10-PCS 碼由幾個字元組成？每個字元代表什麼？","o":["七個字元，每個字元是一個分類軸（axis of classification）","五個字元，每個字元代表手術部位","七個字元，每個字元固定代表相同資訊，與章節無關","六個字元，第七碼為選擇性"],"e":"每個 PCS 碼有七個字元，每個字元都是一個分類軸；在一個定義的碼範圍內，字元代表同一類型的資訊（如第 5 碼在 0–4、7–9 章為手術方式）。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A1）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a2","q":"ICD-10-PCS 每個字元可用哪些值？","o":["數字 0–9 與英文字母（不含 I 與 O），共 34 種可能值","數字 0–9 與全部 26 個字母","只有數字 0–9","數字 0–9 與字母（不含 L 與 O）"],"e":"PCS 每個字元可為 0–9 與英文字母，但排除 I 與 O 以免與 1、0 混淆，故共 34 種可能值。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A2）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a4","q":"在 ICD-10-PCS 中，同一個字元值（如體部值 0）在不同體系是否意義相同？","o":["不同；一個值的意義取決於其分類軸與所依附的前面字元，例如中樞神經系統 0＝腦，周邊神經系統 0＝頸神經叢","相同；值在整個 PCS 系統中永遠代表相同意義","相同；只有手術章節（0）例外","不同，但僅限於 Section X"],"e":"指引舉例：體部值 0 在中樞神經系統代表 Brain，在周邊神經系統代表 Cervical Plexus；值的意義取決於分類軸與前面的值。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A4）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a7","q":"編 PCS 碼時，是否一定要先查 Alphabetic Index？","o":["不必；可直接從 Tables 選出有效碼，但 Tables 必須查閱以找到最適當的有效碼","必須，Index 是唯一合法起點","必須，且只能由 Index 取得完整碼","只有在 Section X 才可直接查 Tables"],"e":"指引 A6：Index 是用來找到包含建構完整碼所需資訊的表；A7：並不要求先查 Index，可直接由 Tables 選取有效碼。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A6–A7）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a8","q":"PCS 文件資訊不完整、無法指定全部七個字元時，應如何處理？","o":["向醫師查詢所需資訊；七個字元都指定才是有效碼","用 Z 補足缺的字元","編至已知的字元數即可","自行以最常見值填入"],"e":"必須指定全部七個字元才是有效碼；若文件不足以編碼，應向醫師查詢。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A8）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a11","q":"醫師病歷記載「partial resection」，編碼員是否須先查詢才能決定 root operation？","o":["不必；編碼員應自行判斷「partial resection」對應 Excision","必須查詢，因為 partial resection 對應 Resection","必須查詢，因為不確定是 Excision 或 Detachment","直接編 Resection"],"e":"編碼員有責任判斷病歷記載相當於 PCS 的哪個定義；醫師不必使用 PCS 用語。指引舉例：「partial resection」可獨立對應到 Excision，無須查詢。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A11）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b21b","q":"在 Upper 與 Lower 為體部值選項的系統（如 Upper Arteries、Lower Veins、Muscles），「upper」與「lower」如何界定？","o":["以橫膈膜為界，位於橫膈膜上方為 upper、下方為 lower","以腰部為界","以心臟為界","以骨盆為界"],"e":"當體部值提供一般性的「upper」「lower」選項時，upper 與 lower 分別指橫膈膜之上與之下。（來源：ICD-10-PCS 官方指引 FY2027 B2.1b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b31b","q":"開放式肝臟切片，為到達手術部位所做的剖腹，是否另編碼？","o":["不另編；到達與關閉手術部位所需的步驟，以及 root operation 定義內含的成分，均不另編","另編 Inspection","另編 Division","另編 Bypass"],"e":"指引舉例：為開放肝切片而剖腹不另編；乙狀結腸切除併降結腸與直腸吻合時，吻合也不另編。（來源：ICD-10-PCS 官方指引 FY2027 B3.1b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b32d","q":"原擬腹腔鏡膽囊切除術，術中轉為開腹膽囊切除，應如何編碼？","o":["編經皮內視鏡的 Inspection，與開放的 Resection（兩者皆編）","只編開放的 Resection","編經皮內視鏡的 Resection","只編經皮內視鏡的 Inspection"],"e":"預定的 root operation 先以一種方式嘗試，後轉為另一種方式時，兩者皆編：腹腔鏡 Inspection 與開放 Resection。（來源：ICD-10-PCS 官方指引 FY2027 B3.2d）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b32b","q":"同一次手術中，切除縫匠肌與股薄肌的病灶，兩者都屬「上腿肌肉」體部值，應如何編碼？","o":["各別編碼（兩個程序），因為是同一體部值內分開的兩個獨立部位","只編一個碼","只編較大塊肌肉的碼","改編 Anatomical Regions 碼"],"e":"同一 root operation 於同一體部值內多個分離且不同的部位重複執行時，要分別編碼（如縫匠肌與股薄肌，或多個趾甲的 Extraction）。（來源：ICD-10-PCS 官方指引 FY2027 B3.2b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b33","q":"預定主動脈瓣置換術，在開胸後、切開心肌前，病人血行動力學不穩而中止手術，應如何編碼？","o":["開放 Inspection of mediastinum（縱膈腔）","Replacement of aortic valve","Resection of aortic valve","不編碼"],"e":"手術中止或未完成時，編實際執行的 root operation；若在執行任何其他 root operation 之前就中止，編 Inspection（針對檢視的部位或區域）。本例編開放的縱膈腔 Inspection。（來源：ICD-10-PCS 官方指引 FY2027 B3.3）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b34a","q":"骨髓切片的 root operation 與限定詞為何？","o":["Extraction，限定詞 Diagnostic","Excision，限定詞 Diagnostic","Drainage，限定詞 Diagnostic","Inspection，無限定詞"],"e":"切片編 Excision、Extraction 或 Drainage 加限定詞 Diagnostic：骨髓切片為 Extraction Diagnostic；肺部液體的細針抽吸為 Drainage Diagnostic；淋巴結採樣為 Excision Diagnostic。（來源：ICD-10-PCS 官方指引 FY2027 B3.4a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b34b","q":"乳房先做切片，隨後在同一手術部位做部分乳房切除，應如何編碼？","o":["切片與部分乳房切除兩者皆編","只編部分乳房切除","只編切片","兩者合併編為一個 Resection 碼"],"e":"切片之後接著在同一部位做更確定的治療（Destruction、Excision、Resection），兩者都編。（來源：ICD-10-PCS 官方指引 FY2027 B3.4b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b35","q":"excisional debridement 涉及肌肉與肌腱的重疊層次，應編到哪一個體部值？","o":["肌腱（最深層）","肌肉","皮膚","皮下組織"],"e":"在肌肉骨骼系統重疊層次進行 Excision、Extraction、Repair 或 Inspection 時，編最深層的體部值；肌肉＋肌腱→肌腱，皮膚＋皮下組織＋肌肉→肌肉。（來源：ICD-10-PCS 官方指引 FY2027 B3.5）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b36a","q":"Bypass（繞道）程序中，第 4 字元體部值與限定詞各代表什麼？","o":["體部值＝被繞道的來源（from）；限定詞＝繞道到達的目的地（to）","體部值＝目的地；限定詞＝來源","兩者都代表來源","體部值＝移植物來源；限定詞＝目的地"],"e":"例：胃到空腸的繞道，體部值為 Stomach、限定詞為 Jejunum。（來源：ICD-10-PCS 官方指引 FY2027 B3.6a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b36b","q":"冠狀動脈繞道（CABG）的體部值與限定詞，與其他繞道有何不同？","o":["體部值代表被繞道的冠狀動脈數目；限定詞代表繞道的來源血管","體部值代表來源血管；限定詞代表動脈數目","體部值與限定詞的意義與一般繞道相同","體部值代表使用的移植物種類"],"e":"冠狀動脈繞道的體部值指繞道到的冠狀動脈數目，限定詞指繞道來源（如主動脈）。若多條冠狀動脈使用不同裝置／限定詞，各別編碼。（來源：ICD-10-PCS 官方指引 FY2027 B3.6b–c）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b37","q":"以硝酸銀燒灼治療急性鼻出血，應編哪個 root operation？","o":["Control","Destruction","Repair","Occlusion"],"e":"Control 為停止或企圖停止術後或其他急性出血；以燒灼、應用物質、縫合、結紮等未被更特定 root operation 描述的技術止血時編 Control。若有更特定的 root operation 適用（如以液態栓塞阻斷血流為 Occlusion），則編更特定者。（來源：ICD-10-PCS 官方指引 FY2027 B3.7）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b38","q":"左上肺葉切除術（左上葉整個切除），應編何者？","o":["Resection of Upper Lung Lobe, Left","Excision of Lung, Left","Excision of Upper Lung Lobe, Left","Detachment of Lung, Left"],"e":"PCS 對器官的解剖次分區（如肺葉、肝葉）有各自體部值；整個體部值被切除時編 Resection，而不是對較不特定的體部值編 Excision。（來源：ICD-10-PCS 官方指引 FY2027 B3.8）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b39","q":"冠狀動脈繞道手術同時取下大隱靜脈作為移植物，大隱靜脈的取得應如何編碼？","o":["另編一個 Excision 程序，因限定詞並未完整指定自體移植物取得部位","不另編，已含在 Bypass 內","另編 Resection","另編 Detachment"],"e":"自體移植物取自不同手術部位時另編；例外是 PCS 表格的第 7 碼已完整指定取得部位，如 DIEP 皮瓣乳房置換，皮瓣取得不另編。（來源：ICD-10-PCS 官方指引 FY2027 B3.9）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b310c","q":"脊椎椎體關節融合使用內含碎骨移植的 cage 式椎體間融合裝置，應選何種裝置值？","o":["Interbody Fusion Device","Autologous Tissue Substitute","Nonautologous Tissue Substitute","Synthetic Substitute"],"e":"使用含骨移植的椎體間融合裝置使關節固定時，編 Interbody Fusion Device；僅骨移植時視自體或非自體編相應 Tissue Substitute；自體與非自體骨混合時編 Autologous Tissue Substitute。（來源：ICD-10-PCS 官方指引 FY2027 B3.10c）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b311b","q":"膀胱輸尿管鏡檢查，檢視膀胱與輸尿管，Inspection 應編到哪個體部值？","o":["Ureter（最遠端的管狀構造）","Bladder","Urinary Tract（區域）","兩者各編一碼"],"e":"檢視多個管狀構造時，編最遠端（離起始點最遠）者；若檢視多個非管狀構造，編代表整個檢視區域的體部值（如剖腹探查編 Peritoneal Cavity）。（來源：ICD-10-PCS 官方指引 FY2027 B3.11b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b312","q":"腫瘤栓塞（tumor embolization）與腦動脈瘤栓塞，各應編何種 root operation？","o":["腫瘤栓塞編 Occlusion；腦動脈瘤栓塞編 Restriction","兩者皆 Occlusion","兩者皆 Restriction","腫瘤栓塞編 Restriction；腦動脈瘤栓塞編 Occlusion"],"e":"栓塞目的為完全關閉血管編 Occlusion（腫瘤栓塞切斷血液供應）；目的為縮窄管腔編 Restriction（腦動脈瘤處縮窄管腔而非完全阻斷）。（來源：ICD-10-PCS 官方指引 FY2027 B3.12）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b313","q":"腸黏連分離術（lysis of intestinal adhesions），Release 的體部值應如何選？","o":["被鬆解的特定腸段（被釋放的體部），而非被切開的黏連組織","黏連組織","Peritoneum","Anatomical Regions, General"],"e":"Release 的體部值是被釋放的體部，不是為釋放而操作或切開的組織。（來源：ICD-10-PCS 官方指引 FY2027 B3.13）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b314","q":"把神經根從周圍疤痕組織中鬆解以緩解疼痛，與切斷神經根以緩解疼痛，分別是何種 root operation？","o":["前者 Release；後者 Division","前者 Division；後者 Release","兩者皆 Release","兩者皆 Excision"],"e":"唯一目的為釋放體部而不切割該體部＝Release；唯一目的為分離或橫切體部＝Division。（來源：ICD-10-PCS 官方指引 FY2027 B3.14）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b315","q":"無移位骨折以石膏固定，與有移位骨折閉鎖整復後上石膏，分別如何編碼？","o":["前者編 Placement 章節的 Immobilization；後者編 Reposition，石膏不另編","前者編 Reposition；後者編 Immobilization","兩者皆編 Immobilization","兩者皆編 Reposition 並另編石膏"],"e":"有移位骨折的整復編 Reposition，併用的石膏或夾板不另編；無移位骨折依實際執行的程序編碼（石膏為 Immobilization；打釘為 Insertion）。（來源：ICD-10-PCS 官方指引 FY2027 B3.15）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b316","q":"自體或非自體骨髓、胰島細胞、幹細胞的輸入，應編何處？","o":["Administration 章節","Transplantation（Medical and Surgical）","Transfer","Replacement"],"e":"Transplantation 為放入另一個體或動物的成熟且具功能的活體部位；放入自體或非自體細胞（骨髓、胰島細胞、幹細胞）則編 Administration 章節。（來源：ICD-10-PCS 官方指引 FY2027 B3.16）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b317","q":"肌皮瓣（musculocutaneous flap）轉移，體部值應如何選？","o":["皮瓣中最深層組織所對應的體部值（肌肉），限定詞描述其他組織層","皮膚","皮下組織","必須編成三個獨立程序"],"e":"多組織層的 Transfer 編到皮瓣中最深層組織的體部值，並用限定詞描述其他組織層。（來源：ICD-10-PCS 官方指引 FY2027 B3.17）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b318","q":"乳房切除後立即重建，與全關節置換前切除關節，各應如何處理？","o":["乳房切除與重建兩者皆編；關節置換的關節切除屬整合性準備，不另編","兩者都只編置換／重建","兩者的切除皆須另編","兩者的切除皆不另編"],"e":"切除後接置換，通常兩者皆編以呈現各自目的；但若切除為置換所必需的整合性準備（如關節置換、瓣膜置換的切除）則不另編。（來源：ICD-10-PCS 官方指引 FY2027 B3.18）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b319","q":"手部截肢，「Complete」與「Partial」在 PCS 定義中分別指什麼？","o":["Complete＝經腕掌關節（足部為跗蹠關節）；Partial＝沿掌骨（蹠骨）幹或頭的任何位置","Complete＝經掌指關節；Partial＝經腕掌關節","Complete＝經腕骨；Partial＝經指骨","Complete＝經橈尺骨；Partial＝經掌骨"],"e":"手與足的 Detachment：Complete 指經腕掌關節（手）或跗蹠關節（足）的截肢；Partial 指沿掌骨或蹠骨幹或頭的任何位置的截肢。拇指、手指、腳趾的 Complete 則指經掌指／蹠趾關節。（來源：ICD-10-PCS 官方指引 FY2027 B3.19）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b41a","q":"手術在下頷骨牙槽突（alveolar process）進行，PCS 沒有該部位的獨立體部值，應編到何處？","o":["Mandible（整個下頷骨）","Maxilla","Tooth","Skull"],"e":"手術部位只是某體部的一部分、且無獨立體部值時，編對應整個體部的值。（來源：ICD-10-PCS 官方指引 FY2027 B4.1a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b41b","q":"手術部位記載為骨膜（periosteum）時，應編到什麼體部值？","o":["對應的骨頭","皮下組織","肌肉","Anatomical Regions"],"e":"指引舉例：涉及骨膜的手術編到對應的骨體部值；「peri-」加體部（如 perirenal）且部位未進一步特定時，編到所命名的體部（腎）。（來源：ICD-10-PCS 官方指引 FY2027 B4.1b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b43","q":"相同程序施行於雙側輸卵管，與雙側膝關節，各如何編碼？","o":["輸卵管編一碼（Fallopian Tube, Bilateral）；膝關節編兩碼（右、左各一）","兩者皆編一碼","兩者皆編兩碼","輸卵管編兩碼；膝關節編一碼"],"e":"只有部分體部有雙側值；有雙側值者相同程序編一碼，沒有則左右分別編碼。（來源：ICD-10-PCS 官方指引 FY2027 B4.3）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b44","q":"兩條冠狀動脈做血管成形術，一條置放支架、另一條未放支架，應如何編碼？","o":["分別編碼：Dilation 一條動脈併 Intraluminal Device，與 Dilation 一條動脈無裝置","編一個 Dilation 兩條動脈併 Intraluminal Device","編一個 Dilation 兩條動脈無裝置","編 Insertion of 兩條動脈"],"e":"冠狀動脈是單一體部值，以治療的動脈數指定；僅當同一程序的裝置與限定詞值都相同才合為一碼，裝置不同須分開編。（來源：ICD-10-PCS 官方指引 FY2027 B4.4）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b45","q":"前十字韌帶（ACL）修補與膝關節鏡下軟骨修整，兩者的體部值是否相同？","o":["不同；ACL 修補編 Bursae and Ligaments 的膝體部，關節鏡軟骨修整編 Lower Joints 的膝關節","相同，都編 Lower Joints 的膝關節","相同，都編 Bursae and Ligaments","相同，都編 Tendons"],"e":"作用於關節周圍的肌腱、韌帶、滑囊、筋膜時，編以該結構為焦點的所屬系統體部；作用在關節構造本身（如關節軟骨）才編關節系統。（來源：ICD-10-PCS 官方指引 FY2027 B4.5）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b46","q":"對覆蓋肩關節的皮膚、皮下組織或筋膜進行程序，體部值應編至哪裡？膝關節呢？","o":["肩編 Upper Arm；膝編 Lower Leg","肩編 Lower Arm；膝編 Upper Leg","肩編 Upper Arm；膝編 Upper Leg","肩編 Chest；膝編 Foot"],"e":"指引對應：肩→上臂，肘→下臂，腕→下臂，髖→大腿（Upper Leg），膝→小腿（Lower Leg），踝→足。（來源：ICD-10-PCS 官方指引 FY2027 B4.6）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b47","q":"某系統（如 Muscles）沒有手指的獨立體部值，切除指肌肉應編到哪個體部？","o":["Hand（手）的肌肉體部值","Upper Arm","Lower Arm and Wrist","Anatomical Regions, Upper Extremities"],"e":"體系沒有指／趾的獨立體部值時，手指編手、腳趾編足。（來源：ICD-10-PCS 官方指引 FY2027 B4.7）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b48","q":"Upper Intestinal Tract 與 Lower Intestinal Tract 的範圍如何界定？更換空腸中的裝置（Change）應編哪個？","o":["Upper＝食道至十二指腸（含）；Lower＝空腸至直腸與肛門（含）；空腸裝置編 Lower Intestinal Tract","Upper＝食道至空腸（含）；空腸裝置編 Upper","Upper＝食道至胃；空腸裝置編 Upper","Lower＝迴腸至肛門；空腸裝置編 Upper"],"e":"Upper Intestinal Tract 包含食道到十二指腸；Lower 包含空腸到直腸與肛門，因此空腸裝置的 Change 編 Lower Intestinal Tract。（來源：ICD-10-PCS 官方指引 FY2027 B4.8）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b52a","q":"腹腔鏡輔助乙狀結腸切除（laparoscopic-assisted sigmoidectomy，開放執行主要步驟），手術方式應編何者？","o":["Open（開放）","Percutaneous Endoscopic","Via Natural or Artificial Opening Endoscopic","Percutaneous"],"e":"以開放方式並由經皮內視鏡輔助者，編 Open；此與經皮內視鏡手術，因手輔助或延伸切口取出標本而仍編 Percutaneous Endoscopic 的情形（B5.2b）不同。（來源：ICD-10-PCS 官方指引 FY2027 B5.2a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b52b","q":"手輔助腹腔鏡乙狀結腸切除，並延長切口取出標本，手術方式編何者？","o":["Percutaneous Endoscopic","Open","Percutaneous","External"],"e":"經皮內視鏡手術使用手輔助，或延伸切口以取出全部或部分體部、或吻合管狀構造者，仍編 Percutaneous Endoscopic。（來源：ICD-10-PCS 官方指引 FY2027 B5.2b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b53","q":"扁桃腺切除術與閉鎖性骨折整復，手術方式各編何者？","o":["兩者皆 External","扁桃腺 Open；骨折整復 External","扁桃腺 Via Natural or Artificial Opening；骨折整復 Percutaneous","兩者皆 Via Natural or Artificial Opening"],"e":"在孔道內、不需器械即可看見的構造上所做的程序編 External（如扁桃腺切除）；以外力經中間體層間接施行的程序也編 External（如閉鎖性骨折整復）。（來源：ICD-10-PCS 官方指引 FY2027 B5.3a–b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b54","q":"經由為手術放置的經皮腎造瘻管來碎腎結石，手術方式編何者？","o":["Percutaneous","Via Natural or Artificial Opening","Open","External"],"e":"經由為該程序而放置的裝置，以經皮方式進行，編 Percutaneous。（來源：ICD-10-PCS 官方指引 FY2027 B5.4）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b61","q":"縫線、結紮線、放射標記與暫時性術後傷口引流管，在 PCS 是否編為裝置？","o":["不編；它們視為手術的整合部分","要編為 Drainage Device","要編為 Other Device","要編為 Insertion"],"e":"只有手術結束後仍留存的裝置才編；縫線、結紮、放射標記與暫時性術後傷口引流管均不另編為裝置。若預計留存的裝置在同一手術過程內因故須移除，則置入與移除都要編。（來源：ICD-10-PCS 官方指引 FY2027 B6.1a–b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b61c","q":"對經皮腎造瘻管（裝置本身）進行沖洗，應如何編碼？","o":["編 Administration 章節的 Irrigation（沖洗植入裝置）","編 Drainage","編 Inspection of kidney","編 Revision"],"e":"只對裝置而非對體部進行的程序，用 Change、Irrigation、Removal、Revision 等 root operation；指引舉例為腎造瘻管沖洗。（來源：ICD-10-PCS 官方指引 FY2027 B6.1c）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:bc2","q":"產後或流產後的子宮內膜刮除或殘留妊娠產物排出，與非產後的 D&C，分別編在哪個章節？","o":["前者在 Obstetrics 章節（Extraction，Products of Conception, Retained）；後者在 Medical and Surgical（Extraction，Endometrium）","兩者皆 Obstetrics 章節","兩者皆 Medical and Surgical 章節","前者在 Medical and Surgical；後者在 Obstetrics"],"e":"產後／流產後的內膜刮除與殘留物清除，編 Obstetrics 章節的 Extraction、Products of Conception, Retained；其他時間的診斷或治療性 D&C 編 Medical and Surgical 的 Extraction、Endometrium。（來源：ICD-10-PCS 官方指引 FY2027 C2）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:bd1","q":"近接治療（brachytherapy）後放射性來源留在體內，除放射治療章節的碼之外，還須如何編？","o":["另編 Medical and Surgical 的 Insertion，裝置值為 Radioactive Element","不須另編","另編 Removal","另編 Administration"],"e":"近接治療編 Radiation Therapy 章節近接治療模式；若放射性來源於程序結束時仍在體內，另編 Insertion 與 Radioactive Element（例外：腦腫瘤切除後置入含 Cs-131 或 Pd-103 的膠原植入物，只編 Insertion）。（來源：ICD-10-PCS 官方指引 FY2027 D1.a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:be1","q":"Section X（新技術）的碼已完整描述一項新技術程序，且為唯一程序時，是否須再加編其他章節的碼？","o":["不須；只報告 Section X 碼","須，要再編 Administration 章節的碼","須，要再編 Medical and Surgical 的碼","視保險給付而定"],"e":"Section X 碼完整代表碼名所述的特定程序，若是唯一執行的程序，只編 Section X 碼（例：zanidatamab 經周邊靜脈給予，不再編 3E0 表的 Administration 碼）。（來源：ICD-10-PCS 官方指引 FY2027 E1.a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:be1b","q":"經導管主動脈瓣置換（valve-in-valve TAVR）時，另以射頻能量做瓣葉切割（X28F3WB），應如何編碼？","o":["Section X 碼與 TAVR 程序碼分別編碼","只編 X28F3WB","只編 TAVR","合併為一個 Replacement 碼"],"e":"多項程序時，Section X 碼依多重程序指引編碼：X28F3WB 與 TAVR 另碼並報；同理，經暫時輸注裝置給予基因治療時，輸注裝置的 Insertion 另編。（來源：ICD-10-PCS 官方指引 FY2027 E1.b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:bf","q":"主診斷的相關診斷性程序，與次要診斷的確定治療性程序並存時，何者為主要程序？","o":["與主診斷相關的診斷性程序作為主要程序","次要診斷的確定治療性程序","依手術時間先後","依 DRG 權重較高者"],"e":"指引 F3：對主診斷執行診斷程序，且對次要診斷執行確定治療程序時，與主診斷最相關的診斷程序優先作為主要程序。（來源：ICD-10-PCS 官方指引 FY2027 F）","s":"g27pcs"}];

/* ---------- 持久狀態 ---------- */
var stats = ls.get('dx.stats', {});
var marked = new Set(ls.get('dx.marked', []));
var notes = ls.get('dx.notes', null);
if (!Array.isArray(notes)) {
  notes = [{
    id: uid(), title: '範例：Excludes1 與 Excludes2', tags: ['編碼慣例','範例'], ref: null, updated: Date.now(),
    body: '（這是範例筆記，可以直接修改或刪除。）\n\nExcludes1：兩個情況不能同時編碼。\nExcludes2：不包括在本分類內，但病人同時有兩種情況時可以一起編碼。'
  }];
  ls.set('dx.notes', notes);
}
function saveStats(){ ls.set('dx.stats', stats); }
function saveMarked(){ ls.set('dx.marked', Array.from(marked)); }
function saveNotes(){ ls.set('dx.notes', notes); }
function record(id, ok){
  var s = stats[id] || {r:0, w:0};
  if (ok) s.r++; else s.w++;
  s.last = ok ? 'r' : 'w';
  stats[id] = s; saveStats();
}

/* ---------- 版面狀態 ---------- */
var TABS = [['quiz','題庫自測'], ['notes','我的筆記'], ['books','電子書庫']];
var S = {
  tab: 'quiz',
  quiz: { phase:'setup', cats:new Set(CATS.filter(function(c){ return c.past; }).map(function(c){ return c.id; })), exams:new Set(EXAMS), count:20, mode:'practice', source:'all', items:[], i:0, confirm:false },
  notesUi: { sel: null, q: '', tag: '' },
  reader: null,
  openNote: null
};
(function(){ var t = (location.hash || '').slice(1); if (TABS.some(function(x){ return x[0]===t; })) S.tab = t; })();

function go(t){
  if (S.reader) { S.reader.destroy(); S.reader = null; }
  S.tab = t;
  try { history.replaceState(null, '', '#' + t); } catch(e) {}
  render();
}
function renderTabs(){
  var box = document.getElementById('tabs');
  box.replaceChildren();
  TABS.forEach(function(x){
    var label = x[1];
    var b = h('button', {type:'button', role:'tab', class:'tab', id:'tab-'+x[0], 'aria-selected': String(S.tab===x[0]), 'aria-controls':'view', onClick:function(){ go(x[0]); }}, label);
    if (x[0]==='notes') b.append(h('span', {class:'cnt'}, '(' + notes.length + ')'));
    box.append(b);
  });
}
function render(){
  renderTabs();
  var v = document.getElementById('view');
  v.setAttribute('aria-labelledby', 'tab-' + S.tab);
  v.replaceChildren(S.tab==='quiz' ? quizView() : S.tab==='notes' ? notesView() : booksView());
}
function secHead(label, title, id){
  return h('header', {class:'sec-head'},
    h('div', {class:'eyebrow'}, label),
    h('h2', {class:'sec-title', id:id}, title),
    h('div', {class:'rule-short', 'aria-hidden':'true'}));
}

/* ---------- 01 題庫自測 ---------- */
function pool(){
  var qz = S.quiz;
  return QS.filter(function(q){
    if (!qz.cats.has(q.c)) return false;
    if (q.s && !qz.exams.has(q.s)) return false;
    if (qz.source==='wrong') return stats[q.id] && stats[q.id].last==='w';
    if (qz.source==='marked') return marked.has(q.id);
    return true;
  });
}
function quizView(){
  var qz = S.quiz;
  var root = h('section', {class:'sec', 'aria-labelledby':'quiz-h'});
  root.append(secHead('01｜題庫自測', '挑一個範圍，答完馬上看解析', 'quiz-h'));
  root.append(qz.phase==='setup' ? quizSetup() : qz.phase==='run' ? quizRun() : quizResult());
  root.append(h('p', {class:'closing'}, '錯的題目會自動收進錯題本，隨時回來再做一次。'));
  return root;
}
function chipGroup(name, opts, value, onPick){
  var box = h('div', {class:'chips', role:'radiogroup'});
  opts.forEach(function(o){
    var inp = h('input', {type:'radio', name:name, id:name+'-'+o[0], checked: value===o[0], onChange:function(){
      Array.prototype.forEach.call(box.children, function(c){ c.classList.remove('on'); });
      lab.classList.add('on'); onPick(o[0]);
    }});
    var lab = h('label', {class:'chip'+(value===o[0]?' on':''), for:name+'-'+o[0]}, inp, h('span', {class:'chip-t'}, o[1]), o[2] ? h('span', {class:'chip-s'}, o[2]) : null);
    box.append(lab);
  });
  return box;
}
function quizSetup(){
  var qz = S.quiz;
  var wrap = h('div', {class:'stack'});
  var card = h('div', {class:'card pad'});
  var fields = h('div', {class:'fields'});

  var catBox = h('div', {class:'chips', role:'group', 'aria-label':'題目範圍'});
  CATS.forEach(function(c){
    var n = QS.filter(function(q){ return q.c===c.id; }).length;
    var inp = h('input', {type:'checkbox', id:'cat-'+c.id, checked: qz.cats.has(c.id), onChange:function(){
      if (inp.checked) qz.cats.add(c.id); else qz.cats.delete(c.id);
      lab.classList.toggle('on', inp.checked); upd();
    }});
    var lab = h('label', {class:'chip'+(qz.cats.has(c.id)?' on':''), for:'cat-'+c.id}, inp, h('span', {class:'chip-t'}, c.name), h('span', {class:'chip-s'}, c.hint + '・' + n + ' 題'));
    catBox.append(lab);
  });
  fields.append(h('div', null, h('p', {class:'label'}, '題目範圍'), catBox));

  var examBox = h('div', {class:'chips', role:'group', 'aria-label':'考卷範圍'});

    var save = debounce(function(){ n.updated = Date.now(); saveNotes(); status.textContent = canPersist ? '已儲存' : '已更新（此瀏覽器無法長期保存）'; refreshList(); renderTabs(); }, 400);
    var title = h('input', {type:'text', id:'note-title', value:n.title, placeholder:'標題', onInput:function(){ n.title = title.value; status.textContent = '儲存中…'; save(); }});
    var tags = h('input', {type:'text', id:'note-tags', value:(n.tags||[]).join('、'), placeholder:'例如：Excludes1、PCS', onInput:function(){ n.tags = parseTags(tags.value); status.textContent = '儲存中…'; save(); }});
    var body = h('textarea', {id:'note-body', rows:'14', placeholder:'在這裡寫下重點、口訣或易混淆的地方', value:n.body, onInput:function(){ n.body = body.value; status.textContent = '儲存中…'; save(); }});
    var del = h('button', {type:'button', class:'btn quiet small'});
    twoStep(del, '刪除這則筆記', '再按一次確定刪除', function(){
      notes = notes.filter(function(x){ return x.id !== n.id; }); saveNotes();
      ui.sel = notes.length ? notes[0].id : null; refreshList(); loadEditor(false); renderTabs(); toast('已刪除筆記');
    });
    var refLine = null;
    if (n.ref && n.ref.type==='q') refLine = h('span', {class:'tag soft'}, '來自題庫');
    else if (n.ref && n.ref.type==='book') refLine = h('span', {class:'tag soft'}, '來自電子書' + (n.ref.page ? '第 ' + n.ref.page + ' 頁' : ''));
    editorCard.append(h('div', {class:'fields'},
      h('label', {for:'note-title'}, '標題', title),
      h('label', {for:'note-tags'}, h('span', null, '標籤 ', h('span', {class:'hint'}, '用頓號或逗號分開')), tags),
      h('label', {for:'note-body'}, '內容', body),
      h('div', {class:'row between'}, h('div', {class:'row'}, status, refLine), del)));
    if (focusTitle && !n.title && !n.body) title.focus();
  }

  grid.append(listCard, editorCard);
  root.append(grid, h('p', {class:'closing'}, '筆記只存在這台裝置的瀏覽器，記得常按「匯出筆記」備份。'));
  if (!current()) { var first = notes.slice().sort(function(a,b){ return b.updated-a.updated; })[0]; ui.sel = first ? first.id : null; }
  refreshList(); loadEditor(false);
  return root;
}

/* ---------- 03 電子書庫 ---------- */
var DB = (function(){
  var p;
  function open(){
    return p || (p = new Promise(function(res, rej){
      if (!window.indexedDB) return rej(new Error('no indexedDB'));
      var r;
      try { r = indexedDB.open('dx-books', 1); } catch(e) { return rej(e); }
      r.onupgradeneeded = function(){ var d = r.result; d.createObjectStore('meta', {keyPath:'id'}); d.createObjectStore('files'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
      r.onblocked = function(){ rej(new Error('blocked')); };
    }));
  }
  function run(store, mode, fn){
    return open().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction(store, mode), s = t.objectStore(store), req;
        try { req = fn(s); } catch(e) { return rej(e); }
        t.oncomplete = function(){ res(req ? req.result : undefined); };
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    list: function(){ return run('meta', 'readonly', function(s){ return s.getAll(); }); },
    putMeta: function(m){ return run('meta', 'readwrite', function(s){ return s.put(m); }); },
    putFile: function(id, b){ return run('files', 'readwrite', function(s){ return s.put(b, id); }); },
    getFile: function(id){ return run('files', 'readonly', function(s){ return s.get(id); }); },
    del: function(id){ return run('meta', 'readwrite', function(s){ return s.delete(id); }).then(function(){ return run('files', 'readwrite', function(s){ return s.delete(id); }); }); }
  };
})();
var sessionBooks = []; /* 無法寫入 IndexedDB 時，只在本次瀏覽中保留 */
var loaded = {};
function loadScript(src){
  if (loaded[src]) return loaded[src];
  loaded[src] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = function(){ delete loaded[src]; rej(new Error('無法載入閱讀元件')); };
    document.head.append(s);
  });
  return loaded[src];
}
var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
var EPUBJS = 'https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js';

function kindOf(name){
  var m = /\.([a-z0-9]+)$/i.exec(name || '');
  var ext = m ? m[1].toLowerCase() : '';
  if (ext === 'pdf') return 'pdf';
  if (ext === 'epub') return 'epub';
  if (ext === 'txt' || ext === 'md' || ext === 'markdown' || ext === 'text') return 'text';
  return null;
}
function persistMeta(meta){
  if (sessionBooks.some(function(b){ return b.meta.id === meta.id; })) return;
  DB.putMeta(meta).catch(function(){});
}
function progressText(m){
  if (m.kind === 'pdf') return m.last ? '讀到第 ' + m.last + (m.total ? ' / ' + m.total : '') + ' 頁' : '尚未開始';
  if (m.kind === 'epub') return m.cfi ? '已讀過' : '尚未開始';
  return m.ratio ? '讀到約 ' + Math.round(m.ratio * 100) + '%' : '尚未開始';
}
function booksView(){
  var root = h('section', {class:'sec', 'aria-labelledby':'books-h'});
  root.append(secHead('03｜電子書庫', '上傳自己的電子書，一邊讀一邊記', 'books-h'));
  var body = h('div', {class:'stack'});
  root.append(body);
  showLibrary(body);
  return root;
}
function showLibrary(body){
  body.replaceChildren();
  var msg = h('div', {'aria-live':'polite'});
  var input = h('input', {type:'file', id:'bookfile', class:'sr-file', accept:'.pdf,.epub,.txt,.md,.markdown,application/pdf,application/epub+zip,text/plain', multiple:true, onChange:function(){ var f = Array.prototype.slice.call(input.files); input.value = ''; handleFiles(f); }});
  var drop = h('label', {class:'drop', for:'bookfile'}, input, h('strong', null, '選擇檔案，或把檔案拖曳到這裡'), h('span', {class:'muted'}, '支援 PDF、EPUB、TXT、Markdown，單檔上限 200 MB'));
  drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files) handleFiles(Array.prototype.slice.call(e.dataTransfer.files)); });
  var listBox = h('div');
  body.append(h('div', {class:'card pad'}, drop, msg), listBox);

  function say(text){
    msg.replaceChildren();
    if (text) msg.append(h('div', {class:'notice', style:'margin:14px 0 0'}, text));
  }
  function handleFiles(files){
    var chain = Promise.resolve(); var problems = []; var added = 0;
    files.forEach(function(f){
      chain = chain.then(function(){
        var kind = kindOf(f.name);
        if (!kind) { problems.push('「' + f.name + '」格式不支援'); return; }
        if (f.size > 200 * 1048576) { problems.push('「' + f.name + '」超過 200 MB'); return; }
        var meta = { id: uid(), name: f.name.replace(/\.[^.]+$/, ''), kind: kind, size: f.size, added: Date.now(), last: 1, total: 0, cfi: '', ratio: 0 };
        return DB.putFile(meta.id, f).then(function(){ return DB.putMeta(meta); }).then(function(){ added++; }, function(){
          sessionBooks.push({meta: meta, blob: f}); added++; problems.push('「' + f.name + '」無法長期保存，只能在這次瀏覽中閱讀');
        });
      });
    });
    chain.then(function(){
      say(problems.length ? problems.join('；') + '。' : '');
      if (added && !problems.length) toast('已加入 ' + added + ' 本');
      refresh();
    });
  }
  function refresh(){
    listBox.replaceChildren(h('p', {class:'muted'}, '讀取書庫中…'));
    DB.list().catch(function(){ return []; }).then(function(metas){
      var all = metas.concat(sessionBooks.map(function(b){ return b.meta; })).sort(function(a,b){ return b.added - a.added; });
      listBox.replaceChildren();
      if (!all.length) { listBox.append(h('div', {class:'card pad empty'}, '書庫是空的。上傳第一本電子書，之後可以從上次讀到的地方繼續。')); return; }
      var ul = h('ul', {class:'book-list'});
      all.forEach(function(m){
        var del = h('button', {type:'button', class:'btn quiet small'});
        twoStep(del, '刪除', '再按一次確定', function(){
          sessionBooks = sessionBooks.filter(function(b){ return b.meta.id !== m.id; });
          DB.del(m.id).catch(function(){}).then(refresh);
        });
        ul.append(h('li', {class:'card book'},
          h('div', {class:'book-info'}, h('b', null, m.name), h('span', null, m.kind.toUpperCase() + '・' + fmtSize(m.size) + '・' + progressText(m))),
          h('div', {class:'row'}, h('button', {type:'button', class:'btn primary small', onClick:function(){ openReader(body, m); }}, '開啟閱讀'), del)));
      });
      listBox.append(ul);
    });
  }
  refresh();
  body.append(h('p', {class:'closing'}, '檔案只存在你的瀏覽器，不會上傳到任何伺服器。'));
}

function openReader(body, meta){
  body.replaceChildren(h('p', {class:'muted'}, '開啟中…'));
  var sb = sessionBooks.filter(function(b){ return b.meta.id === meta.id; })[0];
  var getBlob = sb ? Promise.resolve(sb.blob) : DB.getFile(meta.id);
  getBlob.catch(function(){ return null; }).then(function(blob){
    function back(){ if (S.reader) { S.reader.destroy(); S.reader = null; } showLibrary(body); }
    if (!blob) {
      body.replaceChildren(h('div', {class:'notice'}, '找不到這本書的檔案，可能已被清除。請重新上傳。'), h('button', {type:'button', class:'btn', onClick:back}, '回到書庫'));
      return;
    }
    var stage = h('div', {class:'stage', tabindex:'0', 'aria-label':'閱讀區'});
    var indicator = h('span', {class:'status', 'aria-live':'polite'}, '');
    var controlsBox = h('div', {class:'row'});
    var saveMeta = debounce(function(){ persistMeta(meta); }, 500);
    var ctl = { destroy:function(){} };
    S.reader = { destroy:function(){ try { ctl.destroy(); } catch(e) {} document.removeEventListener('keydown', onKey); } };

    var page = function(){ return meta.kind === 'pdf' ? meta.last : null; };
    var notePanel = h('div', {class:'card pad note-panel', hidden:true});
    var noteArea = h('textarea', {id:'reader-note', rows:'4', placeholder:'寫下這一頁的重點或疑問'});
    var noteHint = h('p', {class:'status', style:'margin:0 0 8px'}, '');
    notePanel.append(h('label', {for:'reader-note', class:'label', style:'display:block'}, '讀書筆記'), noteHint, noteArea,
      h('div', {class:'row', style:'margin-top:10px'},
        h('button', {type:'button', class:'btn primary small', onClick:function(){
          var text = noteArea.value.trim();
          if (!text) { noteHint.textContent = '請先寫一點內容。'; return; }
          var pg = page();
          var n = { id: uid(), title: '《' + meta.name + '》' + (pg ? '第 ' + pg + ' 頁' : ''), body: text, tags:['讀書筆記'], ref:{type:'book', id:meta.id, page:pg}, updated: Date.now() };
          notes.unshift(n); saveNotes(); S.notesUi.sel = n.id; noteArea.value = ''; renderTabs();
          toast('已存成筆記', '前往筆記', function(){ go('notes'); });
        }}, '存成筆記'),
        h('button', {type:'button', class:'btn quiet small', onClick:function(){ notePanel.hidden = true; }}, '收起')));
    var noteBtn = h('button', {type:'button', class:'btn small', onClick:function(){
      notePanel.hidden = !notePanel.hidden;
      noteHint.textContent = page() ? '這則筆記會記錄在第 ' + page() + ' 頁。' : '這則筆記會連到這本書。';
      if (!notePanel.hidden) noteArea.focus();
    }}, '記筆記');

    var bar = h('div', {class:'reader-bar'},
      h('button', {type:'button', class:'btn small quiet', onClick:back}, '回到書庫'),
      h('div', {class:'grow'}, meta.name), controlsBox, noteBtn);
    body.replaceChildren(h('div', null, bar, stage, h('div', {style:'margin-top:8px'}, indicator), notePanel));

    function onKey(e){
      if (/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) return;
      if (ctl.prev && e.key === 'ArrowLeft') ctl.prev();
      if (ctl.next && e.key === 'ArrowRight') ctl.next();
    }
    document.addEventListener('keydown', onKey);

    function fail(err){
      stage.replaceChildren(h('div', {class:'notice', style:'text-align:left'}, '這個檔案無法在頁面內開啟（' + (err && err.message ? err.message : '未知原因') + '）。請確認檔案沒有加密或損毀，或換成 PDF 格式再試一次。'));
    }
    var start = meta.kind === 'pdf' ? pdfReader : meta.kind === 'epub' ? epubReader : textReader;
    start(blob).then(function(c){ ctl = c; }, fail);

    /* PDF */
    function pdfReader(blob){
      stage.replaceChildren(h('p', {class:'muted'}, '載入 PDF 中…'));
      return loadScript(PDFJS).then(function(){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        return blob.arrayBuffer();
      }).then(function(buf){
        return window.pdfjsLib.getDocument({data: buf}).promise;
      }).then(function(doc){
        var total = doc.numPages, zoom = meta.zoom || 1, token = 0, task = null, dead = false;
        meta.total = total; meta.last = Math.min(Math.max(1, meta.last || 1), total);
        var pg = h('input', {type:'number', class:'pg', min:'1', max:String(total), value:String(meta.last), 'aria-label':'跳到頁碼', onChange:function(){ goTo(Number(pg.value)); }});
        function goTo(n){ if (!isFinite(n)) return; n = Math.min(Math.max(1, Math.round(n)), total); meta.last = n; pg.value = String(n); draw(); }
        function setZoom(z){ zoom = Math.min(3, Math.max(0.5, z)); meta.zoom = zoom; draw(); }
        controlsBox.replaceChildren(
          h('button', {type:'button', class:'btn small', onClick:function(){ goTo(meta.last - 1); }}, '上一頁'),
          pg, h('span', {class:'status'}, '/ ' + total),
          h('button', {type:'button', class:'btn small', onClick:function(){ goTo(meta.last + 1); }}, '下一頁'),
          h('button', {type:'button', class:'btn small quiet', 'aria-label':'縮小', onClick:function(){ setZoom(zoom - 0.15); }}, '縮小'),
          h('button', {type:'button', class:'btn small quiet', 'aria-label':'放大', onClick:function(){ setZoom(zoom + 0.15); }}, '放大'));
        function draw(){
          var my = ++token;
          indicator.textContent = '第 ' + meta.last + ' / ' + total + ' 頁';
          doc.getPage(meta.last).then(function(p){
            if (my !== token || dead) return;
            var base = p.getViewport({scale:1});
            var avail = Math.max(260, stage.clientWidth - 28);
            var vp = p.getViewport({scale: avail / base.width * zoom});
            var dpr = window.devicePixelRatio || 1;
            var cv = document.createElement('canvas');
            cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
            cv.style.width = Math.floor(vp.width) + 'px'; cv.style.height = Math.floor(vp.height) + 'px';
            if (task) { try { task.cancel(); } catch(e) {} }
            task = p.render({canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null});
            return task.promise.then(function(){
              if (my !== token || dead) return;
              stage.replaceChildren(cv); stage.scrollTop = 0; saveMeta();
            });
          }).catch(function(e){ if (e && e.name === 'RenderingCancelledException') return; fail(e); });
        }
        draw();
        return { prev:function(){ goTo(meta.last - 1); }, next:function(){ goTo(meta.last + 1); }, destroy:function(){ dead = true; token++; if (task) { try { task.cancel(); } catch(e) {} } try { doc.destroy(); } catch(e) {} } };
      });
    }

    /* EPUB */
    function epubReader(blob){
      stage.replaceChildren(h('p', {class:'muted'}, '載入 EPUB 中…'));
      return loadScript(JSZIP).then(function(){ return loadScript(EPUBJS); }).then(function(){ return blob.arrayBuffer(); }).then(function(buf){
        var book = window.ePub(buf);
        var host = h('div', {class:'epub-host'});
        stage.replaceChildren(host);
        var cs = getComputedStyle(stage);
        var rend = book.renderTo(host, {width:'100%', height:'100%', flow:'paginated', spread:'none'});
        rend.themes.default({ body: { color: getComputedStyle(document.body).color + ' !important', 'line-height': '1.85 !important', 'font-family': "'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif !important" }, a: { color: 'inherit' } });
        rend.on('relocated', function(loc){
          try { meta.cfi = loc.start.cfi; indicator.textContent = '閱讀中，進度已自動記錄'; saveMeta(); } catch(e) {}
        });
        controlsBox.replaceChildren(
          h('button', {type:'button', class:'btn small', onClick:function(){ rend.prev(); }}, '上一頁'),
          h('button', {type:'button', class:'btn small', onClick:function(){ rend.next(); }}, '下一頁'));
        return rend.display(meta.cfi || undefined).then(function(){
          return { prev:function(){ rend.prev(); }, next:function(){ rend.next(); }, destroy:function(){ try { rend.destroy(); } catch(e) {} try { book.destroy(); } catch(e) {} } };
        });
      });
    }

    /* 純文字／Markdown */
    function textReader(blob){
      return blob.arrayBuffer().then(function(buf){
        var text;
        try { text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
        catch(e) { try { text = new TextDecoder('big5').decode(buf); } catch(e2) { text = new TextDecoder('utf-8').decode(buf); } }
        var box = h('div', {class:'textbook'}, text);
        stage.replaceChildren(box);
        controlsBox.replaceChildren(h('span', {class:'status'}, '捲動閱讀，進度會自動記錄'));
        function ratio(){ var max = stage.scrollHeight - stage.clientHeight; return max > 0 ? stage.scrollTop / max : 0; }
        var onScroll = debounce(function(){ meta.ratio = ratio(); indicator.textContent = '讀到約 ' + Math.round(meta.ratio * 100) + '%'; saveMeta(); }, 300);
        stage.addEventListener('scroll', onScroll);
        setTimeout(function(){ var max = stage.scrollHeight - stage.clientHeight; stage.scrollTop = (meta.ratio || 0) * Math.max(0, max); }, 0);
        return { destroy:function(){ stage.removeEventListener('scroll', onScroll); } };
      });
    }
  });
}

render();
})();
</script>

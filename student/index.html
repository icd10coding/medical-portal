<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>疾病分類練習簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：頂部青綠橫條 → 報頭（水彩插畫在右上）→ 分頁籤 → 區塊（章節標・結論標題・內容・玫瑰粉結論句）。插畫只在邊角，文字區保持乾淨紙色。 */
:root{
  --paper:#F7F4EC; --card:#FCF7EB; --field:#FFFBF1;
  --ink:#5C443A; --ink2:#6E5446; --ink3:#876755;
  --rose:#C27777; --rose-ink:#A65A5A; --apricot:#DE9B67; --sage:#78978B; --teal:#118A8A;
  --peach:#F9E5CE; --mint:#E2EEE2; --blush:#F6E0DB; --line:#E6C9A8;
  --ok-line:#5E9A82; --bad-line:#C27777;
  --deco-pink:#F4C2C2; --deco-yellow:#F6CF96; --deco-green:#BFD6C6; --deco-heart:#F2B5B0;
  --wash-1:rgba(246,224,219,.95); --wash-2:rgba(249,229,206,.95); --wash-3:rgba(226,238,226,.9); --wash-4:rgba(246,224,219,.8);
  --grain:.22; --grain-blend:multiply;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2A2220; --card:#352B27; --field:#2E2522;
    --ink:#F4E8DA; --ink2:#E6D3C2; --ink3:#BFA593;
    --rose:#D88C8C; --rose-ink:#EBA9A9; --apricot:#E3A675; --sage:#8FB2A3; --teal:#4FB3AE;
    --peach:#4A3A2F; --mint:#2F4038; --blush:#4B3535; --line:#6A5545;
    --ok-line:#7DB59C; --bad-line:#D88C8C;
    --deco-pink:#8A5A5A; --deco-yellow:#B88A55; --deco-green:#5E8272; --deco-heart:#9A5F5F;
    --wash-1:rgba(120,70,70,.35); --wash-2:rgba(130,90,50,.3); --wash-3:rgba(60,95,80,.3); --wash-4:rgba(120,70,70,.28);
    --grain:.3; --grain-blend:soft-light;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2A2220; --card:#352B27; --field:#2E2522;
  --ink:#F4E8DA; --ink2:#E6D3C2; --ink3:#BFA593;
  --rose:#D88C8C; --rose-ink:#EBA9A9; --apricot:#E3A675; --sage:#8FB2A3; --teal:#4FB3AE;
  --peach:#4A3A2F; --mint:#2F4038; --blush:#4B3535; --line:#6A5545;
  --ok-line:#7DB59C; --bad-line:#D88C8C;
  --deco-pink:#8A5A5A; --deco-yellow:#B88A55; --deco-green:#5E8272; --deco-heart:#9A5F5F;
  --wash-1:rgba(120,70,70,.35); --wash-2:rgba(130,90,50,.3); --wash-3:rgba(60,95,80,.3); --wash-4:rgba(120,70,70,.28);
  --grain:.3; --grain-blend:soft-light;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  position:relative; margin:0; min-height:100%;
  background:var(--paper); color:var(--ink2);
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:1rem; line-height:1.75; overflow-x:hidden;
}
/* 水彩暈染：四角各一團淡彩 */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60vmax 40vmax at 6% 4%, var(--wash-1) 0, transparent 62%),
    radial-gradient(50vmax 38vmax at 98% 10%, var(--wash-2) 0, transparent 62%),
    radial-gradient(55vmax 42vmax at 94% 100%, var(--wash-3) 0, transparent 62%),
    radial-gradient(45vmax 34vmax at 2% 96%, var(--wash-4) 0, transparent 64%);
}
/* 紙張顆粒 */
body::after{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:var(--grain); mix-blend-mode:var(--grain-blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .27  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.topbar{position:absolute; top:0; left:0; right:0; height:6px; background:var(--teal); z-index:3}
.page{position:relative; z-index:1}
.wrap{width:min(1080px,100%); margin-inline:auto; padding-inline:clamp(16px,4vw,32px)}

:focus-visible{outline:3px solid var(--teal); outline-offset:3px; border-radius:6px}
.sr-file{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
.muted{color:var(--ink3)}

/* 報頭 */
.masthead{position:relative; padding-block:clamp(44px,8vw,72px) 8px}
.kicker{color:var(--rose-ink); font-weight:700; font-size:.95rem; letter-spacing:.1em}
h1{margin:.15em 0 .1em; color:var(--ink); font-size:clamp(2rem,6vw,3rem); line-height:1.25; font-weight:700; text-wrap:balance}
.lead{max-width:34em; margin:.4em 0 0; font-size:1.05rem}
.bar-short{width:64px; height:6px; border-radius:6px; background:var(--apricot); margin-top:14px}
.deco{position:absolute; pointer-events:none}
.deco svg{display:block; width:100%; height:auto; filter:url(#wobble2)}
.deco.a{top:34px; right:3%; width:clamp(54px,11vw,92px); transform:rotate(12deg)}
.deco.b{top:104px; right:calc(3% + clamp(48px,10vw,88px)); width:clamp(24px,4.4vw,38px); transform:rotate(-10deg)}
.deco.c{top:30px; right:calc(3% + clamp(66px,13vw,118px)); width:clamp(20px,3.6vw,30px); transform:rotate(14deg)}
.deco.d{top:16px; left:max(6px,1.5%); width:clamp(30px,5vw,48px); transform:rotate(-8deg)}
.petal ellipse{fill:var(--deco-pink); fill-opacity:.85; stroke:var(--rose); stroke-width:1.4}
.core{fill:var(--deco-yellow); stroke:var(--apricot); stroke-width:1.4}
.heart{fill:var(--deco-heart); fill-opacity:.9; stroke:var(--rose); stroke-width:1.5}
.star{fill:var(--deco-yellow); fill-opacity:.9; stroke:var(--apricot); stroke-width:1.5; stroke-linejoin:round}
.leaf{fill:var(--deco-green); fill-opacity:.9; stroke:var(--sage); stroke-width:1.5}
.stem{fill:none; stroke:var(--sage); stroke-width:2; stroke-linecap:round}

/* 分頁籤 */
.tabs{display:flex; flex-wrap:wrap; gap:10px; margin-block:22px 4px}
.tab{
  font:inherit; font-weight:700; color:var(--ink); cursor:pointer; min-height:44px;
  padding:.45rem 1.2rem; background:transparent; border:2px dashed var(--apricot);
  border-radius:18px 22px 16px 24px / 22px 16px 24px 18px;
}
.tab:hover{background:var(--peach)}
.tab[aria-selected="true"]{background:var(--blush); border:2px solid var(--rose)}
.tab .cnt{font-weight:400; color:var(--ink3); margin-left:.35em}

/* 區塊標題 */
.sec{padding-block:20px 12px}
.eyebrow{color:var(--rose-ink); font-weight:700; font-size:.9rem; letter-spacing:.1em}
.sec-title{margin:.1em 0 0; color:var(--ink); font-size:clamp(1.45rem,3.6vw,2rem); line-height:1.4; font-weight:700; text-wrap:balance}
.rule-short{width:56px; height:5px; border-radius:5px; background:var(--apricot); margin:10px 0 18px}
.closing{color:var(--rose-ink); font-weight:700; font-size:1.15rem; margin:24px 0 0}
.stack{display:grid; gap:18px}

/* 手繪外框的卡片 */
.card{position:relative; background:var(--card); border-radius:20px 24px 18px 26px / 24px 18px 26px 20px; min-width:0}
.card::before{
  content:""; position:absolute; inset:0; border:2px solid var(--apricot); border-radius:inherit;
  filter:url(#wobble); pointer-events:none; opacity:.9;
}
.pad{padding:clamp(16px,3vw,26px)}
.card.mint{background:var(--mint)} .card.blush{background:var(--blush)} .card.peach{background:var(--peach)}
.card h3{margin:0 0 .5em; color:var(--ink); font-size:1.2rem; line-height:1.45}
.divider{height:2px; border:0; background:var(--line); margin:18px 0; border-radius:2px}
.label{font-weight:700; color:var(--ink); margin:0 0 8px; font-size:.98rem}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.row.between{justify-content:space-between}

/* 按鈕 */
.btn{
  font:inherit; font-weight:700; color:var(--ink); cursor:pointer; min-height:44px;
  padding:.5rem 1.15rem; background:var(--peach); border:2px solid var(--apricot);
  border-radius:16px 20px 16px 20px / 20px 16px 20px 16px;
}
.btn:hover{background:var(--blush)}
.btn.primary{background:var(--blush); border-color:var(--rose)}
.btn.primary:hover{background:var(--peach)}
.btn.quiet{background:transparent; border-color:var(--line)}
.btn.quiet:hover{background:var(--peach)}
.btn.small{min-height:38px; padding:.3rem .85rem; font-size:.92rem}
.btn[disabled]{opacity:.5; cursor:not-allowed}

/* 選項膠囊 */
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{
  position:relative; display:flex; flex-direction:column; gap:0; cursor:pointer; min-height:44px;
  padding:.4rem .95rem; background:var(--field); border:2px solid var(--line);
  border-radius:16px 18px 14px 20px / 18px 14px 20px 16px;
}
.chip input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.chip:focus-within{outline:3px solid var(--teal); outline-offset:3px}
.chip.on{background:var(--peach); border-color:var(--rose)}
.chip-t{font-weight:700; color:var(--ink); line-height:1.4}
.chip-s{font-size:.82rem; color:var(--ink3); line-height:1.4}
.chip.simple{flex-direction:row; align-items:center}

select,input[type="text"],input[type="search"],input[type="number"],textarea{
  font:inherit; color:var(--ink); background:var(--field); border:2px solid var(--line);
  border-radius:12px 14px 12px 16px; padding:.5rem .75rem; min-height:44px; max-width:100%;
}
textarea{width:100%; line-height:1.8; resize:vertical}
input[type="text"],input[type="search"]{width:100%}
select:focus,input:focus,textarea:focus{outline:3px solid var(--teal); outline-offset:2px; border-color:var(--teal)}

/* 作答統計 */
.stat-grid{display:grid; gap:12px 22px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat-line{display:flex; justify-content:space-between; gap:12px; font-size:.92rem}
.meter{height:10px; background:var(--peach); border-radius:10px; overflow:hidden; margin-top:4px}
.meter>i{display:block; height:100%; background:var(--sage); border-radius:10px}
.big-num{font-size:2.2rem; font-weight:700; color:var(--ink); line-height:1.2}

/* 題目 */
.tag{display:inline-block; padding:.05rem .75rem; background:var(--mint); color:var(--ink); border:2px solid var(--sage); border-radius:12px 14px 12px 14px; font-weight:700; font-size:.88rem}
.tag.soft{background:var(--peach); border-color:var(--apricot)}
.q-text.long{font-size:1.02rem !important; font-weight:400; line-height:1.75 !important}
.q-text{white-space:pre-line; margin:16px 0 14px !important; font-size:clamp(1.15rem,2.6vw,1.4rem) !important; line-height:1.6 !important; color:var(--ink); text-wrap:pretty}
.opts{display:grid; gap:10px; margin:0; padding:0; list-style:none}
.opt{
  display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer;
  font:inherit; color:var(--ink2); background:var(--field); border:2px solid var(--line);
  border-radius:16px 14px 18px 12px / 14px 18px 12px 16px; padding:.7rem .9rem; min-height:44px;
}
.opt:hover{border-color:var(--apricot)}
.opt .ltr{
  flex:none; display:grid; place-items:center; width:34px; height:34px; font-weight:700; color:var(--ink);
  background:var(--peach); border:2px solid var(--apricot); border-radius:10px 8px 11px 9px;
}
.opts li:nth-child(2) .ltr{background:var(--mint); border-color:var(--sage)}
.opts li:nth-child(3) .ltr{background:var(--blush); border-color:var(--rose)}
.opts li:nth-child(4) .ltr{background:var(--peach); border-color:var(--sage)}
.opt .txt{flex:1; min-width:0; padding-top:3px; overflow-wrap:anywhere}
.opt .state{flex:none; font-size:.82rem; font-weight:700; padding-top:5px}
.opt.picked{border-color:var(--teal); background:var(--peach)}
.opt.right{border-color:var(--ok-line); background:var(--mint)}
.opt.wrong{border-color:var(--bad-line); background:var(--blush)}
.opt.right .state{color:var(--ink)}
.opt.wrong .state{color:var(--rose-ink)}
.opt[aria-disabled="true"]{cursor:default}
.feedback{margin-top:16px; padding:14px 16px; border-radius:14px 18px 14px 18px; border:2px solid var(--ok-line); background:var(--mint)}
.feedback.bad{border-color:var(--bad-line); background:var(--blush)}
.feedback strong{color:var(--ink)}
.feedback p{margin:.4em 0 0}
.progress{height:12px; background:var(--peach); border-radius:12px; overflow:hidden; margin-top:12px}
.progress>i{display:block; height:100%; background:var(--sage); border-radius:12px; transition:width .25s}
@media (prefers-reduced-motion: reduce){.progress>i{transition:none}}

.result-list{display:grid; gap:10px; margin:0; padding:0; list-style:none}
details.res{background:var(--field); border:2px solid var(--line); border-radius:14px; padding:.55rem .9rem}
details.res[open]{border-color:var(--apricot)}
details.res summary{cursor:pointer; font-weight:700; color:var(--ink); list-style-position:outside}
details.res .ans{margin:.5em 0 0}

/* 筆記 */
.notes-grid{display:grid; gap:18px; grid-template-columns:minmax(0,330px) minmax(0,1fr); align-items:start}
.note-list{display:grid; gap:8px; margin:12px 0 0; padding:0; list-style:none; max-height:56vh; overflow:auto}
.note-item{
  display:block; width:100%; text-align:left; font:inherit; color:var(--ink2); cursor:pointer;
  background:var(--field); border:2px solid var(--line); border-radius:14px 12px 16px 12px; padding:.55rem .8rem;
}
.note-item:hover{border-color:var(--apricot)}
.note-item.active{border-color:var(--rose); background:var(--blush)}
.note-item b{display:block; color:var(--ink); line-height:1.45; overflow-wrap:anywhere}
.note-item span{display:block; font-size:.84rem; color:var(--ink3); overflow-wrap:anywhere}
.tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.pill{font:inherit; font-size:.85rem; font-weight:700; cursor:pointer; color:var(--ink); background:transparent; border:2px solid var(--line); border-radius:999px; padding:.1rem .7rem; min-height:32px}
.pill.on{background:var(--peach); border-color:var(--rose)}
.fields{display:grid; gap:14px}
.fields label{display:grid; gap:6px; font-weight:700; color:var(--ink)}
.fields label .hint{font-weight:400; color:var(--ink3); font-size:.88rem}
.status{font-size:.88rem; color:var(--ink3)}

/* 電子書 */
.drop{
  display:grid; gap:4px; justify-items:center; text-align:center; cursor:pointer; padding:26px 16px;
  background:var(--field); border:2.5px dashed var(--apricot); border-radius:20px 24px 18px 26px / 24px 18px 26px 20px; color:var(--ink2);
}
.drop strong{color:var(--ink); font-size:1.1rem}
.drop.over,.drop:hover{background:var(--peach)}
.drop:focus-within{outline:3px solid var(--teal); outline-offset:3px}
.book-list{display:grid; gap:12px; margin:0; padding:0; list-style:none}
.book{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; padding:14px 18px}
.book-info{min-width:0; flex:1 1 220px}
.book-info b{display:block; color:var(--ink); font-size:1.05rem; line-height:1.45; overflow-wrap:anywhere}
.book-info span{font-size:.88rem; color:var(--ink3)}
.reader-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px}
.reader-bar .grow{flex:1 1 160px; min-width:0; font-weight:700; color:var(--ink); overflow-wrap:anywhere}
.stage{
  background:var(--field); border:2px solid var(--line); border-radius:14px; overflow:auto;
  height:min(72vh,820px); padding:12px; text-align:center;
}
.stage canvas{display:block; margin:0 auto; max-width:none}
.textbook{text-align:left; white-space:pre-wrap; line-height:1.95; font-size:1.05rem; max-width:42em; margin-inline:auto; padding:8px 10px; color:var(--ink); overflow-wrap:anywhere}
.epub-host{height:100%; min-height:300px}
.pg{width:5.2em; text-align:center; padding:.3rem .4rem; min-height:38px}
.note-panel{margin-top:14px}

.notice{padding:12px 16px; border-radius:14px; border:2px solid var(--apricot); background:var(--peach); color:var(--ink); margin-bottom:14px}
.empty{padding:26px 16px; text-align:center; color:var(--ink3)}

#toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:20;
  display:flex; gap:12px; align-items:center; max-width:min(92vw,520px);
  background:var(--card); color:var(--ink); border:2px solid var(--rose); border-radius:16px 20px 16px 20px;
  padding:.6rem 1rem; font-weight:700;
}
.btn[hidden]{display:none}
#toast[hidden]{display:none}

.foot{padding-block:36px 24px; position:relative}
.foot p{margin:.3em 0; font-size:.9rem; color:var(--ink3); max-width:44em}
.foot .deco.e{position:absolute; right:3%; top:20px; width:clamp(36px,7vw,60px); transform:rotate(10deg)}

@media (max-width:760px){
  .notes-grid{grid-template-columns:minmax(0,1fr)}
  .note-list{max-height:34vh}
  .masthead{padding-top:56px}
  .deco.b{top:92px}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/>
  </filter>
  <filter id="wobble2" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="2.5"/>
  </filter>
</svg>

  <header class="wrap masthead">

    <div class="deco b" aria-hidden="true"><svg viewBox="0 0 64 64"><path class="heart" d="M32 54C10 38 4 24 14 14C21 8 29 11 32 18C35 11 43 8 50 14C60 24 54 38 32 54Z"/></svg></div>
    <div class="deco c" aria-hidden="true"><svg viewBox="0 0 64 64"><polygon class="star" points="32,6 39,24 58,25 43,37 48,56 32,45 16,56 21,37 6,25 25,24"/></svg></div>
    <div class="deco d" aria-hidden="true"><svg viewBox="0 0 64 64"><circle class="leaf" cx="32" cy="19" r="10"/><circle class="leaf" cx="45" cy="32" r="10"/><circle class="leaf" cx="32" cy="45" r="10"/><circle class="leaf" cx="19" cy="32" r="10"/><path class="stem" d="M32 45C34 54 38 58 44 60"/></svg></div>

/* ---------- 小工具 ---------- */
function h(tag, props){
  var el = document.createElement(tag);
  var kids = Array.prototype.slice.call(arguments, 2);
  if (props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if (v === false || v == null) return;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  });
  (function add(list){
    list.forEach(function(kid){
      if (kid == null || kid === false) return;
      if (Array.isArray(kid)) return add(kid);
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
  })(kids);
  return el;
}

function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function debounce(fn, ms){ var t; return function(){ var a=arguments, c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); }, ms); }; }
function fmtDate(ts){ try{ return new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }

};

}

var toastTimer;
function toast(msg, actionLabel, action){
  var t = document.getElementById('toast');
  t.replaceChildren(h('span', null, msg));
  if (actionLabel) t.append(h('button', {class:'btn small', type:'button', onClick:function(){ t.hidden = true; action && action(); }}, actionLabel));
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 4500);
}
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return false; });
  }
  return Promise.resolve(false);
}
function twoStep(btn, label, confirmLabel, run){
  var armed = false, timer;
  btn.textContent = label;
  btn.addEventListener('click', function(){
    if (!armed) {
      armed = true; btn.textContent = confirmLabel;
      timer = setTimeout(function(){ armed = false; btn.textContent = label; }, 3500);
    } else { clearTimeout(timer); armed = false; btn.textContent = label; run(); }
  });
  return btn;
}

Q('pcs','p5','Excision 與 Resection 的差別為何？',

Q('pcs','p6','PCS 中「根本操作」位於第幾個字元？',

var EXAMS = Object.keys(SRC).map(function(k){ return SRC[k]; });
var PK = {}, DK = {};            /* code -> 描述 */
CASES.forEach(function(cs){
  cs.dx.forEach(function(e){ if (!DK[e.c]) DK[e.c] = e.t; });
  cs.px.forEach(function(e){ if (!PK[e.c]) PK[e.c] = e.t; });
  cs.chg.forEach(function(g){
    var pool = (g.c14.length === 7 && /^[0-9]/.test(g.c14)) ? PK : DK;
    if (!pool[g.c14]) pool[g.c14] = g.t14;
    if (!pool[g.c23]) pool[g.c23] = g.t23;
  });
});
function codeOpt(c, t){ return c + '　' + t; }
function inCase(cs, code){
  var hit = false;
  cs.dx.concat(cs.px).forEach(function(e){ if (e.c === code) hit = true; });
  cs.chg.forEach(function(g){ if (g.c14 === code || g.c23 === code) hit = true; });
  return hit;
}
/* 選出干擾碼：先用 prefer（同案例、同系統），再用相近前綴，最後任意 */
function distract(pool, exclude, prefer, n, prefixLens){
  var out = [], used = {};
  exclude.forEach(function(c){ used[c] = 1; });
  function take(list){
    shuffle(list).forEach(function(c){ if (out.length < n && !used[c]) { used[c] = 1; out.push(c); } });
  }
  take(prefer.filter(function(c){ return pool[c]; }));
  var all = Object.keys(pool);
  (prefixLens || [3,2,1]).forEach(function(len){
    if (out.length >= n) return;
    var base = (prefer.length ? prefer[0] : exclude[0]) || '';
    var keys = (exclude[0] || '').slice(0, len);
    take(all.filter(function(c){ return c.slice(0, len) === keys; }));
  });
  take(all);
  return out;
}
var ROLE_DX = {d:'主要診斷', a:'主(次)要診斷', e:'次要診斷'};
var ROLE_PX = {p:'主要處置', b:'主(次)要處置', q:'次要處置'};
function ansLine(cs){
  var parts = [];
  ['d','a','e'].forEach(function(r){
    var l = cs.dx.filter(function(e){ return e.r === r; }).map(function(e){ return e.c; });
    if (l.length) parts.push(ROLE_DX[r] + ' ' + l.join('、'));
  });
  ['p','b','q'].forEach(function(r){
    var l = cs.px.filter(function(e){ return e.r === r; }).map(function(e){ return e.c; });
    if (l.length) parts.push(ROLE_PX[r] + ' ' + l.join('、'));
  });
  var s = '參考答案：' + (parts.join('；') || '（僅列診斷或處置）') + '。';
  if (cs.chg.length) s += ' 版本差異（2014→2023）：' + cs.chg.map(function(g){ return g.c14 + '→' + g.c23; }).join('、') + '。';
  return s + ' 來源：' + cs.s + ' ' + cs.id + '。';
}
function head(cs){ return '【' + cs.s + '　' + cs.id + '】\n' + cs.text + '\n\n'; }
function byRole(list, roles){ return list.filter(function(e){ return roles.indexOf(e.r) >= 0; }); }

CASES.forEach(function(cs){
  var key = cs.s + '|' + cs.id;
  var dxAll = cs.dx.map(function(e){ return e.c; }), pxAll = cs.px.map(function(e){ return e.c; });
  var chgCodes = []; cs.chg.forEach(function(g){ chgCodes.push(g.c14, g.c23); });

  /* 1. 主要診斷 */
  var dMain = byRole(cs.dx, ['d']);
  if (dMain.length === 1 && !byRole(cs.dx, ['a']).length) {
    var ok = dMain[0];
    var ds = distract(DK, [ok.c].concat(chgCodes), byRole(cs.dx, ['e']).slice(0,1).map(function(e){ return e.c; }), 3, [2,1]);
    if (ds.length === 3) Q('pastdx', 'g:' + key + ':d', head(cs) + '依參考答案，此案例的「主要診斷」是？',
      [codeOpt(ok.c, ok.t)].concat(ds.map(function(c){ return codeOpt(c, DK[c]); })), ansLine(cs), cs.s);
  }
  /* 2. 主要處置 */
  var pMain = byRole(cs.px, ['p']);
  if (pMain.length === 1 && !byRole(cs.px, ['b']).length) {
    var okp = pMain[0];
    var dp = distract(PK, [okp.c].concat(chgCodes), byRole(cs.px, ['q']).slice(0,1).map(function(e){ return e.c; }), 3, [3,2,1]);
    if (dp.length === 3) Q('pastpx', 'g:' + key + ':p', head(cs) + '依參考答案，此案例的「主要處置」是？',
      [codeOpt(okp.c, okp.t)].concat(dp.map(function(c){ return codeOpt(c, PK[c]); })), ansLine(cs), cs.s);
  }
  /* 3. 次要診斷 */
  var eList = byRole(cs.dx, ['e']);
  if (eList.length) {
    var oke = eList[Math.floor(Math.random() * eList.length)];
    var dd = distract(DK, dxAll.concat(chgCodes), [], 3, [2,1]);
    if (dd.length === 3) Q('pastdx', 'g:' + key + ':e', head(cs) + '下列哪一個診斷碼是此案例參考答案中的「次要診斷」？',
      [codeOpt(oke.c, oke.t)].concat(dd.map(function(c){ return codeOpt(c, DK[c]); })), ansLine(cs), cs.s);
  }
  /* 4. 次要處置 */
  var qList = byRole(cs.px, ['q']);
  if (qList.length) {
    var okq = qList[Math.floor(Math.random() * qList.length)];
    var dq = distract(PK, pxAll.concat(chgCodes), [], 3, [3,2,1]);
    if (dq.length === 3) Q('pastpx', 'g:' + key + ':q', head(cs) + '下列哪一個處置碼是此案例參考答案中的「次要處置」？',
      [codeOpt(okq.c, okq.t)].concat(dq.map(function(c){ return codeOpt(c, PK[c]); })), ansLine(cs), cs.s);
  }
  /* 5. 處置描述 → 代碼（看懂 PCS 描述） */
  if (cs.px.length) {
    var e5 = cs.px[Math.floor(Math.random() * cs.px.length)];
    var d5 = distract(PK, pxAll.concat(chgCodes), [], 3, [3,2,1]);
    if (d5.length === 3) Q('pastpx', 'g:' + key + ':pd', '參考答案中，哪一個處置碼的描述是：\n' + e5.t + '\n（案例：' + cs.s + '　' + cs.id + '）',
      [e5.c].concat(d5), '正確為 ' + e5.c + '：' + e5.t + '。PCS 碼各字元依序為區段、身體系統、根本操作、身體部位、手術途徑、裝置、限定詞，可從描述回推。' + ansLine(cs), cs.s);
  }
  /* 6. 診斷代碼 → 描述 */
  if (cs.dx.length) {
    var e6 = cs.dx[Math.floor(Math.random() * cs.dx.length)];
    var d6 = distract(DK, dxAll.concat(chgCodes), [], 3, [2,1]);
    if (d6.length === 3) Q('pastdx', 'g:' + key + ':dd', '參考答案中，診斷碼 ' + e6.c + ' 的描述是？\n（案例：' + cs.s + '　' + cs.id + '）',
      [e6.t].concat(d6.map(function(c){ return DK[c]; })), '正確為 ' + e6.c + '：' + e6.t + '。' + ansLine(cs), cs.s);
  }
  /* 7. 2014 → 2023 版本差異 */
  cs.chg.forEach(function(g, i){
    var isPx = g.c14.length === 7 && /^[0-9]/.test(g.c14);
    var pool = isPx ? PK : DK;
    var dv = distract(pool, [g.c23], [g.c14], 3, isPx ? [3,2,1] : [3,2,1]);
    if (dv.length === 3) Q('pastver', 'g:' + key + ':v' + i, head(cs) + '此案例 2014 版本的參考代碼為 ' + g.c14 + '（' + g.t14 + '）。依 2023 版本的參考答案，該項目改為？',
      [codeOpt(g.c23, g.t23)].concat(dv.map(function(c){ return codeOpt(c, pool[c]); })),
      '2014 版 ' + g.c14 + ' → 2023 版 ' + g.c23 + '（' + g.t23 + '）。' + (g.c23 === '5A1D80Z' ? '同案 2023 版另接受 5A1D90Z（Continuous，每日超過 18 小時）。' : '') + ansLine(cs), cs.s);
  });

var NB=[{"c":"g27cm","id":"g27cm:exc1","q":"依 ICD-10-CM 慣例，Excludes1 註記的意義是什麼？","o":["被排除的碼不應與該碼同時使用（兩病況無法並存），但兩病況互不相關時為例外","被排除的病況不屬於該碼，但病人可同時有兩者，適當時可併用","被排除的碼必須作為次要診斷一併申報","僅表示該碼不得作為主診斷"],"e":"Excludes1 為「NOT CODED HERE」，表示不應與上方碼同時使用；若兩病況彼此無關（如 F45.8 與 G47.63 的例子，心因性經痛與睡眠磨牙），可例外併報。選項二描述的是 Excludes2。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.12.a）","s":"g27cm"},{"c":"g27cm","id":"g27cm:exc2","q":"ICD-10-CM 中 Excludes2 註記表示什麼？","o":["被排除的病況不屬於該碼的一部分，病人可同時有兩者，適當時可兩碼併用","兩碼絕不可同時申報","被排除的碼必須排在該碼之前","該碼僅限於住院病人使用"],"e":"Excludes2 意為「Not included here」，被排除的病況不是該碼所代表病況的一部分，但病人可能同時存在，適當時可同時編兩碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.12.b）","s":"g27cm"},{"c":"g27cm","id":"g27cm:manif","q":"標題含「in diseases classified elsewhere」的表現碼（manifestation code），其使用規則為何？","o":["不得作為主診斷或第一順位診斷，必須排在潛在病因碼之後","可作為主診斷，視就診原因而定","必須排在潛在病因碼之前","只在門診可單獨使用"],"e":"病因／表現慣例要求先編病因再編表現；標題為「in diseases classified elsewhere」的碼是表現碼，永遠不可作為第一順位或主診斷，須接在潛在病因碼之後（如巴金森氏症 G20- 後接 F02.80/F02.81-）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.13）","s":"g27cm"},{"c":"g27cm","id":"g27cm:codealso","q":"Tabular List 中「Code also」註記的意義為何？","o":["可能需要兩個碼才能完整描述病況，但此註記不提供排序指示，排序依該次就診情況決定","必須先編註記所指的碼，再編本碼","註記所指的碼僅在住院時才可使用","兩碼互相排斥，只能擇一"],"e":"「Code also」表示兩個碼可能都需要，但不提供排序方向，順序視該次就診的情況而定。與「Code first」不同，後者規定了順序。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.17）","s":"g27cm"},{"c":"g27cm","id":"g27cm:with","q":"ICD-10-CM 中標題、索引或註記裡的「with」或「in」應如何解讀？","o":["解讀為「associated with」或「due to」，分類假定兩者有因果關係，除非文件明確指出無關","必須有醫師明確記載兩者相關才能編為相關","僅表示兩者在同一次就診出現，不假定因果","只適用於 Tabular List，不適用於 Alphabetic Index"],"e":"「with」在標題、Alphabetic Index（主詞或次詞）或 Tabular List 註記中，推定兩病況有因果關係，即使缺乏醫師明確連結；除非文件明確寫兩者無關，或另有指引要求明確記載連結（如敗血症的急性器官功能障礙）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.15）","s":"g27cm"},{"c":"g27cm","id":"g27cm:and","q":"ICD-10-CM 碼標題中的「and」應如何解讀？","o":["解讀為「and 或 or」（和／或）","僅能解讀為「and」，兩者須同時存在","僅能解讀為「or」，兩者擇一","視病人年齡決定"],"e":"標題中的 and 視為 and/or。例如「骨結核」「關節結核」與「骨及關節結核」都歸 A18.0 結核性骨與關節。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.14）","s":"g27cm"},{"c":"g27cm","id":"g27cm:default","q":"病歷只記載「appendicitis」，沒有「急性」「慢性」等進一步資訊時，ICD-10-CM 應如何選碼？","o":["指定 Alphabetic Index 主詞旁的預設碼（default code）","必須先向醫師查詢才能編碼","一律選「其他特指」碼","一律選最嚴重（急性）的碼"],"e":"Alphabetic Index 主詞旁的碼為預設碼，代表最常見或未特指的病況；病歷只有主詞而無進一步資訊時，指定預設碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.18）","s":"g27cm"},{"c":"g27cm","id":"g27cm:clin","q":"關於診斷碼的指定與臨床診斷標準（clinical criteria），指引的規定為何？","o":["診斷碼依提供者的診斷陳述指定，不依其所用的臨床標準；紀錄互相矛盾時須查詢醫師","編碼員須自行核對臨床標準是否成立才可編碼","只有實驗室數據支持時才可編碼","提供者陳述不足時，應依檢驗數值自行判定診斷"],"e":"診斷碼的指定依據是提供者「病況存在」的診斷陳述；提供者的陳述即已足夠，不是依其建立診斷所用的臨床標準。如病歷記載互相衝突，須查詢提供者。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.A.19）","s":"g27cm"},{"c":"g27cm","id":"g27cm:detail","q":"關於診斷碼的詳細程度（level of detail），下列何者正確？","o":["碼必須編至可用的最多字元數（含適用的第 7 碼），否則視為無效碼","三碼類目即使有細分，只要已有診斷也可直接使用","第 7 碼為選擇性，可省略","只要編到第 5 碼就算完整"],"e":"三碼類目僅在沒有再細分時才可使用；若未編至該碼所需的完整字元數（含 7th character），則該碼無效。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:acchr","q":"同一病況被描述為既屬急性（亞急性）又屬慢性，且 Alphabetic Index 在同一縮排層級有各自的次詞，應如何編碼？","o":["兩者都編，急性（亞急性）碼排在前","只編慢性碼","只編急性碼","兩者都編，慢性碼排在前"],"e":"依指引，同一病況同時為急性（亞急性）與慢性，且 Index 在同一縮排層級各有次詞時，兩者皆編，急性（亞急性）碼先排。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.8）","s":"g27cm"},{"c":"g27cm","id":"g27cm:combo","q":"當分類中已有組合碼（combination code）能完整涵蓋所記載的診斷與其合併症／表現時，應如何處理？","o":["只編組合碼；僅在組合碼缺乏所需特異性時才加碼","組合碼與各別碼都要編","優先編各別碼以提高特異性","先編組合碼，再把每個元素各自加編"],"e":"指引指出：組合碼已能完整識別所有診斷元素時，不應再多重編碼；只有組合碼對表現或併發症的描述不夠時，才以次要碼補充。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.9）","s":"g27cm"},{"c":"g27cm","id":"g27cm:sequela","q":"殘餘效應（sequela）通常需要兩個碼，其排序為何？","o":["先編殘餘病況或其性質，再編 sequela（後遺症）碼；導致後遺症的急性期疾病碼不得與 sequela 碼併用","先編 sequela 碼，再編殘餘病況","急性期疾病碼與 sequela 碼併用，急性碼排第一","只編 sequela 碼，不編殘餘病況"],"e":"編 sequela 通常需兩碼：殘餘病況或其性質在先，sequela 碼在後（例外：sequela 碼後有表現碼，或已擴充至含表現）。導致後遺症的急性期碼永不與 late effect 碼併用；sequela 無時間限制。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.10）","s":"g27cm"},{"c":"g27cm","id":"g27cm:threat","q":"出院時被描述為「threatened（威脅性）」的病況但並未實際發生，且 Alphabetic Index 沒有 threatened 次詞，應如何編碼？","o":["編現存的潛在病況，不編被描述為 threatened 的病況","當作已確診編碼","不編任何碼","編為疑似診斷的症狀碼 R69"],"e":"「impending/threatened」若確實發生則編為確診；未發生時須查 Index 有無「impending」「threatened」次詞，有則編之；沒有則編現存的潛在病況。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.11）","s":"g27cm"},{"c":"g27cm","id":"g27cm:dup","q":"同一次就診中，同一個 ICD-10-CM 診斷碼可報告幾次？","o":["每個不重複的診斷碼一次就診只報告一次，包括沒有側別專屬碼的雙側病況","雙側病況可報告兩次以表達左右兩側","只要在不同日期記載就可重複報告","有不同醫師記載時可重複報告"],"e":"每個獨特的診斷碼一次就診只可報告一次；這也適用於沒有區分側別的碼的雙側病況，以及兩個不同病況歸到同一碼的情形。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.12）","s":"g27cm"},{"c":"g27cm","id":"g27cm:lat","q":"雙側白內障於不同次住院／就診分別手術，第一側手術那次就診，應如何選擇側別碼？","o":["雙側碼（病況仍在兩側），第二次則依仍存在病況的一側編單側碼","第一次就編單側碼，第二次再編另一側","兩次都編雙側碼","兩次都編側別未特指碼"],"e":"雙側病況分次治療時，第一次治療那次仍因兩側皆有病況而編雙側碼；第二次治療前，已治療側的病況不再存在，所以編仍存在一側的單側碼（若第一次未完全解決，才仍可用雙側碼）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.13）","s":"g27cm"},{"c":"g27cm","id":"g27cm:oth","q":"下列哪項資訊可依非「病人提供者」之其他臨床人員（如護理師、營養師）的紀錄編碼？","o":["壓瘡的分期（pressure ulcer stage）","敗血症的診斷","肺炎的診斷","手術併發症與手術的因果關係"],"e":"例外清單包含 BMI、非壓力性慢性潰瘍深度、壓瘡分期、昏迷量表、NIHSS、SDOH、側別、血液酒精濃度、免疫不足狀態、槍傷意圖等；但相關診斷（如壓瘡本身）仍須由病人的提供者記載。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.14）","s":"g27cm"},{"c":"g27cm","id":"g27cm:bmi","q":"關於 BMI、昏迷量表、NIHSS 等碼的報告，指引的規定為何？","o":["只能作為次要診斷報告，且相關診斷（如肥胖）須由病人的提供者記載","可作為主診斷","只要營養師記載了 BMI 就可同時推定有肥胖診斷","只能在門診報告"],"e":"BMI、昏迷量表、NIHSS、血液酒精濃度、SDOH 與免疫不足狀態碼只能作為次要診斷；雖可依其他臨床人員記錄，但相關診斷（肥胖、急性中風、F10 等）必須由病人的提供者記載。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.14）","s":"g27cm"},{"c":"g27cm","id":"g27cm:comp","q":"關於「醫療照護併發症」的編碼，下列何者正確？","o":["須有照護與病況間的因果關係且具臨床意義；不必明確寫出「complication」一詞","病歷必須明確使用「complication」才能編碼","手術後發生的任何病況都視為併發症","併發症碼只能由編碼員依時間先後推定"],"e":"編碼依提供者對病況與照護／手術關係的記載；須有因果關係，且病況具臨床意義，但不必明確寫「complication」（如病況改變了手術過程）。關係不清時須查詢提供者。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.16）","s":"g27cm"},{"c":"g27cm","id":"g27cm:border","q":"出院時診斷記載為「borderline」，且 ICD-10-CM 無專屬索引條目時，應如何編碼？","o":["依確診編碼；若索引有專屬條目（如 borderline diabetes）則依該條目","依疑似診斷處理，門診不編","一律改編症狀碼","不編任何碼"],"e":"「borderline」診斷除非分類有專屬條目（如 borderline diabetes），否則當作確診編碼。因為 borderline 不屬於不確定診斷，所以不分門診或住院。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.17）","s":"g27cm"},{"c":"g27cm","id":"g27cm:unspec","q":"關於使用症狀碼與「未特指（unspecified）」碼，指引的立場為何？","o":["當它們最能反映該次就診已知的資訊時是可接受的；不應為求更特定的碼而做不必要的檢查","未特指碼一律禁止使用","應要求醫師進一步檢查，直到可編特定碼為止","診斷尚未確立時一律不可編症狀碼"],"e":"症狀／未特指碼有時是最佳選擇：若診斷尚未確立，可編症狀碼；資訊不足以更特定時可編未特指碼。選用病歷無法支持的特定碼，或為了得到更特定的碼而做不必要檢查，都是不適當的。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.18）","s":"g27cm"},{"c":"g27cm","id":"g27cm:multi","q":"ICD-10-CM 對「multiple（多處）」的定義，以及在無章節專屬指引時的處理為何？","o":["兩處以上；有記載特定部位時各自編碼，部位未記載時才編「multiple sites」碼","三處以上；一律編 multiple sites 碼","兩處以上；一律編 multiple sites 碼","一處以上；一律各自編碼"],"e":"分類將「multiple」定義為涉及兩處以上；無章節專屬指引時，有記載特定部位就各部位分別編碼，部位未記載時才選 multiple sites 碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.B.20）","s":"g27cm"},{"c":"g27cm","id":"g27cm:hiv1","q":"病人因 HIV 相關疾病住院，主診斷應如何選擇？","o":["B20（人類免疫缺乏病毒［HIV］病），後接所有 HIV 相關病況碼","HIV 相關疾病本身的碼，B20 作為次要診斷","Z21（無症狀 HIV 感染狀態）","R75（HIV 實驗室證據）"],"e":"因 HIV 相關病況入院，主診斷為 B20，再加所有報告的 HIV 相關病況碼；例外是 HIV 相關溶血性尿毒症候群，先編 D59.31 再編 B20。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.a.2(b)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:hiv2","q":"HIV 病人因外傷（與 HIV 無關）住院，主診斷為何？","o":["外傷的碼（傷害性質碼）；B20 作為次要診斷","B20","Z21","外傷的外因碼"],"e":"HIV 病人因無關的疾病（如外傷）入院，無關病況碼（如傷害的性質碼）作主診斷，B20 與其他記載的病況為次要診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.a.2(c)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:uro","q":"提供者在病歷中使用「urosepsis」一詞，編碼員應如何處理？","o":["它是非特異性詞彙，不等於 sepsis，Index 沒有預設碼，須向提供者查詢","編為敗血症 A41.9","編為泌尿道感染 N39.0","編為菌血症 R78.81"],"e":"urosepsis 是不具特異性的用語，不可視為與 sepsis 同義，在 Alphabetic Index 中沒有預設碼；提供者用此詞時須查詢澄清。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.1(a)(ii)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:sevsep","q":"「嚴重敗血症（severe sepsis）」的編碼，下列何者正確？","o":["至少兩碼：先編潛在的全身性感染，再編 R65.2-，並加編相關急性器官功能障礙碼；未記載病原時感染編 A41.9","只需一個 R65.2- 碼","R65.2- 碼可作為主診斷","先編 R65.2-，再編全身性感染碼"],"e":"嚴重敗血症至少需要兩碼：先為潛在全身性感染（無病原則 A41.9），再為 R65.2- 嚴重敗血症，並加編相關急性器官功能障礙碼；R65.2- 永遠不可作為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.1(b) 與 I.C.1.d.3）","s":"g27cm"},{"c":"g27cm","id":"g27cm:shock","q":"敗血性休克（septic shock）碼的使用，下列何者正確？","o":["全身性感染碼排第一，再編 R65.21；敗血性休克碼不可作為主診斷","R65.21 可作為主診斷","只編 R65.21，不必編感染碼","R65.21 排在其他器官功能障礙碼之前即可，不需先編感染碼"],"e":"敗血性休克是一種急性器官功能障礙：先編全身性感染碼，再編 R65.21（或術後 T81.12），其他急性器官功能障礙另加；依 Tabular List 排序註記，敗血性休克碼不可為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:orgdys","q":"病人有敗血症，也有急性器官功能障礙，但病歷顯示該器官功能障礙與敗血症以外的其他病況有關。是否可編 R65.2-？","o":["不可，急性器官功能障礙須與敗血症相關才可編嚴重敗血症碼；關聯不清時須查詢提供者","可以，只要同時存在即可","可以，但須排在第二順位","視檢驗數值而定，不必查詢"],"e":"嚴重敗血症碼要求急性器官功能障礙與敗血症有關；若病歷顯示器官功能障礙與其他病況有關，不編 R65.2-；關聯不清則查詢。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.1(a)(iv)）","s":"g27cm"},{"c":"g27cm","id":"g27cm:seploc","q":"病人因敗血症合併局部感染（如肺炎）入院，應如何排序？","o":["先編全身性感染（敗血症）碼，局部感染為次要；若敗血症是入院後才發生，則局部感染先編","局部感染一律排第一","兩者可任意排序","敗血症一律排在局部感染之後"],"e":"入院原因為敗血症合併局部感染時，全身性感染碼為第一，局部感染為次要診斷；若入院時只有局部感染（如肺炎），敗血症／嚴重敗血症在入院後才發生，則局部感染先編。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.1.d.4）","s":"g27cm"},{"c":"g27cm","id":"g27cm:obcls","q":"病歷同時記載「第 3 級肥胖（class 3 obesity）」與「病態肥胖（morbid obesity）」，應如何編碼？","o":["只編第 3 級肥胖碼，因它較為特定","兩者都編","只編病態肥胖碼","兩者都不編，改編 E66.9"],"e":"肥胖級別碼（E66.81-）須由提供者記載級別，可與 Chapter 4、15 的其他肥胖碼併報；但若同時記載第 3 級與病態肥胖，只編第 3 級肥胖碼（較為特定）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.4.b.1）","s":"g27cm"},{"c":"g27cm","id":"g27cm:f4541","q":"純粹與心理因素相關的疼痛，應編哪個碼？此時能否同時編 G89 類疼痛碼？","o":["F45.41；不可，因 G89 類目下有 Excludes1 註記","F45.41；可以，同時編 G89","F45.42；不可同時編 G89","G89.4；不可同時編 F45.41"],"e":"純心理因素的疼痛編 F45.41；G89 類目的 Excludes1 註記使二者不能併報。F45.42（疼痛症併相關心理因素）才與 G89 碼併用。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.5.a）","s":"g27cm"},{"c":"g27cm","id":"g27cm:hcrisis","q":"依 FY2027 指引，病歷記載「高血壓急迫（hypertensive urgency）」時，應如何編碼？","o":["編 I16 類目碼，並加編已確認的高血壓疾病（I10–I15、I1A）；排序依就診原因","僅編 I10，不另編 I16","僅編 I16，不編其他高血壓碼","一律把 I16 排在高血壓疾病碼之前"],"e":"高血壓急迫、高血壓緊急或未特指的高血壓危象都編 I16；同時編碼任何已確認的高血壓疾病（I10–I15、I1A），排序視就診原因而定。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.10）","s":"g27cm"},{"c":"g27cm","id":"g27cm:transht","q":"門診血壓偏高，但無高血壓診斷，也沒有既往高血壓診斷。應如何編碼？","o":["R03.0（無高血壓診斷的血壓讀數升高）","I10","I15.9","I16.9"],"e":"「暫時性高血壓」：除非病人已有高血壓的確立診斷，否則編 R03.0；妊娠的暫時性高血壓則依 O13.- 或 O14.-。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.7）","s":"g27cm"},{"c":"g27cm","id":"g27cm:uncon","q":"病歷記載「uncontrolled hypertension」，應如何選碼？","o":["依其病況編 I10–I15 類碼，不另有專屬的「未控制」碼","I16（高血壓危象）","I1A.0（抗藥性高血壓）","R03.0"],"e":"「未控制」可能指未治療或對現行療法無反應，兩者都編 I10–I15 的適當碼；「controlled」同理。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.8–9）","s":"g27cm"},{"c":"g27cm","id":"g27cm:secht","q":"次發性高血壓（secondary hypertension）的編碼要求為何？","o":["需要兩碼：潛在病因碼與 I15 類碼，排序依入院／就診原因","只編 I10","只編病因碼","必須先編 I15，再編病因碼"],"e":"次發性高血壓由潛在病況引起，需要兩碼：一為病因，一為 I15；排序由入院或就診的原因決定。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.6）","s":"g27cm"},{"c":"g27cm","id":"g27cm:resist","q":"病歷記載「treatment resistant hypertension」，應如何編 I1A.0？","o":["作為附加碼（additional code），並同時編高血壓的類型","作為第一順位診斷碼，取代其他高血壓碼","只編 I1A.0，不編高血壓類型","與 I16 併報"],"e":"提供者記載明顯抗藥性、抗藥性或真正抗藥性高血壓時，I1A.0 作為附加碼，另須編高血壓的特定類型碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.9.a.12）","s":"g27cm"},{"c":"g27cm","id":"g27cm:pu1","q":"病人入院時病歷記載壓瘡「已完全癒合」，應如何編碼？","o":["不編壓瘡碼","編 L89 的未特指分期碼","編 L89 第 1 期","編 L89 無法分期碼"],"e":"入院時壓瘡已記載完全癒合，不指定任何壓瘡碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.12.a.4）","s":"g27cm"},{"c":"g27cm","id":"g27cm:pu2","q":"無法分期的壓瘡（unstageable），在清創後揭露出分期，應如何編碼？","o":["只編清創後揭露的分期碼","同時編無法分期碼與揭露的分期碼","只編無法分期碼","編未特指分期碼"],"e":"無法分期（L89.--0）依臨床記載，如被焦痂覆蓋或已植皮；與「未特指分期（L89.--9）」不同，後者用於完全沒有分期記載。若同一次就診清創後揭露分期，只編揭露的分期碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.12.a.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:z05","q":"健康新生兒為排除疑似疾病而做觀察與評估，結果未發現問題，應如何使用 Z05 類目？","o":["Z05 用於疑似病況經評估後確定不存在者；若記載有疑似問題的症狀或徵象，則編該症狀或徵象","只要有疑似問題就編 Z05，即使有症狀","Z05 只能作為主診斷","Z05 不可與 Z38 同時使用"],"e":"Z05 用於健康新生兒評估疑似疾病，經檢查排除者；有疑似問題的徵象或症狀時不可用 Z05，應編徵象／症狀。在出生紀錄上，Z05 作次要碼，排在 Z38 之後。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.16.b.1 與 b.3）","s":"g27cm"},{"c":"g27cm","id":"g27cm:z05b","q":"FY2027 指引中，非出生紀錄（如再入院）上的 Z05 碼，何時可作主診斷／第一順位診斷？","o":["當 Z38 已不再適用，且為健康新生兒／嬰兒、檢查後未發現病況時","任何時候","只有在出生紀錄上","只有新生兒有症狀時"],"e":"指引 I.C.16.b.2：Z05 可為再入院或就診的主診斷／第一順位診斷，條件是 Z38 不再適用；Z05 僅供健康新生兒與嬰兒、經研判沒有病況者使用。（來源：ICD-10-CM 官方編碼指引 FY2027 Section I.C.16.b.2）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2a","q":"主診斷選擇：當相關的確定診斷已確立時，第 18 章的症狀、徵象與不明確病況碼可否作主診斷？","o":["不可","可以，只要為入院的第一個原因","可以，只要住院天數超過 3 天","可以，但須附加原因碼"],"e":"當相關的確定診斷已確立，症狀、徵象與不明確病況碼（第 18 章）不可作為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.A）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2b","q":"兩個以上互相關聯的病況都可能符合主診斷定義（如同一章中的疾病），選擇主診斷的原則為何？","o":["任一病況都可排第一，除非就診情況、所給治療、Tabular List 或 Alphabetic Index 另有指示","一律由編碼員依國際慣例排最嚴重者","一律依字母／碼序排序","一律須查詢醫師"],"e":"互相關聯且皆符合主診斷定義時，哪一個排第一均可，除非入院情況、治療、Tabular List 或 Index 另有指示。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.B）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2d","q":"病歷記載「肺炎或心衰竭（either/or）」兩個對比診斷，如何編碼與排序？","o":["兩者都當作已確診編碼，依入院情況排序；若無法判斷，任一個先編皆可","只編較嚴重者","兩者都不編，改編症狀碼","一律先編 Chapter 9"],"e":"兩個以上對比（comparative/contrasting）診斷以「either/or」記載時，都當作確診編碼，並依入院情況排序；無法進一步決定時，任一均可為第一。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.D）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2f","q":"原定治療計畫因意外情況而未能執行，主診斷應選什麼？","o":["經檢查後造成住院的病況，即使治療未執行","治療計畫改變後的新病況","造成治療取消的原因","一律改編 Z53 類碼"],"e":"原治療計畫未執行時，仍以經檢查後造成住院的病況作為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.F）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2g","q":"因手術或其他醫療照護的併發症而入院治療，主診斷應如何選？","o":["併發症碼作為主診斷；若併發症屬 T80–T88 且特異性不足，另加特定併發症碼","原手術的原因","併發症碼作為次要診斷","T80–T88 碼不可作為主診斷"],"e":"入院原因是治療手術或其他醫療照護的併發症時，併發症碼為主診斷；若屬 T80–T88 且特異性不足以描述，須另加指出特定併發症的碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.G）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2h","q":"出院時診斷記載為「probable」「suspected」「likely」，在哪些設施，這些不確定診斷可當作確立診斷編碼？","o":["僅限於短期急性、長期照護與精神科醫院的住院，門診不適用","所有門診與住院皆適用","只限於門診","只限於手術病人"],"e":"不確定診斷（probable、suspected、likely、questionable、possible、still to be ruled out、compatible with、consistent with 等）在出院時視為確診編碼，但這項指引僅適用於短期急性、長期照護與精神科醫院的住院；門診不適用。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.H 與 IV）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2j","q":"病人在醫院門診手術後接著因併發症而轉為同院住院，主診斷如何選？","o":["住院原因是併發症時，併發症為主診斷","一律是門診手術的原因","一律是手術碼","一律由編碼員自行裁量"],"e":"門診手術後轉住院：住院理由是併發症則併發症為主診斷；沒有併發症或其他病況記載時，門診手術的原因為主診斷；住院理由是與手術無關的其他病況，該病況為主診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.J）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p2k","q":"為復健（rehabilitation）而入院，第一順位診斷應如何選？","o":["編接受復健的病況；若該病況已不存在則編追蹤照護（aftercare）碼，但損傷後的復健編損傷碼加第 7 碼 D","一律編 Z51.89","一律編原因急性病況的初診碼","一律編 aftercare 碼"],"e":"復健入院先編正在接受服務的病況（如 I69.351）；病況已不存在時編 aftercare（如髖關節置換後復健 Z47.1），但損傷後復健例外，編損傷碼加 D（如 S72.141D）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section II.K）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p3a","q":"Section III 對「先前病況（previous conditions）」的規定為何？","o":["對本次住院無影響的已解決病況不報告；但歷史碼（Z80–Z87）對現行照護有影響時可作次要碼","所有出現在診斷陳述上的病況皆須報告","歷史碼絕不可使用","已解決的病況只要有 ICD 碼就須報告"],"e":"提供者列在最終診斷陳述的診斷通常應編碼，但對本次住院無影響、已解決的病況與過往手術狀態不報告（除非醫院政策要求）；歷史碼若對現行照護有影響可作次要碼。（來源：ICD-10-CM 官方編碼指引 FY2027 Section III.A）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p3b","q":"住院病人檢驗結果異常，但提供者未表示其臨床意義，是否應編碼？","o":["不編；若異常值已安排其他檢查或治療，可向提供者查詢是否加入","一律編碼","異常值超過正常範圍就編碼","由編碼員依數值判斷嚴重度後編碼"],"e":"住院的異常發現（實驗室、X光、病理）除非提供者指出臨床意義，否則不編碼；超出正常範圍並已安排其他檢查或治療時，可詢問提供者。（來源：ICD-10-CM 官方編碼指引 FY2027 Section III.B）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p4a","q":"門診手術病人因禁忌症而未能執行手術，第一順位診斷應如何選？","o":["編手術的原因（reason for the surgery）","編禁忌症","編 Z53 類目碼","不報告任何診斷"],"e":"門診手術時，即使手術因禁忌症未執行，仍以手術原因為第一順位診斷（reason for the encounter）。（來源：ICD-10-CM 官方編碼指引 FY2027 Section IV.A.1）","s":"g27cm"},{"c":"g27cm","id":"g27cm:p4b","q":"門診手術後出現併發症而收住觀察室，診斷如何排序？","o":["手術原因為第一順位，併發症為次要診斷","併發症為第一順位","兩者任意排序","只報告併發症"],"e":"門診手術後因併發症入觀察：第一報告手術原因（就診原因），再報告併發症為次要診斷。（來源：ICD-10-CM 官方編碼指引 FY2027 Section IV.A.2）","s":"g27cm"},{"c":"g27pcs","id":"g27pcs:a1","q":"ICD-10-PCS 碼由幾個字元組成？每個字元代表什麼？","o":["七個字元，每個字元是一個分類軸（axis of classification）","五個字元，每個字元代表手術部位","七個字元，每個字元固定代表相同資訊，與章節無關","六個字元，第七碼為選擇性"],"e":"每個 PCS 碼有七個字元，每個字元都是一個分類軸；在一個定義的碼範圍內，字元代表同一類型的資訊（如第 5 碼在 0–4、7–9 章為手術方式）。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A1）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a2","q":"ICD-10-PCS 每個字元可用哪些值？","o":["數字 0–9 與英文字母（不含 I 與 O），共 34 種可能值","數字 0–9 與全部 26 個字母","只有數字 0–9","數字 0–9 與字母（不含 L 與 O）"],"e":"PCS 每個字元可為 0–9 與英文字母，但排除 I 與 O 以免與 1、0 混淆，故共 34 種可能值。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A2）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a4","q":"在 ICD-10-PCS 中，同一個字元值（如體部值 0）在不同體系是否意義相同？","o":["不同；一個值的意義取決於其分類軸與所依附的前面字元，例如中樞神經系統 0＝腦，周邊神經系統 0＝頸神經叢","相同；值在整個 PCS 系統中永遠代表相同意義","相同；只有手術章節（0）例外","不同，但僅限於 Section X"],"e":"指引舉例：體部值 0 在中樞神經系統代表 Brain，在周邊神經系統代表 Cervical Plexus；值的意義取決於分類軸與前面的值。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A4）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a7","q":"編 PCS 碼時，是否一定要先查 Alphabetic Index？","o":["不必；可直接從 Tables 選出有效碼，但 Tables 必須查閱以找到最適當的有效碼","必須，Index 是唯一合法起點","必須，且只能由 Index 取得完整碼","只有在 Section X 才可直接查 Tables"],"e":"指引 A6：Index 是用來找到包含建構完整碼所需資訊的表；A7：並不要求先查 Index，可直接由 Tables 選取有效碼。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A6–A7）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a8","q":"PCS 文件資訊不完整、無法指定全部七個字元時，應如何處理？","o":["向醫師查詢所需資訊；七個字元都指定才是有效碼","用 Z 補足缺的字元","編至已知的字元數即可","自行以最常見值填入"],"e":"必須指定全部七個字元才是有效碼；若文件不足以編碼，應向醫師查詢。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A8）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:a11","q":"醫師病歷記載「partial resection」，編碼員是否須先查詢才能決定 root operation？","o":["不必；編碼員應自行判斷「partial resection」對應 Excision","必須查詢，因為 partial resection 對應 Resection","必須查詢，因為不確定是 Excision 或 Detachment","直接編 Resection"],"e":"編碼員有責任判斷病歷記載相當於 PCS 的哪個定義；醫師不必使用 PCS 用語。指引舉例：「partial resection」可獨立對應到 Excision，無須查詢。（來源：ICD-10-PCS 官方指引 FY2027 Conventions A11）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b21b","q":"在 Upper 與 Lower 為體部值選項的系統（如 Upper Arteries、Lower Veins、Muscles），「upper」與「lower」如何界定？","o":["以橫膈膜為界，位於橫膈膜上方為 upper、下方為 lower","以腰部為界","以心臟為界","以骨盆為界"],"e":"當體部值提供一般性的「upper」「lower」選項時，upper 與 lower 分別指橫膈膜之上與之下。（來源：ICD-10-PCS 官方指引 FY2027 B2.1b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b31b","q":"開放式肝臟切片，為到達手術部位所做的剖腹，是否另編碼？","o":["不另編；到達與關閉手術部位所需的步驟，以及 root operation 定義內含的成分，均不另編","另編 Inspection","另編 Division","另編 Bypass"],"e":"指引舉例：為開放肝切片而剖腹不另編；乙狀結腸切除併降結腸與直腸吻合時，吻合也不另編。（來源：ICD-10-PCS 官方指引 FY2027 B3.1b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b32d","q":"原擬腹腔鏡膽囊切除術，術中轉為開腹膽囊切除，應如何編碼？","o":["編經皮內視鏡的 Inspection，與開放的 Resection（兩者皆編）","只編開放的 Resection","編經皮內視鏡的 Resection","只編經皮內視鏡的 Inspection"],"e":"預定的 root operation 先以一種方式嘗試，後轉為另一種方式時，兩者皆編：腹腔鏡 Inspection 與開放 Resection。（來源：ICD-10-PCS 官方指引 FY2027 B3.2d）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b32b","q":"同一次手術中，切除縫匠肌與股薄肌的病灶，兩者都屬「上腿肌肉」體部值，應如何編碼？","o":["各別編碼（兩個程序），因為是同一體部值內分開的兩個獨立部位","只編一個碼","只編較大塊肌肉的碼","改編 Anatomical Regions 碼"],"e":"同一 root operation 於同一體部值內多個分離且不同的部位重複執行時，要分別編碼（如縫匠肌與股薄肌，或多個趾甲的 Extraction）。（來源：ICD-10-PCS 官方指引 FY2027 B3.2b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b33","q":"預定主動脈瓣置換術，在開胸後、切開心肌前，病人血行動力學不穩而中止手術，應如何編碼？","o":["開放 Inspection of mediastinum（縱膈腔）","Replacement of aortic valve","Resection of aortic valve","不編碼"],"e":"手術中止或未完成時，編實際執行的 root operation；若在執行任何其他 root operation 之前就中止，編 Inspection（針對檢視的部位或區域）。本例編開放的縱膈腔 Inspection。（來源：ICD-10-PCS 官方指引 FY2027 B3.3）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b34a","q":"骨髓切片的 root operation 與限定詞為何？","o":["Extraction，限定詞 Diagnostic","Excision，限定詞 Diagnostic","Drainage，限定詞 Diagnostic","Inspection，無限定詞"],"e":"切片編 Excision、Extraction 或 Drainage 加限定詞 Diagnostic：骨髓切片為 Extraction Diagnostic；肺部液體的細針抽吸為 Drainage Diagnostic；淋巴結採樣為 Excision Diagnostic。（來源：ICD-10-PCS 官方指引 FY2027 B3.4a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b34b","q":"乳房先做切片，隨後在同一手術部位做部分乳房切除，應如何編碼？","o":["切片與部分乳房切除兩者皆編","只編部分乳房切除","只編切片","兩者合併編為一個 Resection 碼"],"e":"切片之後接著在同一部位做更確定的治療（Destruction、Excision、Resection），兩者都編。（來源：ICD-10-PCS 官方指引 FY2027 B3.4b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b35","q":"excisional debridement 涉及肌肉與肌腱的重疊層次，應編到哪一個體部值？","o":["肌腱（最深層）","肌肉","皮膚","皮下組織"],"e":"在肌肉骨骼系統重疊層次進行 Excision、Extraction、Repair 或 Inspection 時，編最深層的體部值；肌肉＋肌腱→肌腱，皮膚＋皮下組織＋肌肉→肌肉。（來源：ICD-10-PCS 官方指引 FY2027 B3.5）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b36a","q":"Bypass（繞道）程序中，第 4 字元體部值與限定詞各代表什麼？","o":["體部值＝被繞道的來源（from）；限定詞＝繞道到達的目的地（to）","體部值＝目的地；限定詞＝來源","兩者都代表來源","體部值＝移植物來源；限定詞＝目的地"],"e":"例：胃到空腸的繞道，體部值為 Stomach、限定詞為 Jejunum。（來源：ICD-10-PCS 官方指引 FY2027 B3.6a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b36b","q":"冠狀動脈繞道（CABG）的體部值與限定詞，與其他繞道有何不同？","o":["體部值代表被繞道的冠狀動脈數目；限定詞代表繞道的來源血管","體部值代表來源血管；限定詞代表動脈數目","體部值與限定詞的意義與一般繞道相同","體部值代表使用的移植物種類"],"e":"冠狀動脈繞道的體部值指繞道到的冠狀動脈數目，限定詞指繞道來源（如主動脈）。若多條冠狀動脈使用不同裝置／限定詞，各別編碼。（來源：ICD-10-PCS 官方指引 FY2027 B3.6b–c）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b37","q":"以硝酸銀燒灼治療急性鼻出血，應編哪個 root operation？","o":["Control","Destruction","Repair","Occlusion"],"e":"Control 為停止或企圖停止術後或其他急性出血；以燒灼、應用物質、縫合、結紮等未被更特定 root operation 描述的技術止血時編 Control。若有更特定的 root operation 適用（如以液態栓塞阻斷血流為 Occlusion），則編更特定者。（來源：ICD-10-PCS 官方指引 FY2027 B3.7）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b38","q":"左上肺葉切除術（左上葉整個切除），應編何者？","o":["Resection of Upper Lung Lobe, Left","Excision of Lung, Left","Excision of Upper Lung Lobe, Left","Detachment of Lung, Left"],"e":"PCS 對器官的解剖次分區（如肺葉、肝葉）有各自體部值；整個體部值被切除時編 Resection，而不是對較不特定的體部值編 Excision。（來源：ICD-10-PCS 官方指引 FY2027 B3.8）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b39","q":"冠狀動脈繞道手術同時取下大隱靜脈作為移植物，大隱靜脈的取得應如何編碼？","o":["另編一個 Excision 程序，因限定詞並未完整指定自體移植物取得部位","不另編，已含在 Bypass 內","另編 Resection","另編 Detachment"],"e":"自體移植物取自不同手術部位時另編；例外是 PCS 表格的第 7 碼已完整指定取得部位，如 DIEP 皮瓣乳房置換，皮瓣取得不另編。（來源：ICD-10-PCS 官方指引 FY2027 B3.9）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b310c","q":"脊椎椎體關節融合使用內含碎骨移植的 cage 式椎體間融合裝置，應選何種裝置值？","o":["Interbody Fusion Device","Autologous Tissue Substitute","Nonautologous Tissue Substitute","Synthetic Substitute"],"e":"使用含骨移植的椎體間融合裝置使關節固定時，編 Interbody Fusion Device；僅骨移植時視自體或非自體編相應 Tissue Substitute；自體與非自體骨混合時編 Autologous Tissue Substitute。（來源：ICD-10-PCS 官方指引 FY2027 B3.10c）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b311b","q":"膀胱輸尿管鏡檢查，檢視膀胱與輸尿管，Inspection 應編到哪個體部值？","o":["Ureter（最遠端的管狀構造）","Bladder","Urinary Tract（區域）","兩者各編一碼"],"e":"檢視多個管狀構造時，編最遠端（離起始點最遠）者；若檢視多個非管狀構造，編代表整個檢視區域的體部值（如剖腹探查編 Peritoneal Cavity）。（來源：ICD-10-PCS 官方指引 FY2027 B3.11b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b312","q":"腫瘤栓塞（tumor embolization）與腦動脈瘤栓塞，各應編何種 root operation？","o":["腫瘤栓塞編 Occlusion；腦動脈瘤栓塞編 Restriction","兩者皆 Occlusion","兩者皆 Restriction","腫瘤栓塞編 Restriction；腦動脈瘤栓塞編 Occlusion"],"e":"栓塞目的為完全關閉血管編 Occlusion（腫瘤栓塞切斷血液供應）；目的為縮窄管腔編 Restriction（腦動脈瘤處縮窄管腔而非完全阻斷）。（來源：ICD-10-PCS 官方指引 FY2027 B3.12）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b313","q":"腸黏連分離術（lysis of intestinal adhesions），Release 的體部值應如何選？","o":["被鬆解的特定腸段（被釋放的體部），而非被切開的黏連組織","黏連組織","Peritoneum","Anatomical Regions, General"],"e":"Release 的體部值是被釋放的體部，不是為釋放而操作或切開的組織。（來源：ICD-10-PCS 官方指引 FY2027 B3.13）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b314","q":"把神經根從周圍疤痕組織中鬆解以緩解疼痛，與切斷神經根以緩解疼痛，分別是何種 root operation？","o":["前者 Release；後者 Division","前者 Division；後者 Release","兩者皆 Release","兩者皆 Excision"],"e":"唯一目的為釋放體部而不切割該體部＝Release；唯一目的為分離或橫切體部＝Division。（來源：ICD-10-PCS 官方指引 FY2027 B3.14）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b315","q":"無移位骨折以石膏固定，與有移位骨折閉鎖整復後上石膏，分別如何編碼？","o":["前者編 Placement 章節的 Immobilization；後者編 Reposition，石膏不另編","前者編 Reposition；後者編 Immobilization","兩者皆編 Immobilization","兩者皆編 Reposition 並另編石膏"],"e":"有移位骨折的整復編 Reposition，併用的石膏或夾板不另編；無移位骨折依實際執行的程序編碼（石膏為 Immobilization；打釘為 Insertion）。（來源：ICD-10-PCS 官方指引 FY2027 B3.15）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b316","q":"自體或非自體骨髓、胰島細胞、幹細胞的輸入，應編何處？","o":["Administration 章節","Transplantation（Medical and Surgical）","Transfer","Replacement"],"e":"Transplantation 為放入另一個體或動物的成熟且具功能的活體部位；放入自體或非自體細胞（骨髓、胰島細胞、幹細胞）則編 Administration 章節。（來源：ICD-10-PCS 官方指引 FY2027 B3.16）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b317","q":"肌皮瓣（musculocutaneous flap）轉移，體部值應如何選？","o":["皮瓣中最深層組織所對應的體部值（肌肉），限定詞描述其他組織層","皮膚","皮下組織","必須編成三個獨立程序"],"e":"多組織層的 Transfer 編到皮瓣中最深層組織的體部值，並用限定詞描述其他組織層。（來源：ICD-10-PCS 官方指引 FY2027 B3.17）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b318","q":"乳房切除後立即重建，與全關節置換前切除關節，各應如何處理？","o":["乳房切除與重建兩者皆編；關節置換的關節切除屬整合性準備，不另編","兩者都只編置換／重建","兩者的切除皆須另編","兩者的切除皆不另編"],"e":"切除後接置換，通常兩者皆編以呈現各自目的；但若切除為置換所必需的整合性準備（如關節置換、瓣膜置換的切除）則不另編。（來源：ICD-10-PCS 官方指引 FY2027 B3.18）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b319","q":"手部截肢，「Complete」與「Partial」在 PCS 定義中分別指什麼？","o":["Complete＝經腕掌關節（足部為跗蹠關節）；Partial＝沿掌骨（蹠骨）幹或頭的任何位置","Complete＝經掌指關節；Partial＝經腕掌關節","Complete＝經腕骨；Partial＝經指骨","Complete＝經橈尺骨；Partial＝經掌骨"],"e":"手與足的 Detachment：Complete 指經腕掌關節（手）或跗蹠關節（足）的截肢；Partial 指沿掌骨或蹠骨幹或頭的任何位置的截肢。拇指、手指、腳趾的 Complete 則指經掌指／蹠趾關節。（來源：ICD-10-PCS 官方指引 FY2027 B3.19）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b41a","q":"手術在下頷骨牙槽突（alveolar process）進行，PCS 沒有該部位的獨立體部值，應編到何處？","o":["Mandible（整個下頷骨）","Maxilla","Tooth","Skull"],"e":"手術部位只是某體部的一部分、且無獨立體部值時，編對應整個體部的值。（來源：ICD-10-PCS 官方指引 FY2027 B4.1a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b41b","q":"手術部位記載為骨膜（periosteum）時，應編到什麼體部值？","o":["對應的骨頭","皮下組織","肌肉","Anatomical Regions"],"e":"指引舉例：涉及骨膜的手術編到對應的骨體部值；「peri-」加體部（如 perirenal）且部位未進一步特定時，編到所命名的體部（腎）。（來源：ICD-10-PCS 官方指引 FY2027 B4.1b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b43","q":"相同程序施行於雙側輸卵管，與雙側膝關節，各如何編碼？","o":["輸卵管編一碼（Fallopian Tube, Bilateral）；膝關節編兩碼（右、左各一）","兩者皆編一碼","兩者皆編兩碼","輸卵管編兩碼；膝關節編一碼"],"e":"只有部分體部有雙側值；有雙側值者相同程序編一碼，沒有則左右分別編碼。（來源：ICD-10-PCS 官方指引 FY2027 B4.3）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b44","q":"兩條冠狀動脈做血管成形術，一條置放支架、另一條未放支架，應如何編碼？","o":["分別編碼：Dilation 一條動脈併 Intraluminal Device，與 Dilation 一條動脈無裝置","編一個 Dilation 兩條動脈併 Intraluminal Device","編一個 Dilation 兩條動脈無裝置","編 Insertion of 兩條動脈"],"e":"冠狀動脈是單一體部值，以治療的動脈數指定；僅當同一程序的裝置與限定詞值都相同才合為一碼，裝置不同須分開編。（來源：ICD-10-PCS 官方指引 FY2027 B4.4）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b45","q":"前十字韌帶（ACL）修補與膝關節鏡下軟骨修整，兩者的體部值是否相同？","o":["不同；ACL 修補編 Bursae and Ligaments 的膝體部，關節鏡軟骨修整編 Lower Joints 的膝關節","相同，都編 Lower Joints 的膝關節","相同，都編 Bursae and Ligaments","相同，都編 Tendons"],"e":"作用於關節周圍的肌腱、韌帶、滑囊、筋膜時，編以該結構為焦點的所屬系統體部；作用在關節構造本身（如關節軟骨）才編關節系統。（來源：ICD-10-PCS 官方指引 FY2027 B4.5）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b46","q":"對覆蓋肩關節的皮膚、皮下組織或筋膜進行程序，體部值應編至哪裡？膝關節呢？","o":["肩編 Upper Arm；膝編 Lower Leg","肩編 Lower Arm；膝編 Upper Leg","肩編 Upper Arm；膝編 Upper Leg","肩編 Chest；膝編 Foot"],"e":"指引對應：肩→上臂，肘→下臂，腕→下臂，髖→大腿（Upper Leg），膝→小腿（Lower Leg），踝→足。（來源：ICD-10-PCS 官方指引 FY2027 B4.6）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b47","q":"某系統（如 Muscles）沒有手指的獨立體部值，切除指肌肉應編到哪個體部？","o":["Hand（手）的肌肉體部值","Upper Arm","Lower Arm and Wrist","Anatomical Regions, Upper Extremities"],"e":"體系沒有指／趾的獨立體部值時，手指編手、腳趾編足。（來源：ICD-10-PCS 官方指引 FY2027 B4.7）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b48","q":"Upper Intestinal Tract 與 Lower Intestinal Tract 的範圍如何界定？更換空腸中的裝置（Change）應編哪個？","o":["Upper＝食道至十二指腸（含）；Lower＝空腸至直腸與肛門（含）；空腸裝置編 Lower Intestinal Tract","Upper＝食道至空腸（含）；空腸裝置編 Upper","Upper＝食道至胃；空腸裝置編 Upper","Lower＝迴腸至肛門；空腸裝置編 Upper"],"e":"Upper Intestinal Tract 包含食道到十二指腸；Lower 包含空腸到直腸與肛門，因此空腸裝置的 Change 編 Lower Intestinal Tract。（來源：ICD-10-PCS 官方指引 FY2027 B4.8）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b52a","q":"腹腔鏡輔助乙狀結腸切除（laparoscopic-assisted sigmoidectomy，開放執行主要步驟），手術方式應編何者？","o":["Open（開放）","Percutaneous Endoscopic","Via Natural or Artificial Opening Endoscopic","Percutaneous"],"e":"以開放方式並由經皮內視鏡輔助者，編 Open；此與經皮內視鏡手術，因手輔助或延伸切口取出標本而仍編 Percutaneous Endoscopic 的情形（B5.2b）不同。（來源：ICD-10-PCS 官方指引 FY2027 B5.2a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b52b","q":"手輔助腹腔鏡乙狀結腸切除，並延長切口取出標本，手術方式編何者？","o":["Percutaneous Endoscopic","Open","Percutaneous","External"],"e":"經皮內視鏡手術使用手輔助，或延伸切口以取出全部或部分體部、或吻合管狀構造者，仍編 Percutaneous Endoscopic。（來源：ICD-10-PCS 官方指引 FY2027 B5.2b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b53","q":"扁桃腺切除術與閉鎖性骨折整復，手術方式各編何者？","o":["兩者皆 External","扁桃腺 Open；骨折整復 External","扁桃腺 Via Natural or Artificial Opening；骨折整復 Percutaneous","兩者皆 Via Natural or Artificial Opening"],"e":"在孔道內、不需器械即可看見的構造上所做的程序編 External（如扁桃腺切除）；以外力經中間體層間接施行的程序也編 External（如閉鎖性骨折整復）。（來源：ICD-10-PCS 官方指引 FY2027 B5.3a–b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b54","q":"經由為手術放置的經皮腎造瘻管來碎腎結石，手術方式編何者？","o":["Percutaneous","Via Natural or Artificial Opening","Open","External"],"e":"經由為該程序而放置的裝置，以經皮方式進行，編 Percutaneous。（來源：ICD-10-PCS 官方指引 FY2027 B5.4）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b61","q":"縫線、結紮線、放射標記與暫時性術後傷口引流管，在 PCS 是否編為裝置？","o":["不編；它們視為手術的整合部分","要編為 Drainage Device","要編為 Other Device","要編為 Insertion"],"e":"只有手術結束後仍留存的裝置才編；縫線、結紮、放射標記與暫時性術後傷口引流管均不另編為裝置。若預計留存的裝置在同一手術過程內因故須移除，則置入與移除都要編。（來源：ICD-10-PCS 官方指引 FY2027 B6.1a–b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:b61c","q":"對經皮腎造瘻管（裝置本身）進行沖洗，應如何編碼？","o":["編 Administration 章節的 Irrigation（沖洗植入裝置）","編 Drainage","編 Inspection of kidney","編 Revision"],"e":"只對裝置而非對體部進行的程序，用 Change、Irrigation、Removal、Revision 等 root operation；指引舉例為腎造瘻管沖洗。（來源：ICD-10-PCS 官方指引 FY2027 B6.1c）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:bc2","q":"產後或流產後的子宮內膜刮除或殘留妊娠產物排出，與非產後的 D&C，分別編在哪個章節？","o":["前者在 Obstetrics 章節（Extraction，Products of Conception, Retained）；後者在 Medical and Surgical（Extraction，Endometrium）","兩者皆 Obstetrics 章節","兩者皆 Medical and Surgical 章節","前者在 Medical and Surgical；後者在 Obstetrics"],"e":"產後／流產後的內膜刮除與殘留物清除，編 Obstetrics 章節的 Extraction、Products of Conception, Retained；其他時間的診斷或治療性 D&C 編 Medical and Surgical 的 Extraction、Endometrium。（來源：ICD-10-PCS 官方指引 FY2027 C2）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:bd1","q":"近接治療（brachytherapy）後放射性來源留在體內，除放射治療章節的碼之外，還須如何編？","o":["另編 Medical and Surgical 的 Insertion，裝置值為 Radioactive Element","不須另編","另編 Removal","另編 Administration"],"e":"近接治療編 Radiation Therapy 章節近接治療模式；若放射性來源於程序結束時仍在體內，另編 Insertion 與 Radioactive Element（例外：腦腫瘤切除後置入含 Cs-131 或 Pd-103 的膠原植入物，只編 Insertion）。（來源：ICD-10-PCS 官方指引 FY2027 D1.a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:be1","q":"Section X（新技術）的碼已完整描述一項新技術程序，且為唯一程序時，是否須再加編其他章節的碼？","o":["不須；只報告 Section X 碼","須，要再編 Administration 章節的碼","須，要再編 Medical and Surgical 的碼","視保險給付而定"],"e":"Section X 碼完整代表碼名所述的特定程序，若是唯一執行的程序，只編 Section X 碼（例：zanidatamab 經周邊靜脈給予，不再編 3E0 表的 Administration 碼）。（來源：ICD-10-PCS 官方指引 FY2027 E1.a）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:be1b","q":"經導管主動脈瓣置換（valve-in-valve TAVR）時，另以射頻能量做瓣葉切割（X28F3WB），應如何編碼？","o":["Section X 碼與 TAVR 程序碼分別編碼","只編 X28F3WB","只編 TAVR","合併為一個 Replacement 碼"],"e":"多項程序時，Section X 碼依多重程序指引編碼：X28F3WB 與 TAVR 另碼並報；同理，經暫時輸注裝置給予基因治療時，輸注裝置的 Insertion 另編。（來源：ICD-10-PCS 官方指引 FY2027 E1.b）","s":"g27pcs"},{"c":"g27pcs","id":"g27pcs:bf","q":"主診斷的相關診斷性程序，與次要診斷的確定治療性程序並存時，何者為主要程序？","o":["與主診斷相關的診斷性程序作為主要程序","次要診斷的確定治療性程序","依手術時間先後","依 DRG 權重較高者"],"e":"指引 F3：對主診斷執行診斷程序，且對次要診斷執行確定治療程序時，與主診斷最相關的診斷程序優先作為主要程序。（來源：ICD-10-PCS 官方指引 FY2027 F）","s":"g27pcs"}];

var stats = ls.get('dx.stats', {});
var marked = new Set(ls.get('dx.marked', []));
var notes = ls.get('dx.notes', null);
if (!Array.isArray(notes)) {
  notes = [{
    id: uid(), title: '範例：Excludes1 與 Excludes2', tags: ['編碼慣例','範例'], ref: null, updated: Date.now(),
    body: '（這是範例筆記，可以直接修改或刪除。）\n\nExcludes1：兩個情況不能同時編碼。\nExcludes2：不包括在本分類內，但病人同時有兩種情況時可以一起編碼。'
  }];
  ls.set('dx.notes', notes);
}
function saveStats(){ ls.set('dx.stats', stats); }
function saveMarked(){ ls.set('dx.marked', Array.from(marked)); }
function saveNotes(){ ls.set('dx.notes', notes); }
function record(id, ok){
  var s = stats[id] || {r:0, w:0};
  if (ok) s.r++; else s.w++;
  s.last = ok ? 'r' : 'w';
  stats[id] = s; saveStats();
}

/* ---------- 版面狀態 ---------- */
var TABS = [['quiz','題庫自測'], ['notes','我的筆記'], ['books','電子書庫']];
var S = {
  tab: 'quiz',
  quiz: { phase:'setup', cats:new Set(CATS.filter(function(c){ return c.past; }).map(function(c){ return c.id; })), exams:new Set(EXAMS), count:20, mode:'practice', source:'all', items:[], i:0, confirm:false },
  notesUi: { sel: null, q: '', tag: '' },
  reader: null,
  openNote: null
};
(function(){ var t = (location.hash || '').slice(1); if (TABS.some(function(x){ return x[0]===t; })) S.tab = t; })();

function go(t){
  if (S.reader) { S.reader.destroy(); S.reader = null; }
  S.tab = t;
  try { history.replaceState(null, '', '#' + t); } catch(e) {}
  render();
}
function renderTabs(){
  var box = document.getElementById('tabs');
  box.replaceChildren();
  TABS.forEach(function(x){
    var label = x[1];
    var b = h('button', {type:'button', role:'tab', class:'tab', id:'tab-'+x[0], 'aria-selected': String(S.tab===x[0]), 'aria-controls':'view', onClick:function(){ go(x[0]); }}, label);
    if (x[0]==='notes') b.append(h('span', {class:'cnt'}, '(' + notes.length + ')'));
    box.append(b);
  });
}
function render(){
  renderTabs();
  var v = document.getElementById('view');
  v.setAttribute('aria-labelledby', 'tab-' + S.tab);
  v.replaceChildren(S.tab==='quiz' ? quizView() : S.tab==='notes' ? notesView() : booksView());
}
function secHead(label, title, id){
  return h('header', {class:'sec-head'},
    h('div', {class:'eyebrow'}, label),
    h('h2', {class:'sec-title', id:id}, title),
    h('div', {class:'rule-short', 'aria-hidden':'true'}));
}

/* ---------- 01 題庫自測 ---------- */
function pool(){
  var qz = S.quiz;
  return QS.filter(function(q){
    if (!qz.cats.has(q.c)) return false;
    if (q.s && !qz.exams.has(q.s)) return false;
    if (qz.source==='wrong') return stats[q.id] && stats[q.id].last==='w';
    if (qz.source==='marked') return marked.has(q.id);
    return true;
  });
}
function quizView(){
  var qz = S.quiz;
  var root = h('section', {class:'sec', 'aria-labelledby':'quiz-h'});
  root.append(secHead('01｜題庫自測', '挑一個範圍，答完馬上看解析', 'quiz-h'));
  root.append(qz.phase==='setup' ? quizSetup() : qz.phase==='run' ? quizRun() : quizResult());
  root.append(h('p', {class:'closing'}, '錯的題目會自動收進錯題本，隨時回來再做一次。'));
  return root;
}
function chipGroup(name, opts, value, onPick){
  var box = h('div', {class:'chips', role:'radiogroup'});
  opts.forEach(function(o){
    var inp = h('input', {type:'radio', name:name, id:name+'-'+o[0], checked: value===o[0], onChange:function(){
      Array.prototype.forEach.call(box.children, function(c){ c.classList.remove('on'); });
      lab.classList.add('on'); onPick(o[0]);
    }});
    var lab = h('label', {class:'chip'+(value===o[0]?' on':''), for:name+'-'+o[0]}, inp, h('span', {class:'chip-t'}, o[1]), o[2] ? h('span', {class:'chip-s'}, o[2]) : null);
    box.append(lab);
  });
  return box;
}
function quizSetup(){
  var qz = S.quiz;
  var wrap = h('div', {class:'stack'});
  var card = h('div', {class:'card pad'});
  var fields = h('div', {class:'fields'});

  var catBox = h('div', {class:'chips', role:'group', 'aria-label':'題目範圍'});
  CATS.forEach(function(c){
    var n = QS.filter(function(q){ return q.c===c.id; }).length;
    var inp = h('input', {type:'checkbox', id:'cat-'+c.id, checked: qz.cats.has(c.id), onChange:function(){
      if (inp.checked) qz.cats.add(c.id); else qz.cats.delete(c.id);
      lab.classList.toggle('on', inp.checked); upd();
    }});
    var lab = h('label', {class:'chip'+(qz.cats.has(c.id)?' on':''), for:'cat-'+c.id}, inp, h('span', {class:'chip-t'}, c.name), h('span', {class:'chip-s'}, c.hint + '・' + n + ' 題'));
    catBox.append(lab);
  });
  fields.append(h('div', null, h('p', {class:'label'}, '題目範圍'), catBox));

  var examBox = h('div', {class:'chips', role:'group', 'aria-label':'考卷範圍'});
  EXAMS.forEach(function(name, i){
    var n = QS.filter(function(q){ return q.s === name; }).length;
    var inp = h('input', {type:'checkbox', id:'ex-'+i, checked: qz.exams.has(name), onChange:function(){
      if (inp.checked) qz.exams.add(name); else qz.exams.delete(name);
      lab.classList.toggle('on', inp.checked); upd();
    }});
    var lab = h('label', {class:'chip'+(qz.exams.has(name)?' on':''), for:'ex-'+i}, inp, h('span', {class:'chip-t'}, name), h('span', {class:'chip-s'}, n + ' 題'));
    examBox.append(lab);
  });
  var allEx = h('button', {type:'button', class:'btn small quiet', onClick:function(){
    var all = qz.exams.size === EXAMS.length;
    qz.exams = new Set(all ? [] : EXAMS);
    Array.prototype.forEach.call(examBox.querySelectorAll('label.chip'), function(l, i){
      l.classList.toggle('on', !all); l.querySelector('input').checked = !all;
    }); upd();
  }}, '全選／全不選');
  fields.append(h('div', null, h('div', {class:'row between'}, h('p', {class:'label', style:'margin:0'}, '題源範圍（歷屆考卷、2027 指引、Coding Clinic 依來源篩選）'), allEx), examBox));

  var wrongN = QS.filter(function(q){ return stats[q.id] && stats[q.id].last==='w'; }).length;
  var markN = QS.filter(function(q){ return marked.has(q.id); }).length;
  fields.append(h('div', null, h('p', {class:'label'}, '題目來源'),
    chipGroup('src', [['all','全部題目'], ['wrong','錯題本', wrongN + ' 題'], ['marked','已標記', markN + ' 題']], qz.source, function(v){ qz.source = v; upd(); })));
  fields.append(h('div', null, h('p', {class:'label'}, '作答方式'),
    chipGroup('mode', [['practice','練習','每題答完立即看解析'], ['exam','模擬考','交卷後一起看解析']], qz.mode, function(v){ qz.mode = v; })));

  var sel = h('select', {id:'qcount', onChange:function(){ qz.count = Number(sel.value); upd(); }},
    [5,10,20,30,50,100,0].map(function(n){ return h('option', {value:String(n), selected: qz.count===n}, n===0 ? '全部（依範圍隨機排序）' : n + ' 題'); }));
  fields.append(h('div', null, h('label', {for:'qcount', class:'label', style:'display:block'}, '題數'), sel));

  var info = h('p', {class:'status', 'aria-live':'polite'});
  var start = h('button', {type:'button', class:'btn primary', onClick:startQuiz}, '開始作答');
  card.append(fields, h('hr', {class:'divider'}), h('div', {class:'row'}, start, info));
  function upd(){
    var n = pool().length;
    var take = qz.count===0 ? n : Math.min(qz.count, n);
    info.textContent = n===0 ? '符合條件的題目是 0 題，請調整範圍或來源。' : '符合條件 ' + n + ' 題，這次會出 ' + take + ' 題。';
    start.disabled = n===0;
  }
  upd();
  wrap.append(card, statsCard());
  return wrap;
}
function statsCard(){
  var answered = 0, right = 0;
  QS.forEach(function(q){ var s = stats[q.id]; if (s) { answered += s.r + s.w; right += s.r; } });
  var pct = answered ? Math.round(right / answered * 100) : 0;

function makeItems(list){

}
function startQuiz(){

  qz.items = makeItems(list); qz.i = 0; qz.phase = 'run'; qz.confirm = false;
  render(); window.scrollTo(0, 0);
}
function isRight(it){ return it.pick !== null && it.order[it.pick] === 0; }
function answer(k){
  var qz = S.quiz, it = qz.items[qz.i];
  if (qz.mode==='practice') {
    if (it.done) return;
    it.pick = k; it.done = true; record(it.q.id, isRight(it));
  } else { it.pick = k; }

}
function finishQuiz(){
  var qz = S.quiz;
  if (qz.mode==='exam') qz.items.forEach(function(it){ if (it.pick !== null) record(it.q.id, isRight(it)); });
  qz.phase = 'result'; qz.confirm = false;

}
function noteFromQuestion(q){
  var n = { id: uid(), title: '題目：' + q.q.slice(0, 22) + (q.q.length > 22 ? '…' : ''), tags:['題庫'], ref:{type:'q', id:q.id}, updated: Date.now(),
    body: '【題目】' + q.q + '\n【正解】' + q.o[0] + '\n【解析】' + q.e + '\n\n【我的想法】\n' };

}
function quizRun(){
  var qz = S.quiz, it = qz.items[qz.i], q = it.q, n = qz.items.length, practice = qz.mode==='practice';
  var wrap = h('div', {class:'stack'});
  var card = h('div', {class:'card pad'});

    }}, isMarked ? '已標記，點一下取消' : '標記這題')));

      if (oi === 0) { cls += ' right'; stateText = '正確答案'; }

  });

    card.append(h('div', {class:'feedback' + (ok ? '' : ' bad'), role:'status'},
      h('strong', null, ok ? '答對了' : '答錯了，正解是 ' + correctLetter),

  }

  if (practice) {
    nav.append(h('button', {type:'button', class:'btn primary', disabled: !it.done, onClick:function(){ if (last) finishQuiz(); else { qz.i++; render(); } }}, last ? '看結果' : '下一題'));

  function buildExport(fmt, list){

    if (fmt === 'json') {
      return JSON.stringify({ app:'疾病分類練習', exported: new Date().toISOString(), notes: list.map(function(n){

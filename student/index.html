<title>疾病分類練習簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：頂部青綠橫條 → 報頭（水彩插畫在右上）→ 分頁籤 → 區塊（章節標・結論標題・內容・玫瑰粉結論句）。插畫只在邊角，文字區保持乾淨紙色。 */
:root{
  --paper:#F7F4EC; --card:#FCF7EB; --field:#FFFBF1;
  --ink:#5C443A; --ink2:#6E5446; --ink3:#876755;
  --rose:#C27777; --rose-ink:#A65A5A; --apricot:#DE9B67; --sage:#78978B; --teal:#118A8A;
  --peach:#F9E5CE; --mint:#E2EEE2; --blush:#F6E0DB; --line:#E6C9A8;
  --ok-line:#5E9A82; --bad-line:#C27777;
  --deco-pink:#F4C2C2; --deco-yellow:#F6CF96; --deco-green:#BFD6C6; --deco-heart:#F2B5B0;
  --wash-1:rgba(246,224,219,.95); --wash-2:rgba(249,229,206,.95); --wash-3:rgba(226,238,226,.9); --wash-4:rgba(246,224,219,.8);
  --grain:.22; --grain-blend:multiply;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2A2220; --card:#352B27; --field:#2E2522;
    --ink:#F4E8DA; --ink2:#E6D3C2; --ink3:#BFA593;
    --rose:#D88C8C; --rose-ink:#EBA9A9; --apricot:#E3A675; --sage:#8FB2A3; --teal:#4FB3AE;
    --peach:#4A3A2F; --mint:#2F4038; --blush:#4B3535; --line:#6A5545;
    --ok-line:#7DB59C; --bad-line:#D88C8C;
    --deco-pink:#8A5A5A; --deco-yellow:#B88A55; --deco-green:#5E8272; --deco-heart:#9A5F5F;
    --wash-1:rgba(120,70,70,.35); --wash-2:rgba(130,90,50,.3); --wash-3:rgba(60,95,80,.3); --wash-4:rgba(120,70,70,.28);
    --grain:.3; --grain-blend:soft-light;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2A2220; --card:#352B27; --field:#2E2522;
  --ink:#F4E8DA; --ink2:#E6D3C2; --ink3:#BFA593;
  --rose:#D88C8C; --rose-ink:#EBA9A9; --apricot:#E3A675; --sage:#8FB2A3; --teal:#4FB3AE;
  --peach:#4A3A2F; --mint:#2F4038; --blush:#4B3535; --line:#6A5545;
  --ok-line:#7DB59C; --bad-line:#D88C8C;
  --deco-pink:#8A5A5A; --deco-yellow:#B88A55; --deco-green:#5E8272; --deco-heart:#9A5F5F;
  --wash-1:rgba(120,70,70,.35); --wash-2:rgba(130,90,50,.3); --wash-3:rgba(60,95,80,.3); --wash-4:rgba(120,70,70,.28);
  --grain:.3; --grain-blend:soft-light;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  position:relative; margin:0; min-height:100%;
  background:var(--paper); color:var(--ink2);
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:1rem; line-height:1.75; overflow-x:hidden;
}
/* 水彩暈染：四角各一團淡彩 */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60vmax 40vmax at 6% 4%, var(--wash-1) 0, transparent 62%),
    radial-gradient(50vmax 38vmax at 98% 10%, var(--wash-2) 0, transparent 62%),
    radial-gradient(55vmax 42vmax at 94% 100%, var(--wash-3) 0, transparent 62%),
    radial-gradient(45vmax 34vmax at 2% 96%, var(--wash-4) 0, transparent 64%);
}
/* 紙張顆粒 */
body::after{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:var(--grain); mix-blend-mode:var(--grain-blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .27  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.topbar{position:absolute; top:0; left:0; right:0; height:6px; background:var(--teal); z-index:3}
.page{position:relative; z-index:1}
.wrap{width:min(1080px,100%); margin-inline:auto; padding-inline:clamp(16px,4vw,32px)}

:focus-visible{outline:3px solid var(--teal); outline-offset:3px; border-radius:6px}
.sr-file{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
.muted{color:var(--ink3)}

/* 報頭 */
.masthead{position:relative; padding-block:clamp(44px,8vw,72px) 8px}
.kicker{color:var(--rose-ink); font-weight:700; font-size:.95rem; letter-spacing:.1em}
h1{margin:.15em 0 .1em; color:var(--ink); font-size:clamp(2rem,6vw,3rem); line-height:1.25; font-weight:700; text-wrap:balance}
.lead{max-width:34em; margin:.4em 0 0; font-size:1.05rem}
.bar-short{width:64px; height:6px; border-radius:6px; background:var(--apricot); margin-top:14px}
.deco{position:absolute; pointer-events:none}
.deco svg{display:block; width:100%; height:auto; filter:url(#wobble2)}
.deco.a{top:34px; right:3%; width:clamp(54px,11vw,92px); transform:rotate(12deg)}
.deco.b{top:104px; right:calc(3% + clamp(48px,10vw,88px)); width:clamp(24px,4.4vw,38px); transform:rotate(-10deg)}
.deco.c{top:30px; right:calc(3% + clamp(66px,13vw,118px)); width:clamp(20px,3.6vw,30px); transform:rotate(14deg)}
.deco.d{top:16px; left:max(6px,1.5%); width:clamp(30px,5vw,48px); transform:rotate(-8deg)}
.petal ellipse{fill:var(--deco-pink); fill-opacity:.85; stroke:var(--rose); stroke-width:1.4}
.core{fill:var(--deco-yellow); stroke:var(--apricot); stroke-width:1.4}
.heart{fill:var(--deco-heart); fill-opacity:.9; stroke:var(--rose); stroke-width:1.5}
.star{fill:var(--deco-yellow); fill-opacity:.9; stroke:var(--apricot); stroke-width:1.5; stroke-linejoin:round}
.leaf{fill:var(--deco-green); fill-opacity:.9; stroke:var(--sage); stroke-width:1.5}
.stem{fill:none; stroke:var(--sage); stroke-width:2; stroke-linecap:round}

/* 分頁籤 */
.tabs{display:flex; flex-wrap:wrap; gap:10px; margin-block:22px 4px}
.tab{
  font:inherit; font-weight:700; color:var(--ink); cursor:pointer; min-height:44px;
  padding:.45rem 1.2rem; background:transparent; border:2px dashed var(--apricot);
  border-radius:18px 22px 16px 24px / 22px 16px 24px 18px;
}
.tab:hover{background:var(--peach)}
.tab[aria-selected="true"]{background:var(--blush); border:2px solid var(--rose)}
.tab .cnt{font-weight:400; color:var(--ink3); margin-left:.35em}

/* 區塊標題 */
.sec{padding-block:20px 12px}
.eyebrow{color:var(--rose-ink); font-weight:700; font-size:.9rem; letter-spacing:.1em}
.sec-title{margin:.1em 0 0; color:var(--ink); font-size:clamp(1.45rem,3.6vw,2rem); line-height:1.4; font-weight:700; text-wrap:balance}
.rule-short{width:56px; height:5px; border-radius:5px; background:var(--apricot); margin:10px 0 18px}
.closing{color:var(--rose-ink); font-weight:700; font-size:1.15rem; margin:24px 0 0}
.stack{display:grid; gap:18px}

/* 手繪外框的卡片 */
.card{position:relative; background:var(--card); border-radius:20px 24px 18px 26px / 24px 18px 26px 20px; min-width:0}
.card::before{
  content:""; position:absolute; inset:0; border:2px solid var(--apricot); border-radius:inherit;
  filter:url(#wobble); pointer-events:none; opacity:.9;
}
.pad{padding:clamp(16px,3vw,26px)}
.card.mint{background:var(--mint)} .card.blush{background:var(--blush)} .card.peach{background:var(--peach)}
.card h3{margin:0 0 .5em; color:var(--ink); font-size:1.2rem; line-height:1.45}
.divider{height:2px; border:0; background:var(--line); margin:18px 0; border-radius:2px}
.label{font-weight:700; color:var(--ink); margin:0 0 8px; font-size:.98rem}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.row.between{justify-content:space-between}

/* 按鈕 */
.btn{
  font:inherit; font-weight:700; color:var(--ink); cursor:pointer; min-height:44px;
  padding:.5rem 1.15rem; background:var(--peach); border:2px solid var(--apricot);
  border-radius:16px 20px 16px 20px / 20px 16px 20px 16px;
}
.btn:hover{background:var(--blush)}
.btn.primary{background:var(--blush); border-color:var(--rose)}
.btn.primary:hover{background:var(--peach)}
.btn.quiet{background:transparent; border-color:var(--line)}
.btn.quiet:hover{background:var(--peach)}
.btn.small{min-height:38px; padding:.3rem .85rem; font-size:.92rem}
.btn[disabled]{opacity:.5; cursor:not-allowed}

/* 選項膠囊 */
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{
  position:relative; display:flex; flex-direction:column; gap:0; cursor:pointer; min-height:44px;
  padding:.4rem .95rem; background:var(--field); border:2px solid var(--line);
  border-radius:16px 18px 14px 20px / 18px 14px 20px 16px;
}
.chip input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.chip:focus-within{outline:3px solid var(--teal); outline-offset:3px}
.chip.on{background:var(--peach); border-color:var(--rose)}
.chip-t{font-weight:700; color:var(--ink); line-height:1.4}
.chip-s{font-size:.82rem; color:var(--ink3); line-height:1.4}
.chip.simple{flex-direction:row; align-items:center}

select,input[type="text"],input[type="search"],input[type="number"],textarea{
  font:inherit; color:var(--ink); background:var(--field); border:2px solid var(--line);
  border-radius:12px 14px 12px 16px; padding:.5rem .75rem; min-height:44px; max-width:100%;
}
textarea{width:100%; line-height:1.8; resize:vertical}
input[type="text"],input[type="search"]{width:100%}
select:focus,input:focus,textarea:focus{outline:3px solid var(--teal); outline-offset:2px; border-color:var(--teal)}

/* 作答統計 */
.stat-grid{display:grid; gap:12px 22px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat-line{display:flex; justify-content:space-between; gap:12px; font-size:.92rem}
.meter{height:10px; background:var(--peach); border-radius:10px; overflow:hidden; margin-top:4px}
.meter>i{display:block; height:100%; background:var(--sage); border-radius:10px}
.big-num{font-size:2.2rem; font-weight:700; color:var(--ink); line-height:1.2}

/* 題目 */
.tag{display:inline-block; padding:.05rem .75rem; background:var(--mint); color:var(--ink); border:2px solid var(--sage); border-radius:12px 14px 12px 14px; font-weight:700; font-size:.88rem}
.tag.soft{background:var(--peach); border-color:var(--apricot)}
.q-text.long{font-size:1.02rem !important; font-weight:400; line-height:1.75 !important}
.q-text{white-space:pre-line; margin:16px 0 14px !important; font-size:clamp(1.15rem,2.6vw,1.4rem) !important; line-height:1.6 !important; color:var(--ink); text-wrap:pretty}
.opts{display:grid; gap:10px; margin:0; padding:0; list-style:none}
.opt{
  display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer;
  font:inherit; color:var(--ink2); background:var(--field); border:2px solid var(--line);
  border-radius:16px 14px 18px 12px / 14px 18px 12px 16px; padding:.7rem .9rem; min-height:44px;
}
.opt:hover{border-color:var(--apricot)}
.opt .ltr{
  flex:none; display:grid; place-items:center; width:34px; height:34px; font-weight:700; color:var(--ink);
  background:var(--peach); border:2px solid var(--apricot); border-radius:10px 8px 11px 9px;
}
.opts li:nth-child(2) .ltr{background:var(--mint); border-color:var(--sage)}
.opts li:nth-child(3) .ltr{background:var(--blush); border-color:var(--rose)}
.opts li:nth-child(4) .ltr{background:var(--peach); border-color:var(--sage)}
.opt .txt{flex:1; min-width:0; padding-top:3px; overflow-wrap:anywhere}
.opt .state{flex:none; font-size:.82rem; font-weight:700; padding-top:5px}
.opt.picked{border-color:var(--teal); background:var(--peach)}
.opt.right{border-color:var(--ok-line); background:var(--mint)}
.opt.wrong{border-color:var(--bad-line); background:var(--blush)}
.opt.right .state{color:var(--ink)}
.opt.wrong .state{color:var(--rose-ink)}
.opt[aria-disabled="true"]{cursor:default}
.feedback{margin-top:16px; padding:14px 16px; border-radius:14px 18px 14px 18px; border:2px solid var(--ok-line); background:var(--mint)}
.feedback.bad{border-color:var(--bad-line); background:var(--blush)}
.feedback strong{color:var(--ink)}
.feedback p{margin:.4em 0 0}
.progress{height:12px; background:var(--peach); border-radius:12px; overflow:hidden; margin-top:12px}
.progress>i{display:block; height:100%; background:var(--sage); border-radius:12px; transition:width .25s}
@media (prefers-reduced-motion: reduce){.progress>i{transition:none}}

.result-list{display:grid; gap:10px; margin:0; padding:0; list-style:none}
details.res{background:var(--field); border:2px solid var(--line); border-radius:14px; padding:.55rem .9rem}
details.res[open]{border-color:var(--apricot)}
details.res summary{cursor:pointer; font-weight:700; color:var(--ink); list-style-position:outside}
details.res .ans{margin:.5em 0 0}

/* 筆記 */
.notes-grid{display:grid; gap:18px; grid-template-columns:minmax(0,330px) minmax(0,1fr); align-items:start}
.note-list{display:grid; gap:8px; margin:12px 0 0; padding:0; list-style:none; max-height:56vh; overflow:auto}
.note-item{
  display:block; width:100%; text-align:left; font:inherit; color:var(--ink2); cursor:pointer;
  background:var(--field); border:2px solid var(--line); border-radius:14px 12px 16px 12px; padding:.55rem .8rem;
}
.note-item:hover{border-color:var(--apricot)}
.note-item.active{border-color:var(--rose); background:var(--blush)}
.note-item b{display:block; color:var(--ink); line-height:1.45; overflow-wrap:anywhere}
.note-item span{display:block; font-size:.84rem; color:var(--ink3); overflow-wrap:anywhere}
.tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.pill{font:inherit; font-size:.85rem; font-weight:700; cursor:pointer; color:var(--ink); background:transparent; border:2px solid var(--line); border-radius:999px; padding:.1rem .7rem; min-height:32px}
.pill.on{background:var(--peach); border-color:var(--rose)}
.fields{display:grid; gap:14px}
.fields label{display:grid; gap:6px; font-weight:700; color:var(--ink)}
.fields label .hint{font-weight:400; color:var(--ink3); font-size:.88rem}
.status{font-size:.88rem; color:var(--ink3)}

/* 電子書 */
.drop{
  display:grid; gap:4px; justify-items:center; text-align:center; cursor:pointer; padding:26px 16px;
  background:var(--field); border:2.5px dashed var(--apricot); border-radius:20px 24px 18px 26px / 24px 18px 26px 20px; color:var(--ink2);
}
.drop strong{color:var(--ink); font-size:1.1rem}
.drop.over,.drop:hover{background:var(--peach)}
.drop:focus-within{outline:3px solid var(--teal); outline-offset:3px}
.book-list{display:grid; gap:12px; margin:0; padding:0; list-style:none}
.book{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; padding:14px 18px}
.book-info{min-width:0; flex:1 1 220px}
.book-info b{display:block; color:var(--ink); font-size:1.05rem; line-height:1.45; overflow-wrap:anywhere}
.book-info span{font-size:.88rem; color:var(--ink3)}
.reader-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px}
.reader-bar .grow{flex:1 1 160px; min-width:0; font-weight:700; color:var(--ink); overflow-wrap:anywhere}
.stage{
  background:var(--field); border:2px solid var(--line); border-radius:14px; overflow:auto;
  height:min(72vh,820px); padding:12px; text-align:center;
}
.stage canvas{display:block; margin:0 auto; max-width:none}
.textbook{text-align:left; white-space:pre-wrap; line-height:1.95; font-size:1.05rem; max-width:42em; margin-inline:auto; padding:8px 10px; color:var(--ink); overflow-wrap:anywhere}
.epub-host{height:100%; min-height:300px}
.pg{width:5.2em; text-align:center; padding:.3rem .4rem; min-height:38px}
.note-panel{margin-top:14px}

.notice{padding:12px 16px; border-radius:14px; border:2px solid var(--apricot); background:var(--peach); color:var(--ink); margin-bottom:14px}
.empty{padding:26px 16px; text-align:center; color:var(--ink3)}

#toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:20;
  display:flex; gap:12px; align-items:center; max-width:min(92vw,520px);
  background:var(--card); color:var(--ink); border:2px solid var(--rose); border-radius:16px 20px 16px 20px;
  padding:.6rem 1rem; font-weight:700;
}
.btn[hidden]{display:none}
#toast[hidden]{display:none}

.foot{padding-block:36px 24px; position:relative}
.foot p{margin:.3em 0; font-size:.9rem; color:var(--ink3); max-width:44em}
.foot .deco.e{position:absolute; right:3%; top:20px; width:clamp(36px,7vw,60px); transform:rotate(10deg)}

@media (max-width:760px){
  .notes-grid{grid-template-columns:minmax(0,1fr)}
  .note-list{max-height:34vh}
  .masthead{padding-top:56px}
  .deco.b{top:92px}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/>
  </filter>
  <filter id="wobble2" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="2.5"/>
  </filter>
</svg>

<div class="topbar" aria-hidden="true"></div>
<div class="page">
  <header class="wrap masthead">
    <div class="deco a" aria-hidden="true"><svg viewBox="0 0 64 64"><g class="petal"><ellipse cx="32" cy="17" rx="8.5" ry="12"/><ellipse cx="32" cy="17" rx="8.5" ry="12" transform="rotate(72 32 32)"/><ellipse cx="32" cy="17" rx="8.5" ry="12" transform="rotate(144 32 32)"/><ellipse cx="32" cy="17" rx="8.5" ry="12" transform="rotate(216 32 32)"/><ellipse cx="32" cy="17" rx="8.5" ry="12" transform="rotate(288 32 32)"/></g><circle class="core" cx="32" cy="32" r="5.5"/></svg></div>
    <div class="deco b" aria-hidden="true"><svg viewBox="0 0 64 64"><path class="heart" d="M32 54C10 38 4 24 14 14C21 8 29 11 32 18C35 11 43 8 50 14C60 24 54 38 32 54Z"/></svg></div>
    <div class="deco c" aria-hidden="true"><svg viewBox="0 0 64 64"><polygon class="star" points="32,6 39,24 58,25 43,37 48,56 32,45 16,56 21,37 6,25 25,24"/></svg></div>
    <div class="deco d" aria-hidden="true"><svg viewBox="0 0 64 64"><circle class="leaf" cx="32" cy="19" r="10"/><circle class="leaf" cx="45" cy="32" r="10"/><circle class="leaf" cx="32" cy="45" r="10"/><circle class="leaf" cx="19" cy="32" r="10"/><path class="stem" d="M32 45C34 54 38 58 44 60"/></svg></div>
    <div class="kicker">ICD-10-CM / PCS 自學小站</div>
    <h1>疾病分類練習簿</h1>
    <p class="lead">題庫自測、隨手筆記、上傳電子書閱讀，都收在同一頁。一題一題練，錯的地方留下記號。</p>
    <div class="bar-short" aria-hidden="true"></div>
    <nav class="tabs" role="tablist" aria-label="功能分頁" id="tabs"></nav>
  </header>

  <main class="wrap" id="view"></main>

  <footer class="wrap foot">
    <div class="deco e" aria-hidden="true"><svg viewBox="0 0 64 64"><path class="heart" d="M32 54C10 38 4 24 14 14C21 8 29 11 32 18C35 11 43 8 50 14C60 24 54 38 32 54Z"/></svg></div>
    <p id="persist-note">筆記、作答紀錄與電子書都存在你自己的瀏覽器裡，換裝置或清除網站資料後不會跟著走。</p>
    <p>題目與解析供練習參考，正式編碼請依機構使用的官方版本與最新公告為準。</p>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- 小工具 ---------- */
function h(tag, props){
  var el = document.createElement(tag);
  var kids = Array.prototype.slice.call(arguments, 2);
  if (props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if (v === false || v == null) return;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  });
  (function add(list){
    list.forEach(function(kid){
      if (kid == null || kid === false) return;
      if (Array.isArray(kid)) return add(kid);
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
  })(kids);
  return el;
}

function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function debounce(fn, ms){ var t; return function(){ var a=arguments, c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); }, ms); }; }
function fmtDate(ts){ try{ return new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return false; });
  }
  return Promise.resolve(false);
}
function twoStep(btn, label, confirmLabel, run){
  var armed = false, timer;
  btn.textContent = label;
  btn.addEventListener('click', function(){
    if (!armed) {
      armed = true; btn.textContent = confirmLabel;
      timer = setTimeout(function(){ armed = false; btn.textContent = label; }, 3500);
    } else { clearTimeout(timer); armed = false; btn.textContent = label; run(); }
  });
  return btn;
}

Q('pcs','p1','ICD-10-PCS 七個字元由左至右依序代表什麼？',

Q('pcs','p2','PCS 第 1 碼「0」代表哪個區段？',
  ['內外科 (Medical and Surgical)','產科 (Obstetrics)','影像 (Imaging)','放射治療 (Radiation Therapy)'],

Q('pcs','p3','PCS 手術途徑字元「4」代表什麼？',
  ['經皮內視鏡 (Percutaneous Endoscopic)，例如腹腔鏡','開放式 (Open)','經皮穿刺 (Percutaneous)','經自然或人工開口 (Via Natural or Artificial Opening)'],

Q('pcs','p4','0DTJ4ZZ（腹腔鏡闌尾切除術）中，根本操作是什麼？',
  ['Resection，切除整個身體部位','Excision，切除部分身體部位','Drainage，引流','Inspection，檢查'],
  '拆解：0 內外科、D 消化系統、T 切除、J 闌尾、4 經皮內視鏡、Z 無裝置、Z 無限定詞。');
Q('pcs','p5','Excision 與 Resection 的差別為何？',
  ['Excision 切除部位的一部分；Resection 切除整個部位','Excision 切除整個部位；Resection 切除一部分','Excision 需要置入裝置，Resection 不需要','兩者完全相同'],
  '切除範圍是區分的關鍵：只切一部分用 Excision，整個身體部位切除用 Resection。');
Q('pcs','p6','PCS 中「根本操作」位於第幾個字元？',
  ['第 3 個','第 1 個','第 5 個','第 7 個'],

var EXAMS = Object.keys(SRC).map(function(k){ return SRC[k]; });
var PK = {}, DK = {};            /* code -> 描述 */
CASES.forEach(function(cs){
  cs.dx.forEach(function(e){ if (!DK[e.c]) DK[e.c] = e.t; });
  cs.px.forEach(function(e){ if (!PK[e.c]) PK[e.c] = e.t; });
  cs.chg.forEach(function(g){
    var pool = (g.c14.length === 7 && /^[0-9]/.test(g.c14)) ? PK : DK;
    if (!pool[g.c14]) pool[g.c14] = g.t14;
    if (!pool[g.c23]) pool[g.c23] = g.t23;
  });
});
function codeOpt(c, t){ return c + '　' + t; }
function inCase(cs, code){
  var hit = false;
  cs.dx.concat(cs.px).forEach(function(e){ if (e.c === code) hit = true; });
  cs.chg.forEach(function(g){ if (g.c14 === code || g.c23 === code) hit = true; });
  return hit;
}
/* 選出干擾碼：先用 prefer（同案例、同系統），再用相近前綴，最後任意 */
function distract(pool, exclude, prefer, n, prefixLens){
  var out = [], used = {};
  exclude.forEach(function(c){ used[c] = 1; });
  function take(list){
    shuffle(list).forEach(function(c){ if (out.length < n && !used[c]) { used[c] = 1; out.push(c); } });
  }
  take(prefer.filter(function(c){ return pool[c]; }));
  var all = Object.keys(pool);
  (prefixLens || [3,2,1]).forEach(function(len){
    if (out.length >= n) return;
    var base = (prefer.length ? prefer[0] : exclude[0]) || '';
    var keys = (exclude[0] || '').slice(0, len);
    take(all.filter(function(c){ return c.slice(0, len) === keys; }));
  });
  take(all);
  return out;
}
var ROLE_DX = {d:'主要診斷', a:'主(次)要診斷', e:'次要診斷'};
var ROLE_PX = {p:'主要處置', b:'主(次)要處置', q:'次要處置'};
function ansLine(cs){
  var parts = [];
  ['d','a','e'].forEach(function(r){
    var l = cs.dx.filter(function(e){ return e.r === r; }).map(function(e){ return e.c; });
    if (l.length) parts.push(ROLE_DX[r] + ' ' + l.join('、'));
  });
  ['p','b','q'].forEach(function(r){
    var l = cs.px.filter(function(e){ return e.r === r; }).map(function(e){ return e.c; });
    if (l.length) parts.push(ROLE_PX[r] + ' ' + l.join('、'));
  });
  var s = '參考答案：' + (parts.join('；') || '（僅列診斷或處置）') + '。';
  if (cs.chg.length) s += ' 版本差異（2014→2023）：' + cs.chg.map(function(g){ return g.c14 + '→' + g.c23; }).join('、') + '。';
  return s + ' 來源：' + cs.s + ' ' + cs.id + '。';
}
function head(cs){ return '【' + cs.s + '　' + cs.id + '】\n' + cs.text + '\n\n'; }
function byRole(list, roles){ return list.filter(function(e){ return roles.indexOf(e.r) >= 0; }); }

CASES.forEach(function(cs){
  var key = cs.s + '|' + cs.id;
  var dxAll = cs.dx.map(function(e){ return e.c; }), pxAll = cs.px.map(function(e){ return e.c; });
  var chgCodes = []; cs.chg.forEach(function(g){ chgCodes.push(g.c14, g.c23); });

  /* 1. 主要診斷 */
  var dMain = byRole(cs.dx, ['d']);
  if (dMain.length === 1 && !byRole(cs.dx, ['a']).length) {
    var ok = dMain[0];
    var ds = distract(DK, [ok.c].concat(chgCodes), byRole(cs.dx, ['e']).slice(0,1).map(function(e){ return e.c; }), 3, [2,1]);
    if (ds.length === 3) Q('pastdx', 'g:' + key + ':d', head(cs) + '依參考答案，此案例的「主要診斷」是？',
      [codeOpt(ok.c, ok.t)].concat(ds.map(function(c){ return codeOpt(c, DK[c]); })), ansLine(cs), cs.s);
  }
  /* 2. 主要處置 */
  var pMain = byRole(cs.px, ['p']);
  if (pMain.length === 1 && !byRole(cs.px, ['b']).length) {
    var okp = pMain[0];
    var dp = distract(PK, [okp.c].concat(chgCodes), byRole(cs.px, ['q']).slice(0,1).map(function(e){ return e.c; }), 3, [3,2,1]);
    if (dp.length === 3) Q('pastpx', 'g:' + key + ':p', head(cs) + '依參考答案，此案例的「主要處置」是？',
      [codeOpt(okp.c, okp.t)].concat(dp.map(function(c){ return codeOpt(c, PK[c]); })), ansLine(cs), cs.s);
  }
  /* 3. 次要診斷 */
  var eList = byRole(cs.dx, ['e']);
  if (eList.length) {
    var oke = eList[Math.floor(Math.random() * eList.length)];
    var dd = distract(DK, dxAll.concat(chgCodes), [], 3, [2,1]);
    if (dd.length === 3) Q('pastdx', 'g:' + key + ':e', head(cs) + '下列哪一個診斷碼是此案例參考答案中的「次要診斷」？',
      [codeOpt(oke.c, oke.t)].concat(dd.map(function(c){ return codeOpt(c, DK[c]); })), ansLine(cs), cs.s);
  }
  /* 4. 次要處置 */
  var qList = byRole(cs.px, ['q']);
  if (qList.length) {
    var okq = qList[Math.floor(Math.random() * qList.length)];
    var dq = distract(PK, pxAll.concat(chgCodes), [], 3, [3,2,1]);
    if (dq.length === 3) Q('pastpx', 'g:' + key + ':q', head(cs) + '下列哪一個處置碼是此案例參考答案中的「次要處置」？',
      [codeOpt(okq.c, okq.t)].concat(dq.map(function(c){ return codeOpt(c, PK[c]); })), ansLine(cs), cs.s);
  }
  /* 5. 處置描述 → 代碼（看懂 PCS 描述） */
  if (cs.px.length) {
    var e5 = cs.px[Math.floor(Math.random() * cs.px.length)];
    var d5 = distract(PK, pxAll.concat(chgCodes), [], 3, [3,2,1]);
    if (d5.length === 3) Q('pastpx', 'g:' + key + ':pd', '參考答案中，哪一個處置碼的描述是：\n' + e5.t + '\n（案例：' + cs.s + '　' + cs.id + '）',
      [e5.c].concat(d5), '正確為 ' + e5.c + '：' + e5.t + '。PCS 碼各字元依序為區段、身體系統、根本操作、身體部位、手術途徑、裝置、限定詞，可從描述回推。' + ansLine(cs), cs.s);
  }
  /* 6. 診斷代碼 → 描述 */
  if (cs.dx.length) {
    var e6 = cs.dx[Math.floor(Math.random() * cs.dx.length)];
    var d6 = distract(DK, dxAll.concat(chgCodes), [], 3, [2,1]);
    if (d6.length === 3) Q('pastdx', 'g:' + key + ':dd', '參考答案中，診斷碼 ' + e6.c + ' 的描述是？\n（案例：' + cs.s + '　' + cs.id + '）',
      [e6.t].concat(d6.map(function(c){ return DK[c]; })), '正確為 ' + e6.c + '：' + e6.t + '。' + ansLine(cs), cs.s);
  }
  /* 7. 2014 → 2023 版本差異 */
  cs.chg.forEach(function(g, i){
    var isPx = g.c14.length === 7 && /^[0-9]/.test(g.c14);
    var pool = isPx ? PK : DK;
    var dv = distract(pool, [g.c23], [g.c14], 3, isPx ? [3,2,1] : [3,2,1]);
    if (dv.length === 3) Q('pastver', 'g:' + key + ':v' + i, head(cs) + '此案例 2014 版本的參考代碼為 ' + g.c14 + '（' + g.t14 + '）。依 2023 版本的參考答案，該項目改為？',
      [codeOpt(g.c23, g.t23)].concat(dv.map(function(c){ return codeOpt(c, pool[c]); })),
      '2014 版 ' + g.c14 + ' → 2023 版 ' + g.c23 + '（' + g.t23 + '）。' + (g.c23 === '5A1D80Z' ? '同案 2023 版另接受 5A1D90Z（Continuous，每日超過 18 小時）。' : '') + ansLine(cs), cs.s);
  });

var NB=[{"c":"cccode","id":"cc:CC2023Q1-01:a","q":"【AHA Coding Clinic 2023年第1季｜骨內輸注血品】\n重症病人經雙側脛骨骨內管路輸液與非自體全血。\n依該季 Coding Clinic，應如何編碼？","o":["302A3H1","30243Q1","3E00XGC","3E023GC"],"e":"正解：302A3H1。302A3H1（非自體全血輸血入骨髓,經皮）×2 重點：經骨內管路輸注非自體全血編 302A3H1。 實務：302 新增 body system A 骨髓(approach 3) 為 FY2023 新碼。 （來源：AHA Coding Clinic 2023年第1季「骨內輸注血品」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-01:d","q":"【AHA Coding Clinic 2023年第1季】\n重症病人經雙側脛骨骨內管路輸液與非自體全血。\n依該季 Coding Clinic，下列結論何者正確？","o":["經骨內管路輸注非自體全血編 302A3H1。","CAR-NK 經 port-a-cath 中央靜脈輸注編 3E043GC。","肌肉給予 RSV 預防性單株抗體編 3E023GC；不用 XW023Y7。","顱內海綿狀血管瘤（cavernoma）併皮質下出血，編 D18.02 + I61.0。"],"e":"正解：經骨內管路輸注非自體全血編 302A3H1。 應使用：302A3H1（非自體全血輸血入骨髓,經皮）×2。 實務：302 新增 body system A 骨髓(approach 3) 為 FY2023 新碼。 （來源：AHA Coding Clinic 2023年第1季「骨內輸注血品」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-02:d","q":"【AHA Coding Clinic 2023年第1季】\nABLA due to GI bleeding(疑慢性NSAID)，內視鏡見非出血性胃潰瘍，輸2單位PRBC。\n依該季 Coding Clinic，下列結論何者正確？","o":["貧血與 GI 出血皆符合主診斷時任一可排序在前；若明載何者致入院則以其為主診。","同時診斷原發與轉移時,原發為主診(除非治療僅針對轉移灶)。","『due to』不觸發 With 推定;需醫師記載連結。若明載則編 D64.81。","高輸出量迴腸造口須 query 病因(感染/營養不良/dumping/術後併發症)後編碼。"],"e":"正解：貧血與 GI 出血皆符合主診斷時任一可排序在前；若明載何者致入院則以其為主診。 應使用：貧血(D62)或 GI 出血(如 K92.2)——兩者互為 interrelated，任一可為主診。 編碼順序：依 II.B：明載致入院者為主診。 實務：同章/相關聯病況任一可為主診，除非情境/治療/索引另有指示。 （來源：AHA Coding Clinic 2023年第1季「急性失血性貧血併消化道出血」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-03:d","q":"【AHA Coding Clinic 2023年第1季】\nABLA 入院查 GI 出血，內視鏡見十二指腸血管發育異常與急性胃潰瘍滲血，APC 燒灼。\n依該季 Coding Clinic，下列結論何者正確？","o":["本例治療焦點為出血病灶 → 以 K25.0 或 K31.811 為主診。","貧血與 GI 出血皆符合主診斷時任一可排序在前；若明載何者致入院則以其為主診。","MAPCA 為先天血管異常，診斷編 Q28.8。","溺水所致急性肺水腫編 J81.0（已知效應）+ 外因；不用 T75.1-。"],"e":"正解：本例治療焦點為出血病灶 → 以 K25.0 或 K31.811 為主診。 應使用：K25.0（急性胃潰瘍併出血）或 K31.811（胃十二指腸血管發育異常併出血）為主診。 編碼順序：治療焦點(出血病灶)為主診。 實務：與 [[CC2023Q1-02 急性失血性貧血併消化道出血]] 對照：治療焦點決定主診。 （來源：AHA Coding Clinic 2023年第1季「急性失血性貧血併血管發育異常與胃潰瘍出血」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-04:a","q":"【AHA Coding Clinic 2023年第1季｜自然流產與慢性病之產科碼】\n不完全自然流產行 D&C，另評估治療氣喘。\n依該季 Coding Clinic，應如何編碼？","o":["O03.4 + J45.909","J45.909","O03.4","O04.6 + J45.909"],"e":"正解：O03.4 + J45.909。O03.4（不完全自然流產,無併發症）+ J45.909（未特指氣喘,若未載型別） 不應使用／不適用：第15章產科碼(病人已非孕)。 重點：自然流產後(已非孕)之慢性氣喘不用第15章碼；O03.4 + 氣喘碼。 實務：I.C.15.Q.3 之第15章附加碼適用於 O04/O07/O08，不適用 O03。 （來源：AHA Coding Clinic 2023年第1季「自然流產與慢性病之產科碼」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-04:d","q":"【AHA Coding Clinic 2023年第1季】\n不完全自然流產行 D&C，另評估治療氣喘。\n依該季 Coding Clinic，下列結論何者正確？","o":["自然流產後(已非孕)之慢性氣喘不用第15章碼；O03.4 + 氣喘碼。","產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。","CKD G4A3 = 第4期，編 N18.4。","失智併憂鬱推定相關，編 F03.93 + F32.A。"],"e":"正解：自然流產後(已非孕)之慢性氣喘不用第15章碼；O03.4 + 氣喘碼。 應使用：O03.4（不完全自然流產,無併發症）+ J45.909（未特指氣喘,若未載型別）。 不應使用：第15章產科碼(病人已非孕)。 實務：I.C.15.Q.3 之第15章附加碼適用於 O04/O07/O08，不適用 O03。 （來源：AHA Coding Clinic 2023年第1季「自然流產與慢性病之產科碼」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-05:d","q":"【AHA Coding Clinic 2023年第1季】\nCKD 併 AKI 與膀胱腫塊，記 CKD G4A3(eGFR 25)。\n依該季 Coding Clinic，下列結論何者正確？","o":["CKD G4A3 = 第4期，編 N18.4。","橫紋肌溶解所致 AKF 編 N17.8 + 橫紋肌溶解碼。","低血壓所致 AKI 編 N17.8。","【更正】第3期 CKD 應編 N18.30（非 N18.3）。"],"e":"正解：CKD G4A3 = 第4期，編 N18.4。 應使用：N18.4（CKD 第4期,重度）。 實務：CGA 分期(C 病因/G eGFR/A 白蛋白尿)；G 後數字=期別。 （來源：AHA Coding Clinic 2023年第1季「慢性腎臟病第4期」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-06:a","q":"【AHA Coding Clinic 2023年第1季｜小淋巴球淋巴瘤／慢性淋巴球白血病】\nSLL/CLL 復發追蹤，記 no lymph node involvement。\n依該季 Coding Clinic，應如何編碼？","o":["C91.12","C92.02","C22.1","C50.A2"],"e":"正解：C91.12。C91.12（B 細胞型慢性淋巴球白血病,復發） 編碼順序：不清時 query。 重點：SLL/CLL 依部位定碼；無淋巴結侵犯 → C91.12。 實務：無預設碼；CLL(血/骨髓為主)→C91.1；SLL(淋巴結為主)→C83.0。 （來源：AHA Coding Clinic 2023年第1季「小淋巴球淋巴瘤／慢性淋巴球白血病」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-06:d","q":"【AHA Coding Clinic 2023年第1季】\nSLL/CLL 復發追蹤，記 no lymph node involvement。\n依該季 Coding Clinic，下列結論何者正確？","o":["SLL/CLL 依部位定碼；無淋巴結侵犯 → C91.12。","多淋巴結 DLBCL 編 C83.38；淋巴結外/實質器官轉移 C83.39。","內疝併壞疽阻塞編 K45.1（含壞疽與阻塞）；腸扭轉(volvulus)另編 K56.2。","左股靜脈生物瓣(VenoValve)置入編 X2H30R9。"],"e":"正解：SLL/CLL 依部位定碼；無淋巴結侵犯 → C91.12。 應使用：C91.12（B 細胞型慢性淋巴球白血病,復發）。 編碼順序：不清時 query。 實務：無預設碼；CLL(血/骨髓為主)→C91.1；SLL(淋巴結為主)→C83.0。 （來源：AHA Coding Clinic 2023年第1季「小淋巴球淋巴瘤／慢性淋巴球白血病」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-07:a","q":"【AHA Coding Clinic 2023年第1季｜末期腎病與體液過多】\n高血壓併 ESRD，因體液過多緊急透析(規律透析中)。\n依該季 Coding Clinic，應如何編碼？","o":["E87.70","E88.811","E85.81","E87.6"],"e":"正解：E87.70。E87.70（體液過多,未特指）主診 編碼順序：E87.70 為主診(致入院)。 重點：體液過多為 ESRD 之併發症、非固有 → 以 E87.70 為主診。 實務：體液過多非 ESRD 固有；入院情境決定主診。 （來源：AHA Coding Clinic 2023年第1季「末期腎病與體液過多」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-07:d","q":"【AHA Coding Clinic 2023年第1季】\n高血壓併 ESRD，因體液過多緊急透析(規律透析中)。\n依該季 Coding Clinic，下列結論何者正確？","o":["體液過多為 ESRD 之併發症、非固有 → 以 E87.70 為主診。","高乳酸血症 ≠ 酸中毒；未載酸中毒不可編 E87.20；query 後僅確認高乳酸 → R79.89。","高血壓「續發於糖尿病」→ I12 遇 I15 Excludes1，只編 I15.2；併 DM 腎病與 CKD 分期。","飢餓性酮酸中毒編 E87.29 + T73.0XXA。"],"e":"正解：體液過多為 ESRD 之併發症、非固有 → 以 E87.70 為主診。 應使用：E87.70（體液過多,未特指）主診。 編碼順序：E87.70 為主診(致入院)。 實務：體液過多非 ESRD 固有；入院情境決定主診。 （來源：AHA Coding Clinic 2023年第1季「末期腎病與體液過多」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-08:a","q":"【AHA Coding Clinic 2023年第1季｜糜爛性食道炎併出血】\nGrade D 糜爛性食道炎併吐血。\n依該季 Coding Clinic，應如何編碼？","o":["K22.11","K22.89","K28.4","K26.7"],"e":"正解：K22.11。K22.11（食道潰瘍併出血） 重點：糜爛性食道炎併出血編 K22.11。 實務：K20 有 Excludes1 導向 K22.1-(含 erosion/ulcerative esophagitis 為 inclusion)。 （來源：AHA Coding Clinic 2023年第1季「糜爛性食道炎併出血」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-08:d","q":"【AHA Coding Clinic 2023年第1季】\nGrade D 糜爛性食道炎併吐血。\n依該季 Coding Clinic，下列結論何者正確？","o":["糜爛性食道炎併出血編 K22.11。","食道扁平苔癬編 K22.89（非皮膚科 L43.9）。","住院診斷『possibly 膽管癌』依不確定診斷指引編 C22.1。","慢性糜爛性十二指腸炎編 K26.7。"],"e":"正解：糜爛性食道炎併出血編 K22.11。 應使用：K22.11（食道潰瘍併出血）。 實務：K20 有 Excludes1 導向 K22.1-(含 erosion/ulcerative esophagitis 為 inclusion)。 （來源：AHA Coding Clinic 2023年第1季「糜爛性食道炎併出血」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-09:d","q":"【AHA Coding Clinic 2023年第1季】\n右肺低分化神經內分泌大細胞癌併肝轉移。\n依該季 Coding Clinic，下列結論何者正確？","o":["大細胞神經內分泌肺癌編 C7A.1；肝轉移 C7B.8。","SLE 所致急性心肌炎編 M32.19 + I40.8。","成人 DIPNECH 編 J98.4。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。"],"e":"正解：大細胞神經內分泌肺癌編 C7A.1；肝轉移 C7B.8。 應使用：C7A.1（惡性低分化神經內分泌腫瘤）+ C7B.8（其他續發性神經內分泌腫瘤=肝轉移）。 不應使用：C34（一般肺癌類目）。 實務：低分化神經內分泌癌(任何部位)為 C7A.1 之 inclusion。 （來源：AHA Coding Clinic 2023年第1季「大細胞神經內分泌肺癌」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-10:d","q":"【AHA Coding Clinic 2023年第1季】\n左肺舌葉腫塊診斷 SCLC with neuroendocrine features。\n依該季 Coding Clinic，下列結論何者正確？","o":["SCLC 併神經內分泌特徵編 C7A.1。","帕金森依 dyskinesia 與 fluctuations 分:G20.A1/A2/B1/B2/C。","成人 DIPNECH 編 J98.4。","僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。"],"e":"正解：SCLC 併神經內分泌特徵編 C7A.1。 應使用：C7A.1（惡性低分化神經內分泌腫瘤）。 不應使用：C34（一般肺癌）。 實務：SCLC 屬神經內分泌腫瘤、描述為小細胞即低分化 → C7A.1。 （來源：AHA Coding Clinic 2023年第1季「小細胞肺癌併神經內分泌特徵」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-11:d","q":"【AHA Coding Clinic 2023年第1季】\nDLBCL 多淋巴部位併肺/腦/左腎上腺轉移。\n依該季 Coding Clinic，下列結論何者正確？","o":["多淋巴結 DLBCL 編 C83.38；淋巴結外/實質器官轉移 C83.39。","淋巴結無腫瘤時，淋巴血管侵犯不另編(為侵襲性指標非轉移)。","SCLC 併神經內分泌特徵編 C7A.1。","轉移性 GTD/GTN 編惡性碼 C54.8 + 肺/生殖器轉移;非 D39.2。"],"e":"正解：多淋巴結 DLBCL 編 C83.38；淋巴結外/實質器官轉移 C83.39。 應使用：C83.38（DLBCL,多部位淋巴結）+ C83.39（DLBCL,淋巴結外及實質器官）。 不應使用：逐一另編 C78/C79。 實務：第5碼 9(extranodal/solid organ)已捕捉淋巴系統外轉移。 （來源：AHA Coding Clinic 2023年第1季「瀰漫大 B 細胞淋巴瘤併轉移」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-12:d","q":"【AHA Coding Clinic 2023年第1季】\n難治復發 AML 因牙齦出血入院，全血球減少僅輸血支持。\n依該季 Coding Clinic，下列結論何者正確？","o":["AML 所致全血球減少入院輸血支持，主診 D61.818 + C92.02。","溺水所致急性肺水腫編 J81.0（已知效應）+ 外因；不用 T75.1-。","腦點狀出血編 I61.8（=出血性中風）。","本例治療焦點為出血病灶 → 以 K25.0 或 K31.811 為主診。"],"e":"正解：AML 所致全血球減少入院輸血支持，主診 D61.818 + C92.02。 應使用：D61.818（其他全血球減少）主診 + C92.02（急性骨髓母細胞白血病,復發）。 編碼順序：D61.818 為主診。 實務：I.C.2.c.1(惡性腫瘤相關貧血)不適用，因全血球減少不只貧血。 （來源：AHA Coding Clinic 2023年第1季「急性骨髓性白血病所致全血球減少」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-13:a","q":"【AHA Coding Clinic 2023年第1季｜骨盆底協調不良】\n便秘史行肛門直腸壓力檢查診斷 PFD。\n依該季 Coding Clinic，應如何編碼？","o":["K59.02","K57.20","K56.1","K56.699"],"e":"正解：K59.02。K59.02（出口功能障礙便秘） 重點：骨盆底協調不良編 K59.02（出口功能障礙型便秘）。 實務：PFD/anismus/outlet type constipation → K59.02。 （來源：AHA Coding Clinic 2023年第1季「骨盆底協調不良」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-13:d","q":"【AHA Coding Clinic 2023年第1季】\n便秘史行肛門直腸壓力檢查診斷 PFD。\n依該季 Coding Clinic，下列結論何者正確？","o":["骨盆底協調不良編 K59.02（出口功能障礙型便秘）。","EGJOO(蠕動障礙)編 K22.89 + K31.89；非真性阻塞不用 K22.2。","憩室炎穿孔所致骨盆/腹內膿瘍（非 PID、非腹膜炎）編 K65.1 + K57.20，不編 N73.3。","靜脈型胸廓出口症候群編 I87.1；非 G54.0。"],"e":"正解：骨盆底協調不良編 K59.02（出口功能障礙型便秘）。 應使用：K59.02（出口功能障礙便秘）。 實務：PFD/anismus/outlet type constipation → K59.02。 （來源：AHA Coding Clinic 2023年第1季「骨盆底協調不良」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-14:a","q":"【AHA Coding Clinic 2023年第1季｜疑似肝內膽管癌】\n肝腫塊,最終診斷 possible hepatic cholangiocarcinoma pending pathology。\n依該季 Coding Clinic，應如何編碼？","o":["C22.1","C50.A2","C54.8","C56.1"],"e":"正解：C22.1。C22.1（肝內膽管癌） 重點：住院診斷『possibly 膽管癌』依不確定診斷指引編 C22.1。 實務：II.H 不確定診斷指引不分疾病種類(含惡性腫瘤)。 （來源：AHA Coding Clinic 2023年第1季「疑似肝內膽管癌」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-14:d","q":"【AHA Coding Clinic 2023年第1季】\n肝腫塊,最終診斷 possible hepatic cholangiocarcinoma pending pathology。\n依該季 Coding Clinic，下列結論何者正確？","o":["住院診斷『possibly 膽管癌』依不確定診斷指引編 C22.1。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","難治性室性心搏過速之心臟 SBRT（radio-ablation）編 D228DZZ。"],"e":"正解：住院診斷『possibly 膽管癌』依不確定診斷指引編 C22.1。 應使用：C22.1（肝內膽管癌）。 實務：II.H 不確定診斷指引不分疾病種類(含惡性腫瘤)。 （來源：AHA Coding Clinic 2023年第1季「疑似肝內膽管癌」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-15:a","q":"【AHA Coding Clinic 2023年第1季｜前負荷不足】\n門診 iCPET 示前負荷不足(疑 IVC 阻塞)，右心導管診斷 preload insufficiency。\n依該季 Coding Clinic，應如何編碼？","o":["R94.39","R92.333","R97.21","R04.0"],"e":"正解：R94.39。R94.39（其他心血管功能檢查異常結果） 不應使用／不適用：門診不編『most likely 阻塞 IVC』。 重點：前負荷不足編 R94.39；門診不編不確定病因。 實務：索引 Findings, abnormal, stress test R94.39；門診不編不確定診斷。 （來源：AHA Coding Clinic 2023年第1季「前負荷不足」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-15:d","q":"【AHA Coding Clinic 2023年第1季】\n門診 iCPET 示前負荷不足(疑 IVC 阻塞)，右心導管診斷 preload insufficiency。\n依該季 Coding Clinic，下列結論何者正確？"," 62 + E78.79 + K76.89；無阻塞不用 K83.1。","前次脊椎融合後 adding-on 現象編 M96.89 + M41.125 + Z98.1。","DM 相關高血脂編 E11.69 + E78.49（有因果連結）。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。"],"e":"正解：妊娠肝內膽汁鬱積編 O26.62 + E78.79 + K76.89；無阻塞不用 K83.1。 應使用：O26.62（分娩肝膽疾患）+ E78.79（膽酸/膽固醇代謝其他疾患）+ K76.89（肝其他特指疾病）。 不應使用：K83.1（膽管阻塞，本例無阻塞）。 實務：涉肝(K76.89)與膽酸(E78.79)；無膽管阻塞記載不用 K83.1。 （來源：AHA Coding Clinic 2023年第1季「妊娠肝內膽汁鬱積」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-18:d","q":"【AHA Coding Clinic 2023年第1季】\n雙側膝上外傷截肢行 OPRA 第1階段(fixture)、後續第2階段(abutment)置入。\n依該季 Coding Clinic，下列結論何者正確？","o":["OPRA 骨整合義肢置入：診斷用外傷截肢碼第7碼 D；PCS 為 Insertion。","MCA 內幹細胞灌注編 table 3E0，body region Q（顱腔及腦）、經皮，依幹細胞種類選 qualifier。","reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。","記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。"],"e":"正解：OPRA 骨整合義肢置入：診斷用外傷截肢碼第7碼 D；PCS 為 Insertion。 應使用：S88.011D + S88.012D（雙側膝部完全外傷截肢,後續就診）；PCS 0YHC0YZ + 0YHD0YZ（雙側上腿其他裝置置入,開放）。 不應使用：aftercare Z 碼(傷害不用 aftercare)；第7碼 A。 實務：傷害後續處置用急性傷害碼+第7碼 D；OPRA 未取代股骨→Insertion。 （來源：AHA Coding Clinic 2023年第1季「雙側外傷性截肢併 OPRA 骨整合義肢（第1、2階段）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-19:a","q":"【AHA Coding Clinic 2023年第1季｜氣切還原後氣管皮膚廔】\n氣切還原後廔口持續開放併綠色分泌物，行手術閉合。\n依該季 Coding Clinic，應如何編碼？","o":["J39.8","T81.83XA","J38.01","J16.8"],"e":"正解：J39.8。J39.8（上呼吸道其他特指疾病） 不應使用／不適用：T81.83XA（持續性術後廔，氣切本為造廔不適用）。 重點：氣切還原後未自然閉合之氣管皮膚廔編 J39.8；非 T81.83。 實務：氣切目的即造廔/stoma，未自然閉合非術後廔亦非併發症。 （來源：AHA Coding Clinic 2023年第1季「氣切還原後氣管皮膚廔」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-19:d","q":"【AHA Coding Clinic 2023年第1季】\n氣切還原後廔口持續開放併綠色分泌物，行手術閉合。\n依該季 Coding Clinic，下列結論何者正確？","o":["氣切還原後未自然閉合之氣管皮膚廔編 J39.8；非 T81.83。","NG 管置放所致鼻出血(長期抗凝)編 J95.831 + R04.0 + Z79.01 + Y84.8。","CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。","術後腹內膿瘍編 T81.43XA + K65.1。"],"e":"正解：氣切還原後未自然閉合之氣管皮膚廔編 J39.8；非 T81.83。 應使用：J39.8（上呼吸道其他特指疾病）。 不應使用：T81.83XA（持續性術後廔，氣切本為造廔不適用）。 實務：氣切目的即造廔/stoma，未自然閉合非術後廔亦非併發症。 （來源：AHA Coding Clinic 2023年第1季「氣切還原後氣管皮膚廔」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-20:d","q":"【AHA Coding Clinic 2023年第1季】\n顱骨切除後自體骨瓣顱骨成形,追蹤見骨瓣吸收,後移除以待合成顱骨成形。\n依該季 Coding Clinic，下列結論何者正確？","o":["自體骨瓣吸收診斷 T86.838 + M95.2；移除 PCS 為 Removal 0NP007Z。","椎體成形術後水泥肺栓塞：主診 S22.089A + J95.821 + T81.718A + I26.95。","術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。","乙狀竇裂開編 I67.89 + M89.8X8 + H93.A1(搏動性耳鳴);表面重建 PCS 0NU50JZ。"],"e":"正解：自體骨瓣吸收診斷 T86.838 + M95.2；移除 PCS 為 Removal 0NP007Z。 應使用：T86.838（其他骨移植併發症）+ M95.2（頭部其他後天變形）；PCS 0NP007Z（自體組織替代物自顱骨移除,開放）。 不應使用：Excision of skull(骨瓣已吸收未成替代→用 Removal)。 實務：骨瓣吸收未成顱骨替代 → root operation Removal 較貼切。 （來源：AHA Coding Clinic 2023年第1季「自體骨瓣吸收之移除」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-21:a","q":"【AHA Coding Clinic 2023年第1季｜Zenker 憩室切除】\nZenker 憩室併肥厚環咽肌,內視鏡電燒切開黏膜、切除環咽肌中段與憩室囊。\n依該季 Coding Clinic，應如何編碼？","o":["0DB18ZZ + 0KB44ZZ","0KB44ZZ","0DB18ZZ","0DBQ0ZZ + 0KB44ZZ"],"e":"正解：0DB18ZZ + 0KB44ZZ。0DB18ZZ（上食道切除,經自然孔內視鏡=憩室切除）+ 0KB44ZZ（舌/顎/咽肌切除,經皮內視鏡=環咽肌） 重點：本例 Zenker 憩室切除以 Excision：0DB18ZZ + 環咽肌切除 0KB44ZZ。 實務：2020 Q2 曾建議 Division；本例技術不同用 Excision。0KB 無 approach 8 故用經皮內視鏡。 （來源：AHA Coding Clinic 2023年第1季「Zenker 憩室切除」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-21:d","q":"【AHA Coding Clinic 2023年第1季】\nZenker 憩室併肥厚環咽肌,內視鏡電燒切開黏膜、切除環咽肌中段與憩室囊。\n依該季 Coding Clinic，下列結論何者正確？","o":["本例 Zenker 憩室切除以 Excision：0DB18ZZ + 環咽肌切除 0KB44ZZ。","計畫吻合但需先切除小腸→最終處置為 Excision，只編 0DB80ZZ(吻合為固有)。","乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。","EGD 找出血源、抽吸舊血塊無獨立目的，編 Inspection 0DJ08ZZ。"],"e":"正解：本例 Zenker 憩室切除以 Excision：0DB18ZZ + 環咽肌切除 0KB44ZZ。 應使用：0DB18ZZ（上食道切除,經自然孔內視鏡=憩室切除）+ 0KB44ZZ（舌/顎/咽肌切除,經皮內視鏡=環咽肌）。 實務：2020 Q2 曾建議 Division；本例技術不同用 Excision。0KB 無 approach 8 故用經皮內視鏡。 （來源：AHA Coding Clinic 2023年第1季「Zenker 憩室切除」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-22:a","q":"【AHA Coding Clinic 2023年第1季｜S2 骶翼髂螺釘移除】\n既往 L1-L5 融合延伸至 S2AI,因硬體突出疼痛移除 S2AI 螺釘。\n依該季 Coding Clinic，應如何編碼？","o":["0QP104Z","0QBC0ZZ","0QRC0JZ","0QSC04Z"],"e":"正解：0QP104Z。0QP104Z（薦骨內固定裝置移除,開放） 重點：自薦骨移除 S2AI 螺釘編 0QP104Z。 實務：S2AI 螺釘位於薦骨 → 自薦骨移除內固定。 （來源：AHA Coding Clinic 2023年第1季「S2 骶翼髂螺釘移除」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-22:d","q":"【AHA Coding Clinic 2023年第1季】\n既往 L1-L5 融合延伸至 S2AI,因硬體突出疼痛移除 S2AI 螺釘。\n依該季 Coding Clinic，下列結論何者正確？","o":["自薦骨移除 S2AI 螺釘編 0QP104Z。","內視鏡經蝶切除蝶鞍顱咽管瘤編 0NBC4ZZ（Excision，蝶骨）。","type D 滑車發育不良之滑車成形（截骨移位+錨釘固定）編 0QSC04Z。","Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。"],"e":"正解：自薦骨移除 S2AI 螺釘編 0QP104Z。 應使用：0QP104Z（薦骨內固定裝置移除,開放）。 實務：S2AI 螺釘位於薦骨 → 自薦骨移除內固定。 （來源：AHA Coding Clinic 2023年第1季「S2 骶翼髂螺釘移除」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-23:d","q":"【AHA Coding Clinic 2023年第1季】\n右坐骨/薦部第4期壓瘡切除+肌皮瓣重建,閉合前置 AmnioFill。\n依該季 Coding Clinic，下列結論何者正確？","o":["AmnioFill 置入為手術固有,不另編。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","Norwood 手術中為顯露而切除胸腺,無獨立目的,不另編。","ORIF 中 BMAC 抽吸與注射為手術固有,不另編。"],"e":"正解：AmnioFill 置入為手術固有,不另編。 應使用：不另編 AmnioFill(為總處置固有)；壓瘡切除/皮瓣依實際另編。 不應使用：另編 AmnioFill。 實務：AmnioFill 非皮膚替代、整合於總處置。 （來源：AHA Coding Clinic 2023年第1季「第4期壓瘡修補併 AmnioFill」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-24:a","q":"【AHA Coding Clinic 2023年第1季｜頸動脈假性動脈瘤栓塞（血流導向支架＋線圈）】\n右頸內動脈假性動脈瘤行 Surpass 血流導向支架 + 3 線圈栓塞。\n依該季 Coding Clinic，應如何編碼？","o":["03VK3HZ + 03VK3DZ","03VK3DZ","03VK3HZ","03VK3HZ + 03VG3HZ"],"e":"正解：03VK3HZ + 03VK3DZ。03VK3HZ（右頸內動脈 Restriction,血流導向腔內裝置,經皮）+ 03VK3DZ（右頸內動脈 Restriction,腔內裝置=線圈,經皮） 不應使用／不適用：僅編一裝置。 重點：血流導向支架 + 線圈治頸內動脈假性動脈瘤,各編一碼。 實務：兩種不同裝置且無指引禁止 → 各編。 （來源：AHA Coding Clinic 2023年第1季「頸動脈假性動脈瘤栓塞（血流導向支架＋線圈）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-24:d","q":"【AHA Coding Clinic 2023年第1季】\n右頸內動脈假性動脈瘤行 Surpass 血流導向支架 + 3 線圈栓塞。\n依該季 Coding Clinic，下列結論何者正確？","o":["血流導向支架 + 線圈治頸內動脈假性動脈瘤,各編一碼。","【釐清】後大腦動脈梗塞無阻塞/狹窄/栓塞/血栓記載時編 I63.89。","胸椎「中線」壓瘡無法定側，L89.1 無中背碼，左右上背各編一碼。","腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。"],"e":"正解：血流導向支架 + 線圈治頸內動脈假性動脈瘤,各編一碼。 應使用：03VK3HZ（右頸內動脈 Restriction,血流導向腔內裝置,經皮）+ 03VK3DZ（右頸內動脈 Restriction,腔內裝置=線圈,經皮）。 不應使用：僅編一裝置。 實務：兩種不同裝置且無指引禁止 → 各編。 （來源：AHA Coding Clinic 2023年第1季「頸動脈假性動脈瘤栓塞（血流導向支架＋線圈）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-25:d","q":"【AHA Coding Clinic 2023年第1季】\n左頸內/總動脈內膜切除併頸動脈摺疊(carotid loop),牛心包補片閉合。\n依該季 Coding Clinic，下列結論何者正確？","o":["於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。","reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。"],"e":"正解：於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。 應使用：只編 Supplement（補片血管成形）。 不應使用：另編 imbrication(Restriction/Repair)。 實務：摺疊於補片處進行 → 不另編。 （來源：AHA Coding Clinic 2023年第1季「頸動脈內膜切除併摺疊」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-26:a","q":"【AHA Coding Clinic 2023年第1季｜蛆蟲療法】\n左足底跟部潰瘍(露脂肪)行醫療蛆蟲治療。\n依該季 Coding Clinic，應如何編碼？","o":["0JDR0ZZ","0JB70ZZ","0JH637Z","0JHS3YZ"],"e":"正解：0JDR0ZZ。0JDR0ZZ（左足皮下組織與筋膜 Extraction,開放） 重點：蛆蟲療法為非切除性清創,編 0JDR0ZZ。 實務：蛆蟲療法=非切除性清創。 （來源：AHA Coding Clinic 2023年第1季「蛆蟲療法」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-26:d","q":"【AHA Coding Clinic 2023年第1季】\n左足底跟部潰瘍(露脂肪)行醫療蛆蟲治療。\n依該季 Coding Clinic，下列結論何者正確？","o":["蛆蟲療法為非切除性清創,編 0JDR0ZZ。","Bjork flap 氣切修整編 0BS10ZZ + 氣切管更換 0B21XFZ。","糖尿病足潰瘍切除性清創至肌肉與肌腱，取最深層（肌腱）編 0LBV0ZZ。","改良式 Graham patch 修補胃穿孔編 0DQ60ZZ；網膜補強為附帶不另編。"],"e":"正解：蛆蟲療法為非切除性清創,編 0JDR0ZZ。 應使用：0JDR0ZZ（左足皮下組織與筋膜 Extraction,開放）。 實務：蛆蟲療法=非切除性清創。 （來源：AHA Coding Clinic 2023年第1季「蛆蟲療法」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-27:d","q":"【AHA Coding Clinic 2023年第1季】\n7歲因 C1-C4 旋轉性椎動脈症候群反覆中風。\n依該季 Coding Clinic，下列結論何者正確？","o":["旋轉性椎動脈症候群編 M47.022；另加中風史碼。","ESS 編 E23.6；僅影像「空蝶鞍」無 ESS 診斷則編 R93.0。","肝腎症候群併 AKI 兩碼並編 N17.8 + K76.7。","鐮刀型貧血脾隔離危象併功能性無脾，編 D57.02 + D73.0；非 Q89.01。"],"e":"正解：旋轉性椎動脈症候群編 M47.022；另加中風史碼。 應使用：M47.022（椎動脈壓迫症候群,頸段）+ Z86.73(無殘缺中風史)或 I69(有後遺症)。 不應使用：M47.012(前脊髓動脈)、G45-(非 TIA)。 實務：椎動脈壓迫較前脊髓動脈更特定；非 TIA 不編 G45。 （來源：AHA Coding Clinic 2023年第1季「旋轉性椎動脈症候群」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-28:d","q":"【AHA Coding Clinic 2023年第1季】\n纖維板層肝細胞癌併門靜脈瘤栓,體外(ex vivo)切除後將自身肝再植。\n依該季 Coding Clinic，下列結論何者正確？","o":["體外切除肝腫瘤後自體再植：只編所行處置(切除)；非 Transplantation。","難治性室性心搏過速之心臟 SBRT（radio-ablation）編 D228DZZ。","於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。","HeRO 移植片血栓清除編 03C73ZZ + 05CY3ZZ(Extirpation)；非 Revision。"],"e":"正解：體外切除肝腫瘤後自體再植：只編所行處置(切除)；非 Transplantation。 應使用：依實際所行編(如肝腫瘤 Excision 0FB…)。 不應使用：Transplantation(自體再植非移植)。 實務：ex vivo 不影響編碼；自身肝再植非 Transplantation 定義(取自他人/動物)。 （來源：AHA Coding Clinic 2023年第1季「體外肝腫瘤切除併自體再植」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-29:a","q":"【AHA Coding Clinic 2023年第1季｜更正：慢性腎臟病第3期】\n更正 2022 Q4 p.6 誤植。\n依該季 Coding Clinic，應如何編碼？","o":["N18.30","N18.3","N17.0","N18.31"],"e":"正解：N18.30。N18.30（CKD 第3期,未特指） 不應使用／不適用：N18.3。 重點：【更正】第3期 CKD 應編 N18.30（非 N18.3）。 實務：更正 2022 Q4 之誤植。 （來源：AHA Coding Clinic 2023年第1季「更正：慢性腎臟病第3期」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-29:d","q":"【AHA Coding Clinic 2023年第1季】\n更正 2022 Q4 p.6 誤植。\n依該季 Coding Clinic，下列結論何者正確？","o":["【更正】第3期 CKD 應編 N18.30（非 N18.3）。","高血壓「續發於糖尿病」→ I12 遇 I15 Excludes1，只編 I15.2；併 DM 腎病與 CKD 分期。","非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。","慢性 C 肝所致肝硬化編 K74.69（更新 2018 Q1 p.4 之 K74.60 建議）。"],"e":"正解：【更正】第3期 CKD 應編 N18.30（非 N18.3）。 應使用：N18.30（CKD 第3期,未特指）。 不應使用：N18.3。 實務：更正 2022 Q4 之誤植。 （來源：AHA Coding Clinic 2023年第1季「更正：慢性腎臟病第3期」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q1-30:a","q":"【AHA Coding Clinic 2023年第1季｜更正：Amlodipine 劑量不足】\n更正 2022 Q1 p.36。\n依該季 Coding Clinic，應如何編碼？","o":["T46.1X6A","T46.5X6A","T45.1X5A","T40.411A"],"e":"正解：T46.1X6A。T46.1X6A（鈣通道阻斷劑劑量不足,初診） 不應使用／不適用：T46.5X6A（其他降血壓藥）。 重點：【更正】Amlodipine 劑量不足應編 T46.1X6A（鈣通道阻斷劑），非 T46.5X6A。 實務：Amlodipine 藥理分類為鈣通道阻斷劑。 （來源：AHA Coding Clinic 2023年第1季「更正：Amlodipine 劑量不足」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q1-30:d","q":"【AHA Coding Clinic 2023年第1季】\n更正 2022 Q1 p.36。\n依該季 Coding Clinic，下列結論何者正確？","o":["【更正】Amlodipine 劑量不足應編 T46.1X6A（鈣通道阻斷劑），非 T46.5X6A。","【更正】椎板切除為神經系統手術，術後硬膜外血腫應編 G97.61（非 G97.62）。","PRN 藥物未服用不編劑量不足；編 Z91.198。","【更正】抽吸下葉分泌物應分別編右下葉 0B9F8ZZ + 左下葉 0B9J8ZZ，非雙側肺 0B9M8ZZ。"],"e":"正解：【更正】Amlodipine 劑量不足應編 T46.1X6A（鈣通道阻斷劑），非 T46.5X6A。 應使用：T46.1X6A（鈣通道阻斷劑劑量不足,初診）。 不應使用：T46.5X6A（其他降血壓藥）。 實務：Amlodipine 藥理分類為鈣通道阻斷劑。 （來源：AHA Coding Clinic 2023年第1季「更正：Amlodipine 劑量不足」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-01:d","q":"【AHA Coding Clinic 2023年第2季】\nPHE 結束後 COVID-19 篩檢(含術前檢查)之編碼。\n依該季 Coding Clinic，下列結論何者正確？","o":["PHE(2023/5/11)後 COVID-19 篩檢續用 Z20.822；2023/10/1 起改 Z11.52。術前篩檢 Z01.812 主診 + Z20.822(後改 Z11.52)。","COVID-19 所致病毒性心肌炎編 U07.1 + B33.22（非 I40.0/I41）。","椎體成形術後水泥肺栓塞：主診 S22.089A + J95.821 + T81.718A + I26.95。","ICD-10-CM 推定甲狀腺低下與失智相關，編 E03.- + F02.80。"],"e":"正解：PHE(2023/5/11)後 COVID-19 篩檢續用 Z20.822；2023/10/1 起改 Z11.52。術前篩檢 Z01.812 主診 + Z20.822(後改 Z11.52)。 應使用：篩檢：Z20.822（2023/10/1 起 Z11.52）；術前：Z01.812 主診 + Z20.822（後 Z11.52）。 編碼順序：術前以 Z01.812 為主診。 實務：2023/10/1 起 COVID-19 篩檢改用 Z11.52。 （來源：AHA Coding Clinic 2023年第2季「COVID-19 篩檢更新」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-02:a","q":"【AHA Coding Clinic 2023年第2季｜生化復發性攝護腺癌】\n前列腺切除+挽救放療後生化復發性攝護腺癌,PSA 上升。\n依該季 Coding Clinic，應如何編碼？","o":["C79.9 + R97.21 + Z90.79 + Z85.46","R97.21 + Z90.79 + Z85.46","C79.9 + Z90.79 + Z85.46","C79.9 + R97.21 + Z85.46"],"e":"正解：C79.9 + R97.21 + Z90.79 + Z85.46。C79.9（未特指部位續發惡性）+ R97.21（治療後 PSA 上升）+ Z90.79（後天生殖器官缺如）+ Z85.46（攝護腺惡性腫瘤個人史） 重點：生化復發(PSA上升)攝護腺癌(前列腺切除後)編 C79.9 + R97.21 + Z90.79 + Z85.46。 實務：生化復發推定為復發/轉移；部位未載→未特指續發碼。 （來源：AHA Coding Clinic 2023年第2季「生化復發性攝護腺癌」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-02:d","q":"【AHA Coding Clinic 2023年第2季】\n前列腺切除+挽救放療後生化復發性攝護腺癌,PSA 上升。\n依該季 Coding Clinic，下列結論何者正確？","o":["生化復發(PSA上升)攝護腺癌(前列腺切除後)編 C79.9 + R97.21 + Z90.79 + Z85.46。","妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。","惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。"],"e":"正解：生化復發(PSA上升)攝護腺癌(前列腺切除後)編 C79.9 + R97.21 + Z90.79 + Z85.46。 應使用：C79.9（未特指部位續發惡性）+ R97.21（治療後 PSA 上升）+ Z90.79（後天生殖器官缺如）+ Z85.46（攝護腺惡性腫瘤個人史）。 實務：生化復發推定為復發/轉移；部位未載→未特指續發碼。 （來源：AHA Coding Clinic 2023年第2季「生化復發性攝護腺癌」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-03:d","q":"【AHA Coding Clinic 2023年第2季】\n第四期 NSCLC 併頸淋巴結轉移,切片同時確診。\n依該季 Coding Clinic，下列結論何者正確？","o":["同時診斷原發與轉移時,原發為主診(除非治療僅針對轉移灶)。","SLL/CLL 依部位定碼；無淋巴結侵犯 → C91.12。","SCLC 併神經內分泌特徵編 C7A.1。","淋巴結無腫瘤時，淋巴血管侵犯不另編(為侵襲性指標非轉移)。"],"e":"正解：同時診斷原發與轉移時,原發為主診(除非治療僅針對轉移灶)。 應使用：原發 NSCLC(C34.-)為主診 + 頸淋巴結轉移碼(C77.0)。 編碼順序：原發為主診。 實務：原發為入院原因與轉移之根源→主診。 （來源：AHA Coding Clinic 2023年第2季「原發與續發惡性腫瘤同時診斷」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-04:d","q":"【AHA Coding Clinic 2023年第2季】\n心臟移植中切除原生心臟時,移除暫時 RVAD 套管見套管/右心房/肺動脈血栓。\n依該季 Coding Clinic，下列結論何者正確？","o":["移植中移除暫時 RVAD 時偶見之血栓(未影響照護)不另編。","DIEAP 皮瓣(乳房重建)靜脈血栓編 T85.868A。","於補片血管成形處之頸動脈摺疊不另編；只編 Supplement(補片)。","PROTEKDuo + CentriMag 作 RVAD：編 02HA3RZ + 5A02216；套管不另編。"],"e":"正解：移植中移除暫時 RVAD 時偶見之血栓(未影響照護)不另編。 應使用：不編血栓(偶見發現,未影響照護)。 不應使用：另編血栓。 實務：偶見發現不另編。 （來源：AHA Coding Clinic 2023年第2季「心臟移植併移除 RVAD（偶見血栓）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-05:a","q":"【AHA Coding Clinic 2023年第2季｜主動脈雙股繞道移植片血栓】\n主動脈雙股繞道左肢血栓行血管再通。\n依該季 Coding Clinic，應如何編碼？","o":["T82.868A + I74.5","I74.5","T82.868A","T82.868A + T81.89XA"],"e":"正解：T82.868A + I74.5。T82.868A（血管義器/移植物血栓,初診）+ I74.5（髂動脈栓塞及血栓） 重點：繞道移植片(左肢)血栓編 T82.868A + I74.5(部位)。 實務：移植片現行使如髂動脈→加 I74 表部位。 （來源：AHA Coding Clinic 2023年第2季「主動脈雙股繞道移植片血栓」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-05:d","q":"【AHA Coding Clinic 2023年第2季】\n主動脈雙股繞道左肢血栓行血管再通。\n依該季 Coding Clinic，下列結論何者正確？","o":["繞道移植片(左肢)血栓編 T82.868A + I74.5(部位)。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","前臂皮瓣陰莖成形失敗(微循環血栓)編 T83.86XA。","術後脂肪肺栓塞編 T81.718A + I26.96。"],"e":"正解：繞道移植片(左肢)血栓編 T82.868A + I74.5(部位)。 應使用：T82.868A（血管義器/移植物血栓,初診）+ I74.5（髂動脈栓塞及血栓）。 實務：移植片現行使如髂動脈→加 I74 表部位。 （來源：AHA Coding Clinic 2023年第2季「主動脈雙股繞道移植片血栓」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-06:a","q":"【AHA Coding Clinic 2023年第2季｜靜脈型胸廓出口症候群】\n左上肢 DVT 續發於靜脈型 TOS,行手術修補。\n依該季 Coding Clinic，應如何編碼？","o":["I87.1","G54.0","I82.412","I87.2"],"e":"正解：I87.1。I87.1（靜脈壓迫） 不應使用／不適用：G54.0（臂神經叢疾患，本例壓迫的是靜脈）。 重點：靜脈型胸廓出口症候群編 I87.1；非 G54.0。 實務：索引導向 G54.0 不符→靜脈受壓用 I87.1。 （來源：AHA Coding Clinic 2023年第2季「靜脈型胸廓出口症候群」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-06:d","q":"【AHA Coding Clinic 2023年第2季】\n左上肢 DVT 續發於靜脈型 TOS,行手術修補。\n依該季 Coding Clinic，下列結論何者正確？","o":["靜脈型胸廓出口症候群編 I87.1；非 G54.0。","COPD 惡化併肺炎與慢性支氣管擴張編 J44.0 + J44.1 + J47.9（+肺炎/呼衰/敗血症）。","股靜脈結紮(止血)之自然結果 DVT 編 I82.412,非手術併發症;併骨折/血管傷碼。","肝腎症候群併 AKI 兩碼並編 N17.8 + K76.7。"],"e":"正解：靜脈型胸廓出口症候群編 I87.1；非 G54.0。 應使用：I87.1（靜脈壓迫）。 不應使用：G54.0（臂神經叢疾患，本例壓迫的是靜脈）。 實務：索引導向 G54.0 不符→靜脈受壓用 I87.1。 （來源：AHA Coding Clinic 2023年第2季「靜脈型胸廓出口症候群」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-07:a","q":"【AHA Coding Clinic 2023年第2季｜糖尿病併自律神經失調姿勢性低血壓】\n第2型 DM 併自律神經病變、姿勢性低血壓、dysautonomia。\n依該季 Coding Clinic，應如何編碼？","o":["E11.43 + I95.1 + G90.8","I95.1 + G90.8","E11.43 + G90.8","E11.43 + I95.1"],"e":"正解：E11.43 + I95.1 + G90.8。E11.43（DM 併自律神經病變）+ I95.1（姿勢性低血壓）+ G90.8（自律神經系統其他疾患） 重點：第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。 實務：T2DM 自律神經失調常致姿勢性低血壓。 （來源：AHA Coding Clinic 2023年第2季「糖尿病併自律神經失調姿勢性低血壓」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-07:d","q":"【AHA Coding Clinic 2023年第2季】\n第2型 DM 併自律神經病變、姿勢性低血壓、dysautonomia。\n依該季 Coding Clinic，下列結論何者正確？","o":["第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。","DM 相關高血脂編 E11.69 + E78.49（有因果連結）。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","大麻劇吐症候群編新碼 R11.16 為主診；併低血鉀 E87.6。"],"e":"正解：第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。 應使用：E11.43（DM 併自律神經病變）+ I95.1（姿勢性低血壓）+ G90.8（自律神經系統其他疾患）。 實務：T2DM 自律神經失調常致姿勢性低血壓。 （來源：AHA Coding Clinic 2023年第2季「糖尿病併自律神經失調姿勢性低血壓」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-08:a","q":"【AHA Coding Clinic 2023年第2季｜混合型高血脂併高膽固醇血症】\n診斷 mixed hyperlipidemia with hypercholesterolemia。\n依該季 Coding Clinic，應如何編碼？","o":["E78.2","E78.00","E78.79","E78.49"],"e":"正解：E78.2。E78.2（混合型高血脂） 不應使用／不適用：E78.00（純高膽固醇，已含於 E78.2）。 重點：混合型高血脂併高膽固醇血症編 E78.2(已含高膽固醇)。 實務：高膽固醇+高三酸甘油脂→E78.2。 （來源：AHA Coding Clinic 2023年第2季「混合型高血脂併高膽固醇血症」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-08:d","q":"【AHA Coding Clinic 2023年第2季】\n診斷 mixed hyperlipidemia with hypercholesterolemia。\n依該季 Coding Clinic，下列結論何者正確？","o":["混合型高血脂併高膽固醇血症編 E78.2(已含高膽固醇)。","自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。","「左側」下背痛編 M54.50（非 M54.59）；ICD-10-CM 依 type 而非 laterality 分類。","失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。"],"e":"正解：混合型高血脂併高膽固醇血症編 E78.2(已含高膽固醇)。 應使用：E78.2（混合型高血脂）。 不應使用：E78.00（純高膽固醇，已含於 E78.2）。 實務：高膽固醇+高三酸甘油脂→E78.2。 （來源：AHA Coding Clinic 2023年第2季「混合型高血脂併高膽固醇血症」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-09:d","q":"【AHA Coding Clinic 2023年第2季】\n既存 T2DM 因免疫治療致『autoimmune DM』高血糖。\n依該季 Coding Clinic，下列結論何者正確？","o":["既存 T2DM 因免疫治療惡化高血糖編 E11.65 + T45.1X5A；不併編 E10。","兒童健檢確認 stage 2 前症狀期 T1D，主診 Z00.121 + E10.A2 + Z23。","T2DM 緩解編 E11.A；但有糖尿病併發症時不可用 E11.A（Excludes1）。","術後腹內膿瘍編 T81.43XA + K65.1。"],"e":"正解：既存 T2DM 因免疫治療惡化高血糖編 E11.65 + T45.1X5A；不併編 E10。 應使用：E11.65（T2DM 併高血糖）+ T45.1X5A（抗腫瘤/免疫抑制劑不良反應,初診）。 不應使用：E10（第1型，本例為既存 T2DM 惡化）。 實務：免疫治療致血糖升高分類為藥物不良反應。 （來源：AHA Coding Clinic 2023年第2季「既存第2型糖尿病因免疫治療致高血糖」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-10:d","q":"【AHA Coding Clinic 2023年第2季】\nGERD 病人 EGD 見十二指腸球多處糜爛,診斷慢性糜爛性十二指腸炎。\n依該季 Coding Clinic，下列結論何者正確？","o":["慢性糜爛性十二指腸炎編 K26.7。","芽生菌肺炎編 J16.8 + B40.2；若載明急/慢性改用 B40 更特定碼。","慢性十二指腸炎併 GFM 編 K29.80 + R89.7（GFM 為組織學發現無專碼）。","環咽肌功能障礙(上食道括約肌痙攣)編 K22.4。"],"e":"正解：慢性糜爛性十二指腸炎編 K26.7。 應使用：K26.7（慢性十二指腸潰瘍,無出血或穿孔）。 實務：糜爛/潰瘍含發炎；erosion of duodenum 為 K26 inclusion。 （來源：AHA Coding Clinic 2023年第2季「糜爛性十二指腸炎」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-11:d","q":"【AHA Coding Clinic 2023年第2季】\n急性膽囊炎併膽結石與膽石性胰臟炎,行腹腔鏡膽囊切除。\n依該季 Coding Clinic，下列結論何者正確？","o":["膽囊炎與膽石性胰臟炎互為相關,任一可為主診。","急性攝護腺炎併膀胱炎編 N41.3 + N41.0。","轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。","本例治療焦點為出血病灶 → 以 K25.0 或 K31.811 為主診。"],"e":"正解：膽囊炎與膽石性胰臟炎互為相關,任一可為主診。 應使用：K80.00（膽囊結石併急性膽囊炎,無阻塞）或 K85.10（膽石性急性胰臟炎,無壞死/感染）任一為主診。 編碼順序：依 II.B 任一為主診。 實務：膽囊切除同時治兩者→任一可為主診。 （來源：AHA Coding Clinic 2023年第2季「急性膽囊炎併膽結石與膽石性胰臟炎（排序）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-12:a","q":"【AHA Coding Clinic 2023年第2季｜苔癬樣角化症】\n診斷 lichenoid keratosis(無專碼)。\n依該季 Coding Clinic，應如何編碼？","o":["L82.0","L89.123","L89.113","L25.3"],"e":"正解：L82.0。L82.0（發炎性脂漏性角化症） 重點：苔癬樣角化症編 L82.0。 實務：ICD-10-CM 無專碼→L82.0。 （來源：AHA Coding Clinic 2023年第2季「苔癬樣角化症」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-12:d","q":"【AHA Coding Clinic 2023年第2季】\n診斷 lichenoid keratosis(無專碼)。\n依該季 Coding Clinic，下列結論何者正確？","o":["苔癬樣角化症編 L82.0。","Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。","住院診斷『possibly 膽管癌』依不確定診斷指引編 C22.1。","顳葉癲癇編 G40.109。"],"e":"正解：苔癬樣角化症編 L82.0。 應使用：L82.0（發炎性脂漏性角化症）。 實務：ICD-10-CM 無專碼→L82.0。 （來源：AHA Coding Clinic 2023年第2季「苔癬樣角化症」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-13:a","q":"【AHA Coding Clinic 2023年第2季｜術後血清腫】\n腋淋巴結切片+乳房腫瘤切除後復發腋部血清腫,置管引流。\n依該季 Coding Clinic，應如何編碼？","o":["M96.843","M94.262","M96.89","M95.2"],"e":"正解：M96.843。M96.843（他處置後肌肉骨骼構造血清腫） 重點：腋淋巴結切片/乳房腫瘤切除處術後血清腫編 M96.843。 實務：術後血清腫依部位/前處置編 M96.84-。 （來源：AHA Coding Clinic 2023年第2季「術後血清腫」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-13:d","q":"【AHA Coding Clinic 2023年第2季】\n腋淋巴結切片+乳房腫瘤切除後復發腋部血清腫,置管引流。\n依該季 Coding Clinic，下列結論何者正確？","o":["腋淋巴結切片/乳房腫瘤切除處術後血清腫編 M96.843。","術後脂肪肺栓塞編 T81.718A + I26.96。","自發性顱內低壓併 CSF 廔編 G96.811 + G96.08。","轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。"],"e":"正解：腋淋巴結切片/乳房腫瘤切除處術後血清腫編 M96.843。 應使用：M96.843（他處置後肌肉骨骼構造血清腫）。 實務：術後血清腫依部位/前處置編 M96.84-。 （來源：AHA Coding Clinic 2023年第2季「術後血清腫」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-14:a","q":"【AHA Coding Clinic 2023年第2季｜黃韌帶肥厚】\n腰椎狹窄史,慢性下背痛,L4-5 黃韌帶肥厚。\n依該季 Coding Clinic，應如何編碼？","o":["M24.28","M24.662","M22.01","M21.6X1"],"e":"正解：M24.28。為狹窄成分→只編脊椎狹窄;無關→M24.28（椎骨韌帶疾患） 編碼順序：先 query。 重點：黃韌帶肥厚須 query 是否為脊椎狹窄成分;若無關編 M24.28,若為成分只編狹窄。 實務：黃韌帶肥厚常為脊椎狹窄之因、少獨立出現。 （來源：AHA Coding Clinic 2023年第2季「黃韌帶肥厚」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-14:d","q":"【AHA Coding Clinic 2023年第2季】\n腰椎狹窄史,慢性下背痛,L4-5 黃韌帶肥厚。\n依該季 Coding Clinic，下列結論何者正確？","o":["黃韌帶肥厚須 query 是否為脊椎狹窄成分;若無關編 M24.28,若為成分只編狹窄。","術後異位性骨化編 M61.552；可 query 是否術後併發症。","高輸出量迴腸造口須 query 病因(感染/營養不良/dumping/術後併發症)後編碼。","記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。"],"e":"正解：黃韌帶肥厚須 query 是否為脊椎狹窄成分;若無關編 M24.28,若為成分只編狹窄。 應使用：為狹窄成分→只編脊椎狹窄;無關→M24.28（椎骨韌帶疾患）。 編碼順序：先 query。 實務：黃韌帶肥厚常為脊椎狹窄之因、少獨立出現。 （來源：AHA Coding Clinic 2023年第2季「黃韌帶肥厚」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-15:a","q":"【AHA Coding Clinic 2023年第2季｜腓腸肌馬蹄攣縮】\n診斷 left gastrocnemius equinus。\n依該季 Coding Clinic，應如何編碼？","o":["M62.462","M61.552","M62.82","M00.061"],"e":"正解：M62.462。M62.462（肌肉攣縮,左小腿） 重點：左腓腸肌馬蹄攣縮編 M62.462。 實務：gastrocnemius equinus=肌肉攣縮。 （來源：AHA Coding Clinic 2023年第2季「腓腸肌馬蹄攣縮」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-15:d","q":"【AHA Coding Clinic 2023年第2季】\n診斷 left gastrocnemius equinus。\n依該季 Coding Clinic，下列結論何者正確？","o":["左腓腸肌馬蹄攣縮編 M62.462。","術後異位性骨化編 M61.552；可 query 是否術後併發症。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","低血壓所致 AKI 編 N17.8。"],"e":"正解：左腓腸肌馬蹄攣縮編 M62.462。 應使用：M62.462（肌肉攣縮,左小腿）。 實務：gastrocnemius equinus=肌肉攣縮。 （來源：AHA Coding Clinic 2023年第2季「腓腸肌馬蹄攣縮」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-16:a","q":"【AHA Coding Clinic 2023年第2季｜術中移除骨釘造成脛骨骨折】\n左膝 TKA 中以 slap hammer 移除舊釘造成內側脛骨平台皮質骨折。\n依該季 Coding Clinic，應如何編碼？","o":["M96.89 + Y83.8","Y83.8","M96.89","M96.89 + M96.843"],"e":"正解：M96.89 + Y83.8。M96.89（肌肉骨骼其他術中/術後併發症）+ Y83.8（其他手術為異常反應原因） 重點：TKA 中移除舊骨釘造成脛骨平台骨折(醫師記為併發症)編 M96.89 + Y83.8。 實務：醫師記為手術併發症→M96.89 + 外因。 （來源：AHA Coding Clinic 2023年第2季「術中移除骨釘造成脛骨骨折」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-16:d","q":"【AHA Coding Clinic 2023年第2季】\n左膝 TKA 中以 slap hammer 移除舊釘造成內側脛骨平台皮質骨折。\n依該季 Coding Clinic，下列結論何者正確？","o":["TKA 中移除舊骨釘造成脛骨平台骨折(醫師記為併發症)編 M96.89 + Y83.8。","陰道成形術後新陰道狹窄，編術後泌尿生殖併發症 N99.89 + N89.5。","多關節發炎性關節炎未指特定關節/型別時 query；無資訊→M13.89，非 M06.4。","胃繞道後吻合處穿孔編 K63.1；無醫師記載不可逕當繞道併發症。"],"e":"正解：TKA 中移除舊骨釘造成脛骨平台骨折(醫師記為併發症)編 M96.89 + Y83.8。 應使用：M96.89（肌肉骨骼其他術中/術後併發症）+ Y83.8（其他手術為異常反應原因）。 實務：醫師記為手術併發症→M96.89 + 外因。 （來源：AHA Coding Clinic 2023年第2季「術中移除骨釘造成脛骨骨折」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-17:a","q":"【AHA Coding Clinic 2023年第2季｜流產後子宮無力出血】\n14週因胎兒囊狀水瘤/Monosomy XO 終止妊娠,D&C 後子宮無力出血。\n依該季 Coding Clinic，應如何編碼？","o":["O04.6 + O35.10X0","O72.1 + O35.10X0","Z33.2 + O35.10X0","O35.10X0"],"e":"正解：O04.6 + O35.10X0。O04.6（終止妊娠後延遲/過度出血）+ O35.10X0（胎兒染色體異常母體照護,未特指） 不應使用／不適用：O72.1（產後出血，本為流產後）；Z33.2（有併發症時不併編）。 重點：選擇性終止妊娠術中子宮無力出血編 O04.6 + O35.10X0;非 O72.1、不併 Z33.2。 實務：O04 之 Excludes1(→2023/10/1 改 Excludes2)禁 Z33.2 與 O04.6 併編。 （來源：AHA Coding Clinic 2023年第2季「流產後子宮無力出血」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-17:d","q":"【AHA Coding Clinic 2023年第2季】\n14週因胎兒囊狀水瘤/Monosomy XO 終止妊娠,D&C 後子宮無力出血。\n依該季 Coding Clinic，下列結論何者正確？","o":["選擇性終止妊娠術中子宮無力出血編 O04.6 + O35.10X0;非 O72.1、不併 Z33.2。","12週絨毛膜下出血編 O20.8。","剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。","過期流產後(已非孕)不編 Trisomy 21 妊娠併發症碼。"],"e":"正解：選擇性終止妊娠術中子宮無力出血編 O04.6 + O35.10X0;非 O72.1、不併 Z33.2。 應使用：O04.6（終止妊娠後延遲/過度出血）+ O35.10X0（胎兒染色體異常母體照護,未特指）。 不應使用：O72.1（產後出血，本為流產後）；Z33.2（有併發症時不併編）。 實務：O04 之 Excludes1(→2023/10/1 改 Excludes2)禁 Z33.2 與 O04.6 併編。 （來源：AHA Coding Clinic 2023年第2季「流產後子宮無力出血」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-18:a","q":"【AHA Coding Clinic 2023年第2季｜小腦血管母細胞瘤與 VHL 症候群】\nVHL 症候群併右小腦血管母細胞瘤,手術切除。\n依該季 Coding Clinic，應如何編碼？","o":["D43.1 + Q85.83","Q85.83","D43.1","D43.1 + D44.0"],"e":"正解：D43.1 + Q85.83。D43.1（腦未定行為腫瘤,幕下）主診 + Q85.83（VHL 症候群） 編碼順序：D43.1 為主診。 重點：因治療小腦血管母細胞瘤入院,主診 D43.1 + Q85.83。 實務：入院為治療血管母細胞瘤→其為主診。 （來源：AHA Coding Clinic 2023年第2季「小腦血管母細胞瘤與 VHL 症候群」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-18:d","q":"【AHA Coding Clinic 2023年第2季】\nVHL 症候群併右小腦血管母細胞瘤,手術切除。\n依該季 Coding Clinic，下列結論何者正確？","o":["因治療小腦血管母細胞瘤入院,主診 D43.1 + Q85.83。","門診 CAR-T 輸注後計畫入院續照護，主診 Z51.12 + C83.10。","惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。"],"e":"正解：因治療小腦血管母細胞瘤入院,主診 D43.1 + Q85.83。 應使用：D43.1（腦未定行為腫瘤,幕下）主診 + Q85.83（VHL 症候群）。 編碼順序：D43.1 為主診。 實務：入院為治療血管母細胞瘤→其為主診。 （來源：AHA Coding Clinic 2023年第2季「小腦血管母細胞瘤與 VHL 症候群」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-21:d","q":"【AHA Coding Clinic 2023年第2季】\n右搏動性耳鳴因乙狀竇經骨裂至骨膜,行乳突切除併 HydroSet 表面重建。\n依該季 Coding Clinic，下列結論何者正確？","o":["乙狀竇裂開編 I67.89 + M89.8X8 + H93.A1(搏動性耳鳴);表面重建 PCS 0NU50JZ。","外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。","【釐清】後大腦動脈梗塞無阻塞/狹窄/栓塞/血栓記載時編 I63.89。","減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。"],"e":"正解：乙狀竇裂開編 I67.89 + M89.8X8 + H93.A1(搏動性耳鳴);表面重建 PCS 0NU50JZ。 應使用：I67.89（其他腦血管疾病）+ M89.8X8（其他部位骨疾患）+ H93.A1（右耳搏動性耳鳴）;PCS 0NU50JZ（右顳骨 Supplement 合成替代物,開放）。 實務：乙狀竇含骨與血管段;乳突切除為入路不另編。 （來源：AHA Coding Clinic 2023年第2季「乙狀竇裂開（併乳突切除表面重建）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-22:d","q":"【AHA Coding Clinic 2023年第2季】\n迴腸造口高輸出併電解質異常,以止瀉藥與 IV 補液處理。\n依該季 Coding Clinic，下列結論何者正確？","o":["高輸出量迴腸造口須 query 病因(感染/營養不良/dumping/術後併發症)後編碼。","重度失智併憂鬱致嚴重營養不良/惡病質:潛在病因先編,再 E88.A。","黃韌帶肥厚須 query 是否為脊椎狹窄成分;若無關編 M24.28,若為成分只編狹窄。","術後異位性骨化編 M61.552；可 query 是否術後併發症。"],"e":"正解：高輸出量迴腸造口須 query 病因(感染/營養不良/dumping/術後併發症)後編碼。 應使用：先 query 病因後編碼;另編電解質異常等相關病況。 不應使用：逕當造口併發症。 編碼順序：先 query。 實務：病因不一(感染→腸炎碼;術後併發症→查具體型別)。 （來源：AHA Coding Clinic 2023年第2季「高輸出量迴腸造口」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-23:a","q":"【AHA Coding Clinic 2023年第2季｜Carillon 二尖瓣環系統置放】\n症狀性二尖瓣逆流,經冠狀竇置 Carillon 裝置。\n依該季 Coding Clinic，應如何編碼？","o":["02UG3JZ","028G3Z1","02H63KZ","02HA3RZ"],"e":"正解：02UG3JZ。02UG3JZ（二尖瓣 Supplement 合成替代物,經皮） 重點：Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。 實務：以裝置重塑瓣環→Supplement。 （來源：AHA Coding Clinic 2023年第2季「Carillon 二尖瓣環系統置放」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-23:d","q":"【AHA Coding Clinic 2023年第2季】\n症狀性二尖瓣逆流,經冠狀竇置 Carillon 裝置。\n依該季 Coding Clinic，下列結論何者正確？","o":["Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。","MMA 顱骨成形替換切除之顱骨編 0NR00JZ（Replacement）。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。"],"e":"正解：Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。 應使用：02UG3JZ（二尖瓣 Supplement 合成替代物,經皮）。 實務：以裝置重塑瓣環→Supplement。 （來源：AHA Coding Clinic 2023年第2季「Carillon 二尖瓣環系統置放」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-24:d","q":"【AHA Coding Clinic 2023年第2季】\n左心發育不全新生兒行 Norwood+Sano shunt,次全切除胸腺以顯露。\n依該季 Coding Clinic，下列結論何者正確？","o":["Norwood 手術中為顯露而切除胸腺,無獨立目的,不另編。","NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。","LAMPOON(撕裂二尖瓣小葉防 LVOT 阻塞)有獨立手術目的→另編 028;另編瓣膜置換。","氣管發育不全致氣切管置入食道編 0DH50YZ。"],"e":"正解：Norwood 手術中為顯露而切除胸腺,無獨立目的,不另編。 應使用：不另編胸腺切除(為顯露)。 不應使用：另編胸腺切除。 實務：取代 2014 Q3 p.16-17;為顯露之切除不另編。 （來源：AHA Coding Clinic 2023年第2季「Norwood 手術併胸腺切除」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-25:a","q":"【AHA Coding Clinic 2023年第2季｜直接內視鏡壞死組織清除】\nWOPN 之 AXIOS 支架阻塞,行 DEN 以 EndoRotor 清除壞死。\n依該季 Coding Clinic，應如何編碼？","o":["0FCG8ZZ","0F9980Z","009640Z","01580ZZ"],"e":"正解：0FCG8ZZ。0FCG8ZZ（胰臟固體物質清除,經自然孔內視鏡） 不應使用／不適用：Extraction/Excision/Drainage。 重點：DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。 實務：清除固體物質→Extirpation(不論技術/器械)。 （來源：AHA Coding Clinic 2023年第2季「直接內視鏡壞死組織清除」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-25:d","q":"【AHA Coding Clinic 2023年第2季】\nWOPN 之 AXIOS 支架阻塞,行 DEN 以 EndoRotor 清除壞死。\n依該季 Coding Clinic，下列結論何者正確？","o":["DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","EGD 找出血源、抽吸舊血塊無獨立目的，編 Inspection 0DJ08ZZ。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。"],"e":"正解：DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。 應使用：0FCG8ZZ（胰臟固體物質清除,經自然孔內視鏡）。 不應使用：Extraction/Excision/Drainage。 實務：清除固體物質→Extirpation(不論技術/器械)。 （來源：AHA Coding Clinic 2023年第2季「直接內視鏡壞死組織清除」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-26:a","q":"【AHA Coding Clinic 2023年第2季｜V-Y 肛門成形併黏膜外翻切除】\n直腸癌術後肛門黏膜外翻併失禁,行黏膜外翻切除+V-Y 肛門成形(皮膚前移皮瓣)。\n依該季 Coding Clinic，應如何編碼？","o":["0HX9XZZ + 0DBQ0ZZ","0DBQ0ZZ","0HX9XZZ","0HX5XZZ + 0DBQ0ZZ"],"e":"正解：0HX9XZZ + 0DBQ0ZZ。0HX9XZZ（會陰皮膚 Transfer,外部=V-Y 成形）+ 0DBQ0ZZ（肛門切除,開放=黏膜外翻） 不應使用／不適用：以 Repair/Supplement 編成形。 重點：V-Y 肛門成形(皮瓣前移)為 Transfer 0HX9XZZ;黏膜外翻切除 0DBQ0ZZ。 實務：以皮膚前移皮瓣→Transfer;黏膜外翻切除為獨立目的另編。 （來源：AHA Coding Clinic 2023年第2季「V-Y 肛門成形併黏膜外翻切除」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-26:d","q":"【AHA Coding Clinic 2023年第2季】\n直腸癌術後肛門黏膜外翻併失禁,行黏膜外翻切除+V-Y 肛門成形(皮膚前移皮瓣)。\n依該季 Coding Clinic，下列結論何者正確？","o":["V-Y 肛門成形(皮瓣前移)為 Transfer 0HX9XZZ;黏膜外翻切除 0DBQ0ZZ。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。","體外切除肝腫瘤後自體再植：只編所行處置(切除)；非 Transplantation。","本例 Zenker 憩室切除以 Excision：0DB18ZZ + 環咽肌切除 0KB44ZZ。"],"e":"正解：V-Y 肛門成形(皮瓣前移)為 Transfer 0HX9XZZ;黏膜外翻切除 0DBQ0ZZ。 應使用：0HX9XZZ（會陰皮膚 Transfer,外部=V-Y 成形）+ 0DBQ0ZZ（肛門切除,開放=黏膜外翻）。 不應使用：以 Repair/Supplement 編成形。 實務：以皮膚前移皮瓣→Transfer;黏膜外翻切除為獨立目的另編。 （來源：AHA Coding Clinic 2023年第2季「V-Y 肛門成形併黏膜外翻切除」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-27:a","q":"【AHA Coding Clinic 2023年第2季｜肩胛下肌腱填補術】\n右肩後方不穩併 Bankart 與 reverse Hill-Sachs,以肩胛下肌腱填補缺損(modified McLaughlin)。\n依該季 Coding Clinic，應如何編碼？","o":["0PUC47Z","0PH000Z","0PH304Z","0PS004Z"],"e":"正解：0PUC47Z。0PUC47Z（右肱骨頭 Supplement 自體組織,經皮內視鏡） 重點：reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。 實務：remplissage=填補;以肌腱填補增補肱骨頭功能→Supplement。 （來源：AHA Coding Clinic 2023年第2季「肩胛下肌腱填補術」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-27:d","q":"【AHA Coding Clinic 2023年第2季】\n右肩後方不穩併 Bankart 與 reverse Hill-Sachs,以肩胛下肌腱填補缺損(modified McLaughlin)。\n依該季 Coding Clinic，下列結論何者正確？","o":["reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。","SFA 剝離置 Tack 植入物編 04UL3JZ(Supplement)。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。"],"e":"正解：reverse Hill-Sachs 以肩胛下肌腱填補編 0PUC47Z(Supplement)。 應使用：0PUC47Z（右肱骨頭 Supplement 自體組織,經皮內視鏡）。 實務：remplissage=填補;以肌腱填補增補肱骨頭功能→Supplement。 （來源：AHA Coding Clinic 2023年第2季「肩胛下肌腱填補術」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-28:a","q":"【AHA Coding Clinic 2023年第2季｜脊椎融合併同種異體骨與骨髓抽吸】\nL2-L4 後外側融合,以 allograft 混骨髓抽吸植入。\n依該季 Coding Clinic，應如何編碼？","o":["0SG10K1","0SG00A0","0SGJ07Z","0SGJ04Z"],"e":"正解：0SG10K1。0SG10K1（2+腰椎關節融合,非自體,後入路後柱,開放）+ 另編骨髓抽吸 不應使用／不適用：以自體組織 device(骨髓抽吸非骨移植)。 重點：同種異體骨+骨髓抽吸之融合:device 值 K(非自體);骨髓抽吸另編。 實務：骨髓抽吸/幹細胞非骨移植→device 用非自體;抽吸另編。 （來源：AHA Coding Clinic 2023年第2季「脊椎融合併同種異體骨與骨髓抽吸」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-28:d","q":"【AHA Coding Clinic 2023年第2季】\nL2-L4 後外側融合,以 allograft 混骨髓抽吸植入。\n依該季 Coding Clinic，下列結論何者正確？","o":["同種異體骨+骨髓抽吸之融合:device 值 K(非自體);骨髓抽吸另編。","PTP(XLIF 一型)L3-L4 前柱椎間融合編 0SG00A0。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。","冠脈瘤併廔管行 CABG，但 vein graft 最終結紮/橫斷；編修補冠靜脈+修補冠動脈+隱靜脈取材。"],"e":"正解：同種異體骨+骨髓抽吸之融合:device 值 K(非自體);骨髓抽吸另編。 應使用：0SG10K1（2+腰椎關節融合,非自體,後入路後柱,開放）+ 另編骨髓抽吸。 不應使用：以自體組織 device(骨髓抽吸非骨移植)。 實務：骨髓抽吸/幹細胞非骨移植→device 用非自體;抽吸另編。 （來源：AHA Coding Clinic 2023年第2季「脊椎融合併同種異體骨與骨髓抽吸」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-29:a","q":"【AHA Coding Clinic 2023年第2季｜以 Hemospray 止血】\n十二指腸潰瘍併附著血塊出血,噴 Hemospray 止血。\n依該季 Coding Clinic，應如何編碼？","o":["0W3P8ZZ","0W3R7ZZ","0W9J4ZZ","009640Z"],"e":"正解：0W3P8ZZ。XW0G886（礦物基外用止血劑導入上消化道,經自然孔內視鏡,group6）+ 0W3P8ZZ（消化道止血,經自然孔內視鏡） 不應使用／不適用：僅編其一。 重點：Hemospray 止血編 XW0G886 + 0W3P8ZZ。 實務：Section X 碼不足以完整描述→併編 Control。 （來源：AHA Coding Clinic 2023年第2季「以 Hemospray 止血」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-29:d","q":"【AHA Coding Clinic 2023年第2季】\n十二指腸潰瘍併附著血塊出血,噴 Hemospray 止血。\n依該季 Coding Clinic，下列結論何者正確？","o":["Hemospray 止血編 XW0G886 + 0W3P8ZZ。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","EGD 找出血源、抽吸舊血塊無獨立目的，編 Inspection 0DJ08ZZ。","自體骨瓣吸收診斷 T86.838 + M95.2；移除 PCS 為 Removal 0NP007Z。"],"e":"正解：Hemospray 止血編 XW0G886 + 0W3P8ZZ。 應使用：XW0G886（礦物基外用止血劑導入上消化道,經自然孔內視鏡,group6）+ 0W3P8ZZ（消化道止血,經自然孔內視鏡）。 不應使用：僅編其一。 實務：Section X 碼不足以完整描述→併編 Control。 （來源：AHA Coding Clinic 2023年第2季「以 Hemospray 止血」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q2-30:a","q":"【AHA Coding Clinic 2023年第2季｜矽膠注射併發症】\n20年前美容矽膠臀部注射侵蝕致右腹膜後膿瘍。\n依該季 Coding Clinic，應如何編碼？","o":["K68.19 + M79.5 + Z18.89","T85.79XA + M79.5 + Z18.89","M79.5 + Z18.89","K68.19 + Z18.89"],"e":"正解：K68.19 + M79.5 + Z18.89。K68.19（其他腹膜後膿瘍）+ M79.5（軟組織殘留異物）+ Z18.89（其他殘留異物碎片） 不應使用／不適用：T85.79XA（非 FDA 核准美容矽膠非醫療裝置）。 重點：非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。 實務：非核准美容矽膠不分類為醫療裝置→不用 T85.79。 （來源：AHA Coding Clinic 2023年第2季「矽膠注射併發症」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q2-30:d","q":"【AHA Coding Clinic 2023年第2季】\n20年前美容矽膠臀部注射侵蝕致右腹膜後膿瘍。\n依該季 Coding Clinic，下列結論何者正確？","o":["非醫療矽膠注射所致腹膜後膿 oding Clinic 2023年第3季｜鐳-223 所致全血球減少】\n攝護腺癌骨轉移,全血球減少惡化疑因鐳-223 治療。\n依該季 Coding Clinic，應如何編碼？","o":["D61.811 + T50.995A","D61.811 + T50.8X5","T50.995A","D61.811"],"e":"正解：D61.811 + T50.995A。D61.811（其他藥物誘發全血球減少）+ T50.995A（其他藥物不良反應,初診） 不應使用／不適用：T50.8X5（放射診斷劑；鐳-223 為治療非診斷）。 重點：鐳-223 治療所致全血球減少編 D61.811 + T50.995A；非 T50.8X5(診斷劑)。 實務：鐳-223 為治療劑非診斷劑→用 T50.995A。 （來源：AHA Coding Clinic 2023年第3季「鐳-223 所致全血球減少」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-03:d","q":"【AHA Coding Clinic 2023年第3季】\n攝護腺癌骨轉移,全血球減少惡化疑因鐳-223 治療。\n依該季 Coding Clinic，下列結論何者正確？","o":["鐳-223 治療所致全血球減少編 D61.811 + T50.995A；非 T50.8X5(診斷劑)。","既存 T2DM 因免疫治療惡化高血糖編 E11.65 + T45.1X5A；不併編 E10。","減重用 tirzepatide 增量所致胃輕癱編 K31.84 + T38.895A。","Ozempic（GLP-1）所致藥物性急性胰臟炎編 K85.30 + T38.895A；非 T38.3X5A。"],"e":"正解：鐳-223 治療所致全血球減少編 D61.811 + T50.995A；非 T50.8X5(診斷劑)。 應使用：D61.811（其他藥物誘發全血球減少）+ T50.995A（其他藥物不良反應,初診）。 不應使用：T50.8X5（放射診斷劑；鐳-223 為治療非診斷）。 實務：鐳-223 為治療劑非診斷劑→用 T50.995A。 （來源：AHA Coding Clinic 2023年第3季「鐳-223 所致全血球減少」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-04:a","q":"【AHA Coding Clinic 2023年第3季｜非外傷性腎後包膜下血腫】\n左脅痛、白血球增多、AKI、乳酸升高,CT 示左腎後包膜下血腫,無外傷。\n依該季 Coding Clinic，應如何編碼？","o":["N28.89 + N17.9","N17.9","N28.89","N04.0 + N17.9"],"e":"正解：N28.89 + N17.9。N28.89（腎及輸尿管其他疾患）+ N17.9（急性腎衰竭,未特指） 編碼順序：依情境排序。 重點：非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。 實務：AKI 與包膜下血腫為獨立病況分別編。 （來源：AHA Coding Clinic 2023年第3季「非外傷性腎後包膜下血腫」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-04:d","q":"【AHA Coding Clinic 2023年第3季】\n左脅痛、白血球增多、AKI、乳酸升高,CT 示左腎後包膜下血腫,無外傷。\n依該季 Coding Clinic，下列結論何者正確？","o":["非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。","外傷性顱內積氣編 G93.89 + S06.890A；非 air embolism T79.0。","MCD 併 ATN 之 AKI 編 N17.0 + N04.0。","低血壓所致 AKI 編 N17.8。"],"e":"正解：非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。 應使用：N28.89（腎及輸尿管其他疾患）+ N17.9（急性腎衰竭,未特指）。 編碼順序：依情境排序。 實務：AKI 與包膜下血腫為獨立病況分別編。 （來源：AHA Coding Clinic 2023年第3季「非外傷性腎後包膜下血腫」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-05:a","q":"【AHA Coding Clinic 2023年第3季｜Jada 系統治產後出血】\n產後子宮下段無力持續出血,經陰道置 Jada 系統抽吸止血。\n依該季 Coding Clinic，應如何編碼？","o":["0W3R7ZZ","0W3P8ZZ","0W9J4ZZ","009640Z"],"e":"正解：0W3R7ZZ。0W3R7ZZ（生殖泌尿道止血,經自然孔） 不應使用／不適用：Drainage(目的為止血非引流)。 重點：Jada 系統以抽吸使子宮收縮止血 → Control,編 0W3R7ZZ。 實務：目的為止血(子宮收縮壓迫血管)→Control 非 Drainage。 （來源：AHA Coding Clinic 2023年第3季「Jada 系統治產後出血」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-05:d","q":"【AHA Coding Clinic 2023年第3季】\n產後子宮下段無力持續出血,經陰道置 Jada 系統抽吸止血。\n依該季 Coding Clinic，下列結論何者正確？","o":["Jada 系統以抽吸使子宮收縮止血 → Control,編 0W3R7ZZ。","Hemospray + 止血夾各編：XW0G886 + 0W3P8ZZ。","腹主+降胸主動脈剝離瓣開窗編 04Q03ZZ + 02QW3ZZ(Repair)。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。"],"e":"正解：Jada 系統以抽吸使子宮收縮止血 → Control,編 0W3R7ZZ。 應使用：0W3R7ZZ（生殖泌尿道止血,經自然孔）。 不應使用：Drainage(目的為止血非引流)。 實務：目的為止血(子宮收縮壓迫血管)→Control 非 Drainage。 （來源：AHA Coding Clinic 2023年第3季「Jada 系統治產後出血」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-06:a","q":"【AHA Coding Clinic 2023年第3季｜氣切管置入食道（氣管發育不全）】\n先天氣管發育不全新生兒無法插管,緊急氣切但氣切管置入食道並改善通氣。\n依該季 Coding Clinic，應如何編碼？","o":["0DH50YZ","0DH68DZ","0D9Q70Z","0DB18ZZ"],"e":"正解：0DH50YZ。0DH50YZ（食道其他裝置置入,開放） 重點：氣管發育不全致氣切管置入食道編 0DH50YZ。 實務：裝置實際置於食道→body part 食道。 （來源：AHA Coding Clinic 2023年第3季「氣切管置入食道（氣管發育不全）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-06:d","q":"【AHA Coding Clinic 2023年第3季】\n先天氣管發育不全新生兒無法插管,緊急氣切但氣切管置入食道並改善通氣。\n依該季 Coding Clinic，下列結論何者正確？","o":["氣管發育不全致氣切管置入食道編 0DH50YZ。","type D 滑車發育不良之滑車成形（截骨移位+錨釘固定）編 0QSC04Z。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","左腋淋巴靜脈繞道編 07160Z3。"],"e":"正解：氣管發育不全致氣切管置入食道編 0DH50YZ。 應使用：0DH50YZ（食道其他裝置置入,開放）。 實務：裝置實際置於食道→body part 食道。 （來源：AHA Coding Clinic 2023年第3季「氣切管置入食道（氣管發育不全）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-07:a","q":"【AHA Coding Clinic 2023年第3季｜Hemospray 併止血夾】\n胃繞道後吻合口潰瘍出血,置止血夾仍滲血再噴 Hemospray。\n依該季 Coding Clinic，應如何編碼？","o":["0W3P8ZZ","0W3R7ZZ","0W9J4ZZ","009640Z"],"e":"正解：0W3P8ZZ。XW0G886（礦物基外用止血劑導入上消化道,group6）+ 0W3P8ZZ（消化道止血,經自然孔內視鏡=止血夾） 不應使用／不適用：僅編其一。 重點：Hemospray + 止血夾各編：XW0G886 + 0W3P8ZZ。 實務：Section X 碼不含夾等其他止血技術→另編 Control。 （來源：AHA Coding Clinic 2023年第3季「Hemospray 併止血夾」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-07:d","q":"【AHA Coding Clinic 2023年第3季】\n胃繞道後吻合口潰瘍出血,置止血夾仍滲血再噴 Hemospray。\n依該季 Coding Clinic，下列結論何者正確？","o":["Hemospray + 止血夾各編：XW0G886 + 0W3P8ZZ。","胃繞道後吻合口潰瘍編 K28.4(胃空腸潰瘍)；非手術併發症。","自體骨瓣吸收診斷 T86.838 + M95.2；移除 PCS 為 Removal 0NP007Z。","胃繞道後吻合處穿孔編 K63.1；無醫師記載不可逕當繞道併發症。"],"e":"正解：Hemospray + 止血夾各編：XW0G886 + 0W3P8ZZ。 應使用：XW0G886（礦物基外用止血劑導入上消化道,group6）+ 0W3P8ZZ（消化道止血,經自然孔內視鏡=止血夾）。 不應使用：僅編其一。 實務：Section X 碼不含夾等其他止血技術→另編 Control。 （來源：AHA Coding Clinic 2023年第3季「Hemospray 併止血夾」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-08:a","q":"【AHA Coding Clinic 2023年第3季｜空腸/盲腸/結腸槍傷】\n腹部槍傷併廣泛內傷,空腸與盲腸/右結腸『blast』傷需切除。\n依該季 Coding Clinic，應如何編碼？","o":["S36.498A + S36.590A + X95.9XXA + S31.6","S36.590A + X95.9XXA + S31.6","S36.498A + X95.9XXA + S31.6","S36.498A + S36.590A + S31.6"],"e":"正解：S36.498A + S36.590A + X95.9XXA + S31.6。S36.498A（小腸其他部位其他損傷,初診）+ S36.590A（升結腸其他損傷,初診）+ X95.9XXA（槍擊外因,初診）+ 腹壁開放傷 S31.6- 不應使用／不適用：primary/secondary blast 碼(此為槍傷穿刺傷)。 編碼順序：依情境排序。 重點：槍傷(文件稱 blast)之腸道傷編傷害碼,非原發/續發爆震碼。 實務：GSW 分類為穿刺/穿透傷;primary blast 限高壓、secondary 限爆風碎片。 （來源：AHA Coding Clinic 2023年第3季「空腸/盲腸/結腸槍傷」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-08:d","q":"【AHA Coding Clinic 2023年第3季】\n腹部槍傷併廣泛內傷,空腸與盲腸/右結腸『blast』傷需切除。\n依該季 Coding Clinic，下列結論何者正確？","o":["槍傷(文件稱 blast)之腸道傷編傷害碼,非原發/續發爆震碼。","志賀氏菌（Shigella flexneri）結腸炎併敗血症，編 A41.59 + A03.1。","空腸 GIST 切除後轉移至脊椎（骨），轉移灶依部位編 C79.51。","惡性肋膜積液(原發已切除)：主診 C78.01(肺轉移) + J91.0 + J96.01 + Z85.44。"],"e":"正解：槍傷(文件稱 blast)之腸道傷編傷害碼,非原發/續發爆震碼。 應使用：S36.498A（小腸其他部位其他損傷,初診）+ S36.590A（升結腸其他損傷,初診）+ X95.9XXA（槍擊外因,初診）+ 腹壁開放傷 S31.6-。 不應使用：primary/secondary blast 碼(此為槍傷穿刺傷)。 編碼順序：依情境排序。 實務：GSW 分類為穿刺/穿透傷;primary blast 限高壓、secondary 限爆風碎片。 （來源：AHA Coding Clinic 2023年第3季「空腸/盲腸/結腸槍傷」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-09:d","q":"【AHA Coding Clinic 2023年第3季】\n34週早產兒呼吸暫停需 NAVA(<96hr)。\n依該季 Coding Clinic，下列結論何者正確？","o":["NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","移植前於捐贈器官所行準備(心 ASD 閉合、腎靜脈重建)不另編(6AB Perfusion 除外)。","ORIF 中 BMAC 抽吸與注射為手術固有,不另編。"],"e":"正解：NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。 應使用：table 5A0 Assistance（未插管）；插管則 Performance（依時數/連續或間歇）。 不應使用：另編導管置入。 實務：NAVA 為部分通氣支持;導管(EAdi)為固有。 （來源：AHA Coding Clinic 2023年第3季「神經調節通氣輔助」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-10:a","q":"【AHA Coding Clinic 2023年第3季｜吻合口（胃空腸）潰瘍】\n胃繞道後大 cratered 吻合口潰瘍併出血。\n依該季 Coding Clinic，應如何編碼？","o":["K28.4","K25.0","K22.4","K26.7"],"e":"正解：K28.4。K28.4（慢性/未特指胃空腸潰瘍併出血） 不應使用／不適用：報為手術併發症。 重點：胃繞道後吻合口潰瘍編 K28.4(胃空腸潰瘍)；非手術併發症。 實務：ICD-10-CM 將吻合口潰瘍歸胃空腸潰瘍,非併發症。 （來源：AHA Coding Clinic 2023年第3季「吻合口（胃空腸）潰瘍」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-10:d","q":"【AHA Coding Clinic 2023年第3季】\n胃繞道後大 cratered 吻合口潰瘍併出血。\n依該季 Coding Clinic，下列結論何者正確？","o":["胃繞道後吻合口潰瘍編 K28.4(胃空腸潰瘍)；非手術併發症。","失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。","小腸-橫結腸吻合口崩裂編 T81.320A；不另編身體系統併發症碼。","胃空腸狹窄編 K56.699(腸阻塞)；無記載不當併發症。"],"e":"正解：胃繞道後吻合口潰瘍編 K28.4(胃空腸潰瘍)；非手術併發症。 應使用：K28.4（慢性/未特指胃空腸潰瘍併出血）。 不應使用：報為手術併發症。 實務：ICD-10-CM 將吻合口潰瘍歸胃空腸潰瘍,非併發症。 （來源：AHA Coding Clinic 2023年第3季「吻合口（胃空腸）潰瘍」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-11:a","q":"【AHA Coding Clinic 2023年第3季｜胃空腸狹窄（胃繞道後）】\nRoux-en-Y 後胃空腸狹窄行 EGD 擴張。\n依該季 Coding Clinic，應如何編碼？","o":["K56.699","K56.1","K59.02","K56.2"],"e":"正解：K56.699。K56.699（其他腸阻塞,未特指部分/完全） 不應使用／不適用：報為術後併發症(無記載)。 重點：胃空腸狹窄編 K56.699(腸阻塞)；無記載不當併發症。 實務：吻合口狹窄歸腸阻塞;無醫師記載不當併發症。 （來源：AHA Coding Clinic 2023年第3季「胃空腸狹窄（胃繞道後）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-11:d","q":"【AHA Coding Clinic 2023年第3季】\nRoux-en-Y 後胃空腸狹窄行 EGD 擴張。\n依該季 Coding Clinic，下列結論何者正確？","o":["胃空腸狹窄編 K56.699(腸阻塞)；無記載不當併發症。","慢性 C 肝所致肝硬化編 K74.69（更新 2018 Q1 p.4 之 K74.60 建議）。","胃繞道後吻合處穿孔編 K63.1；無醫師記載不可逕當繞道併發症。","NASH 所致肝硬化編 K75.81 + K74.69（非 K74.60）。"],"e":"正解：胃空腸狹窄編 K56.699(腸阻塞)；無記載不當併發症。 應使用：K56.699（其他腸阻塞,未特指部分/完全）。 不應使用：報為術後併發症(無記載)。 實務：吻合口狹窄歸腸阻塞;無醫師記載不當併發症。 （來源：AHA Coding Clinic 2023年第3季「胃空腸狹窄（胃繞道後）」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-12:a","q":"【AHA Coding Clinic 2023年第3季｜腸套疊併胃出口阻塞】\nWhipple+胃繞道史,腸套疊併胃空腸接合處胃出口阻塞。\n依該季 Coding Clinic，應如何編碼？","o":["K56.1","K31.1","K56.699","K57.20"],"e":"正解：K56.1。K56.1（腸套疊） 不應使用／不適用：併發症碼；K31.1（幽門狹窄，已無幽門）。 重點：吻合口腸套疊編 K56.1(非併發症)；Whipple 後無幽門不用 K31.1。 實務：已無幽門→胃出口阻塞不用 K31.1。 （來源：AHA Coding Clinic 2023年第3季「腸套疊併胃出口阻塞」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-12:d","q":"【AHA Coding Clinic 2023年第3季】\nWhipple+胃繞道史,腸套疊併胃空腸接合處胃出口阻塞。\n依該季 Coding Clinic，下列結論何者正確？","o":["吻合口腸套疊編 K56.1(非併發症)；Whipple 後無幽門不用 K31.1。","便秘併糞便阻塞只編 K56.41（便秘為糞便阻塞之固有）。","自行拔除導尿管致血尿屬裝置所致出血(非術後併發症)，編 T83.83XA + R31.9。","胃繞道後吻合口潰瘍編 K28.4(胃空腸潰瘍)；非手術併發症。"],"e":"正解：吻合口腸套疊編 K56.1(非併發症)；Whipple 後無幽門不用 K31.1。 應使用：K56.1（腸套疊）。 不應使用：併發症碼；K31.1（幽門狹窄，已無幽門）。 實務：已無幽門→胃出口阻塞不用 K31.1。 （來源：AHA Coding Clinic 2023年第3季「腸套疊併胃出口阻塞」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-13:d","q":"【AHA Coding Clinic 2023年第3季】\n左大腿槍傷併股骨骨折、股靜脈與 SFA 橫斷,SFA 繞道、股靜脈結紮,術後股靜脈 DVT(醫師記為結紮之自然結果)。\n依該季 Coding Clinic，下列結論何者正確？","o":["股靜脈結紮(止血)之自然結果 DVT 編 I82.412,非手術併發症;併骨折/血管傷碼。","脊椎按摩所致椎動脈剝離併腦梗塞編術後併發症碼組合；不用外傷碼。","TKA 中移除舊骨釘造成脛骨平台骨折(醫師記為併發症)編 M96.89 + Y83.8。","減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。"],"e":"正解：股靜脈結紮(止血)之自然結果 DVT 編 I82.412,非手術併發症;併骨折/血管傷碼。 應使用：I82.412（左股靜脈急性栓塞及血栓）+ S72（股骨骨折）+ S75.022A/S75.122A（左股動/靜脈大撕裂,初診）+ S71.132A（左大腿穿刺傷）+ X95.9XXA。 不應使用：報為手術併發症。 編碼順序：依情境排序。 實務：醫師記 DVT 為結紮(止血)之後果→非併發症。 （來源：AHA Coding Clinic 2023年第3季「股靜脈結紮致深部靜脈血栓」）","s":"cc2023"},{"c":"cccode","id":"cc:CC2023Q3-14:a","q":"【AHA Coding Clinic 2023年第3季｜副甲狀腺切除後（無副甲低下）】\n副甲狀腺切除史常規健檢,無記載術後副甲低下。\n依該季 Coding Clinic，應如何編碼？","o":["Z98.890 + Z90.89","E89.2 + Z90.89","Z90.89","Z98.890"],"e":"正解：Z98.890 + Z90.89。Z98.890（其他特指術後狀態）+ Z90.89（其他器官後天缺如） 不應使用／不適用：E89.2（術後副甲低下，無記載不用）。 重點：副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。 實務：切除部分副甲狀腺不必然致副甲低下(有四顆);無記載不編 E89.2。 （來源：AHA Coding Clinic 2023年第3季「副甲狀腺切除後（無副甲低下）」）","s":"cc2023"},{"c":"ccconcept","id":"cc:CC2023Q3-14:d","q":"【AHA Coding Clinic 2023年第3季】\n副甲狀腺切除史常規健檢,無記載術後副甲低下。\n依該季 Coding Clinic，下列結論何者正確？","o":["副甲狀腺切除後無記載

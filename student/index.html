,"s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-15:a","q":"【AHA Coding Clinic 2025年第3季｜成人瀰漫性特發性肺神經內分泌細胞增生】\n成人 DIPNECH 之診斷碼。\n依該季 Coding Clinic，應如何編碼？","o":["J98.4","J95.831","J96.01","J95.821"],"e":"正解：J98.4。J98.4（肺其他疾患） 重點：成人 DIPNECH 編 J98.4。 實務：DIPNECH 以 J98.4 捕捉。 （來源：AHA Coding Clinic 2025年第3季「成人瀰漫性特發性肺神經內分泌細胞增生」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-15:d","q":"【AHA Coding Clinic 2025年第3季】\n成人 DIPNECH 之診斷碼。\n依該季 Coding Clinic，下列結論何者正確？","o":["成人 DIPNECH 編 J98.4。","SCLC 併神經內分泌特徵編 C7A.1。","大細胞神經內分泌肺癌編 C7A.1；肝轉移 C7B.8。","EDAC 編 J98.8（無特定索引條目）。"],"e":"正解：成人 DIPNECH 編 J98.4。 應使用：J98.4（肺其他疾患）。 實務：DIPNECH 以 J98.4 捕捉。 （來源：AHA Coding Clinic 2025年第3季「成人瀰漫性特發性肺神經內分泌細胞增生」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-16:a","q":"【AHA Coding Clinic 2025年第3季｜三角纖維軟骨複合體撕裂】\n跌倒致左手開放性粉碎性關節內遠端橈骨骨折併 TFCC 撕裂，皆需修補。\n依該季 Coding Clinic，應如何編碼？","o":["S63.592A + S52.572B","S52.572B","S63.592A","S06.890A + S52.572B"],"e":"正解：S63.592A + S52.572B。S63.592A（左腕其他特指扭傷,初診=TFCC）+ S52.572B（左遠端橈骨其他關節內骨折,初診,開放 I/II 型） 重點：TFCC 撕裂(韌帶)編扭傷 S63.592A；併開放性遠端橈骨關節內骨折 S52.572B。 實務：韌帶撕裂歸 Sprain；S63 含腕手部軟骨/關節/韌帶扭傷。 （來源：AHA Coding Clinic 2025年第3季「三角纖維軟骨複合體撕裂」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-16:d","q":"【AHA Coding Clinic 2025年第3季】\n跌倒致左手開放性粉碎性關節內遠端橈骨骨折併 TFCC 撕裂，皆需修補。\n依該季 Coding Clinic，下列結論何者正確？","o":["TFCC 撕裂(韌帶)編扭傷 S63.592A；併開放性遠端橈骨關節內骨折 S52.572B。","前期糖尿病所致多發性神經病變編 G62.89 + R73.03；非 G63。","峽部骨折致滑脫只編滑脫 M43.17。","股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。"],"e":"正解：TFCC 撕裂(韌帶)編扭傷 S63.592A；併開放性遠端橈骨關節內骨折 S52.572B。 應使用：S63.592A（左腕其他特指扭傷,初診=TFCC）+ S52.572B（左遠端橈骨其他關節內骨折,初診,開放 I/II 型）。 實務：韌帶撕裂歸 Sprain；S63 含腕手部軟骨/關節/韌帶扭傷。 （來源：AHA Coding Clinic 2025年第3季「三角纖維軟骨複合體撕裂」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-17:d","q":"【AHA Coding Clinic 2025年第3季】\n疑 NSM 併壓力性心肌病。\n依該季 Coding Clinic，下列結論何者正確？","o":["壓力性心肌病(Takotsubo)編 I51.81；NSM 編 I5A。","剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。","心臟 AL 類澱粉沉積編 E85.81 + I43；併急性慢性舒張性心衰竭 I50.33。","放射冠梗塞屬腔隙性中風，編 I63.81。"],"e":"正解：壓力性心肌病(Takotsubo)編 I51.81；NSM 編 I5A。 應使用：I51.81（Takotsubo 症候群=壓力性心肌病）+ I5A（非缺血性心肌損傷,非外傷）。 實務：索引 Injury, myocardial, non-ischemic, non-traumatic I5A。 （來源：AHA Coding Clinic 2025年第3季「神經性心肌頓抑」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-18:d","q":"【AHA Coding Clinic 2025年第3季】\n右複雜卵巢囊腫行 TLH/BSO，病理示右卵巢漿液性交界性腫瘤。\n依該季 Coding Clinic，下列結論何者正確？","o":["卵巢漿液性交界性腫瘤須 query；惡性→C56.1，未定行為→D39.11。","高輸出量迴腸造口須 query 病因(感染/營養不良/dumping/術後併發症)後編碼。","多關節發炎性關節炎未指特定關節/型別時 query；無資訊→M13.89，非 M06.4。","僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。"],"e":"正解：卵巢漿液性交界性腫瘤須 query；惡性→C56.1，未定行為→D39.11。 應使用：依 query：C56.1（右卵巢惡性）或 D39.11（右卵巢未定行為腫瘤）。 編碼順序：先 query。 實務：交界性腫瘤行為須醫師澄清後定碼。 （來源：AHA Coding Clinic 2025年第3季「卵巢漿液性交界性腫瘤」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-19:a","q":"【AHA Coding Clinic 2025年第3季｜複雜性睡眠呼吸中止】\nOSA 行多項睡眠檢查調 PAP，達壓力後出現顯著中樞型事件，診斷 ComSA。\n依該季 Coding Clinic，應如何編碼？","o":["G47.33 + G47.39","G47.31 + G47.39","G47.39","G47.33"],"e":"正解：G47.33 + G47.39。G47.33（阻塞型睡眠呼吸中止）+ G47.39（其他睡眠呼吸中止=ComSA） 不應使用／不適用：G47.31（原發中樞型，非本例）。 重點：OSA 病人 PAP 治療後出現 ComSA，編 G47.33 + G47.39。 實務：ComSA=治療誘發中樞型，非原發中樞型→G47.39。 （來源：AHA Coding Clinic 2025年第3季「複雜性睡眠呼吸中止」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-19:d","q":"【AHA Coding Clinic 2025年第3季】\nOSA 行多項睡眠檢查調 PAP，達壓力後出現顯著中樞型事件，診斷 ComSA。\n依該季 Coding Clinic，下列結論何者正確？","o":["OSA 病人 PAP 治療後出現 ComSA，編 G47.33 + G47.39。","旋轉性椎動脈症候群編 M47.022；另加中風史碼。","複雜性偏頭痛所致單側無力(醫師連結)編 G43.409。","產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。"],"e":"正解：OSA 病人 PAP 治療後出現 ComSA，編 G47.33 + G47.39。 應使用：G47.33（阻塞型睡眠呼吸中止）+ G47.39（其他睡眠呼吸中止=ComSA）。 不應使用：G47.31（原發中樞型，非本例）。 實務：ComSA=治療誘發中樞型，非原發中樞型→G47.39。 （來源：AHA Coding Clinic 2025年第3季「複雜性睡眠呼吸中止」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-20:a","q":"【AHA Coding Clinic 2025年第3季｜產後動脈瘤性蜘蛛膜下腔出血併水腦】\n孕婦昏迷因動脈瘤性 SAH 併水腦，急剖娩死胎後轉院行前交通動脈瘤夾閉與 EVD。\n依該季 Coding Clinic，應如何編碼？","o":["O99.43 + I60.2 + O99.355 + G91.9","I60.2 + O99.355 + G91.9","O99.43 + O99.355 + G91.9","O99.43 + I60.2 + G91.9"],"e":"正解：O99.43 + I60.2 + O99.355 + G91.9。O99.43（循環系統疾病併發產褥期）+ I60.2（前交通動脈非外傷性 SAH）+ O99.355（神經系統疾病併發產褥期）+ G91.9（水腦,未特指） 不應使用／不適用：孕期併發症碼(已非孕)。 重點：產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。 實務：轉院時已非懷孕→產褥期(產後6週內)併發症碼。 （來源：AHA Coding Clinic 2025年第3季「產後動脈瘤性蜘蛛膜下腔出血併水腦」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-20:d","q":"【AHA Coding Clinic 2025年第3季】\n孕婦昏迷因動脈瘤性 SAH 併水腦，急剖娩死胎後轉院行前交通動脈瘤夾閉與 EVD。\n依該季 Coding Clinic，下列結論何者正確？","o":["產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。","過期流產後(已非孕)不編 Trisomy 21 妊娠併發症碼。","妊娠處方大麻治慢性疼痛：PROM 主診 O42 + O99.892 + G89.29 + Z79.899。","【更正】妊娠合併慢性疼痛應編 O99.354（神經系統疾病），非 O99.892。"],"e":"正解：產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。 應使用：O99.43（循環系統疾病併發產褥期）+ I60.2（前交通動脈非外傷性 SAH）+ O99.355（神經系統疾病併發產褥期）+ G91.9（水腦,未特指）。 不應使用：孕期併發症碼(已非孕)。 實務：轉院時已非懷孕→產褥期(產後6週內)併發症碼。 （來源：AHA Coding Clinic 2025年第3季「產後動脈瘤性蜘蛛膜下腔出血併水腦」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-21:a","q":"【AHA Coding Clinic 2025年第3季｜放射冠中風】\n右顏面下垂、構音障礙，診斷右放射冠急性梗塞。\n依該季 Coding Clinic，應如何編碼？","o":["I63.81","I69.392","I67.4","I60.2"],"e":"正解：I63.81。I63.81（小動脈阻塞/狹窄所致其他腦梗塞） 重點：放射冠梗塞屬腔隙性中風，編 I63.81。 實務：放射冠中風屬 lacunar stroke。 （來源：AHA Coding Clinic 2025年第3季「放射冠中風」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-21:d","q":"【AHA Coding Clinic 2025年第3季】\n右顏面下垂、構音障礙，診斷右放射冠急性梗塞。\n依該季 Coding Clinic，下列結論何者正確？","o":["放射冠梗塞屬腔隙性中風，編 I63.81。","整流術後新發急性舒張性 CHF 編 I97.89 + I50.31。","自體顯性低血鈣編 E20.810。","【釐清】後大腦動脈梗塞無阻塞/狹窄/栓塞/血栓記載時編 I63.89。"],"e":"正解：放射冠梗塞屬腔隙性中風，編 I63.81。 應使用：I63.81（小動脈阻塞/狹窄所致其他腦梗塞）。 實務：放射冠中風屬 lacunar stroke。 （來源：AHA Coding Clinic 2025年第3季「放射冠中風」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-22:a","q":"【AHA Coding Clinic 2025年第3季｜背部手術失敗症候群】\n頸椎關節成形術後持續頸痛，取出義器並 C4-C7 ACDF，診斷頸髓病變與 failed back syndrome。\n依該季 Coding Clinic，應如何編碼？","o":["G95.9","G90.81","G97.61","G97.41"],"e":"正解：G95.9。G95.9（脊髓疾病,未特指=頸髓病變） 不應使用／不適用：postlaminectomy syndrome（非同義且無椎板切除史）。 重點：failed back syndrome 為非特異詞、非 postlaminectomy；只編其表現(此為頸髓病變 G95.9)。 實務：依 I.B.15 症候群無索引指引時編其表現。 （來源：AHA Coding Clinic 2025年第3季「背部手術失敗症候群」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-22:d","q":"【AHA Coding Clinic 2025年第3季】\n頸椎關節成形術後持續頸痛，取出義器並 C4-C7 ACDF，診斷頸髓病變與 failed back syndrome。\n依該季 Coding Clinic，下列結論何者正確？","o":["failed back syndrome 為非特異詞、非 postlaminectomy；只編其表現(此為頸髓病變 G95.9)。","椎體成形術後水泥肺栓塞：主診 S22.089A + J95.821 + T81.718A + I26.95。","減壓/椎板切除術後腰椎滑脫（醫師記因果）編併發症 M96.89 + M43.16 + G83.4；非 postlaminectomy syndrome。","未記錄阻塞之持續性枕後位編 O32.8XX0，另編下降遲滯與產婦耗竭；不可當 obstructed labor。"],"e":"正解：failed back syndrome 為非特異詞、非 postlaminectomy；只編其表現(此為頸髓病變 G95.9)。 應使用：G95.9（脊髓疾病,未特指=頸髓病變）。 不應使用：postlaminectomy syndrome（非同義且無椎板切除史）。 實務：依 I.B.15 症候群無索引指引時編其表現。 （來源：AHA Coding Clinic 2025年第3季「背部手術失敗症候群」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-23:a","q":"【AHA Coding Clinic 2025年第3季｜椎間盤間隙變窄】\n腰痛影像示 L5-S1 多節退化併椎間盤間隙變窄，無脊椎狹窄記載。\n依該季 Coding Clinic，應如何編碼？","o":["M47.817","M47.022","M43.16","M41.124"],"e":"正解：M47.817。M47.817（脊椎關節黏連症,無脊髓/神經根病變,腰薦部） 不應使用／不適用：脊椎狹窄碼（未記載）。 重點：腰椎退化性變化併椎間盤間隙變窄編 M47.817；非脊椎狹窄。 實務：spondylosis 為涵蓋椎間盤之umbrella term；椎間盤間隙變窄≠脊椎狹窄。 （來源：AHA Coding Clinic 2025年第3季「椎間盤間隙變窄」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-23:d","q":"【AHA Coding Clinic 2025年第3季】\n腰痛影像示 L5-S1 多節退化併椎間盤間隙變窄，無脊椎狹窄記載。\n依該季 Coding Clinic，下列結論何者正確？","o":["腰椎退化性變化併椎間盤間隙變窄編 M47.817；非脊椎狹窄。","峽部骨折致滑脫只編滑脫 M43.17。","低血壓所致 AKI 編 N17.8。","BAV 併主動脈瓣狹窄：I35.0 + Q23.81。"],"e":"正解：腰椎退化性變化併椎間盤間隙變窄編 M47.817；非脊椎狹窄。 應使用：M47.817（脊椎關節黏連症,無脊髓/神經根病變,腰薦部）。 不應使用：脊椎狹窄碼（未記載）。 實務：spondylosis 為涵蓋椎間盤之umbrella term；椎間盤間隙變窄≠脊椎狹窄。 （來源：AHA Coding Clinic 2025年第3季「椎間盤間隙變窄」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-24:a","q":"【AHA Coding Clinic 2025年第3季｜失代償性肝硬化】\n低蛋白血症續發於失代償性肝硬化。\n依該季 Coding Clinic，應如何編碼？","o":["K74.60","K76.7","K74.69","K76.89"],"e":"正解：K74.60。K74.60（未特指肝硬化） 不應使用／不適用：將 decompensated 視為特定型別。 重點：失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。 實務：有特定型別記載時改編特定型。 （來源：AHA Coding Clinic 2025年第3季「失代償性肝硬化」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-24:d","q":"【AHA Coding Clinic 2025年第3季】\n低蛋白血症續發於失代償性肝硬化。\n依該季 Coding Clinic，下列結論何者正確？","o":["失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。","減重用 tirzepatide 增量所致胃輕癱編 K31.84 + T38.895A。","慢性 C 肝所致肝硬化編 K74.69（更新 2018 Q1 p.4 之 K74.60 建議）。","改良式 Graham patch 修補胃穿孔編 0DQ60ZZ；網膜補強為附帶不另編。"],"e":"正解：失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。 應使用：K74.60（未特指肝硬化）。 不應使用：將 decompensated 視為特定型別。 實務：有特定型別記載時改編特定型。 （來源：AHA Coding Clinic 2025年第3季「失代償性肝硬化」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-25:d","q":"【AHA Coding Clinic 2025年第3季】\n過期流產行 D&C，POC 染色體分析示 Trisomy 21；能否加編 O35.13 之疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["過期流產後(已非孕)不編 Trisomy 21 妊娠併發症碼。","自然流產後(已非孕)之慢性氣喘不用第15章碼；O03.4 + 氣喘碼。","妊娠肝內膽汁鬱積編 O26.62 + E78.79 + K76.89；無阻塞不用 K83.1。","Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。"],"e":"正解：過期流產後(已非孕)不編 Trisomy 21 妊娠併發症碼。 應使用：不編 Trisomy 21（O35.13 等第15章碼）。 不應使用：O35.13（病人已非懷孕不適用）。 實務：病人已非懷孕→妊娠併發症碼不適用。 （來源：AHA Coding Clinic 2025年第3季「過期流產併唐氏症（21 三體）」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-26:a","q":"【AHA Coding Clinic 2025年第3季｜CAR-T 細胞治療所致全血球減少】\n復發 IgA lambda 多發性骨髓瘤，診斷 CAR-T 所致全血球減少。\n依該季 Coding Clinic，應如何編碼？","o":["T80.82XA + D61.818","T80.82XA + D61.811","D61.818","T80.82XA"],"e":"正解：T80.82XA + D61.818。T80.82XA（免疫效應細胞治療併發症,初診）+ D61.818（其他全血球減少） 不應使用／不適用：D61.811（藥物誘發，CAR-T 非傳統藥物）。 重點：CAR-T 所致全血球減少編 T80.82XA + D61.818。 實務：CAR-T 併發症為 T80.82 之 inclusion term；非傳統藥物→D61.818 非 D61.811。 （來源：AHA Coding Clinic 2025年第3季「CAR-T 細胞治療所致全血球減少」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-26:d","q":"【AHA Coding Clinic 2025年第3季】\n復發 IgA lambda 多發性骨髓瘤，診斷 CAR-T 所致全血球減少。\n依該季 Coding Clinic，下列結論何者正確？","o":["CAR-T 所致全血球減少編 T80.82XA + D61.818。","椎體成形術後水泥肺栓塞：主診 S22.089A + J95.821 + T81.718A + I26.95。","自行拔除導尿管致血尿屬裝置所致出血(非術後併發症)，編 T83.83XA + R31.9。","門診 CAR-T 輸注後計畫入院續照護，主診 Z51.12 + C83.10。"],"e":"正解：CAR-T 所致全血球減少編 T80.82XA + D61.818。 應使用：T80.82XA（免疫效應細胞治療併發症,初診）+ D61.818（其他全血球減少）。 不應使用：D61.811（藥物誘發，CAR-T 非傳統藥物）。 實務：CAR-T 併發症為 T80.82 之 inclusion term；非傳統藥物→D61.818 非 D61.811。 （來源：AHA Coding Clinic 2025年第3季「CAR-T 細胞治療所致全血球減少」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-27:d","q":"【AHA Coding Clinic 2025年第3季】\n幹細胞移植後入院，輕度 AKI 為 POA，住院後因敗血症發生 ATN。\n依該季 Coding Clinic，下列結論何者正確？","o":["AKI(POA)後院內發生 ATN(敗血症所致)，N17.0 之 POA 指標為「N」。","二手電子煙暴露所致病況編症狀碼 + Z77.29；不用 U07.0。","肝腎症候群併 AKI 兩碼並編 N17.8 + K76.7。","急性 EBV 腦炎編 B10.09 + B27.09。"],"e":"正解：AKI(POA)後院內發生 ATN(敗血症所致)，N17.0 之 POA 指標為「N」。 應使用：N17.0（急性腎衰竭併腎小管壞死）POA = N。 不應使用：POA = Y。 實務：多概念碼中至少一概念非入院時併存→POA 標 N。 （來源：AHA Coding Clinic 2025年第3季「AKI 併 ATN 之入院時併存」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-28:d","q":"【AHA Coding Clinic 2025年第3季】\n右乳癌 oncoplastic lumpectomy 併重建後兩側不對稱，左乳為對稱縮減。\n依該季 Coding Clinic，下列結論何者正確？","o":["重建側對側乳房為對稱縮減，兩側不對稱編 N65.1。","EGD 找出血源、抽吸舊血塊無獨立目的，編 Inspection 0DJ08ZZ。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。"],"e":"正解：重建側對側乳房為對稱縮減，兩側不對稱編 N65.1。 應使用：N65.1（重建乳房比例不當）。 不應使用：以「左乳未重建」為由不用 N65.1。 實務：N65.1 inclusion term 含 native 與重建乳房間不對稱；任一側不對稱皆適用。 （來源：AHA Coding Clinic 2025年第3季「為對稱行乳房縮減」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-29:a","q":"【AHA Coding Clinic 2025年第3季｜內視鏡併抽吸血液】\n吐血黑便行 EGD，見食道/胃/十二指腸舊血塊並抽吸，無潰瘍/病灶。\n依該季 Coding Clinic，應如何編碼？","o":["0DJ08ZZ","0D9Q70Z","0DB18ZZ","0DB80ZZ"],"e":"正解：0DJ08ZZ。0DJ08ZZ（上腸道 Inspection,經自然孔內視鏡） 不應使用／不適用：另編抽吸(Extirpation/Drainage)。 重點：EGD 找出血源、抽吸舊血塊無獨立目的，編 Inspection 0DJ08ZZ。 實務：抽血塊無獨立目的→不另編。 （來源：AHA Coding Clinic 2025年第3季「內視鏡併抽吸血液」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-29:d","q":"【AHA Coding Clinic 2025年第3季】\n吐血黑便行 EGD，見食道/胃/十二指腸舊血塊並抽吸，無潰瘍/病灶。\n依該季 Coding Clinic，下列結論何者正確？","o":["EGD 找出血源、抽吸舊血塊無獨立目的，編 Inspection 0DJ08ZZ。","本例 Zenker 憩室切除以 Excision：0DB18ZZ + 環咽肌切除 0KB44ZZ。","TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。","以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。"],"e":"正解：EGD 找出血源、抽吸舊血塊無獨立目的，編 Inspection 0DJ08ZZ。 應使用：0DJ08ZZ（上腸道 Inspection,經自然孔內視鏡）。 不應使用：另編抽吸(Extirpation/Drainage)。 實務：抽血塊無獨立目的→不另編。 （來源：AHA Coding Clinic 2025年第3季「內視鏡併抽吸血液」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-30:a","q":"【AHA Coding Clinic 2025年第3季｜甲基丙烯酸甲酯】\n右三叉神經根微血管減壓併三角形顱骨切除，以 MMA 重建顱骨。\n依該季 Coding Clinic，應如何編碼？","o":["0NR00JZ","0NBC4ZZ","0NP007Z","0NU50JZ"],"e":"正解：0NR00JZ。0NR00JZ（顱骨合成替代物置換,開放） 不應使用／不適用：視為關閉步驟不另編。 編碼順序：減壓另編。 重點：MMA 顱骨成形替換切除之顱骨編 0NR00JZ（Replacement）。 實務：MMA 用以替換切除之顱骨→Replacement；獨立目的另編(類 2014 Q3 p.7-8)。 （來源：AHA Coding Clinic 2025年第3季「甲基丙烯酸甲酯」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-30:d","q":"【AHA Coding Clinic 2025年第3季】\n右三叉神經根微血管減壓併三角形顱骨切除，以 MMA 重建顱骨。\n依該季 Coding Clinic，下列結論何者正確？","o":["MMA 顱骨成形替換切除之顱骨編 0NR00JZ（Replacement）。","以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。","甲狀軟骨骨折開放復位內固定編 0CSS0ZZ(Reposition larynx)。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。"],"e":"正解：MMA 顱骨成形替換切除之顱骨編 0NR00JZ（Replacement）。 應使用：0NR00JZ（顱骨合成替代物置換,開放）。 不應使用：視為關閉步驟不另編。 編碼順序：減壓另編。 實務：MMA 用以替換切除之顱骨→Replacement；獨立目的另編(類 2014 Q3 p.7-8)。 （來源：AHA Coding Clinic 2025年第3季「甲基丙烯酸甲酯」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q3-31:a","q":"【AHA Coding Clinic 2025年第3季｜胃繞道後內視鏡超音波導引經胃 ERCP】\nRoux-en-Y 胃繞道史併總膽管結石，行 EDGE 兩階段；第一階段置 LAMS 建立通道。\n依該季 Coding Clinic，應如何編碼？","o":["0DH68DZ","0DH50YZ","0D9Q70Z","0DB18ZZ"],"e":"正解：0DH68DZ。0DH68DZ（胃內腔內裝置置入,經自然孔內視鏡）；第二階段依實際目的(擴張/引流等)另編 不應使用／不適用：以 Bypass 編第一階段。 重點：EDGE 第一階段(胃囊與排除胃間置 LAMS)編 0DH68DZ。 實務：EDGE 目的為進入排除胃以行處置，非改道→非 Bypass。 （來源：AHA Coding Clinic 2025年第3季「胃繞道後內視鏡超音波導引經胃 ERCP」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q3-31:d","q":"【AHA Coding Clinic 2025年第3季】\nRoux-en-Y 胃繞道史併總膽管結石，行 EDGE 兩階段；第一階段置 LAMS 建立通道。\n依該季 Coding Clinic，下列結論何者正確？","o":["EDGE 第一階段(胃囊與排除胃間置 LAMS)編 0DH68DZ。","氣管發育不全致氣切管置入食道編 0DH50YZ。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","內視鏡經蝶切除蝶鞍顱咽管瘤編 0NBC4ZZ（Excision，蝶骨）。"],"e":"正解：EDGE 第一階段(胃囊與排除胃間置 LAMS)編 0DH68DZ。 應使用：0DH68DZ（胃內腔內裝置置入,經自然孔內視鏡）；第二階段依實際目的(擴張/引流等)另編。 不應使用：以 Bypass 編第一階段。 實務：EDGE 目的為進入排除胃以行處置，非改道→非 Bypass。 （來源：AHA Coding Clinic 2025年第3季「胃繞道後內視鏡超音波導引經胃 ERCP」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q4-01:a","q":"【AHA Coding Clinic 2025年第4季｜乳房惡性發炎性腫瘤】\n46歲左乳 stage 3 IBC(初診斷為乳腺炎)行放療。\n依該季 Coding Clinic，應如何編碼？","o":["Z51.0 + C50.A2","C50.A2","Z51.0","Z51.0 + Z51.12"],"e":"正解：Z51.0 + C50.A2。Z51.0（抗腫瘤放射治療就診）+ C50.A2（左乳惡性發炎性腫瘤） 編碼順序：放療就診 Z51.0 為主診。 重點：發炎性乳癌(IBC)以新碼 C50.A- 編；放療就診主診 Z51.0。 實務：IBC 新增 C50.A-（右 A1/左 A2/未特指 A0）；為侵襲性乳癌亞型。 （來源：AHA Coding Clinic 2025年第4季「乳房惡性發炎性腫瘤」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-01:d","q":"【AHA Coding Clinic 2025年第4季】\n46歲左乳 stage 3 IBC(初診斷為乳腺炎)行放療。\n依該季 Coding Clinic，下列結論何者正確？","o":["發炎性乳癌(IBC)以新碼 C50.A- 編；放療就診主診 Z51.0。","門診 CAR-T 輸注後計畫入院續照護，主診 Z51.12 + C83.10。","卵巢漿液性交界性腫瘤須 query；惡性→C56.1，未定行為→D39.11。","急性攝護腺炎併膀胱炎編 N41.3 + N41.0。"],"e":"正解：發炎性乳癌(IBC)以新碼 C50.A- 編；放療就診主診 Z51.0。 應使用：Z51.0（抗腫瘤放射治療就診）+ C50.A2（左乳惡性發炎性腫瘤）。 編碼順序：放療就診 Z51.0 為主診。 實務：IBC 新增 C50.A-（右 A1/左 A2/未特指 A0）；為侵襲性乳癌亞型。 （來源：AHA Coding Clinic 2025年第4季「乳房惡性發炎性腫瘤」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-02:d","q":"【AHA Coding Clinic 2025年第4季】\n情境一：DM 緩解但仍有糖尿病 CKD 2 期；情境二：DM 緩解且無併發症。\n依該季 Coding Clinic，下列結論何者正確？","o":["T2DM 緩解編 E11.A；但有糖尿病併發症時不可用 E11.A（Excludes1）。","記『DM 無併發症』但有皮膚炎時 query；分類推定相關除非明載無關。","記『DM 無併發症』但有 CKD 3 期時 query；分類推定相關除非明載無關。","同時記錄第1型與第2型糖尿病（hybrid / double DM），E10 與 E11 互為 Excludes1 不可併編，改編 E13（其他特指糖尿病）。"],"e":"正解：T2DM 緩解編 E11.A；但有糖尿病併發症時不可用 E11.A（Excludes1）。 應使用：有併發症→E11.22（DM 併糖尿病 CKD）+ N18.2（CKD 2 期）＋ Z98.84（減重手術狀態）；無併發症→E11.A ＋ Z98.84。 不應使用：有 E11.0-E11.8 併發症時併用 E11.A。 實務：E11.A 為 FY2026 新碼；需醫師記載「緩解」（history of/resolved 非同義，須 query）。 （來源：AHA Coding Clinic 2025年第4季「第2型糖尿病緩解」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-03:d","q":"【AHA Coding Clinic 2025年第4季】\n情境一：雙側脅腹痛併左下腹痛；情境二：左脅腹壓痛併左上腹壓痛。\n依該季 Coding Clinic，下列結論何者正確？","o":["FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。","FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。","FY2026 新增 0DD body part U 網膜、V 腸繫膜；超音波抽吸腸繫膜腫瘤減積編 Extraction。","同時記錄第1型與第2型糖尿病（hybrid / double DM），E10 與 E11 互為 Excludes1 不可併編，改編 E13（其他特指糖尿病）。"],"e":"正解：FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。 應使用：疼痛：R10.A3（雙側脅腹痛）+ R10.32（左下腹痛）；壓痛：R10.8A2（左脅腹壓痛）+ R10.812（左上腹壓痛）。 實務：R10.A 下有 Excludes2 → 脅腹與腹部象限碼可併用。另新增 R10.20-24、R10.85、R39.85-(肋脊角壓痛)。 （來源：AHA Coding Clinic 2025年第4季「脅腹疼痛與壓痛」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q4-04:a","q":"【AHA Coding Clinic 2025年第4季｜大麻劇吐症候群】\n慢性大麻使用(每日4-5次)致頑固噁心嘔吐與低血鉀。\n依該季 Coding Clinic，應如何編碼？","o":["R11.16 + E87.6","E87.6","R11.16","R10.A3 + E87.6"],"e":"正解：R11.16 + E87.6。R11.16（大麻劇吐症候群）主診 + E87.6（低血鉀） 編碼順序：R11.16 為主診。 重點：大麻劇吐症候群編新碼 R11.16 為主診；併低血鉀 E87.6。 實務：R11.16 為 FY2026 新碼；另 query 大麻使用型態，符合 I.C.5.b.3 且伴疾患時編 F12.9-。 （來源：AHA Coding Clinic 2025年第4季「大麻劇吐症候群」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-04:d","q":"【AHA Coding Clinic 2025年第4季】\n慢性大麻使用(每日4-5次)致頑固噁心嘔吐與低血鉀。\n依該季 Coding Clinic，下列結論何者正確？","o":["大麻劇吐症候群編新碼 R11.16 為主診；併低血鉀 E87.6。","轉移性惡性胰島素瘤(肝)為主診 C7B.8；低血糖 E16.1、原發已切除以個人史。","靜脈型胸廓出口症候群編 I87.1；非 G54.0。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。"],"e":"正解：大麻劇吐症候群編新碼 R11.16 為主診；併低血鉀 E87.6。 應使用：R11.16（大麻劇吐症候群）主診 + E87.6（低血鉀）。 編碼順序：R11.16 為主診。 實務：R11.16 為 FY2026 新碼；另 query 大麻使用型態，符合 I.C.5.b.3 且伴疾患時編 F12.9-。 （來源：AHA Coding Clinic 2025年第4季「大麻劇吐症候群」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-05:d","q":"【AHA Coding Clinic 2025年第4季】\n37歲因雙前臂慢性潰瘍(膿性、皮下與肌肉壞死)入院清創，醫師記為 xylazine 與 fentanyl 注射所致。\n依該季 Coding Clinic，下列結論何者正確？","o":["xylazine/fentanyl 注射所致前臂慢性潰瘍(併肌肉壞死)：中毒碼擇一為主診 + L98.A 潰瘍碼。","NIFTP（borderline/pre-malignant）編 D44.0。","糖尿病足潰瘍切除性清創至肌肉與肌腱，取最深層（肌腱）編 0LBV0ZZ。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。"],"e":"正解：xylazine/fentanyl 注射所致前臂慢性潰瘍(併肌肉壞死)：中毒碼擇一為主診 + L98.A 潰瘍碼。 應使用：T65.841A（xylazine 毒性,意外,初診）或 T40.411A（fentanyl 中毒,意外,初診）為主診 + L98.A213（右前臂非壓瘡慢性潰瘍併肌肉壞死）+ L98.A223（左前臂同）。 編碼順序：中毒碼擇一為主診。 實務：T65.84- xylazine 與 L98.A- 潰瘍(依部位/嚴重度)為 FY2026 新碼。 （來源：AHA Coding Clinic 2025年第4季「Xylazine/Fentanyl 傷口」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-06:d","q":"【AHA Coding Clinic 2025年第4季】\n左側胸壁傷口(縫合迷你開胸切口)行 V.A.C. ULTA NPWT(無灌洗)。\n依該季 Coding Clinic，下列結論何者正確？","o":["縫合胸壁傷口單獨行 NPWT 促癒合編 F08F5AZ。","Kratom 濫用併戒斷編 F19.139(精神活性物質)；非 F55.1。","薦部第3期壓傷 NPWTi 併灌洗清除非活性物質，編 F08G5YZ。","xylazine/fentanyl 注射所致前臂慢性潰瘍(併肌肉壞死)：中毒碼擇一為主診 + L98.A 潰瘍碼。"],"e":"正解：縫合胸壁傷口單獨行 NPWT 促癒合編 F08F5AZ。 應使用：F08F5AZ（整形系統傷口管理-上背/上肢,負壓治療）。 實務：F08 新增 equipment A 負壓治療；NPWT 為唯一治療、促癒合 → 可編。 （來源：AHA Coding Clinic 2025年第4季「胸壁傷口負壓治療」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q4-07:a","q":"【AHA Coding Clinic 2025年第4季｜腦瘤聚焦超音波燒灼】\n復發多灶性膠質母細胞瘤，先周邊靜脈灌注 SONALA-001(過血腦障壁使腫瘤光敏)，再 MRI 導引聚焦超音波燒灼。\n依該季 Coding Clinic，應如何編碼？","o":["3E033GN","3E023GC","3E00XGC","3E0Q3E0"],"e":"正解：3E033GN。X053X4B（腦部聚焦超音波燒灼,外部,group11）+ 3E033GN（血腦障壁破壞物質導入周邊靜脈,經皮=SONALA-001） 重點：膠質母細胞瘤 sonodynamic 聚焦超音波燒灼 + SONALA-001 灌注，編 X053X4B + 3E033GN。 實務：X05 新增 body part 3 Brain、technology 4 聚焦超音波(group 11)。 （來源：AHA Coding Clinic 2025年第4季「腦瘤聚焦超音波燒灼」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-07:d","q":"【AHA Coding Clinic 2025年第4季】\n復發多灶性膠質母細胞瘤，先周邊靜脈灌注 SONALA-001(過血腦障壁使腫瘤光敏)，再 MRI 導引聚焦超音波燒灼。\n依該季 Coding Clinic，下列結論何者正確？","o":["膠質母細胞瘤 sonodynamic 聚焦超音波燒灼 + SONALA-001 灌注，編 X053X4B + 3E033GN。","因治療小腦血管母細胞瘤入院,主診 D43.1 + Q85.83。","皮瓣靜脈鬱血之水蛭療法編 3E00XGC。","MCA 內幹細胞灌注編 table 3E0，body region Q（顱腔及腦）、經皮，依幹細胞種類選 qualifier。"],"e":"正解：膠質母細胞瘤 sonodynamic 聚焦超音波燒灼 + SONALA-001 灌注，編 X053X4B + 3E033GN。 應使用：X053X4B（腦部聚焦超音波燒灼,外部,group11）+ 3E033GN（血腦障壁破壞物質導入周邊靜脈,經皮=SONALA-001）。 實務：X05 新增 body part 3 Brain、technology 4 聚焦超音波(group 11)。 （來源：AHA Coding Clinic 2025年第4季「腦瘤聚焦超音波燒灼」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2025Q4-08:a","q":"【AHA Coding Clinic 2025年第4季｜AXIOS 支架膽道引流】\n阻塞性乳頭息肉致黃疸，EUS 導引以 AXIOS LAMS 建 choledochoduodenostomy 引流膽汁。\n依該季 Coding Clinic，應如何編碼？","o":["0F9980Z","0FCG8ZZ","009640Z","01580ZZ"],"e":"正解：0F9980Z。0F9980Z（膽總管引流併引流裝置,經自然孔內視鏡） 不應使用／不適用：Bypass（本例目的為引流）。 重點：以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。 實務：目的為達成膽道引流 → Drainage 而非 Bypass。 （來源：AHA Coding Clinic 2025年第4季「AXIOS 支架膽道引流」）","s":"cc2025"},{"c":"ccconcept","id":"cc:CC2025Q4-08:d","q":"【AHA Coding Clinic 2025年第4季】\n阻塞性乳頭息肉致黃疸，EUS 導引以 AXIOS LAMS 建 choledochoduodenostomy 引流膽汁。\n依該季 Coding Clinic，下列結論何者正確？","o":["以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。","計畫吻合但需先切除小腸→最終處置為 Excision，只編 0DB80ZZ(吻合為固有)。","failed back syndrome 為非特異詞、非 postlaminectomy；只編其表現(此為頸髓病變 G95.9)。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。"],"e":"正解：以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。 應使用：0F9980Z（膽總管引流併引流裝置,經自然孔內視鏡）。 不應使用：Bypass（本例目的為引流）。 實務：目的為達成膽道引流 → Drainage 而非 Bypass。 （來源：AHA Coding Clinic 2025年第4季「AXIOS 支架膽道引流」）","s":"cc2025"},{"c":"cccode","id":"cc:CC2026Q1-01:a","q":"【AHA Coding Clinic 2026年第1季｜心室中膈導線置入】\nHFrEF+LBBB 置入 CRT-D；RV lead 置右心室中膈、pace-sense lead 置心室間膈給左心室起搏、RA lead 置右心耳。\n依該季 Coding Clinic，應如何編碼？","o":["02HK3KZ + 02HM3KZ + 02H63KZ","02HM3KZ + 02H63KZ","02HK3KZ + 02H63KZ","02HK3KZ + 02HM3KZ"],"e":"正解：02HK3KZ + 02HM3KZ + 02H63KZ。02HK3KZ（去顫導線入右心室,經皮）+ 02HM3KZ（去顫導線入心室中膈,經皮）+ 02H63KZ（去顫導線入右心房,經皮） 編碼順序：三導線各編。 重點：FY2026 新增 02H body part M 心室中膈；CRT-D 三導線分別編右心室、心室中膈、右心房。 實務：新增 body part M 心室中膈（approach 3 經皮）；心室間膈起搏為傳統右室尖部之替代。 （來源：AHA Coding Clinic 2026年第1季「心室中膈導線置入」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-01:d","q":"【AHA Coding Clinic 2026年第1季】\nHFrEF+LBBB 置入 CRT-D；RV lead 置右心室中膈、pace-sense lead 置心室間膈給左心室起搏、RA lead 置右心耳。\n依該季 Coding Clinic，下列結論何者正確？","o":["FY2026 新增 02H body part M 心室中膈；CRT-D 三導線分別編右心室、心室中膈、右心房。","AP 側枝線圈栓塞，body part 取右肺動脈，編 02LQ3DZ。","闌尾口之處置歸 body part Appendix（闌尾）。","FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。"],"e":"正解：FY2026 新增 02H body part M 心室中膈；CRT-D 三導線分別編右心室、心室中膈、右心房。 應使用：02HK3KZ（去顫導線入右心室,經皮）+ 02HM3KZ（去顫導線入心室中膈,經皮）+ 02H63KZ（去顫導線入右心房,經皮）。 編碼順序：三導線各編。 實務：新增 body part M 心室中膈（approach 3 經皮）；心室間膈起搏為傳統右室尖部之替代。 （來源：AHA Coding Clinic 2026年第1季「心室中膈導線置入」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-02:a","q":"【AHA Coding Clinic 2026年第1季｜網膜與腸繫膜切除（超音波抽吸減積）】\nstage IVB 子宮內膜癌行子宮全切+雙側輸卵管卵巢切除+SONOPET 超音波抽吸小腸繫膜腫瘤。\n依該季 Coding Clinic，應如何編碼？","o":["0DDV0ZZ","0D9Q70Z","0DB18ZZ","0DB80ZZ"],"e":"正解：0DDV0ZZ。0DDV0ZZ（腸繫膜 Extraction,開放） 重點：FY2026 新增 0DD body part U 網膜、V 腸繫膜；超音波抽吸腸繫膜腫瘤減積編 Extraction。 實務：減積/cytoreduction 抽吸網膜/繫膜腫瘤 → Extraction；新增 U/V body part。 （來源：AHA Coding Clinic 2026年第1季「網膜與腸繫膜切除（超音波抽吸減積）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-02:d","q":"【AHA Coding Clinic 2026年第1季】\nstage IVB 子宮內膜癌行子宮全切+雙側輸卵管卵巢切除+SONOPET 超音波抽吸小腸繫膜腫瘤。\n依該季 Coding Clinic，下列結論何者正確？","o":["FY2026 新增 0DD body part U 網膜、V 腸繫膜；超音波抽吸腸繫膜腫瘤減積編 Extraction。","闌尾口之處置歸 body part Appendix（闌尾）。","FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。"],"e":"正解：FY2026 新增 0DD body part U 網膜、V 腸繫膜；超音波抽吸腸繫膜腫瘤減積編 Extraction。 應使用：0DDV0ZZ（腸繫膜 Extraction,開放）。 實務：減積/cytoreduction 抽吸網膜/繫膜腫瘤 → Extraction；新增 U/V body part。 （來源：AHA Coding Clinic 2026年第1季「網膜與腸繫膜切除（超音波抽吸減積）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-03:a","q":"【AHA Coding Clinic 2026年第1季｜膀胱轉移】\nstage IV 肛門癌放療致右輸尿管狹窄，行右輸尿管再植 + Boari flap（膀胱前壁取瓣接遠端右輸尿管）。\n依該季 Coding Clinic，應如何編碼？","o":["0TXB0Z6","0T768DZ","0T9780Z","0TPB0JZ"],"e":"正解：0TXB0Z6。0TXB0Z6（膀胱轉移至右輸尿管,開放）；root operation = Transfer 重點：FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。 實務：新增 Transfer 表；膀胱組織轉用於輸尿管重建。 （來源：AHA Coding Clinic 2026年第1季「膀胱轉移」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-03:d","q":"【AHA Coding Clinic 2026年第1季】\nstage IV 肛門癌放療致右輸尿管狹窄，行右輸尿管再植 + Boari flap（膀胱前壁取瓣接遠端右輸尿管）。\n依該季 Coding Clinic，下列結論何者正確？","o":["FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。","支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。","FY2026 新增 02H body part M 心室中膈；CRT-D 三導線分別編右心室、心室中膈、右心房。","以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。"],"e":"正解：FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。 應使用：0TXB0Z6（膀胱轉移至右輸尿管,開放）；root operation = Transfer。 實務：新增 Transfer 表；膀胱組織轉用於輸尿管重建。 （來源：AHA Coding Clinic 2026年第1季「膀胱轉移」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-04:a","q":"【AHA Coding Clinic 2026年第1季｜保留包膜之攝護腺切除】\n攝護腺肥大併尿路阻塞，機器手臂單純攝護腺切除，自包膜剝除攝護腺、包膜完整。\n依該季 Coding Clinic，應如何編碼？","o":["0VT04ZE","0VBQ3ZZ","009640Z","01580ZZ"],"e":"正解：0VT04ZE。0VT04ZE（攝護腺 Resection,經皮內視鏡,包膜完整）+ 另編機器手臂輔助 重點：FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。 實務：保留包膜以減少神經損傷；雖包膜留存但無殘餘攝護腺組織 → 仍為 Resection。 （來源：AHA Coding Clinic 2026年第1季「保留包膜之攝護腺切除」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-04:d","q":"【AHA Coding Clinic 2026年第1季】\n攝護腺肥大併尿路阻塞，機器手臂單純攝護腺切除，自包膜剝除攝護腺、包膜完整。\n依該季 Coding Clinic，下列結論何者正確？","o":["FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。","【釐清】肱動脈接下臂靜脈之 AVF 用 Table 031 + qualifier F；Ellipsys 熱阻力僅限橈動脈（X2K）。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。","FY2026 新增 0DD body part U 網膜、V 腸繫膜；超音波抽吸腸繫膜腫瘤減積編 Extraction。"],"e":"正解：FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。 應使用：0VT04ZE（攝護腺 Resection,經皮內視鏡,包膜完整）+ 另編機器手臂輔助。 實務：保留包膜以減少神經損傷；雖包膜留存但無殘餘攝護腺組織 → 仍為 Resection。 （來源：AHA Coding Clinic 2026年第1季「保留包膜之攝護腺切除」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-05:d","q":"【AHA Coding Clinic 2026年第1季】\n甲狀腺低下併失智常規就診；索引 Dementia in hypothyroidism, acquired。\n依該季 Coding Clinic，下列結論何者正確？","o":["ICD-10-CM 推定甲狀腺低下與失智相關，編 E03.- + F02.80。","RSV 未載相關疾病時 query 醫師；ICD-10-CM 不分類「無相關病況之 RSV」。","RAD 但明確無氣喘時 ICD-10-CM 無 RAD 分類，改編症狀碼（如喘鳴），不可用氣喘碼。","胸罩肩帶壓溝 ICD-10-CM 未分類,不報告。"],"e":"正解：ICD-10-CM 推定甲狀腺低下與失智相關，編 E03.- + F02.80。 應使用：E03.-（其他甲狀腺低下）+ F02.80（他處疾病之失智,未特指嚴重度,無行為/精神/情緒/焦慮障礙）。 實務：依 I.A.15 推定相關，除非明載無關或另有指引要求連結；2024 Q2 p.8-9（失智與癲癇）僅限該情形。 （來源：AHA Coding Clinic 2026年第1季「失智併甲狀腺低下」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-06:d","q":"【AHA Coding Clinic 2026年第1季】\n前期糖尿病，噁心嘔吐上腹痛，診斷 Ozempic 所致藥物性急性胰臟炎（無感染/壞死）。\n依該季 Coding Clinic，下列結論何者正確？","o":["Ozempic（GLP-1）所致藥物性急性胰臟炎編 K85.30 + T38.895A；非 T38.3X5A。","鐳-223 治療所致全血球減少編 D61.811 + T50.995A；非 T50.8X5(診斷劑)。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。"],"e":"正解：Ozempic（GLP-1）所致藥物性急性胰臟炎編 K85.30 + T38.895A；非 T38.3X5A。 應使用：K85.30（藥物性急性胰臟炎,無壞死或感染）+ T38.895A（其他荷爾蒙及合成替代物不良反應,初診）+ R73.03（前期糖尿病）。 不應使用：T38.3X5A（Ozempic 非降血糖劑,不適用）。 編碼順序：K85.30 先，T38.895A 次。 實務：GLP-1 受體促效劑之不良反應用 T38.895A。 （來源：AHA Coding Clinic 2026年第1季「注射型非胰島素降糖藥不良反應」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-07:d","q":"【AHA Coding Clinic 2026年第1季】\n長期使用 semaglutide 或 tirzepatide 之用藥碼。\n依該季 Coding Clinic，下列結論何者正確？","o":["長期使用 semaglutide/tirzepatide 編 Z79.899（現無 GLP-1 專碼）。","副甲狀腺切除後無記載副甲低下編 Z98.890 + Z90.89;非 E89.2。","陰道成形術後新陰道狹窄，編術後泌尿生殖併發症 N99.89 + N89.5。","Ozempic（GLP-1）所致藥物性急性胰臟炎編 K85.30 + T38.895A；非 T38.3X5A。"],"e":"正解：長期使用 semaglutide/tirzepatide 編 Z79.899（現無 GLP-1 專碼）。 應使用：Z79.899（其他長期(現行)藥物治療）。 實務：ICD-10-CM 尚未特定分類 GLP-1 長期用藥。 （來源：AHA Coding Clinic 2026年第1季「長期使用 Semaglutide 或 Tirzepatide」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-08:a","q":"【AHA Coding Clinic 2026年第1季｜Tirzepatide 所致胃輕癱】\n非糖尿病病人因 tirzepatide 增量致噁心嘔吐、胃輕癱。\n依該季 Coding Clinic，應如何編碼？","o":["K31.84 + T38.895A","T38.895A","K31.84","K31.84 + K31.89"],"e":"正解：K31.84 + T38.895A。K31.84（胃輕癱）+ T38.895A（其他荷爾蒙及合成替代物不良反應,初診） 編碼順序：K31.84 先，T38.895A 次。 重點：減重用 tirzepatide 增量所致胃輕癱編 K31.84 + T38.895A。 實務：GLP-1 之不良反應用 T38.895A。 （來源：AHA Coding Clinic 2026年第1季「Tirzepatide 所致胃輕癱」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-08:d","q":"【AHA Coding Clinic 2026年第1季】\n非糖尿病病人因 tirzepatide 增量致噁心嘔吐、胃輕癱。\n依該季 Coding Clinic，下列結論何者正確？","o":["減重用 tirzepatide 增量所致胃輕癱編 K31.84 + T38.895A。","UTI 所致敗血症未載病原編 A41.9（非 A41.89）。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。","糖尿病微量白蛋白尿編 E11.29 + R80.8。"],"e":"正解：減重用 tirzepatide 增量所致胃輕癱編 K31.84 + T38.895A。 應使用：K31.84（胃輕癱）+ T38.895A（其他荷爾蒙及合成替代物不良反應,初診）。 編碼順序：K31.84 先，T38.895A 次。 實務：GLP-1 之不良反應用 T38.895A。 （來源：AHA Coding Clinic 2026年第1季「Tirzepatide 所致胃輕癱」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-09:a","q":"【AHA Coding Clinic 2026年第1季｜分開兩次手術置入兩個 Impella】\n心因性休克+急性二尖瓣閉鎖不全，先左鼠蹊置 Impella CP，4小時後惡化再右鼠蹊置 Impella RP。\n依該季 Coding Clinic，應如何編碼？","o":["02HA3RZ","02HK3KZ","02HL3YZ","02HM3KZ"],"e":"正解：02HA3RZ。02HA3RZ（短期外部心臟輔助系統置入,經皮）×2 不應使用／不適用：第7碼 qualifier S（Biventricular，非單次手術置入不可用）。 編碼順序：各編一次。 重點：同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。 實務：同日但不同適應症、不同手術 episode → 各編一次，非雙心室。 （來源：AHA Coding Clinic 2026年第1季「分開兩次手術置入兩個 Impella」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-09:d","q":"【AHA Coding Clinic 2026年第1季】\n心因性休克+急性二尖瓣閉鎖不全，先左鼠蹊置 Impella CP，4小時後惡化再右鼠蹊置 Impella RP。\n依該季 Coding Clinic，下列結論何者正確？","o":["同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。","手輔助腹腔鏡（GelPort）以入路值 4 經皮內視鏡 + qualifier G 手輔助編。","AIVR 編 I49.8；非 I44.2（idioventricular 索引導向不適用）。","FY2026 新增 0VT qualifier E Capsule Intact；機器手臂單純攝護腺切除保留包膜編 0VT04ZE。"],"e":"正解：同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。 應使用：02HA3RZ（短期外部心臟輔助系統置入,經皮）×2。 不應使用：第7碼 qualifier S（Biventricular，非單次手術置入不可用）。 編碼順序：各編一次。 實務：同日但不同適應症、不同手術 episode → 各編一次，非雙心室。 （來源：AHA Coding Clinic 2026年第1季「分開兩次手術置入兩個 Impella」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-10:a","q":"【AHA Coding Clinic 2026年第1季｜飢餓性酮酸中毒】\n腹痛噁心嘔吐、進食差達 17-18 天，高 anion gap 代謝性酸中毒併飢餓性酮酸中毒。\n依該季 Coding Clinic，應如何編碼？","o":["E87.29 + T73.0XXA","T73.0XXA","E87.29","E87.70 + T73.0XXA"],"e":"正解：E87.29 + T73.0XXA。E87.29（其他酸中毒）+ T73.0XXA（飢餓,初診） 編碼順序：E87.29 先，T73.0XXA 次。 重點：飢餓性酮酸中毒編 E87.29 + T73.0XXA。 實務：依醫師記錄之飢餓性酮酸中毒編此組合。 （來源：AHA Coding Clinic 2026年第1季「飢餓性酮酸中毒」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-10:d","q":"【AHA Coding Clinic 2026年第1季】\n腹痛噁心嘔吐、進食差達 17-18 天，高 anion gap 代謝性酸中毒併飢餓性酮酸中毒。\n依該季 Coding Clinic，下列結論何者正確？","o":["飢餓性酮酸中毒編 E87.29 + T73.0XXA。","突出(prominent)脊椎內固定=protrusion 編 T84.296A；併疼痛加 T84.84XA。","Bankart 病灶編 S43.432A；Hill-Sachs 病灶編 S42.292A。","鐮刀型貧血脾隔離危象併功能性無脾，編 D57.02 + D73.0；非 Q89.01。"],"e":"正解：飢餓性酮酸中毒編 E87.29 + T73.0XXA。 應使用：E87.29（其他酸中毒）+ T73.0XXA（飢餓,初診）。 編碼順序：E87.29 先，T73.0XXA 次。 實務：依醫師記錄之飢餓性酮酸中毒編此組合。 （來源：AHA Coding Clinic 2026年第1季「飢餓性酮酸中毒」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-11:d","q":"【AHA Coding Clinic 2026年第1季】\n37+4 週 HIV 篩檢陽性排定 38 週剖腹，產後確認 RNA 陰性、初篩偽陽性。\n依該季 Coding Clinic，下列結論何者正確？","o":["HIV 篩檢偽陽性經確認陰性，無現行 indication 之選擇性剖腹產編 O82；HIV 陰性結果加 Z71.7。","以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。","剖腹產子宮切口延伸併子宮裂傷編 O75.4 + O71.81。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。"],"e":"正解：HIV 篩檢偽陽性經確認陰性，無現行 indication 之選擇性剖腹產編 O82；HIV 陰性結果加 Z71.7。 應使用：O82（無 indication 之剖腹產就診）+ Z71.7（HIV 諮詢，用於陰性結果）。 不應使用：以 HIV 為剖腹 indication（已排除偽陽性）。 實務：偽陽性 HIV 不可當 indication；選擇性 C-section 用 O82。 （來源：AHA Coding Clinic 2026年第1季「無現行醫療indication之剖腹產」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-12:d","q":"【AHA Coding Clinic 2026年第1季】\n因前次分娩肩難產病史排定剖腹產。\n依該季 Coding Clinic，下列結論何者正確？","o":["因前次肩難產病史排定剖腹、無現行併發症，編 O82 + Z87.59。","術後異位性骨化編 M61.552；可 query 是否術後併發症。","產後(已非孕)動脈瘤性 SAH 併水腦，以產褥期併發症編 O99.43 + I60.2 + O99.355 + G91.9。","苔癬樣角化症編 L82.0。"],"e":"正解：因前次肩難產病史排定剖腹、無現行併發症，編 O82 + Z87.59。 應使用：O82（無 indication 之剖腹產就診）+ Z87.59（其他妊娠/分娩/產褥併發症個人史）。 實務：無現行醫療 indication 之選擇性剖腹用 O82，病史以 Z87.59 附加。 （來源：AHA Coding Clinic 2026年第1季「因肩難產病史之剖腹產」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-13:a","q":"【AHA Coding Clinic 2026年第1季｜南北症候群】\n急性缺氧併高碳酸呼吸衰竭需 ECMO，VV→VA→VAV，因 NSS（上半身供氧不足）。\n依該季 Coding Clinic，應如何編碼？","o":["T81.89XA + J96.21 + J96.22","J96.21 + J96.22","T81.89XA + J96.22","T81.89XA + J96.21"],"e":"正解：T81.89XA + J96.21 + J96.22。T81.89XA（其他處置併發症,初診）+ J96.21（急慢性呼衰併缺氧）+ J96.22（急慢性呼衰併高碳酸）+ 其他表現碼 重點：VA-ECMO 併發 NSS 編 T81.89XA + 呼吸衰竭 J96.21/J96.22 及各表現碼。 實務：依 I.B.15 症候群無索引指引時編各表現碼；NSS 為 VA-ECMO 併發症。 （來源：AHA Coding Clinic 2026年第1季「南北症候群」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-13:d","q":"【AHA Coding Clinic 2026年第1季】\n急性缺氧併高碳酸呼吸衰竭需 ECMO，VV→VA→VAV，因 NSS（上半身供氧不足）。\n依該季 Coding Clinic，下列結論何者正確？","o":["VA-ECMO 併發 NSS 編 T81.89XA + 呼吸衰竭 J96.21/J96.22 及各表現碼。","CABG 後深部手術部位感染性敗血症編 T81.42XA + T81.44XA + A41.1。","術後脂肪肺栓塞編 T81.718A + I26.96。","rituximab 輸注反應編輸注併發症 T80.89XA + 藥物不良反應 T45.1X5A + 表現碼。"],"e":"正解：VA-ECMO 併發 NSS 編 T81.89XA + 呼吸衰竭 J96.21/J96.22 及各表現碼。 應使用：T81.89XA（其他處置併發症,初診）+ J96.21（急慢性呼衰併缺氧）+ J96.22（急慢性呼衰併高碳酸）+ 其他表現碼。 實務：依 I.B.15 症候群無索引指引時編各表現碼；NSS 為 VA-ECMO 併發症。 （來源：AHA Coding Clinic 2026年第1季「南北症候群」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-15:a","q":"【AHA Coding Clinic 2026年第1季｜C 肝所致肝硬化】\n慢性病毒性 C 肝所致肝硬化。\n依該季 Coding Clinic，應如何編碼？","o":["K74.69","K74.60","K71.8","K76.7"],"e":"正解：K74.69。K74.69（其他肝硬化）+ 加編 C 肝碼 不應使用／不適用：K74.60（已指明 due to hep C）。 重點：慢性 C 肝所致肝硬化編 K74.69（更新 2018 Q1 p.4 之 K74.60 建議）。 實務：2018 Q1 曾建議 K74.60，現更新為 K74.69（指明病因 → 其他特指）。 （來源：AHA Coding Clinic 2026年第1季「C 肝所致肝硬化」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-15:d","q":"【AHA Coding Clinic 2026年第1季】\n慢性病毒性 C 肝所致肝硬化。\n依該季 Coding Clinic，下列結論何者正確？","o":["慢性 C 肝所致肝硬化編 K74.69（更新 2018 Q1 p.4 之 K74.60 建議）。","類癌心臟病編新碼 E34.01。","【更正】2025 Q1 排序錯誤：主診應為 T82.855A，I21.4 與 I25 為次診斷。","自然流產後(已非孕)之慢性氣喘不用第15章碼；O03.4 + 氣喘碼。"],"e":"正解：慢性 C 肝所致肝硬化編 K74.69（更新 2018 Q1 p.4 之 K74.60 建議）。 應使用：K74.69（其他肝硬化）+ 加編 C 肝碼。 不應使用：K74.60（已指明 due to hep C）。 實務：2018 Q1 曾建議 K74.60，現更新為 K74.69（指明病因 → 其他特指）。 （來源：AHA Coding Clinic 2026年第1季「C 肝所致肝硬化」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-20:a","q":"【AHA Coding Clinic 2026年第1季｜SLE 所致急性心肌炎】\n急性心肌炎 due to SLE。\n依該季 Coding Clinic，應如何編碼？","o":["M32.19 + I40.8","I40.8","M32.19","M32.19 + M00.061"],"e":"正解：M32.19 + I40.8。M32.19（SLE 其他器官/系統侵犯）+ I40.8（其他急性心肌炎） 重點：SLE 所致急性心肌炎編 M32.19 + I40.8。 實務：器官（心肌）已指明、索引無 myocarditis 條目 → 用 specified organ M32.19；病因已知加 I40.8。 （來源：AHA Coding Clinic 2026年第1季「SLE 所致急性心肌炎」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-20:d","q":"【AHA Coding Clinic 2026年第1季】\n急性心肌炎 due to SLE。\n依該季 Coding Clinic，下列結論何者正確？","o":["SLE 所致急性心肌炎編 M32.19 + I40.8。","重度憂鬱所致成人異食癖：F32.2 + F50.83。","ATI 等同急性腎小管壞死，AKI due to ATI 編 N17.0。","『due to』不觸發 With 推定;需醫師記載連結。若明載則編 D64.81。"],"e":"正解：SLE 所致急性心肌炎編 M32.19 + I40.8。 應使用：M32.19（SLE 其他器官/系統侵犯）+ I40.8（其他急性心肌炎）。 實務：器官（心肌）已指明、索引無 myocarditis 條目 → 用 specified organ M32.19；病因已知加 I40.8。 （來源：AHA Coding Clinic 2026年第1季「SLE 所致急性心肌炎」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-22:d","q":"【AHA Coding Clinic 2026年第1季】\n併血小板低下與 DIC；D69 Excludes1 僅列 purpura fulminans、未列 DIC 之疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["血小板低下併 DIC 只編 D65（血小板低下為 DIC 固有）。","T2DM 緩解編 E11.A；但有糖尿病併發症時不可用 E11.A（Excludes1）。","FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。","FY2026 新增 0TX Transfer of Urinary System；Boari flap 以膀胱組織重建輸尿管編 Transfer。"],"e":"正解：血小板低下併 DIC 只編 D65（血小板低下為 DIC 固有）。 應使用：只編 D65（瀰漫性血管內凝血）。 不應使用：另編 D69.6（血小板低下為 DIC 固有）。 實務：血小板低下 integral to DIC → 不另編。 （來源：AHA Coding Clinic 2026年第1季「血小板低下併 DIC」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-23:a","q":"【AHA Coding Clinic 2026年第1季｜更正：靜脈移植片狹窄/血栓致 NSTEMI】\n更正 2024 Q1 p.28；culprit 為 vein graft 近端狹窄併遠端血栓。\n依該季 Coding Clinic，應如何編碼？","o":["T82.857A + T82.867A + I21.A9","T82.867A + I21.A9","T82.857A + I21.A9","T82.857A + T82.867A"],"e":"正解：T82.857A + T82.867A + I21.A9。T82.857A（其他心臟義器/移植物狹窄,初診）+ T82.867A（心臟義器/移植物血栓,初診）+ I21.A9（其他型心肌梗塞） 編碼順序：任一併發症可當主診斷。 重點：【更正】vein graft 狹窄+血栓致 NSTEMI 編 T82.857A + T82.867A + I21.A9。 實務：既置 graft/stent 之狹窄/血栓歸為併發症（除非明載疾病進展）；2024 Q1 的 I21.4 是回答「native 多支病變致 NSTEMI」之情形。 （來源：AHA Coding Clinic 2026年第1季「更正：靜脈移植片狹窄/血栓致 NSTEMI」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-23:d","q":"【AHA Coding Clinic 2026年第1季】\n更正 2024 Q1 p.28；culprit 為 vein graft 近端狹窄併遠端血栓。\n依該季 Coding Clinic，下列結論何者正確？","o":["【更正】vein graft 狹窄+血栓致 NSTEMI 編 T82.857A + T82.867A + I21.A9。","冠脈瘤併廔管行 CABG，但 vein graft 最終結紮/橫斷；編修補冠靜脈+修補冠動脈+隱靜脈取材。","繞道移植片(左肢)血栓編 T82.868A + I74.5(部位)。","vein graft 血栓致 NSTEMI，主診 I21.4 + I25.10；MI 情境不編心絞痛。"],"e":"正解：【更正】vein graft 狹窄+血栓致 NSTEMI 編 T82.857A + T82.867A + I21.A9。 應使用：T82.857A（其他心臟義器/移植物狹窄,初診）+ T82.867A（心臟義器/移植物血栓,初診）+ I21.A9（其他型心肌梗塞）。 編碼順序：任一併發症可當主診斷。 實務：既置 graft/stent 之狹窄/血栓歸為併發症（除非明載疾病進展）；2024 Q1 的 I21.4 是回答「native 多支病變致 NSTEMI」之情形。 （來源：AHA Coding Clinic 2026年第1季「更正：靜脈移植片狹窄/血栓致 NSTEMI」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-24:d","q":"【AHA Coding Clinic 2026年第1季】\nR descriptor 由「customizable」改為「custom-made anatomically designed」之使用疑義。\n依該季 Coding Clinic，下列結論何者正確？","o":["【釐清】XRG device R 用於「custom-made anatomically designed」病人專屬椎間融合器（如 Aprevo），非現成器。","新生兒 RSV 預防性單株抗體(Nirsevimab/Beyfortus)就診編 Z29.11。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","經口直視、無需器械到達 → 入路值 External（非 Percutaneous）。"],"e":"正解：【釐清】XRG device R 用於「custom-made anatomically designed」病人專屬椎間融合器（如 Aprevo），非現成器。 應使用：table XRG device value R——僅用於客製化解剖設計之病人專屬椎間融合器。 不應使用：現成（off-the-shelf）號稱 custom fit 之器材。 實務：2021/10/1 起 R 為「customizable」，2023/10/1 改為「custom-made anatomically designed」以避免與現成器混淆；例 Aprevo。 （來源：AHA Coding Clinic 2026年第1季「釐清：椎間融合新技術 device value R」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q1-25:a","q":"【AHA Coding Clinic 2026年第1季｜釐清：椎板成形術內固定裝置】\nlaminoplasty 以 allograft + graft plate 螺釘固定，原 Q&A 未編 plate 插入。\n依該季 Coding Clinic，應如何編碼？","o":["0PH304Z","0PH000Z","0PS004Z","0PUC47Z"],"e":"正解：0PH304Z。加編 0PH304Z（頸椎內固定裝置插入,開放）；併原 Release（椎板成形擴張椎管）+ Supplement（allograft 增補） 編碼順序：依 B3.2c 不同目的可多編。 重點：【釐清】2015 Q2 p.20-21 漏編 plate；椎板成形 plate 插入應加編 0PH304Z。 實務：plate 目的為椎板內固定；不同目的於同 body part 可多編。 （來源：AHA Coding Clinic 2026年第1季「釐清：椎板成形術內固定裝置」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q1-25:d","q":"【AHA Coding Clinic 2026年第1季】\nlaminoplasty 以 allograft + graft plate 螺釘固定，原 Q&A 未編 plate 插入。\n依該季 Coding Clinic，下列結論何者正確？","o":["【釐清】2015 Q2 p.20-21 漏編 plate；椎板成形 plate 插入應加編 0PH304Z。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。","【更正】vein graft 狹窄+血栓致 NSTEMI 編 T82.857A + T82.867A + I21.A9。","Nuss 手術編 0PS004Z(膠帶為固有)；冷凍消融另編 01584ZZ。"],"e":"正解：【釐清】2015 Q2 p.20-21 漏編 plate；椎板成形 plate 插入應加編 0PH304Z。 應使用：加編 0PH304Z（頸椎內固定裝置插入,開放）；併原 Release（椎板成形擴張椎管）+ Supplement（allograft 增補）。 編碼順序：依 B3.2c 不同目的可多編。 實務：plate 目的為椎板內固定；不同目的於同 body part 可多編。 （來源：AHA Coding Clinic 2026年第1季「釐清：椎板成形術內固定裝置」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-01:a","q":"【AHA Coding Clinic 2026年第2季｜人工全膝關節不穩（股骨組件旋轉不良）】\n右 TKR 後因股骨組件旋轉不良致髕骨復發性脫位入院翻修；索引 malposition → see displacement 導向 T84.02 是否正確。\n依該季 Coding Clinic，應如何編碼？","o":["T84.092A + M22.01","T84.02 + M22.01","M22.01","T84.092A"],"e":"正解：T84.092A + M22.01。T84.092A（右膝義器其他機械性併發症,初診）+ M22.01（右膝髕骨復發性脫位） 不應使用／不適用：T84.02（義關節脫位）——組件僅原位旋轉、非移位/脫位。 重點：股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。 實務：malrotation = 原位轉動，非 displacement/dislocation，不可用 T84.02。 （來源：AHA Coding Clinic 2026年第2季「人工全膝關節不穩（股骨組件旋轉不良）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-01:d","q":"【AHA Coding Clinic 2026年第2季】\n右 TKR 後因股骨組件旋轉不良致髕骨復發性脫位入院翻修；索引 malposition → see displacement 導向 T84.02 是否正確。\n依該季 Coding Clinic，下列結論何者正確？","o":["股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。","突出(prominent)脊椎內固定=protrusion 編 T84.296A；併疼痛加 T84.84XA。","TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。","AIVR 編 I49.8；非 I44.2（idioventricular 索引導向不適用）。"],"e":"正解：股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。 應使用：T84.092A（右膝義器其他機械性併發症,初診）+ M22.01（右膝髕骨復發性脫位）。 不應使用：T84.02（義關節脫位）——組件僅原位旋轉、非移位/脫位。 實務：malrotation = 原位轉動，非 displacement/dislocation，不可用 T84.02。 （來源：AHA Coding Clinic 2026年第2季「人工全膝關節不穩（股骨組件旋轉不良）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-02:a","q":"【AHA Coding Clinic 2026年第2季｜高乳酸血症】\n急性下消化道出血併缺血性結腸炎，乳酸升高，診斷 hyperlactatemia secondary to ischemic colitis；索引 Lactate elevated → see Acidosis lactic → E87.20。\n依該季 Coding Clinic，應如何編碼？","o":["R79.89","E87.20","R73.03","R04.0"],"e":"正解：R79.89。R79.89（血液化學其他特指異常） 不應使用／不適用：E87.20（酸中毒，未記錄不可編）。 編碼順序：先 query 醫師確認有無酸中毒。 重點：高乳酸血症 ≠ 酸中毒；未載酸中毒不可編 E87.20；query 後僅確認高乳酸 → R79.89。 實務：高乳酸血症非必然=酸中毒；R79.89 雖為症狀碼但病因已知仍可當附加診斷（I.C.18.b）。 （來源：AHA Coding Clinic 2026年第2季「高乳酸血症」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-03:a","q":"【AHA Coding Clinic 2026年第2季｜急性腎小管損傷】\nAKI due to ATI；ICD-10-CM 無 ATI 專碼。\n依該季 Coding Clinic，應如何編碼？","o":["N17.0","N17.8","N18.30","N17.0POA"],"e":"正解：N17.0。N17.0（急性腎衰竭併腎小管壞死） 重點：ATI 等同急性腎小管壞死，AKI due to ATI 編 N17.0。 實務：ATI = acute tubular necrosis；索引 Necrosis, kidney, tubular N17.0。 （來源：AHA Coding Clinic 2026年第2季「急性腎小管損傷」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-03:d","q":"【AHA Coding Clinic 2026年第2季】\nAKI due to ATI；ICD-10-CM 無 ATI 專碼。\n依該季 Coding Clinic，下列結論何者正確？","o":["ATI 等同急性腎小管壞死，AKI due to ATI 編 N17.0。","ICD-10-CM 推定甲狀腺低下與失智相關，編 E03.- + F02.80。","非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。","胸罩肩帶壓溝 ICD-10-CM 未分類,不報告。"],"e":"正解：ATI 等同急性腎小管壞死，AKI due to ATI 編 N17.0。 應使用：N17.0（急性腎衰竭併腎小管壞死）。 實務：ATI = acute tubular necrosis；索引 Necrosis, kidney, tubular N17.0。 （來源：AHA Coding Clinic 2026年第2季「急性腎小管損傷」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-04:a","q":"【AHA Coding Clinic 2026年第2季｜志賀氏菌敗血症】\n診斷 sepsis due to Shigella flexneri colitis。\n依該季 Coding Clinic，應如何編碼？","o":["A41.59 + A03.1","A03.1","A41.59","A41.1 + A03.1"],"e":"正解：A41.59 + A03.1。A41.59（其他革蘭氏陰性敗血症）+ A03.1（志賀氏菌病, Shigella flexneri） 重點：志賀氏菌（Shigella flexneri）結腸炎併敗血症，編 A41.59 + A03.1。 實務：索引 Colitis infectious → Enteritis infectious → Infection Shigella；Shigella flexneri = A03.1。 （來源：AHA Coding Clinic 2026年第2季「志賀氏菌敗血症」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-04:d","q":"【AHA Coding Clinic 2026年第2季】\n診斷 sepsis due to Shigella flexneri colitis。\n依該季 Coding Clinic，下列結論何者正確？","o":["志賀氏菌（Shigella flexneri）結腸炎併敗血症，編 A41.59 + A03.1。","TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。","UTI 所致敗血症未載病原編 A41.9（非 A41.89）。","念珠菌血症編 B37.7（念珠菌敗血症）。"],"e":"正解：志賀氏菌（Shigella flexneri）結腸炎併敗血症，編 A41.59 + A03.1。 應使用：A41.59（其他革蘭氏陰性敗血症）+ A03.1（志賀氏菌病, Shigella flexneri）。 實務：索引 Colitis infectious → Enteritis infectious → Infection Shigella；Shigella flexneri = A03.1。 （來源：AHA Coding Clinic 2026年第2季「志賀氏菌敗血症」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-05:a","q":"【AHA Coding Clinic 2026年第2季｜膝關節軟骨軟化】\n左膝 C2 內股骨髁、C3–C4 髕股關節軟骨軟化併內側半月板撕裂，行 chondroplasty。\n依該季 Coding Clinic，應如何編碼？","o":["M94.262","M96.843","M96.89","M95.2"],"e":"正解：M94.262。M94.262（軟骨軟化,左膝）——涵蓋左膝所有 component 重點：左膝多部位軟骨軟化，單一碼 M94.262 涵蓋全膝各 component。 實務：內股骨髁/內脛平台/髕骨之軟骨軟化皆歸 M94.262，不分別編。 （來源：AHA Coding Clinic 2026年第2季「膝關節軟骨軟化」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-05:d","q":"【AHA Coding Clinic 2026年第2季】\n左膝 C2 內股骨髁、C3–C4 髕股關節軟骨軟化併內側半月板撕裂，行 chondroplasty。\n依該季 Coding Clinic，下列結論何者正確？","o":["左膝多部位軟骨軟化，單一碼 M94.262 涵蓋全膝各 component。","股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。","failed back syndrome 為非特異詞、非 postlaminectomy；只編其表現(此為頸髓病變 G95.9)。","失代償性肝硬化編 K74.60（decompensated 為急性度、非型別）。"],"e":"正解：左膝多部位軟骨軟化，單一碼 M94.262 涵蓋全膝各 component。 應使用：M94.262（軟骨軟化,左膝）——涵蓋左膝所有 component。 實務：內股骨髁/內脛平台/髕骨之軟骨軟化皆歸 M94.262，不分別編。 （來源：AHA Coding Clinic 2026年第2季「膝關節軟骨軟化」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-06:a","q":"【AHA Coding Clinic 2026年第2季｜胸椎中段第3期壓瘡】\n胸椎中段第3期壓瘡，醫師表示位於正中無法定側。\n依該季 Coding Clinic，應如何編碼？","o":["L89.113 + L89.123","L89.123","L89.113","L89.113 + L82.0"],"e":"正解：L89.113 + L89.123。L89.113（右上背第3期）+ L89.123（左上背第3期） 重點：胸椎「中線」壓瘡無法定側，L89.1 無中背碼，左右上背各編一碼。 實務：L89.1 無「中背」值；中線病灶以左右上背兩碼完整捕捉。 （來源：AHA Coding Clinic 2026年第2季「胸椎中段第3期壓瘡」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-06:d","q":"【AHA Coding Clinic 2026年第2季】\n胸椎中段第3期壓瘡，醫師表示位於正中無法定側。\n依該季 Coding Clinic，下列結論何者正確？","o":["胸椎「中線」壓瘡無法定側，L89.1 無中背碼，左右上背各編一碼。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。","血流導向支架 + 線圈治頸內動脈假性動脈瘤,各編一碼。","自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。"],"e":"正解：胸椎「中線」壓瘡無法定側，L89.1 無中背碼，左右上背各編一碼。 應使用：L89.113（右上背第3期）+ L89.123（左上背第3期）。 實務：L89.1 無「中背」值；中線病灶以左右上背兩碼完整捕捉。 （來源：AHA Coding Clinic 2026年第2季「胸椎中段第3期壓瘡」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-07:a","q":"【AHA Coding Clinic 2026年第2季｜非ST上升心肌梗塞併心肌橋（非阻塞性CAD）】\nNSTEMI，缺血評估發現 MB 併非阻塞性 CAD；MB 是否=微血管疾病？\n依該季 Coding Clinic，應如何編碼？","o":["I21.4 + Q24.5","Q24.5","I21.4","I21.A9 + Q24.5"],"e":"正解：I21.4 + Q24.5。I21.4（NSTEMI）+ Q24.5（冠脈畸形，指 MB） 重點：NSTEMI 編 I21.4；心肌橋（MB）為冠脈畸形編 Q24.5（非微血管疾病）。 實務：MINOCA 依記錄編碼；僅醫師明載微血管疾病/功能異常時才編。MB ≠ 微血管疾病。 （來源：AHA Coding Clinic 2026年第2季「非ST上升心肌梗塞併心肌橋（非阻塞性CAD）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-07:d","q":"【AHA Coding Clinic 2026年第2季】\nNSTEMI，缺血評估發現 MB 併非阻塞性 CAD；MB 是否=微血管疾病？\n依該季 Coding Clinic，下列結論何者正確？","o":["NSTEMI 編 I21.4；心肌橋（MB）為冠脈畸形編 Q24.5（非微血管疾病）。","壓力性心肌病(Takotsubo)編 I51.81；NSM 編 I5A。","術後異位性骨化編 M61.552；可 query 是否術後併發症。","MCD 併 ATN 之 AKI 編 N17.0 + N04.0。"],"e":"正解：NSTEMI 編 I21.4；心肌橋（MB）為冠脈畸形編 Q24.5（非微血管疾病）。 應使用：I21.4（NSTEMI）+ Q24.5（冠脈畸形，指 MB）。 實務：MINOCA 依記錄編碼；僅醫師明載微血管疾病/功能異常時才編。MB ≠ 微血管疾病。 （來源：AHA Coding Clinic 2026年第2季「非ST上升心肌梗塞併心肌橋（非阻塞性CAD）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-08:a","q":"【AHA Coding Clinic 2026年第2季｜空蝶鞍症候群】\n5年 ESS 病史門診追蹤，MRI 示部分空蝶鞍併殘餘垂體，無變化或症狀。\n依該季 Coding Clinic，應如何編碼？","o":["E23.6","R93.0","E20.810","E23.0"],"e":"正解：E23.6。E23.6（腦下垂體其他疾患）；相關表現另編 不應使用／不適用：R93.0（僅用於無 ESS 診斷之空蝶鞍影像發現）。 重點：ESS 編 E23.6；僅影像「空蝶鞍」無 ESS 診斷則編 R93.0。 實務：ESS = 空蝶鞍 + 垂體功能異常；單純空蝶鞍為影像異常發現（R93.0）。 （來源：AHA Coding Clinic 2026年第2季「空蝶鞍症候群」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-08:d","q":"【AHA Coding Clinic 2026年第2季】\n5年 ESS 病史門診追蹤，MRI 示部分空蝶鞍併殘餘垂體，無變化或症狀。\n依該季 Coding Clinic，下列結論何者正確？","o":["ESS 編 E23.6；僅影像「空蝶鞍」無 ESS 診斷則編 R93.0。","旋轉性椎動脈症候群編 M47.022；另加中風史碼。","TAIRS 編 E88.811。","VA-ECMO 併發 NSS 編 T81.89XA + 呼吸衰竭 J96.21/J96.22 及各表現碼。"],"e":"正解：ESS 編 E23.6；僅影像「空蝶鞍」無 ESS 診斷則編 R93.0。 應使用：E23.6（腦下垂體其他疾患）；相關表現另編。 不應使用：R93.0（僅用於無 ESS 診斷之空蝶鞍影像發現）。 實務：ESS = 空蝶鞍 + 垂體功能異常；單純空蝶鞍為影像異常發現（R93.0）。 （來源：AHA Coding Clinic 2026年第2季「空蝶鞍症候群」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-09:a","q":"【AHA Coding Clinic 2026年第2季｜脊髓休克】\n車禍 T12 爆裂性骨折併脊髓休克，數日後 bulbocavernosus 反射恢復，最終診斷完全性脊髓損傷致下身癱瘓。\n依該季 Coding Clinic，應如何編碼？","o":["R57.8","R50.81","R04.0","R04.2"],"e":"正解：R57.8。R57.8（其他休克） 重點：脊髓休克編 R57.8。 實務：脊髓休克伴隨癱瘓時以 R57.8 捕捉。 （來源：AHA Coding Clinic 2026年第2季「脊髓休克」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-09:d","q":"【AHA Coding Clinic 2026年第2季】\n車禍 T12 爆裂性骨折併脊髓休克，數日後 bulbocavernosus 反射恢復，最終診斷完全性脊髓損傷致下身癱瘓。\n依該季 Coding Clinic，下列結論何者正確？","o":["脊髓休克編 R57.8。","壓力性心肌病(Takotsubo)編 I51.81；NSM 編 I5A。","峽部骨折致滑脫只編滑脫 M43.17。","低血壓所致 AKI 編 N17.8。"],"e":"正解：脊髓休克編 R57.8。 應使用：R57.8（其他休克）。 實務：脊髓休克伴隨癱瘓時以 R57.8 捕捉。 （來源：AHA Coding Clinic 2026年第2季「脊髓休克」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-10:d","q":"【AHA Coding Clinic 2026年第2季】\n末端迴腸克隆氏症行腹腔鏡迴盲切除，病理示透壁發炎、潰瘍、漿膜炎，醫師同意。\n依該季 Coding Clinic，下列結論何者正確？","o":["漿膜炎為克隆氏症固有表現，只編克隆氏症，不另編漿膜炎。","全喉切除後 TEP 併發聲義器置入編 0B110D6；環咽肌切開為手術固有不另編。","剖腹取出腹腔內死胎編 10D00Z1；子宮破裂修補為手術固有、不另編。","腎細胞癌侵犯腎靜脈/腎竇只編 C64.1；病理侵犯發現非轉移、不另編。"],"e":"正解：漿膜炎為克隆氏症固有表現，只編克隆氏症，不另編漿膜炎。 應使用：只編克隆氏症（依部位/併發症選 K50.x）。 不應使用：另編漿膜炎。 實務：克隆氏症為發炎性腸病，serositis 即發炎、屬疾病固有，不另編。 （來源：AHA Coding Clinic 2026年第2季「克隆氏症併漿膜炎」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-11:d","q":"【AHA Coding Clinic 2026年第2季】\n第2型 DM 併高血糖，醫師記 DM 相關高血壓；stage 3b CKD 未連結他病。I12 有 Excludes1 導向 I15。\n依該季 Coding Clinic，下列結論何者正確？","o":["高血壓「續發於糖尿病」→ I12 遇 I15 Excludes1，只編 I15.2；併 DM 腎病與 CKD 分期。","記『DM 無併發症』但有 CKD 3 期時 query；分類推定相關除非明載無關。","T2DM 緩解編 E11.A；但有糖尿病併發症時不可用 E11.A（Excludes1）。","DM 相關高血脂編 E11.69 + E78.49（有因果連結）。"],"e":"正解：高血壓「續發於糖尿病」→ I12 遇 I15 Excludes1，只編 I15.2；併 DM 腎病與 CKD 分期。 應使用：E11.65（DM併高血糖）+ E11.59（DM併其他循環併發症）+ E11.22（DM併糖尿病CKD）+ I15.2（續發性高血壓,內分泌）+ N18.32（CKD 3b期）。 不應使用：I12（高血壓性CKD，本例不編）。 實務：Excludes1 時只編被指向之碼（I15.2），不編 I12；與 2018 Q4 p.87 一致。 （來源：AHA Coding Clinic 2026年第2季「糖尿病相關高血壓併慢性腎臟病」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-12:a","q":"【AHA Coding Clinic 2026年第2季｜持續性枕後位】\n40週引產，胎兒持續枕後位，因下降遲滯、產婦耗竭行產鉗旋轉助產。\n依該季 Coding Clinic，應如何編碼？","o":["O32.8XX0","O35.10X0","O35.05X0","O36.5930"],"e":"正解：O32.8XX0。O32.8XX0（其他胎位不正之母體照護）+ 下降遲滯 + 產婦耗竭 不應使用／不適用：阻塞性分娩（未記錄阻塞）。 重點：未記錄阻塞之持續性枕後位編 O32.8XX0，另編下降遲滯與產婦耗竭；不可當 obstructed labor。 實務：未記載 obstruction 不可編阻塞性；有疑義 query 醫師。 （來源：AHA Coding Clinic 2026年第2季「持續性枕後位」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-12:d","q":"【AHA Coding Clinic 2026年第2季】\n40週引產，胎兒持續枕後位，因下降遲滯、產婦耗竭行產鉗旋轉助產。\n依該季 Coding Clinic，下列結論何者正確？","o":["未記錄阻塞之持續性枕後位編 O32.8XX0，另編下降遲滯與產婦耗竭；不可當 obstructed labor。","重度憂鬱所致成人異食癖：F32.2 + F50.83。","絨毛膜羊膜分離（CAS）編 O41.8X30（索引無專項）。","選擇性終止妊娠術中子宮無力出血編 O04.6 + O35.10X0;非 O72.1、不併 Z33.2。"],"e":"正解：未記錄阻塞之持續性枕後位編 O32.8XX0，另編下降遲滯與產婦耗竭；不可當 obstructed labor。 應使用：O32.8XX0（其他胎位不正之母體照護）+ 下降遲滯 + 產婦耗竭。 不應使用：阻塞性分娩（未記錄阻塞）。 實務：未記載 obstruction 不可編阻塞性；有疑義 query 醫師。 （來源：AHA Coding Clinic 2026年第2季「持續性枕後位」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-13:d","q":"【AHA Coding Clinic 2026年第2季】\n引產後 active phase 停滯（宮縮足夠 >4hr 無子宮頸變化）→ 初次低橫剖腹產，胎兒持續枕後位。\n依該季 Coding Clinic，下列結論何者正確？","o":["只編 active phase 產程停滯；胎位不正是否為併發症/阻塞需 query 醫師。","RSV 未載相關疾病時 query 醫師；ICD-10-CM 不分類「無相關病況之 RSV」。","未記錄阻塞之持續性枕後位編 O32.8XX0，另編下降遲滯與產婦耗竭；不可當 obstructed labor。","黃韌帶肥厚須 query 是否為脊椎狹窄成分;若無關編 M24.28,若為成分只編狹窄。"],"e":"正解：只編 active phase 產程停滯；胎位不正是否為併發症/阻塞需 query 醫師。 應使用：只編 active phase 產程停滯；胎位不正碼視 query 結果。 編碼順序：先 query 醫師。 實務：持續枕後位是否為產程併發症/阻塞需醫師澄清後才編。 （來源：AHA Coding Clinic 2026年第2季「產程停滯併持續性枕後位」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-14:a","q":"【AHA Coding Clinic 2026年第2季｜直接枕後位】\n39週 active labor 併巨嬰，擴張停滯與胎位不正，剖腹產娩出直接枕後位胎兒。\n依該季 Coding Clinic，應如何編碼？","o":["O32.8XX0","O35.10X0","O36.5930","O35.05X0"],"e":"正解：O32.8XX0。O32.8XX0（其他胎位不正之母體照護） 不應使用／不適用：阻塞性分娩（未記錄阻塞）。 重點：直接枕後位所致胎位不正編 O32.8XX0；未記錄阻塞不可當 obstructed labor。 實務：有疑義 query 醫師確認是否阻塞。 （來源：AHA Coding Clinic 2026年第2季「直接枕後位」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-14:d","q":"【AHA Coding Clinic 2026年第2季】\n39週 active labor 併巨嬰，擴張停滯與胎位不正，剖腹產娩出直接枕後位胎兒。\n依該季 Coding Clinic，下列結論何者正確？","o":["直接枕後位所致胎位不正編 O32.8XX0；未記錄阻塞不可當 obstructed labor。","EGJOO(蠕動障礙)編 K22.89 + K31.89；非真性阻塞不用 K22.2。","妊娠肝內膽汁鬱積編 O26.62 + E78.79 + K76.89；無阻塞不用 K83.1。","只編 active phase 產程停滯；胎位不正是否為併發症/阻塞需 query 醫師。"],"e":"正解：直接枕後位所致胎位不正編 O32.8XX0；未記錄阻塞不可當 obstructed labor。 應使用：O32.8XX0（其他胎位不正之母體照護）。 不應使用：阻塞性分娩（未記錄阻塞）。 實務：有疑義 query 醫師確認是否阻塞。 （來源：AHA Coding Clinic 2026年第2季「直接枕後位」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-15:a","q":"【AHA Coding Clinic 2026年第2季｜女性骨盆腔膿瘍】\n敗血症併乙狀結腸急性憩室炎穿孔及骨盆/腹內膿瘍，導管引流；索引導向 N73.3 似不當。\n依該季 Coding Clinic，應如何編碼？","o":["K65.1 + K57.20","N73.3 + K57.20","K57.20","K65.1"],"e":"正解：K65.1 + K57.20。K65.1（腹膜膿瘍）+ K57.20（大腸憩室炎併穿孔及膿瘍,無出血） 不應使用／不適用：N73.3（女性急性骨盆腹膜炎，非 PID 不適用）。 重點：憩室炎穿孔所致骨盆/腹內膿瘍（非 PID、非腹膜炎）編 K65.1 + K57.20，不編 N73.3。 實務：K65.1 為非 PID 相關骨盆/腹內膿瘍之預設碼。 （來源：AHA Coding Clinic 2026年第2季「女性骨盆腔膿瘍」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-16:a","q":"【AHA Coding Clinic 2026年第2季｜新生兒呼吸費力不足】\n真空吸引娩出、臍繞頸x1，呼吸費力不足需短暫 PPV/CPAP/blow-by O2，後穩定；索引導向 P28.5（呼衰）。\n依該季 Coding Clinic，應如何編碼？","o":["P28.9 + P02.5","P28.5 + P02.5","P02.5","P28.9"],"e":"正解：P28.9 + P02.5。P28.9（新生兒呼吸情況,未特指）+ P02.5（臍帶其他壓迫影響新生兒） 不應使用／不適用：P28.5（呼吸衰竭，未記錄不可編）。 重點：無呼吸衰竭記錄之新生兒呼吸費力不足編 P28.9（非 P28.5）；併臍帶壓迫 P02.5。 實務：索引碼明顯不符時須進一步查證（basic rule of coding）。 （來源：AHA Coding Clinic 2026年第2季「新生兒呼吸費力不足」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-16:d","q":"【AHA Coding Clinic 2026年第2季】\n真空吸引娩出、臍繞頸x1，呼吸費力不足需短暫 PPV/CPAP/blow-by O2，後穩定；索引導向 P28.5（呼衰）。\n依該季 Coding Clinic，下列結論何者正確？","o":["無呼吸衰竭記錄之新生兒呼吸費力不足編 P28.9（非 P28.5）；併臍帶壓迫 P02.5。","食道扁平苔癬編 K22.89（非皮膚科 L43.9）。","非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。","OSA 病人 PAP 治療後出現 ComSA，編 G47.33 + G47.39。"],"e":"正解：無呼吸衰竭記錄之新生兒呼吸費力不足編 P28.9（非 P28.5）；併臍帶壓迫 P02.5。 應使用：P28.9（新生兒呼吸情況,未特指）+ P02.5（臍帶其他壓迫影響新生兒）。 不應使用：P28.5（呼吸衰竭，未記錄不可編）。 實務：索引碼明顯不符時須進一步查證（basic rule of coding）。 （來源：AHA Coding Clinic 2026年第2季「新生兒呼吸費力不足」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-17:a","q":"【AHA Coding Clinic 2026年第2季｜為將來透析而存在之動靜脈廔管】\nAV 廔管為將來透析而設、尚未開始透析；索引導向 Z99.2 是否適當。\n依該季 Coding Clinic，應如何編碼？","o":["Z95.828","Z99.2","Z90.79","Z98.1"],"e":"正解：Z95.828。Z95.828（其他血管植入物及移植物存在） 不應使用／不適用：Z99.2（尚未透析不可編；開始透析後才編且已含廔管存在）。 重點：尚未開始透析之 AV 廔管只編 Z95.828；開始透析後才編 Z99.2。 實務：未透析 → 只編廔管存在（Z95.828）；已透析 → 只編 Z99.2。 （來源：AHA Coding Clinic 2026年第2季「為將來透析而存在之動靜脈廔管」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-18:d","q":"【AHA Coding Clinic 2026年第2季】\n兒童發燒咳嗽，醫師診斷 RSV 感染，未指明相關疾病。\n依該季 Coding Clinic，下列結論何者正確？","o":["RSV 未載相關疾病時 query 醫師；ICD-10-CM 不分類「無相關病況之 RSV」。","記『DM 無併發症』但有 CKD 3 期時 query；分類推定相關除非明載無關。","只編 active phase 產程停滯；胎位不正是否為併發症/阻塞需 query 醫師。","僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。"],"e":"正解：RSV 未載相關疾病時 query 醫師；ICD-10-CM 不分類「無相關病況之 RSV」。 應使用：query 醫師澄清。 編碼順序：依 query 結果。 實務：ICD-10-CM 無「無相關病況之 RSV」分類，需釐清相關呼吸道/其他病況。 （來源：AHA Coding Clinic 2026年第2季「呼吸道融合病毒感染（無相關疾患）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-19:a","q":"【AHA Coding Clinic 2026年第2季｜食道扁平苔癬】\n食道扁平苔癬併食道鱗癌病史，追蹤 EGD 示活動性 LP 復發；索引 Lichen planus → L43.9（第12章皮膚）似不當。\n依該季 Coding Clinic，應如何編碼？","o":["K22.89","L43.9","K29.80","K28.4"],"e":"正解：K22.89。K22.89（食道其他特指疾病） 不應使用／不適用：L43.9（皮膚扁平苔癬，非本例）。 重點：食道扁平苔癬編 K22.89（非皮膚科 L43.9）。 實務：食道 LP（ELP）為黏膜皮膚 LP 罕見表現，影響食道鱗狀上皮，非皮膚病 → K22.89。 （來源：AHA Coding Clinic 2026年第2季「食道扁平苔癬」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-19:d","q":"【AHA Coding Clinic 2026年第2季】\n食道扁平苔癬併食道鱗癌病史，追蹤 EGD 示活動性 LP 復發；索引 Lichen planus → L43.9（第12章皮膚）似不當。\n依該季 Coding Clinic，下列結論何者正確？","o":["食道扁平苔癬編 K22.89（非皮膚科 L43.9）。","非外傷性腎包膜下血腫編 N28.89；AKI 另編 N17.9。","前期糖尿病所致多發性神經病變編 G62.89 + R73.03；非 G63。","椎體成形術後水泥肺栓塞：主診 S22.089A + J95.821 + T81.718A + I26.95。"],"e":"正解：食道扁平苔癬編 K22.89（非皮膚科 L43.9）。 應使用：K22.89（食道其他特指疾病）。 不應使用：L43.9（皮膚扁平苔癬，非本例）。 實務：食道 LP（ELP）為黏膜皮膚 LP 罕見表現，影響食道鱗狀上皮，非皮膚病 → K22.89。 （來源：AHA Coding Clinic 2026年第2季「食道扁平苔癬」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-20:a","q":"【AHA Coding Clinic 2026年第2季｜滑車成形術】\n左髕骨不穩併 MPFL 撕裂、type D 滑車發育不良、關節游離體；行脛骨結節截骨、滑車成形、MPFL 重建。\n依該季 Coding Clinic，應如何編碼？","o":["0QSC04Z","0QBC0ZZ","0QP104Z","0QRC0JZ"],"e":"正解：0QSC04Z。0QSC04Z（左下股骨 reposition 併內固定,開放） 重點：type D 滑車發育不良之滑車成形（截骨移位+錨釘固定）編 0QSC04Z。 實務：本例滑車成形為截骨使滑車溝外移 + 錨釘固定 → Reposition；建議僅適用 type D 此類情形（術式多樣）。 （來源：AHA Coding Clinic 2026年第2季「滑車成形術」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-20:d","q":"【AHA Coding Clinic 2026年第2季】\n左髕骨不穩併 MPFL 撕裂、type D 滑車發育不良、關節游離體；行脛骨結節截骨、滑車成形、MPFL 重建。\n依該季 Coding Clinic，下列結論何者正確？","o":["type D 滑車發育不良之滑車成形（截骨移位+錨釘固定）編 0QSC04Z。","DeBakey type 1 多段胸主動脈剝離各編一碼。","股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。","以連著血管之腸段成形新膀胱→Transfer，編 0DX84ZB。"],"e":"正解：type D 滑車發育不良之滑車成形（截骨移位+錨釘固定）編 0QSC04Z。 應使用：0QSC04Z（左下股骨 reposition 併內固定,開放）。 實務：本例滑車成形為截骨使滑車溝外移 + 錨釘固定 → Reposition；建議僅適用 type D 此類情形（術式多樣）。 （來源：AHA Coding Clinic 2026年第2季「滑車成形術」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-21:d","q":"【AHA Coding Clinic 2026年第2季】\n復發性左扁桃周圍膿瘍，經口以針抽吸約 2cc 膿液；入路判定 External vs Percutaneous。\n依該季 Coding Clinic，下列結論何者正確？","o":["經口直視、無需器械到達 → 入路值 External（非 Percutaneous）。","股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。","NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。"],"e":"正解：經口直視、無需器械到達 → 入路值 External（非 Percutaneous）。 應使用：入路值 = External（依實際填 Drainage 碼）。 不應使用：Percutaneous。 實務：PCS B5.3a——經孔道、於無需器械即可見之構造上處置 → External；針僅為取得抽吸物之工具。 （來源：AHA Coding Clinic 2026年第2季「扁桃周圍膿瘍針抽吸」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-22:a","q":"【AHA Coding Clinic 2026年第2季｜顱咽管瘤引流】\n復發顱咽管瘤，右額腦室鏡視丘囊腫開窗，鑽孔置腦室導管，術後 CT 示導管尖端於鞍上區。\n依該季 Coding Clinic，應如何編碼？","o":["009640Z","01580ZZ","01584ZZ","028G3Z1"],"e":"正解：009640Z。009640Z（Drainage of cerebral ventricle with drainage device, percutaneous endoscopic approach） 重點：內視鏡經腦室鑽孔引流鞍上囊腫，編 009640Z 腦室引流併引流裝置,經皮內視鏡。 實務：鞍上囊腫經腦室內視鏡引流 → body part 取腦室、經皮內視鏡入路。 （來源：AHA Coding Clinic 2026年第2季「顱咽管瘤引流」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-22:d","q":"【AHA Coding Clinic 2026年第2季】\n復發顱咽管瘤，右額腦室鏡視丘囊腫開窗，鑽孔置腦室導管，術後 CT 示導管尖端於鞍上區。\n依該季 Coding Clinic，下列結論何者正確？","o":["內視鏡經腦室鑽孔引流鞍上囊腫，編 009640Z 腦室引流併引流裝置,經皮內視鏡。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","以顳肌帶蒂皮瓣行間接血管重建編 0KX00ZZ（Transfer 頭部肌肉）。","手輔助腹腔鏡（GelPort）以入路值 4 經皮內視鏡 + qualifier G 手輔助編。"],"e":"正解：內視鏡經腦室鑽孔引流鞍上囊腫，編 009640Z 腦室引流併引流裝置,經皮內視鏡。 應使用：009640Z（Drainage of cerebral ventricle with drainage device, percutaneous endoscopic approach）。 實務：鞍上囊腫經腦室內視鏡引流 → body part 取腦室、經皮內視鏡入路。 （來源：AHA Coding Clinic 2026年第2季「顱咽管瘤引流」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-23:a","q":"【AHA Coding Clinic 2026年第2季｜幽靈迴腸造口（潛在造口）】\n複雜乙狀結腸憩室炎併小膿瘍行腹腔鏡乙狀結腸切除+吻合，修補吻合口小滲漏後建立 ghost/潛在迴腸造口（迴腸 loop 拉出固定於腹壁）。\n依該季 Coding Clinic，應如何編碼？","o":["0DBE4ZZ + 0DSB4ZZ","0DSB4ZZ","0DBE4ZZ","0DBE4ZZ + 0DB80ZZ"],"e":"正解：0DBE4ZZ + 0DSB4ZZ。0DBE4ZZ（大腸切除,經皮內視鏡=腹腔鏡乙狀結腸切除）+ 0DSB4ZZ（迴腸 reposition,經皮內視鏡=ghost ileostomy） 編碼順序：兩者為不同手術目的，各自編碼。 重點：乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。 實務：ghost ileostomy 符合 Reposition 定義；與切除為不同手術目的。 （來源：AHA Coding Clinic 2026年第2季「幽靈迴腸造口（潛在造口）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q2-23:d","q":"【AHA Coding Clinic 2026年第2季】\n複雜乙狀結腸憩室炎併小膿瘍行腹腔鏡乙狀結腸切除+吻合，修補吻合口小滲漏後建立 ghost/潛在迴腸造口（迴腸 loop 拉出固定於腹壁）。\n依該季 Coding Clinic，下列結論何者正確？","o":["乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。","內視鏡經蝶切除蝶鞍顱咽管瘤編 0NBC4ZZ（Excision，蝶骨）。","以 AXIOS LAMS 建立膽總管十二指腸吻合達膽道引流，root operation = Drainage，編 0F9980Z。","機器手臂結腸膀胱廔切除併膀胱前膿瘍引流：body part 取骨盆腔，編 0W9J4ZZ + 8E0W4CZ。"],"e":"正解：乙狀結腸切除（0DBE4ZZ）+ 幽靈迴腸造口（Reposition 0DSB4ZZ）分別編碼。 應使用：0DBE4ZZ（大腸切除,經皮內視鏡=腹腔鏡乙狀結腸切除）+ 0DSB4ZZ（迴腸 reposition,經皮內視鏡=ghost ileostomy）。 編碼順序：兩者為不同手術目的，各自編碼。 實務：ghost ileostomy 符合 Reposition 定義；與切除為不同手術目的。 （來源：AHA Coding Clinic 2026年第2季「幽靈迴腸造口（潛在造口）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-24:a","q":"【AHA Coding Clinic 2026年第2季｜持續性哮喘重積（續發於二手電子煙）】\n2025 Q3 p.11 原給 J45.41（併急性惡化）；但病人為 persistent status asthmaticus。\n依該季 Coding Clinic，應如何編碼？","o":["J45.42","J45.41","J44.1","J45.909"],"e":"正解：J45.42。J45.42（中度持續性氣喘併哮喘重積） 不應使用／不適用：J45.41。 編碼順序：只編較嚴重之 status asthmaticus。 重點：【更正】應編 J45.42（中度持續性氣喘併 status asthmaticus），非 J45.41。 實務：status asthmaticus 與 exacerbation 並存時只編較嚴重者（status）。 （來源：AHA Coding Clinic 2026年第2季「持續性哮喘重積（續發於二手電子煙）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q2-25:a","q":"【AHA Coding Clinic 2026年第2季｜妊娠合併慢性疼痛】\n2023 Q3 p.17 原給 O99.892；但 G89.29 慢性疼痛屬神經系統疾病。\n依該季 Coding Clinic，應如何編碼？","o":["O99.354","O99.892","O99.355","O99.43"],"e":"正解：O99.354。O99.354（神經系統疾病併發分娩） 不應使用／不適用：O99.892。 重點：【更正】妊娠合併慢性疼痛應編 O99.354（神經系統疾病），非 O99.892。 實務：G89.29（其他慢性疼痛）在 ICD-10-CM 歸類為神經系統疾病 → 用 O99.35x 系列。 （來源：AHA Coding Clinic 2026年第2季「妊娠合併慢性疼痛」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-01:d","q":"【AHA Coding Clinic 2026年第3季】\n病人同時記錄 type 1 與 type 2 DM 併明顯胰島素阻抗；E10、E11 類目有 Excludes1 不允許併用。\n依該季 Coding Clinic，下列結論何者正確？","o":["同時記錄第1型與第2型糖尿病（hybrid / double DM），E10 與 E11 互為 Excludes1 不可併編，改編 E13（其他特指糖尿病）。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。","TAIRS 編 E88.811。","FY2026 新增脅腹(flank)疼痛 R10.A- 與壓痛 R10.8A-；可與腹部象限碼併用（Excludes2）。"],"e":"正解：同時記錄第1型與第2型糖尿病（hybrid / double DM），E10 與 E11 互為 Excludes1 不可併編，改編 E13（其他特指糖尿病）。 應使用：E13.-（依併發症選適當第4–6碼）。 不應使用：E10 與 E11 併用。 編碼順序：依主診斷情形排序。 實務：double / hybrid diabetes 同時具第1型自體免疫β細胞破壞與第2型胰島素阻抗；與 Coding Clinic 2018 Q3 p.5 一致。 （來源：AHA Coding Clinic 2026年第3季「雙重糖尿病」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-02:a","q":"【AHA Coding Clinic 2026年第3季｜雙J輸尿管支架置放（引流目的）】\n左側 7mm 輸尿管結石，膀胱鏡下置入 6Fr×26cm 雙J支架，KUB 確認腎盂與膀胱端捲曲良好。\n依該季 Coding Clinic，應如何編碼？","o":["0T9780Z","0T768DZ","0TPB0JZ","0TXB0Z6"],"e":"正解：0T9780Z。0T9780Z（Drainage of left ureter with drainage device, via NAO endoscopic） 編碼順序：目的為引流。 重點：支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。 實務：同為雙J支架，須依醫師記載之置放目的判 root operation（引流 vs 擴張）。 （來源：AHA Coding Clinic 2026年第3季「雙J輸尿管支架置放（引流目的）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-02:d","q":"【AHA Coding Clinic 2026年第3季】\n左側 7mm 輸尿管結石，膀胱鏡下置入 6Fr×26cm 雙J支架，KUB 確認腎盂與膀胱端捲曲良好。\n依該季 Coding Clinic，下列結論何者正確？","o":["支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。","DEN(EndoRotor)清除胰壞死編 0FCG8ZZ(Extirpation)。","OPRA 骨整合義肢置入：診斷用外傷截肢碼第7碼 D；PCS 為 Insertion。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。"],"e":"正解：支架目的為讓阻塞尿液引流至膀胱 → PCS root operation 為 Drainage。 應使用：0T9780Z（Drainage of left ureter with drainage device, via NAO endoscopic）。 編碼順序：目的為引流。 實務：同為雙J支架，須依醫師記載之置放目的判 root operation（引流 vs 擴張）。 （來源：AHA Coding Clinic 2026年第3季「雙J輸尿管支架置放（引流目的）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-03:a","q":"【AHA Coding Clinic 2026年第3季｜雙J輸尿管支架置放（擴張目的）】\n右上輸尿管大阻塞性結石併腎水腫，輸尿管扭曲且導線多次難以通過；置 6Fr×24cm 雙J支架。\n依該季 Coding Clinic，應如何編碼？","o":["0T768DZ","0T9780Z","0TPB0JZ","0TXB0Z6"],"e":"正解：0T768DZ。0T768DZ（Dilation of right ureter with intraluminal device, via NAO endoscopic） 編碼順序：目的為擴張。 重點：輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。 實務：與引流案例對照：同支架、目的不同 → root operation 不同。 （來源：AHA Coding Clinic 2026年第3季「雙J輸尿管支架置放（擴張目的）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-03:d","q":"【AHA Coding Clinic 2026年第3季】\n右上輸尿管大阻塞性結石併腎水腫，輸尿管扭曲且導線多次難以通過；置 6Fr×24cm 雙J支架。\n依該季 Coding Clinic，下列結論何者正確？","o":["輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。","體外切除肝腫瘤後自體再植：只編所行處置(切除)；非 Transplantation。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","難治性室性心搏過速之心臟 SBRT（radio-ablation）編 D228DZZ。"],"e":"正解：輸尿管扭曲，支架目的為擴張輸尿管以利日後輸尿管鏡 → PCS root operation 為 Dilation。 應使用：0T768DZ（Dilation of right ureter with intraluminal device, via NAO endoscopic）。 編碼順序：目的為擴張。 實務：與引流案例對照：同支架、目的不同 → root operation 不同。 （來源：AHA Coding Clinic 2026年第3季「雙J輸尿管支架置放（擴張目的）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-04:a","q":"【AHA Coding Clinic 2026年第3季｜頦下游離皮瓣多餘軟組織切除/減積】\n唇癌切除+頦下皮瓣重建數月後，回院行皮瓣多餘軟組織切除/減積並縫合。\n依該季 Coding Clinic，應如何編碼？","o":["Z42.8 + L98.7 + Z85.818","L98.7 + Z85.818","Z42.8 + Z85.818","Z42.8 + L98.7"],"e":"正解：Z42.8 + L98.7 + Z85.818。Z42.8（整形重建術後就診）+ L98.7（多餘皮膚及皮下組織）+ Z85.818（唇/口腔/咽其他部位惡性腫瘤個人史） 編碼順序：Z42.8 為 first-listed。 重點：唇癌切除併頦下皮瓣重建後回院切除皮瓣多餘軟組織，主診斷 Z42.8。 實務：術後恢復/重建就診用 Z42.8；符合 Guidelines I.C.21.c.7；與 2017 Q1 p.42 類似。 （來源：AHA Coding Clinic 2026年第3季「頦下游離皮瓣多餘軟組織切除/減積」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-04:d","q":"【AHA Coding Clinic 2026年第3季】\n唇癌切除+頦下皮瓣重建數月後，回院行皮瓣多餘軟組織切除/減積並縫合。\n依該季 Coding Clinic，下列結論何者正確？","o":["唇癌切除併頦下皮瓣重建後回院切除皮瓣多餘軟組織，主診斷 Z42.8。","DIEP 皮瓣重建併 IMF 鄰近組織轉移(Ryan flap)為獨立目的,雙側各編 0HX5XZZ。","DIEP 游離皮瓣失敗(不存活)編 T85.898A。","DIEAP 皮瓣(乳房重建)靜脈血栓編 T85.868A。"],"e":"正解：唇癌切除併頦下皮瓣重建後回院切除皮瓣多餘軟組織，主診斷 Z42.8。 應使用：Z42.8（整形重建術後就診）+ L98.7（多餘皮膚及皮下組織）+ Z85.818（唇/口腔/咽其他部位惡性腫瘤個人史）。 編碼順序：Z42.8 為 first-listed。 實務：術後恢復/重建就診用 Z42.8；符合 Guidelines I.C.21.c.7；與 2017 Q1 p.42 類似。 （來源：AHA Coding Clinic 2026年第3季「頦下游離皮瓣多餘軟組織切除/減積」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-05:a","q":"【AHA Coding Clinic 2026年第3季｜胃腸道基質瘤】\n空腸 GIST 切除病史，S1–S2 硬膜外轉移灶併 S1 神經根病變，診斷 GIST 脊椎轉移；索引 Tumor, stromal 無轉移條目。\n依該季 Coding Clinic，應如何編碼？","o":["C79.51 + Z85.068","Z85.068","C79.51","C79.51 + C78.7"],"e":"正解：C79.51 + Z85.068。C79.51（續發性骨惡性腫瘤）+ Z85.068（小腸其他惡性腫瘤個人史） 編碼順序：轉移灶為主要治療標的時先行。 重點：空腸 GIST 切除後轉移至脊椎（骨），轉移灶依部位編 C79.51。 實務：GIST 雖源自腸胃道仍可轉移；轉移灶依轉移部位（骨）編碼，原發已切除以個人史表示。 （來源：AHA Coding Clinic 2026年第3季「胃腸道基質瘤」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-05:d","q":"【AHA Coding Clinic 2026年第3季】\n空腸 GIST 切除病史，S1–S2 硬膜外轉移灶併 S1 神經根病變，診斷 GIST 脊椎轉移；索引 Tumor, stromal 無轉移條目。\n依該季 Coding Clinic，下列結論何者正確？","o":["空腸 GIST 切除後轉移至脊椎（骨），轉移灶依部位編 C79.51。","新生兒 RSV 預防性單株抗體(Nirsevimab/Beyfortus)就診編 Z29.11。","L2-L3 硬膜外脂肪增多症編 E88.2；並加編相關脊椎病變。","未記錄阻塞之持續性枕後位編 O32.8XX0，另編下降遲滯與產婦耗竭；不可當 obstructed labor。"],"e":"正解：空腸 GIST 切除後轉移至脊椎（骨），轉移灶依部位編 C79.51。 應使用：C79.51（續發性骨惡性腫瘤）+ Z85.068（小腸其他惡性腫瘤個人史）。 編碼順序：轉移灶為主要治療標的時先行。 實務：GIST 雖源自腸胃道仍可轉移；轉移灶依轉移部位（骨）編碼，原發已切除以個人史表示。 （來源：AHA Coding Clinic 2026年第3季「胃腸道基質瘤」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-06:a","q":"【AHA Coding Clinic 2026年第3季｜息肉切除後電凝症候群】\n篩檢大腸鏡息肉切除後腹痛、腹脹、無法排氣排便，診斷 PPCS；索引無指引。\n依該季 Coding Clinic，應如何編碼？","o":["K91.89","K90.822","K90.821","K22.11"],"e":"正解：K91.89。K91.89（消化系統其他術後併發症）+ 各documented表現碼（腹痛等） 編碼順序：K91.89 為主，表現碼為附加。 重點：息肉切除電凝造成透壁灼傷/局部腹膜炎（無穿孔），編 K91.89 並加各表現碼。 實務：症候群無專屬碼時依 Guidelines I.B.15 加編非疾病固有之表現碼；PPCS 可有白血球增多、腹痛、發燒、腹膜炎。 （來源：AHA Coding Clinic 2026年第3季「息肉切除後電凝症候群」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-06:d","q":"【AHA Coding Clinic 2026年第3季】\n篩檢大腸鏡息肉切除後腹痛、腹脹、無法排氣排便，診斷 PPCS；索引無指引。\n依該季 Coding Clinic，下列結論何者正確？","o":["息肉切除電凝造成透壁灼傷/局部腹膜炎（無穿孔），編 K91.89 並加各表現碼。","減重用 tirzepatide 增量所致胃輕癱編 K31.84 + T38.895A。","短腸症候群依結腸是否連續分:有連續 K90.821、無連續 K90.822。","術後胰肋膜廔（醫師確認）編 T81.83XA + K86.89 + J94.8 + J91.8；非 J86.0。"],"e":"正解：息肉切除電凝造成透壁灼傷/局部腹膜炎（無穿孔），編 K91.89 並加各表現碼。 應使用：K91.89（消化系統其他術後併發症）+ 各documented表現碼（腹痛等）。 編碼順序：K91.89 為主，表現碼為附加。 實務：症候群無專屬碼時依 Guidelines I.B.15 加編非疾病固有之表現碼；PPCS 可有白血球增多、腹痛、發燒、腹膜炎。 （來源：AHA Coding Clinic 2026年第3季「息肉切除後電凝症候群」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-07:a","q":"【AHA Coding Clinic 2026年第3季｜經中膈穿刺後雙向分流】\n二尖瓣/三尖瓣逆流行 MitraClip，經中膈穿刺；TEE 與 bubble study 顯示穿刺處雙向分流，以 Gore Cardioform 封堵。\n依該季 Coding Clinic，應如何編碼？","o":["I97.88 + I51.0","I51.0","I97.88","I97.88 + I97.89"],"e":"正解：I97.88 + I51.0。I97.88（循環系統其他術中併發症 NEC）+ I51.0（後天性心中膈缺損） 編碼順序：兩碼並用以完整呈現。 重點：MitraClip 經中膈穿刺後穿刺處雙向分流（後天心中膈缺損），編術中併發症 I97.88 + I51.0。 實務：穿刺造成之雙向分流屬術中併發症並造成心中膈缺損，需兩碼。 （來源：AHA Coding Clinic 2026年第3季「經中膈穿刺後雙向分流」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-07:d","q":"【AHA Coding Clinic 2026年第3季】\n二尖瓣/三尖瓣逆流行 MitraClip，經中膈穿刺；TEE 與 bubble study 顯示穿刺處雙向分流，以 Gore Cardioform 封堵。\n依該季 Coding Clinic，下列結論何者正確？","o":["MitraClip 經中膈穿刺後穿刺處雙向分流（後天心中膈缺損），編術中併發症 I97.88 + I51.0。","經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","SCD 併指炎編 D57.04(Hb-SS 併 dactylitis)+ 發燒 R50.81。","T2DM 緩解編 E11.A；但有糖尿病併發症時不可用 E11.A（Excludes1）。"],"e":"正解：MitraClip 經中膈穿刺後穿刺處雙向分流（後天心中膈缺損），編術中併發症 I97.88 + I51.0。 應使用：I97.88（循環系統其他術中併發症 NEC）+ I51.0（後天性心中膈缺損）。 編碼順序：兩碼並用以完整呈現。 實務：穿刺造成之雙向分流屬術中併發症並造成心中膈缺損，需兩碼。 （來源：AHA Coding Clinic 2026年第3季「經中膈穿刺後雙向分流」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-08:a","q":"【AHA Coding Clinic 2026年第3季｜顱內海綿狀血管瘤併出血】\n中風病史，因類中風症狀入院，診斷後肢 cavernoma 併皮質下出血。\n依該季 Coding Clinic，應如何編碼？","o":["D18.02 + I61.0","I61.0","D18.02","D18.02 + D15.2"],"e":"正解：D18.02 + I61.0。D18.02（顱內結構血管瘤，涵蓋 cavernous hemangioma/angioma）+ I61.0（非外傷性腦內出血，半球皮質下） 編碼順序：兩碼並用。 重點：顱內海綿狀血管瘤（cavernoma）併皮質下出血，編 D18.02 + I61.0。 實務：cavernoma 即 cavernous hemangioma → D18.02；出血另編 I61.0。 （來源：AHA Coding Clinic 2026年第3季「顱內海綿狀血管瘤併出血」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-08:d","q":"【AHA Coding Clinic 2026年第3季】\n中風病史，因類中風症狀入院，診斷後肢 cavernoma 併皮質下出血。\n依該季 Coding Clinic，下列結論何者正確？","o":["顱內海綿狀血管瘤（cavernoma）併皮質下出血，編 D18.02 + I61.0。","自發性腦幹出血致昏迷:主診 I61.3 + R40.2A(潛在病因先編)。","置導尿管創傷攝護腺致血尿屬術後出血，編 N99.820 + Y84.6 + R31.0。","舊中風症狀復發編後遺症碼 I69.392 + I69.398。"],"e":"正解：顱內海綿狀血管瘤（cavernoma）併皮質下出血，編 D18.02 + I61.0。 應使用：D18.02（顱內結構血管瘤，涵蓋 cavernous hemangioma/angioma）+ I61.0（非外傷性腦內出血，半球皮質下）。 編碼順序：兩碼並用。 實務：cavernoma 即 cavernous hemangioma → D18.02；出血另編 I61.0。 （來源：AHA Coding Clinic 2026年第3季「顱內海綿狀血管瘤併出血」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-09:a","q":"【AHA Coding Clinic 2026年第3季｜放療後類中風偏頭痛發作症候群】\n左頂葉腦膜瘤放療病史，反覆 SMART 症候群，併偏癱偏頭痛（非頑固、無 status）與局部相關頑固癲癇。\n依該季 Coding Clinic，應如何編碼？","o":["G97.82 + G43.409 + G40.019 + Y84.2","G43.409 + G40.019 + Y84.2","G97.82 + G40.019 + Y84.2","G97.82 + G43.409 + Y84.2"],"e":"正解：G97.82 + G43.409 + G40.019 + Y84.2。G97.82（神經系統其他術後併發症）+ G43.409（偏癱偏頭痛，非頑固無 status）+ G40.019（局部相關頑固癲癇無 status）+ Y84.2（放療為異常反應原因） 編碼順序：四碼齊全。 重點：腦膜瘤放療後 SMART 症候群，編術後神經併發症 + 偏癱偏頭痛 + 局部癲癇 + 放療外因。 實務：SMART 為放療遲發性併發症；須含外因 Y84.2 表示放療不良反應。 （來源：AHA Coding Clinic 2026年第3季「放療後類中風偏頭痛發作症候群」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-09:d","q":"【AHA Coding Clinic 2026年第3季】\n左頂葉腦膜瘤放療病史，反覆 SMART 症候群，併偏癱偏頭痛（非頑固、無 status）與局部相關頑固癲癇。\n依該季 Coding Clinic，下列結論何者正確？","o":["腦膜瘤放療後 SMART 症候群，編術後神經併發症 + 偏癱偏頭痛 + 局部癲癇 + 放療外因。","切除副甲狀腺癌不可避免犧牲喉返神經致聲帶麻痺，編 J38.01，非術後併發症碼。","【更正】應編 J45.42（中度持續性氣喘併 status asthmaticus），非 J45.41。","第2型 DM 之自律神經失調姿勢性低血壓症候群編 E11.43 + I95.1 + G90.8。"],"e":"正解：腦膜瘤放療後 SMART 症候群，編術後神經併發症 + 偏癱偏頭痛 + 局部癲癇 + 放療外因。 應使用：G97.82（神經系統其他術後併發症）+ G43.409（偏癱偏頭痛，非頑固無 status）+ G40.019（局部相關頑固癲癇無 status）+ Y84.2（放療為異常反應原因）。 編碼順序：四碼齊全。 實務：SMART 為放療遲發性併發症；須含外因 Y84.2 表示放療不良反應。 （來源：AHA Coding Clinic 2026年第3季「放療後類中風偏頭痛發作症候群」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-10:a","q":"【AHA Coding Clinic 2026年第3季｜成熟性白內障】\n病歷僅記 mature cataract，未載年齡相關等型別。\n依該季 Coding Clinic，應如何編碼？","o":["H26.8","H16.223","H46.9","H93.A1"],"e":"正解：H26.8。先 query 醫師；無法取得 → H26.8（其他特指白內障） 不應使用／不適用：編為 unspecified 白內障。 重點：僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。 實務：mature = 完全混濁，屬白內障特定階段 → 歸「其他特指」而非「未特指」。 （來源：AHA Coding Clinic 2026年第3季「成熟性白內障」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-10:d","q":"【AHA Coding Clinic 2026年第3季】\n病歷僅記 mature cataract，未載年齡相關等型別。\n依該季 Coding Clinic，下列結論何者正確？","o":["僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。","視神經病變與 DM 未由『with』推定→需 query;相關 E11.39+H46.9,無關 H46.9+E11.9。","只編 active phase 產程停滯；胎位不正是否為併發症/阻塞需 query 醫師。","高乳酸血症 ≠ 酸中毒；未載酸中毒不可編 E87.20；query 後僅確認高乳酸 → R79.89。"],"e":"正解：僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。 應使用：先 query 醫師；無法取得 → H26.8（其他特指白內障）。 不應使用：編為 unspecified 白內障。 實務：mature = 完全混濁，屬白內障特定階段 → 歸「其他特指」而非「未特指」。 （來源：AHA Coding Clinic 2026年第3季「成熟性白內障」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-11:d","q":"【AHA Coding Clinic 2026年第3季】\n喘鳴，醫師記「reactive airway disease without asthma」；索引 RAD → see Asthma。\n依該季 Coding Clinic，下列結論何者正確？","o":["RAD 但明確無氣喘時 ICD-10-CM 無 RAD 分類，改編症狀碼（如喘鳴），不可用氣喘碼。","僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。","RSV 未載相關疾病時 query 醫師；ICD-10-CM 不分類「無相關病況之 RSV」。","SCD 併指炎編 D57.04(Hb-SS 併 dactylitis)+ 發燒 R50.81。"],"e":"正解：RAD 但明確無氣喘時 ICD-10-CM 無 RAD 分類，改編症狀碼（如喘鳴），不可用氣喘碼。 應使用：依症狀編碼（喘鳴 R06.2 等）。 不應使用：J45.909（未特指氣喘）——無氣喘記錄不可編氣喘。 實務：索引雖導向 Asthma，但病人無氣喘則不適用；以實際症狀編碼。 （來源：AHA Coding Clinic 2026年第3季「反應性呼吸道疾病（無氣喘）」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-12:a","q":"【AHA Coding Clinic 2026年第3季｜莫須瘤】\n淋巴瘤病人 rituximab 輸注中出現寒顫、呼吸急促、倦怠，診斷「輸注反應續發於 rituximab」。\n依該季 Coding Clinic，應如何編碼？","o":["T80.89XA + T45.1X5A","T45.1X5A","T80.89XA","T84.82XA + T45.1X5A"],"e":"正解：T80.89XA + T45.1X5A。T80.89XA（輸注/輸血/治療性注射後其他併發症，初診）+ T45.1X5A（抗腫瘤/免疫抑制劑不良反應，初診）+ 各表現碼 編碼順序：T80.89XA 先，T45.1X5A 次。 重點：rituximab 輸注反應編輸注併發症 T80.89XA + 藥物不良反應 T45.1X5A + 表現碼。 實務：T80–T88 起始指示加編藥物不良反應碼（第5/6碼為5）與併發症所致特定病況碼。 （來源：AHA Coding Clinic 2026年第3季「莫須瘤」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-12:d","q":"【AHA Coding Clinic 2026年第3季】\n淋巴瘤病人 rituximab 輸注中出現寒顫、呼吸急促、倦怠，診斷「輸注反應續發於 rituximab」。\n依該季 Coding Clinic，下列結論何者正確？","o":["rituximab 輸注反應編輸注併發症 T80.89XA + 藥物不良反應 T45.1X5A + 表現碼。","CAR-T 所致全血球減少編 T80.82XA + D61.818。","sertraline 不良反應所致血清素症候群主診 G90.81 + 藥物碼 + 各表現。","VA-ECMO 併發 NSS 編 T81.89XA + 呼吸衰竭 J96.21/J96.22 及各表現碼。"],"e":"正解：rituximab 輸注反應編輸注併發症 T80.89XA + 藥物不良反應 T45.1X5A + 表現碼。 應使用：T80.89XA（輸注/輸血/治療性注射後其他併發症，初診）+ T45.1X5A（抗腫瘤/免疫抑制劑不良反應，初診）+ 各表現碼。 編碼順序：T80.89XA 先，T45.1X5A 次。 實務：T80–T88 起始指示加編藥物不良反應碼（第5/6碼為5）與併發症所致特定病況碼。 （來源：AHA Coding Clinic 2026年第3季「莫須瘤」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-13:a","q":"【AHA Coding Clinic 2026年第3季｜新陰道狹窄】\n變性女性先前陰道成形術後陰道狹窄、擴張困難，入院重做陰道。\n依該季 Coding Clinic，應如何編碼？","o":["N99.89 + N89.5","N89.5","N99.89","N99.861 + N89.5"],"e":"正解：N99.89 + N89.5。N99.89（泌尿生殖系統其他術後併發症）+ N89.5（陰道狹窄及閉鎖） 編碼順序：兩碼並用。 重點：陰道成形術後新陰道狹窄，編術後泌尿生殖併發症 N99.89 + N89.5。 實務：為 gender-affirming 陰道成形術後併發症；狹窄指管腔變窄/縮短/閉合。 （來源：AHA Coding Clinic 2026年第3季「新陰道狹窄」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-13:d","q":"【AHA Coding Clinic 2026年第3季】\n變性女性先前陰道成形術後陰道狹窄、擴張困難，入院重做陰道。\n依該季 Coding Clinic，下列結論何者正確？","o":["陰道成形術後新陰道狹窄，編術後泌尿生殖併發症 N99.89 + N89.5。","非醫療矽膠注射所致腹膜後膿瘍編 K68.19 + M79.5 + Z18.89;非 T85.79。","NSM(保留乳頭乳房切除)後乳頭壞死→新碼 N99.861;缺血為 N99.860。","胃空腸狹窄編 K56.699(腸阻塞)；無記載不當併發症。"],"e":"正解：陰道成形術後新陰道狹窄，編術後泌尿生殖併發症 N99.89 + N89.5。 應使用：N99.89（泌尿生殖系統其他術後併發症）+ N89.5（陰道狹窄及閉鎖）。 編碼順序：兩碼並用。 實務：為 gender-affirming 陰道成形術後併發症；狹窄指管腔變窄/縮短/閉合。 （來源：AHA Coding Clinic 2026年第3季「新陰道狹窄」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-14:a","q":"【AHA Coding Clinic 2026年第3季｜人工全膝關節感染（敗血性）】\n64歲右 TKA 後感染，切開引流 + 第一階段翻修 + 滑膜切除，診斷右義關節感染併 septic TKA due to Staph. caprae。\n依該季 Coding Clinic，應如何編碼？","o":["T84.53XA + M00.061 + B95.7","M00.061 + B95.7","T84.53XA + B95.7","T84.53XA + M00.061"],"e":"正解：T84.53XA + M00.061 + B95.7。T84.53XA（右膝內置關節義器感染，初診）+ M00.061（葡萄球菌性關節炎，右膝）+ B95.7（其他葡萄球菌為致病菌） 編碼順序：三碼齊全。 重點：右 TKA 後義關節感染併敗血性關節炎（Staph. caprae），三碼並用。 實務：T84.5 指示加編感染碼（此處 M00.061）；M00.0 指示加編致病菌（B95.7）。 （來源：AHA Coding Clinic 2026年第3季「人工全膝關節感染（敗血性）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-14:d","q":"【AHA Coding Clinic 2026年第3季】\n64歲右 TKA 後感染，切開引流 + 第一階段翻修 + 滑膜切除，診斷右義關節感染併 septic TKA due to Staph. caprae。\n依該季 Coding Clinic，下列結論何者正確？","o":["右 TKA 後義關節感染併敗血性關節炎（Staph. caprae），三碼並用。","【釐清】XRG device R 用於「custom-made anatomically designed」病人專屬椎間融合器（如 Aprevo），非現成器。","僅記錄 mature cataract 時先 query 醫師確認型別；無法取得則編 H26.8。","『due to』不觸發 With 推定;需醫師記載連結。若明載則編 D64.81。"],"e":"正解：右 TKA 後義關節感染併敗血性關節炎（Staph. caprae），三碼並用。 應使用：T84.53XA（右膝內置關節義器感染，初診）+ M00.061（葡萄球菌性關節炎，右膝）+ B95.7（其他葡萄球菌為致病菌）。 編碼順序：三碼齊全。 實務：T84.5 指示加編感染碼（此處 M00.061）；M00.0 指示加編致病菌（B95.7）。 （來源：AHA Coding Clinic 2026年第3季「人工全膝關節感染（敗血性）」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-15:d","q":"【AHA Coding Clinic 2026年第3季】\n入院時已有輕度血小板低下（POA），脊椎術後惡化，疑似術後消耗所致。\n依該季 Coding Clinic，下列結論何者正確？","o":["需 query 是續發性或原有惡化；續發 → D69.59（POA N）+ D69.6（POA Y）；若僅惡化 → 只 D69.6（POA Y）。","只編 active phase 產程停滯；胎位不正是否為併發症/阻塞需 query 醫師。","術後異位性骨化編 M61.552；可 query 是否術後併發症。","AKI(POA)後院內發生 ATN(敗血症所致)，N17.0 之 POA 指標為「N」。"],"e":"正解：需 query 是續發性或原有惡化；續發 → D69.59（POA N）+ D69.6（POA Y）；若僅惡化 → 只 D69.6（POA Y）。 應使用：續發確認 → D69.59（其他續發性血小板低下，POA N）+ D69.6（未特指，POA Y，基線）；若僅惡化 → 只 D69.6（POA Y）。 編碼順序：先 query 醫師再定。 實務：關鍵在區分「新的續發性」vs「原有惡化」；POA 指標依此不同。 （來源：AHA Coding Clinic 2026年第3季「術後消耗性血小板低下」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-16:a","q":"【AHA Coding Clinic 2026年第3季｜無刀輸精管結紮】\n永久絕育行 NSV，經皮夾穿入陰囊夾出輸精管，兩側各結紮切除約1吋並燒灼。\n依該季 Coding Clinic，應如何編碼？","o":["0VBQ3ZZ","0VT04ZE","009640Z","01580ZZ"],"e":"正解：0VBQ3ZZ。0VBQ3ZZ（Excision of bilateral vas deferens, percutaneous approach） 編碼順序：入路值 = 3（經皮）。 重點：NSV 符合經皮入路定義，編 0VBQ3ZZ 雙側輸精管切除，經皮入路。 實務：NSV 以穿刺/小切口進入 → 符合 percutaneous approach 定義。 （來源：AHA Coding Clinic 2026年第3季「無刀輸精管結紮」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-16:d","q":"【AHA Coding Clinic 2026年第3季】\n永久絕育行 NSV，經皮夾穿入陰囊夾出輸精管，兩側各結紮切除約1吋並燒灼。\n依該季 Coding Clinic，下列結論何者正確？","o":["NSV 符合經皮入路定義，編 0VBQ3ZZ 雙側輸精管切除，經皮入路。","V-Y 肛門成形(皮瓣前移)為 Transfer 0HX9XZZ;黏膜外翻切除 0DBQ0ZZ。","DIEP 皮瓣重建併 IMF 鄰近組織轉移(Ryan flap)為獨立目的,雙側各編 0HX5XZZ。","HeRO 移植片血栓清除編 03C73ZZ + 05CY3ZZ(Extirpation)；非 Revision。"],"e":"正解：NSV 符合經皮入路定義，編 0VBQ3ZZ 雙側輸精管切除，經皮入路。 應使用：0VBQ3ZZ（Excision of bilateral vas deferens, percutaneous approach）。 編碼順序：入路值 = 3（經皮）。 實務：NSV 以穿刺/小切口進入 → 符合 percutaneous approach 定義。 （來源：AHA Coding Clinic 2026年第3季「無刀輸精管結紮」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-17:d","q":"【AHA Coding Clinic 2026年第3季】\n左 MCA 栓塞性中風，機械取栓 + 血管攝影併微導管 MCA 內幹細胞灌注。\n依該季 Coding Clinic，下列結論何者正確？","o":["MCA 內幹細胞灌注編 table 3E0，body region Q（顱腔及腦）、經皮，依幹細胞種類選 qualifier。","膠質母細胞瘤 sonodynamic 聚焦超音波燒灼 + SONALA-001 灌注，編 X053X4B + 3E033GN。","記「chronic renal impairment, stage 3a」須 query；確認 CKD→N18.31，僅腎損害→N28.89。","自多部位移除 Prolift 網膜，依 body part 各編一碼(4 碼)。"],"e":"正解：MCA 內幹細胞灌注編 table 3E0，body region Q（顱腔及腦）、經皮，依幹細胞種類選 qualifier。 應使用：3E0（Introduction）body region Q、經皮：胚胎幹細胞 3E0Q3AZ／自體體幹細胞 3E0Q3E0／非自體體幹細胞 3E0Q3E1。 編碼順序：依細胞種類擇一。 實務：現行選項僅中央/周邊靜脈；本例動脈灌注入腦，取顱腔及腦（Q）為最貼近部位。 （來源：AHA Coding Clinic 2026年第3季「動脈內幹細胞灌注」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-18:d","q":"【AHA Coding Clinic 2026年第3季】\n加溫高流量氧氣經氣切給予，判定 root operation。\n依該季 Coding Clinic，下列結論何者正確？","o":["經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。","NAVA 未插管→Assistance(table 5A0)；經插管→Performance。導管置入為固有不另編。","股骨組件旋轉不良（malrotation）非義關節脫位，編 T84.092A + 髕骨復發性脫位 M22.01。","以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。"],"e":"正解：經氣切給予加溫高流量氧氣時，root operation 為 Performance（非 Assistance）。 應使用：root operation = Performance（依實際填 table 5A 編碼）。 不應使用：Assistance。 實務：經氣切給予 → Performance；注意與經鼻高流量之判定差異，取決於給予途徑。 （來源：AHA Coding Clinic 2026年第3季「氣切經加溫高流量氧氣」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-19:a","q":"【AHA Coding Clinic 2026年第3季｜隱靜脈移植片結紮】\n右冠動脈瘤併與冠狀竇廔管；CABG（隱靜脈至 RCA），縫閉廔管、oversew 動脈瘤，最後 vein graft 橫斷取下。\n依該季 Coding Clinic，應如何編碼？","o":["02Q40ZZ + 02Q00ZZ + 06BQ4ZZ","02Q00ZZ + 06BQ4ZZ","02Q40ZZ + 06BQ4ZZ","02Q40ZZ + 02Q00ZZ"],"e":"正解：02Q40ZZ + 02Q00ZZ + 06BQ4ZZ。02Q40ZZ（修補冠靜脈,開放）+ 02Q00ZZ（修補冠動脈一條,開放）+ 06BQ4ZZ（左隱靜脈切除,經皮內視鏡,取材） 編碼順序：依實際完成之修補與取材編碼。 重點：冠脈瘤併廔管行 CABG，但 vein graft 最終結紮/橫斷；編修補冠靜脈+修補冠動脈+隱靜脈取材。 實務：雖行 CABG 但移植片最終被結紮/橫斷、未成立 bypass；不編 bypass。 （來源：AHA Coding Clinic 2026年第3季「隱靜脈移植片結紮」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-19:d","q":"【AHA Coding Clinic 2026年第3季】\n右冠動脈瘤併與冠狀竇廔管；CABG（隱靜脈至 RCA），縫閉廔管、oversew 動脈瘤，最後 vein graft 橫斷取下。\n依該季 Coding Clinic，下列結論何者正確？","o":["冠脈瘤併廔管行 CABG，但 vein graft 最終結紮/橫斷；編修補冠靜脈+修補冠動脈+隱靜脈取材。","【更正】vein graft 狹窄+血栓致 NSTEMI 編 T82.857A + T82.867A + I21.A9。","V4 段(顱內)剝離性動脈瘤置 pipeline(血流導向)編 03VG3HZ(intracranial artery)。","以 Stimulan 抗生素骨珠作 allograft 之脊椎融合，Fusion device 值 J（合成替代物）。"],"e":"正解：冠脈瘤併廔管行 CABG，但 vein graft 最終結紮/橫斷；編修補冠靜脈+修補冠動脈+隱靜脈取材。 應使用：02Q40ZZ（修補冠靜脈,開放）+ 02Q00ZZ（修補冠動脈一條,開放）+ 06BQ4ZZ（左隱靜脈切除,經皮內視鏡,取材）。 編碼順序：依實際完成之修補與取材編碼。 實務：雖行 CABG 但移植片最終被結紮/橫斷、未成立 bypass；不編 bypass。 （來源：AHA Coding Clinic 2026年第3季「隱靜脈移植片結紮」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-20:a","q":"【AHA Coding Clinic 2026年第3季｜髕骨近端重新對位、外側支持帶放鬆與摺疊】\n右 TKR 後髕骨組件外側脫位、復發性不穩（疤痕）；行 proximal realignment、lateral retinacular release 與 imbrication。\n依該季 Coding Clinic，應如何編碼？","o":["0KSQ0ZZ + 0MSN0ZZ","0MSN0ZZ","0KSQ0ZZ","0KB44ZZ + 0MSN0ZZ"],"e":"正解：0KSQ0ZZ + 0MSN0ZZ。0KSQ0ZZ（右上腿肌肉 reposition,開放）+ 0MSN0ZZ（右膝滑囊與韌帶 reposition,開放） 不應使用／不適用：另編 release。 編碼順序：只編 reposition。 重點：TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。 實務：release 為達成 reposition 之手段、非獨立目的 → 不另編。 （來源：AHA Coding Clinic 2026年第3季「髕骨近端重新對位、外側支持帶放鬆與摺疊」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-20:d","q":"【AHA Coding Clinic 2026年第3季】\n右 TKR 後髕骨組件外側脫位、復發性不穩（疤痕）；行 proximal realignment、lateral retinacular release 與 imbrication。\n依該季 Coding Clinic，下列結論何者正確？","o":["TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。","以機械式擴張桿使子宮頸擴張（引產目的），root operation = Dilation，qualifier J 暫時。","Carillon Mitral Contour System(經冠狀竇重塑瓣環)編 02UG3JZ(Supplement)。","同日但分兩次手術分別置入 Impella CP 與 RP，編 02HA3RZ 兩次；不可用 biventricular qualifier S。"],"e":"正解：TKR 後髕骨不穩行近端重新對位 + 外側支持帶放鬆摺疊；只編 reposition（release 非獨立目的）。 應使用：0KSQ0ZZ（右上腿肌肉 reposition,開放）+ 0MSN0ZZ（右膝滑囊與韌帶 reposition,開放）。 不應使用：另編 release。 編碼順序：只編 reposition。 實務：release 為達成 reposition 之手段、非獨立目的 → 不另編。 （來源：AHA Coding Clinic 2026年第3季「髕骨近端重新對位、外側支持帶放鬆與摺疊」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-21:a","q":"【AHA Coding Clinic 2026年第3季｜主動脈肺側枝動脈】\n法洛四聯症、VSD、肺動脈閉鎖、MAPCA 等病史，心導管評估肺高壓並栓塞 AP 側枝。\n依該季 Coding Clinic，應如何編碼？","o":["Q28.8","Q23.81","Q24.5","Q82.5"],"e":"正解：Q28.8。Q28.8（循環系統其他特指先天畸形） 重點：MAPCA 為先天血管異常，診斷編 Q28.8。 實務：MAPCA 為源自主動脈或其一級分支、連接肺動脈之先天血管。 （來源：AHA Coding Clinic 2026年第3季「主動脈肺側枝動脈」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-21:d","q":"【AHA Coding Clinic 2026年第3季】\n法洛四聯症、VSD、肺動脈閉鎖、MAPCA 等病史，心導管評估肺高壓並栓塞 AP 側枝。\n依該季 Coding Clinic，下列結論何者正確？","o":["MAPCA 為先天血管異常，診斷編 Q28.8。","雙側 LAP 皮瓣乳房重建 0HRV07B + 取血管(髂外動靜脈)各編。","改良 Bentall 瓣膜導管：主動脈根(升主/弓)置換 + 主動脈瓣置換分別編。","BAV 併主動脈瓣狹窄：I35.0 + Q23.81。"],"e":"正解：MAPCA 為先天血管異常，診斷編 Q28.8。 應使用：Q28.8（循環系統其他特指先天畸形）。 實務：MAPCA 為源自主動脈或其一級分支、連接肺動脈之先天血管。 （來源：AHA Coding Clinic 2026年第3季「主動脈肺側枝動脈」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-22:a","q":"【AHA Coding Clinic 2026年第3季｜主動脈肺側枝動脈栓塞】\n同上病人，微導管自降主動脈進入 AP 側枝，MVP 系統線圈栓塞。\n依該季 Coding Clinic，應如何編碼？","o":["02LQ3DZ","028G3Z1","02H63KZ","02HA3RZ"],"e":"正解：02LQ3DZ。02LQ3DZ（Occlusion of right pulmonary artery with intraluminal device, percutaneous approach） 重點：AP 側枝線圈栓塞，body part 取右肺動脈，編 02LQ3DZ。 實務：目的為栓塞 AP 側枝，右肺動脈最能表達手術部位。 （來源：AHA Coding Clinic 2026年第3季「主動脈肺側枝動脈栓塞」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-22:d","q":"【AHA Coding Clinic 2026年第3季】\n同上病人，微導管自降主動脈進入 AP 側枝，MVP 系統線圈栓塞。\n依該季 Coding Clinic，下列結論何者正確？","o":["AP 側枝線圈栓塞，body part 取右肺動脈，編 02LQ3DZ。","機器手臂結腸膀胱廔切除併膀胱前膿瘍引流：body part 取骨盆腔，編 0W9J4ZZ + 8E0W4CZ。","腎上腹主動脈瘤編 I71.41（屬 pararenal AAA）。","腹主+降胸主動脈剝離瓣開窗編 04Q03ZZ + 02QW3ZZ(Repair)。"],"e":"正解：AP 側枝線圈栓塞，body part 取右肺動脈，編 02LQ3DZ。 應使用：02LQ3DZ（Occlusion of right pulmonary artery with intraluminal device, percutaneous approach）。 實務：目的為栓塞 AP 側枝，右肺動脈最能表達手術部位。 （來源：AHA Coding Clinic 2026年第3季「主動脈肺側枝動脈栓塞」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-23:a","q":"【AHA Coding Clinic 2026年第3季｜芽生菌肺炎】\n55歲自感染科轉入，因芽生菌肺炎升階治療。\n依該季 Coding Clinic，應如何編碼？","o":["J16.8 + B40.2","B40.2","J16.8","J16.8 + J38.01"],"e":"正解：J16.8 + B40.2。J16.8（其他特指感染性病原之肺炎）+ B40.2（肺芽生菌病,未特指） 編碼順序：任一可排序在前。 重點：芽生菌肺炎編 J16.8 + B40.2；若載明急/慢性改用 B40 更特定碼。 實務：第1章開頭 Excludes2 允許與流感/其他急性呼吸道感染（J00–J22）併編；載明急/慢性則用 B40 更特定碼。 （來源：AHA Coding Clinic 2026年第3季「芽生菌肺炎」）","s":"cc2026"},{"c":"ccconcept","id":"cc:CC2026Q3-23:d","q":"【AHA Coding Clinic 2026年第3季】\n55歲自感染科轉入，因芽生菌肺炎升階治療。\n依該季 Coding Clinic，下列結論何者正確？","o":["芽生菌肺炎編 J16.8 + B40.2；若載明急/慢性改用 B40 更特定碼。","急性 EBV 腦炎編 B10.09 + B27.09。","K. pneumoniae 敗血症源於 UTI，編 A41.59 + N39.0 + B96.1。","EDAC 編 J98.8（無特定索引條目）。"],"e":"正解：芽生菌肺炎編 J16.8 + B40.2；若載明急/慢性改用 B40 更特定碼。 應使用：J16.8（其他特指感染性病原之肺炎）+ B40.2（肺芽生菌病,未特指）。 編碼順序：任一可排序在前。 實務：第1章開頭 Excludes2 允許與流感/其他急性呼吸道感染（J00–J22）併編；載明急/慢性則用 B40 更特定碼。 （來源：AHA Coding Clinic 2026年第3季「芽生菌肺炎」）","s":"cc2026"},{"c":"cccode","id":"cc:CC2026Q3-24:a","q":"【AHA Coding Clinic 2026年第3季｜肌肉與肌腱切除性清創】\n右糖尿病足跟潰瘍，切除性清創含肌肉與肌腱壞死組織。\n依該季 Coding Cl
